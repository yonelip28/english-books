      const tx = db.transaction(PDF_FILE_STORE, "readwrite");
      tx.objectStore(PDF_FILE_STORE).put(bytes, storyId);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error("שמירת קובץ ה-PDF נכשלה."));
    });
  } catch (e) {
    console.error("savePdfFileBytes failed:", (e && e.message) || e);
  }
}
async function loadPdfFileBytes(storyId) {
  const db = await openPdfDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PDF_FILE_STORE, "readonly");
    const req = tx.objectStore(PDF_FILE_STORE).get(storyId);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error || new Error("טעינת קובץ ה-PDF נכשלה."));
  });
}


// Extracts a PDF page by page as an array of LINES (not one flat string),
// keeping each line's font size and its vertical position on the page.
// That extra structure is what lets us later tell a real chapter heading
// (its own short line, printed noticeably larger than the surrounding
// paragraphs — the "big drop-cap-style chapter start" look) apart from a
// running header/footer or an ordinary sentence that just happens to be
// short.
async function extractPdfText(file, onProgress) {
  if (!window.pdfjsLib) throw new Error("ספריית קריאת ה-PDF לא נטענה (בדקו חיבור לאינטרנט ורעננו את הדף).");
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let meta = {};
  try {
    const info = await pdf.getMetadata();
    if (info && info.info && info.info.Title) meta.title = String(info.info.Title).trim();
    if (info && info.info && info.info.Author) meta.author = String(info.info.Author).trim();
  } catch (e) {
    // metadata is optional — ignore failures
  }
  const pages = [];
  for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
    if (onProgress) onProgress(pageNum, pdf.numPages);
    const page = await pdf.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1 });
    const content = await page.getTextContent();
    const rawLines = [];
    let current = null;
    content.items.forEach((item) => {
      if (!item.str) return;
      const y = item.transform[5];
      const fontSize = Math.hypot(item.transform[2], item.transform[3]) || Math.abs(item.transform[3]) || 0;
      if (current && Math.abs(y - current.y) <= 2) {
        current.text += item.str;
        current.maxFont = Math.max(current.maxFont, fontSize);
      } else {
        if (current) rawLines.push(current);
        current = { y, text: item.str, maxFont: fontSize };
      }
    });
    if (current) rawLines.push(current);
    // Decorative multi-line "drop cap" opening letters (the big first
    // letter a chapter often opens on) are frequently emitted by the PDF's
    // own content stream out of reading order, at a position that doesn't
    // reliably line up with any single line on THIS page. Trying to place
    // it correctly with only one page's worth of context (sometimes just a
    // handful of lines, when most of the page is a full-page illustration)
    // is exactly what kept going wrong. It's resolved later instead, in
    // splitPdfIntoChapters, once the exact start of each chapter is known
    // and the whole book's lines are available in one continuous, correctly
    // ordered sequence — see resolveDropCapLetters below. Here, lines are
    // just returned as extracted, including any oversized short one.
    const mergedRawLines = rawLines;
    // PDF's y-axis grows upward from the bottom of the page, so sorting by
    // descending y puts lines back in natural top-to-bottom reading order.
    mergedRawLines.sort((a, b) => b.y - a.y);
    const lines = mergedRawLines
      .map((l) => ({ text: l.text.replace(/\s+/g, " ").trim(), fontSize: l.maxFont, y: l.y }))
      .filter((l) => l.text.length > 0);
    let images = [];
    try {
      images = await extractPageEmbeddedImages(page, viewport);
    } catch (e) {
      // Image extraction is a nice-to-have — a page that fails to yield
      // images still contributes its text normally, and that chapter just
      // falls back to an AI-generated illustration instead (see below).
    }
    pages.push({ pageNum, lines, images });
  }
  // Also render the very first and very last page as plain images (not
  // text) — real books often have a front/back cover as the first/last
  // page(s) of the PDF, which is mostly artwork rather than extractable
  // text. These are only ever used as a fallback "original cover" display
  // if the reader turns on the cover-page setting; they're never shown or
  // parsed as chapter text.
  let frontCoverImage = null;
  let backCoverImage = null;
  try {
    frontCoverImage = await renderPdfPageToImage(pdf, 1);
    if (pdf.numPages > 1) backCoverImage = await renderPdfPageToImage(pdf, pdf.numPages);
  } catch (e) {
    // Cover rendering is a nice-to-have — never let it block the actual import.
  }
  return { pages, meta, frontCoverImage, backCoverImage };
}

async function renderPdfPageToImage(pdf, pageNum) {
  const page = await pdf.getPage(pageNum);
  const viewport = page.getViewport({ scale: 1.4 });
  const canvas = document.createElement("canvas");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext("2d");
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas.toDataURL("image/jpeg", 0.85);
}

function applyPdfMatrix(m, x, y) {
  return [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
}
function composePdfMatrix(base, applied) {
  // Composes "applied" onto "base" — standard PDF content-stream matrix
  // composition (applied happens first, in the coordinate space base was
  // already in).
  return [
    applied[0] * base[0] + applied[1] * base[2],
    applied[0] * base[1] + applied[1] * base[3],
    applied[2] * base[0] + applied[3] * base[2],
    applied[2] * base[1] + applied[3] * base[3],
    applied[4] * base[0] + applied[5] * base[2] + base[4],
    applied[4] * base[1] + applied[5] * base[3] + base[5],
  ];
}

// Walks a page's operator list tracking the current transform matrix (via
// save/restore/transform), and records the page-space bounding box of every
// image paint — WITHOUT touching pdf.js's raw image objects at all (those
// come in several pixel formats/color spaces that are fiddly and
// version-fragile to decode by hand). The actual pixels are cropped straight
// out of a normally-rendered page canvas instead — see
// extractPageEmbeddedImages below — so this only ever needs the geometry.
async function extractPageImageRegions(page) {
  const opList = await page.getOperatorList();
  const OPS = pdfjsLib.OPS;
  const regions = [];
  const stack = [];
  let ctm = [1, 0, 0, 1, 0, 0];
  const fnArray = opList.fnArray;
  const argsArray = opList.argsArray;
  for (let i = 0; i < fnArray.length; i++) {
    const fn = fnArray[i];
    if (fn === OPS.save) {
      stack.push(ctm);
    } else if (fn === OPS.restore) {
      ctm = stack.length ? stack.pop() : ctm;
    } else if (fn === OPS.transform) {
      ctm = composePdfMatrix(ctm, argsArray[i]);
    } else if (fn === OPS.paintFormXObjectBegin) {
      // A Form XObject (a whole nested content stream, often used to wrap a
      // single embedded picture) carries its OWN placement matrix as its
      // args — separate from a plain `transform` op — and implicitly
      // save/restores the graphics state around its contents per the PDF
      // spec. Some books' image paints only ever occur inside a form
      // (rather than being painted directly), so skipping this made the
      // CTM wrong for every image inside one — its bounding box came out
      // huge, tiny, or off-page, and got silently dropped by the size
      // filter below. That's why image extraction could work perfectly for
      // one PDF and find nothing at all in another with a different
      // internal structure, even though both had real embedded images.
      stack.push(ctm);
      const formMatrix = argsArray[i] && argsArray[i][0];
      if (formMatrix) ctm = composePdfMatrix(ctm, formMatrix);
    } else if (fn === OPS.paintFormXObjectEnd) {
      ctm = stack.length ? stack.pop() : ctm;
    } else if (fn === OPS.paintImageXObject || fn === OPS.paintJpegXObject) {
      // An image XObject is always painted into the unit square [0,1]x[0,1]
      // under the current transform — mapping its four corners through the
      // CTM gives its true placement on the page.
      const corners = [applyPdfMatrix(ctm, 0, 0), applyPdfMatrix(ctm, 1, 0), applyPdfMatrix(ctm, 0, 1), applyPdfMatrix(ctm, 1, 1)];
      const xs = corners.map((c) => c[0]);
      const ys = corners.map((c) => c[1]);
      regions.push({ x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) });
    }
  }
  return regions;
}

// Finds this page's embedded illustrations and returns them as
// {y, dataUrl} — y in the SAME unscaled page-coordinate space as a text
// line's y (see extractPdfText), so the two can be interleaved by true
// vertical position. Tiny regions (icons, bullets, decorative rules,
// repeated background textures) are filtered out by a minimum absolute
// size plus a minimum share of the page's area, so only real illustrations
// come through. Only pages that actually contain image-paint operators pay
// the cost of a full-page render (most pages in a typical book are pure
// text and skip this entirely).
async function extractPageEmbeddedImages(page, rawViewport) {
  const regions = await extractPageImageRegions(page);
  if (!regions.length) return [];
  const pageArea = rawViewport.width * rawViewport.height;
  const kept = regions.filter((r) => {
    const w = Math.abs(r.x1 - r.x0);
    const h = Math.abs(r.y1 - r.y0);
    return w >= 40 && h >= 40 && w * h >= pageArea * 0.03;
  });
  if (!kept.length) return [];

  const scale = 1.6; // resolution to crop from — plenty for on-screen display
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement("canvas");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext("2d");
  await page.render({ canvasContext: ctx, viewport }).promise;

  const images = [];
  const seen = new Set(); // de-dupes the same object painted more than once at ~the same spot
  kept.forEach((r) => {
    const p1 = viewport.convertToViewportPoint(r.x0, r.y0);
    const p2 = viewport.convertToViewportPoint(r.x1, r.y1);
    const sx = Math.max(0, Math.min(p1[0], p2[0]));
    const sy = Math.max(0, Math.min(p1[1], p2[1]));
    const sw = Math.min(canvas.width - sx, Math.abs(p2[0] - p1[0]));
    const sh = Math.min(canvas.height - sy, Math.abs(p2[1] - p1[1]));
    if (sw < 10 || sh < 10) return;
    const dedupeKey = `${Math.round(sx / 8)}:${Math.round(sy / 8)}:${Math.round(sw / 8)}:${Math.round(sh / 8)}`;
    if (seen.has(dedupeKey)) return;
    seen.add(dedupeKey);
    const maxW = 900; // cap stored size — these get embedded as data URLs in IndexedDB
    const outW = Math.min(maxW, Math.round(sw));
    const outH = Math.max(1, Math.round(sh * (outW / sw)));
    const out = document.createElement("canvas");
    out.width = outW;
    out.height = outH;
    out.getContext("2d").drawImage(canvas, sx, sy, sw, sh, 0, 0, outW, outH);
    images.push({ y: (r.y0 + r.y1) / 2, dataUrl: out.toDataURL("image/jpeg", 0.82) });
  });
  return images;
}

// The body-text font size, taken as the median size among reasonably long
// lines (short lines are more likely to be headings/captions, which would
// skew the median if included).
function bodyFontSizeOf(pages) {
  const sizes = [];
  pages.forEach((p) => p.lines.forEach((l) => { if (l.text.length >= 15) sizes.push(l.fontSize); }));
  if (!sizes.length) return 0;
  sizes.sort((a, b) => a - b);
  return sizes[Math.floor(sizes.length / 2)];
}

function normalizeForRepeat(text) {
  // Strips ALL whitespace (not just extra whitespace) so that a heading
  // typeset with letter-spacing on its true first occurrence — e.g.
  // "C H A P T E R O N E" — is recognized as the exact same running text
  // as the plain "CHAPTER ONE" printed as a running header on every later
  // page of that chapter. Without this, the two look like different lines
  // entirely, and the real chapter-opening heading never gets connected to
  // its own repeats — which is what let a repeat on a *later* page get
  // mistaken for the chapter's true start.
  return text.toLowerCase().replace(/[0-9]+/g, "#").replace(/[^a-z#]/g, "");
}

// A page's own printed page number, e.g. "· 1 ·" or "42" sitting alone at
// the very top or bottom of the page — captured BEFORE any boilerplate
// stripping, so it survives even though the line itself gets removed later.
// This is what lets a table of contents ("Dudley Demented · 1") be matched
// back to the actual extracted page it starts on.
function extractPrintedPageNumber(lines) {
  const candidates = [];
  if (lines.length) candidates.push(lines[0].text);
  if (lines.length > 1) candidates.push(lines[lines.length - 1].text);
  for (const t of candidates) {
    const m = t.trim().match(/^[\s\-–—*✦•·◆]{0,4}(\d{1,4})[\s\-–—*✦•·◆]{0,4}$/);
    if (m) return parseInt(m[1], 10);
  }
  return null;
}

// Finds running headers/footers — a short line that repeats, word-for-word
// (spacing-insensitive), at the very top or bottom of more than one page. A
// book's actual running header often changes per chapter (e.g. every page
// of chapter 1 repeats one heading, then every page of chapter 2 repeats a
// different one), so this deliberately does NOT require the same line to
// repeat across the whole book — only that it repeats at all near the same
// edge of the page, which real chapter-opening text never does (each
// chapter's real heading is different wording, appearing exactly once).
// Records the FIRST page each repeating line appears on — that occurrence
// might be the genuine, one-time chapter heading itself, so it's the one
// occurrence stripBoilerplate() below is told to keep.
function detectBoilerplateLines(pages) {
  const topCounts = new Map();
  const bottomCounts = new Map();
  const topFirstPage = new Map();
  const bottomFirstPage = new Map();
  pages.forEach((p, idx) => {
    p.lines.slice(0, 2).forEach((l) => {
      if (l.text.length <= 60) {
        const key = normalizeForRepeat(l.text);
        if (key) {
          topCounts.set(key, (topCounts.get(key) || 0) + 1);
          if (!topFirstPage.has(key)) topFirstPage.set(key, idx);
        }
      }
    });
    p.lines.slice(-2).forEach((l) => {
      if (l.text.length <= 60) {
        const key = normalizeForRepeat(l.text);
        if (key) {
          bottomCounts.set(key, (bottomCounts.get(key) || 0) + 1);
          if (!bottomFirstPage.has(key)) bottomFirstPage.set(key, idx);
        }
      }
    });
  });
  const threshold = 2; // repeats at all near a page edge ⇒ page furniture, not a one-off chapter heading
  const boilerplateTop = new Map();
  const boilerplateBottom = new Map();
  topCounts.forEach((c, k) => { if (c >= threshold) boilerplateTop.set(k, topFirstPage.get(k)); });
  bottomCounts.forEach((c, k) => { if (c >= threshold) boilerplateBottom.set(k, bottomFirstPage.get(k)); });
  return { boilerplateTop, boilerplateBottom };
}

// Strips out detected running headers/footers and bare page numbers. For
// each flagged line, the occurrence on its recorded FIRST page (see above)
// is deliberately kept rather than removed — it might be the genuine,
// one-time chapter heading itself (e.g. the real heading that starts the
// chapter), which just happens to share its wording with the running
// header repeated on every later page of that same chapter. Every
// occurrence on any OTHER page is page furniture and gets removed — this
// checks the first two and last two lines of every page (not just position
// 0), since the real heading and its later running-header repeats don't
// always land in exactly the same line position. Bare page numbers are
// always removed outright, first occurrence included — a page number is
// never itself part of the chapter text.
function stripBoilerplate(pages, boilerplate) {
  return pages.map((p, idx) => {
    const n = p.lines.length;
    const remove = new Set();
    for (let pos = 0; pos < Math.min(2, n); pos++) {
      const key = normalizeForRepeat(p.lines[pos].text);
      if (boilerplate.boilerplateTop.has(key) && boilerplate.boilerplateTop.get(key) !== idx) remove.add(pos);
    }
    for (let pos = Math.max(0, n - 2); pos < n; pos++) {
      const key = normalizeForRepeat(p.lines[pos].text);
      if (boilerplate.boilerplateBottom.has(key) && boilerplate.boilerplateBottom.get(key) !== idx) remove.add(pos);
    }
    let lines = p.lines.filter((_, pos) => !remove.has(pos));
    lines = lines.filter((l) => !/^[\s\-–—*✦•·◆]{0,4}\d{1,4}[\s\-–—*✦•·◆]{0,4}$/.test(l.text));
    return { ...p, lines };
  });
}

// Looks near the start of the book for an actual table-of-contents page —
// lines that read like "Dudley Demented · 1" or "Chapter One ......... 3"
// (a title followed by dot-leaders/spacing and a page number). This is the
// single most reliable source for chapter boundaries, since it's literally
// how the book itself defines them — its entries (with page numbers) are
// used first, before falling back to detecting headings in the body text.
// Some contents pages print a chapter's number label ("ONE", "TWENTY-TWO")
// on its own line above the title, and wrap a long title across two lines
// before the page number — both are stitched back together here rather
// than left as a truncated or mislabeled entry.
function detectTableOfContents(pages) {
  const scanLimit = Math.min(pages.length, 25);
  const tocEntryRe = /^(.{2,70}?)[\s.·_\-]{2,}(\d{1,4})$/;
  const labelOnlyRe = new RegExp("^(?:" + NUMBER_WORD_RE_SRC + "|[0-9]+|[ivxlcdm]+)$", "i");
  const tocPageNums = new Set();
  const entries = [];
  for (let i = 0; i < scanLimit; i++) {
    const p = pages[i];
    const pageEntries = [];
    let pending = "";
    p.lines.forEach((l) => {
      const text = l.text.trim();
      const m = text.match(tocEntryRe);
      if (m && m[1].trim().length >= 2) {
        const title = pending ? `${pending} ${m[1].trim()}` : m[1].trim();
        pageEntries.push({ title, page: parseInt(m[2], 10) });
        pending = "";
      } else if (labelOnlyRe.test(text)) {
        pending = ""; // a bare chapter-number label ("ONE") — not part of the title
      } else if (text.length > 0 && text.length <= 70) {
        pending = pending ? `${pending} ${text}` : text; // possible first half of a wrapped title
      }
    });
    if (pageEntries.length >= 3) {
      tocPageNums.add(p.pageNum);
      pageEntries.forEach((e) => entries.push(e));
    }
  }
  return tocPageNums.size ? { tocPageNums, entries, titles: entries.map((e) => e.title) } : null;
}

// Builds a lookup from a book's own printed page number (as seen in its
// table of contents) to the actual index of that page in our extracted
// `pages` array. The two rarely match 1:1 — front matter (title page,
// copyright, dedication…) usually isn't numbered "1" — so this calibrates
// off whatever printed page numbers we actually found on real pages, and
// interpolates/extrapolates for the rest.
function buildPrintedPageMap(pages) {
  const known = [];
  pages.forEach((p, idx) => {
    if (typeof p.printedPageNum === "number") known.push({ idx, printed: p.printedPageNum });
  });
  if (known.length < 2) return null;
  return function lookup(targetPrinted) {
    for (const k of known) if (k.printed === targetPrinted) return k.idx;
    let before = null, after = null;
    for (const k of known) {
      if (k.printed <= targetPrinted && (!before || k.printed > before.printed)) before = k;
      if (k.printed >= targetPrinted && (!after || k.printed < after.printed)) after = k;
    }
    if (before && after && after.printed !== before.printed) {
      const ratio = (targetPrinted - before.printed) / (after.printed - before.printed);
      return Math.round(before.idx + ratio * (after.idx - before.idx));
    }
    const anchor = before || after;
    return anchor ? anchor.idx + (targetPrinted - anchor.printed) : null;
  };
}



// Flattens every (already-cleaned, non-table-of-contents) page into one
// ordered list of lines — the sequence we actually search for chapter
// breaks in and slice chapter bodies out of. Also records, for each
// surviving page, the index in `flat` where that page's own lines begin —
// needed to translate "chapter N starts on page P" (from the table of
// contents) into an actual cut point in the flattened text.
function flattenPdfLines(pages, tocPageNums) {
  const flat = [];
  const pageStartIndex = new Map(); // index into `pages` (not printed page number) -> offset into `flat`
  const imagesByFlatIndex = new Map(); // flat[] insertion point -> array of image dataUrls that belong right before it
  function recordImage(dataUrl) {
    const key = flat.length;
    if (!imagesByFlatIndex.has(key)) imagesByFlatIndex.set(key, []);
    imagesByFlatIndex.get(key).push(dataUrl);
  }
  pages.forEach((p, i) => {
    if (tocPageNums && tocPageNums.has(p.pageNum)) return;
    pageStartIndex.set(i, flat.length);
    // Both a line's y and an image's y use the same PDF page-coordinate
    // convention (larger y = higher up the page); lines already come out
    // of extractPdfText sorted top-to-bottom (descending y), so a simple
    // merge here keeps images in true reading-order position relative to
    // the surrounding text instead of dumping them all before or after it.
    const pageImages = (p.images || []).slice().sort((a, b) => b.y - a.y);
    let imgIdx = 0;
    p.lines.forEach((line) => {
      while (imgIdx < pageImages.length && pageImages[imgIdx].y >= line.y) {
        recordImage(pageImages[imgIdx].dataUrl);
        imgIdx++;
      }
      flat.push(line);
    });
    // Any images left are below this page's last surviving line (or the
    // page had no body text at all, e.g. a full-page illustration) —
    // they belong right after it.
    while (imgIdx < pageImages.length) {
      recordImage(pageImages[imgIdx].dataUrl);
      imgIdx++;
    }
  });
  return { flat, pageStartIndex, imagesByFlatIndex };
}

// Word form of chapter numbers ("Chapter One", "Chapter Twenty-Two"…), so
// they're recognized as pure numbering — same as "Chapter 1" or "Chapter
// IV" — instead of being mistaken for the chapter's actual name.
const NUMBER_WORD_RE_SRC =
  "(?:one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|" +
  "(?:twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)(?:-?(?:one|two|three|four|five|six|seven|eight|nine))?)";
// "Chapter", "Part", "Book" and "Section" are also perfectly ordinary
// English words — without requiring an actual number after them, a stray
// sentence like "the book back to her" would get misread as a heading. A
// label like "Prologue" never carries a number of its own, so it's allowed
// to stand alone.
const NEEDS_NUMBER_LABELS = "chapter|part|book|section";
const STANDALONE_LABELS_SRC = "prologue|epilogue|introduction|foreword|afterword|preface|interlude";
const CHAPTER_MARKER_RE = new RegExp(
  "^(?:(" + NEEDS_NUMBER_LABELS + ")\\b[\\s:.\\-]*(?:" + NUMBER_WORD_RE_SRC + "|[0-9]+|[ivxlcdm]+)\\b[\\s:.\\-]*(.*)|(" +
    STANDALONE_LABELS_SRC + ")\\b[\\s:.\\-]*(.*))$",
  "i"
);
// A second form of the same pattern for headings typeset with letter-
// spacing ("C H A P T E R O N E") — tested against the line with ALL
// spaces removed, since the spaced-out original can't match a normal word
// boundary ("chapter" isn't literally "chapter" once every letter has a
// space after it).
const CHAPTER_MARKER_COMPACT_RE = new RegExp(
  "^(?:(?:" + NEEDS_NUMBER_LABELS + ")(?:" + NUMBER_WORD_RE_SRC + ")|(?:" + STANDALONE_LABELS_SRC + "))",
  "i"
);
const STANDALONE_LABELS = ["prologue", "epilogue", "introduction", "foreword", "afterword", "preface", "interlude"];

// Decorative flourishes some books wrap a heading in — "❋ ❋ CHAPTER ONE ❋ ❋"
// — stripped before pattern-matching so they don't stop the marker regex
// (anchored at the start of the line) from recognizing the heading, and
// don't leak into a chapter's stored title.
function stripDecorative(text) {
  return text.replace(/^[\s*✦•·◆❋~\-–—]+/, "").replace(/[\s*✦•·◆❋~\-–—]+$/, "").trim();
}

// A line printed with a space after every single letter ("C H A P T E R O N
// E") — the classic decorative small-caps chapter-opening style. Detected
// by how many of its space-separated "words" are exactly one character —
// real prose never looks like this, but a letter-spaced heading is almost
// entirely single letters.
function looksLetterSpaced(text) {
  const tokens = text.trim().split(/\s+/);
  if (tokens.length < 4) return false;
  const singleCharCount = tokens.filter((t) => t.length === 1).length;
  return singleCharCount / tokens.length >= 0.7;
}

// Chapter names go into the app WITHOUT "Chapter N" baked in (the reader
// already gets a numbered circle for that in the chapter menu) — this pulls
// out just the actual name part, e.g. "Chapter Three: The Escape" → "The
// Escape". A label like "Prologue" has no separate number, so it's kept as
// the visible name itself instead of being stripped down to nothing.
function cleanChapterTitle(raw) {
  if (!raw) return "";
  const t = stripDecorative(raw);
  const m = t.match(CHAPTER_MARKER_RE);
  if (!m) return t;
  const label = (m[1] || m[3] || "").toLowerCase();
  const rest = (m[2] || m[4] || "").trim();
  if (STANDALONE_LABELS.includes(label)) {
    const cap = label.charAt(0).toUpperCase() + label.slice(1);
    return rest ? `${cap}: ${rest}` : cap;
  }
  return rest;
}

// A short line printed noticeably larger than body text, or in Title/ALL
// CAPS case, and not trailing off mid-sentence — the visual signature of a
// standalone chapter-name line (the kind many books print just below a
// small "CHAPTER ONE" line, in much bigger type).
function looksLikeStandaloneNameLine(line, bodyFontSize) {
  const text = stripDecorative(line.text);
  if (!text || text.length > 70) return false;
  if (/[,;]$/.test(text)) return false;
  if (CHAPTER_MARKER_RE.test(text)) return false;
  const titled = text === text.toUpperCase() || /^[A-Z][a-z]/.test(text);
  const large = bodyFontSize > 0 && line.fontSize >= bodyFontSize * 1.08;
  return titled || large;
}

// Primary chapter-detection pass: explicit "Chapter/Part/Prologue…" marker
// lines, in either normal or letter-spaced typesetting. When a marker
// carries no name of its own ("CHAPTER ONE" alone, or its letter-spaced
// form, which never carries one), checks the very next line for a
// standalone bigger/title-case name line (the book's actual chapter title,
// printed separately) and folds it in.
function detectHeadingsByMarker(flat, bodyFontSize) {
  const headings = [];
  for (let i = 0; i < flat.length; i++) {
    const raw = stripDecorative(flat[i].text);
    if (!raw) continue;
    const spaced = looksLetterSpaced(raw);
    if (!spaced && raw.length > 70) continue;
    if (spaced && raw.length > 90) continue;
    const testText = spaced ? raw.replace(/\s+/g, "") : raw;
    const isMarker = spaced ? CHAPTER_MARKER_COMPACT_RE.test(testText) : CHAPTER_MARKER_RE.test(raw);
    if (!isMarker) continue;
    let title = spaced ? "" : cleanChapterTitle(raw);
    let consumeExtra = 0;
    if (!title && i + 1 < flat.length && looksLikeStandaloneNameLine(flat[i + 1], bodyFontSize)) {
      title = stripDecorative(flat[i + 1].text);
      consumeExtra = 1;
    }
    headings.push({ index: i, consumeExtra, title });
  }
  return headings;
}

// When marker-detected headings and the book's own table of contents agree
// on how many chapters there are (within one, to allow for a stray
// prologue/epilogue), prefer the table of contents' exact wording for each
// title over whatever we guessed from the body text — it's the book's own
// canonical name for the chapter, not our best-effort reconstruction of it.
function reconcileTitlesWithToc(headings, tocInfo) {
  if (!tocInfo || !tocInfo.entries || Math.abs(tocInfo.entries.length - headings.length) > 1) return headings;
  const n = Math.min(headings.length, tocInfo.entries.length);
  for (let i = 0; i < n; i++) {
    if (tocInfo.entries[i].title) headings[i] = { ...headings[i], title: tocInfo.entries[i].title };
  }
  return headings;
}

// Fallback for books that never print a visible "Chapter N" marker at all:
// look each table-of-contents title up in the body text itself (in order),
// and split there instead.
function detectHeadingsByToc(flat, tocInfo) {
  if (!tocInfo || tocInfo.titles.length < 2) return [];
  const found = [];
  let searchFrom = 0;
  tocInfo.titles.forEach((title) => {
    const needle = title.toLowerCase();
    if (needle.length < 3) return;
    for (let i = searchFrom; i < flat.length; i++) {
      if (flat[i].text.toLowerCase().includes(needle)) {
        found.push({ index: i, consumeExtra: 0, title });
        searchFrom = i + 1;
        break;
      }
    }
  });
  return found.length >= 2 ? found : [];
}

// The preferred, most reliable detection pass: the book's own table of
// contents already lists exactly where each chapter starts, by page number
// ("Dudley Demented · 1", "A Peck of Owls · 20"…) — this maps each of those
// printed page numbers to our extracted page index and cuts there, instead
// of trying to (re-)recognize a heading inside the body text at all. Bails
// out (returns null) rather than guessing if the mapping doesn't look
// trustworthy — e.g. if the resulting chapter order isn't sequential.
function detectHeadingsByTocPages(pages, tocInfo, pageStartIndex) {
  if (!tocInfo || !tocInfo.entries || tocInfo.entries.length < 2) return null;
  const pageLookup = buildPrintedPageMap(pages);
  if (!pageLookup) return null;
  const results = [];
  for (const entry of tocInfo.entries) {
    const pageIdx = pageLookup(entry.page);
    if (pageIdx === null || pageIdx === undefined) continue;
    let flatStart = null;
    for (let i = pageIdx; i < pages.length && i < pageIdx + 3; i++) {
      if (pageStartIndex.has(i)) { flatStart = pageStartIndex.get(i); break; }
    }
    if (flatStart === null) continue;
    results.push({ index: flatStart, consumeExtra: 0, title: entry.title });
  }
  if (results.length < 2) return null;
  for (let i = 1; i < results.length; i++) {
    if (results[i].index < results[i - 1].index) return null; // out of order ⇒ mapping isn't trustworthy
  }
  const deduped = [];
  results.forEach((r) => {
    if (!deduped.length || deduped[deduped.length - 1].index !== r.index) deduped.push(r);
  });
  return deduped.length >= 2 ? deduped : null;
}

// Ties the whole pipeline together: clean the raw per-page lines, find the
// book's real chapter breaks, and cut the exact original wording at those
// points. Detection passes are tried in order of directness: explicit
// "Chapter N" markers printed in the body text first (when present, they're
// the actual, unambiguous split points — no page-number guessing needed),
// then the book's own table of contents matched by printed page number,
// then table-of-contents titles searched for in the body text. The first
// pass that finds at least two credible breaks wins; if the table of
// contents lines up with the marker-based breaks, its wording is used for
// the titles either way, since it's the book's own canonical chapter names.
// Falls back to a single whole-book chapter only if nothing finds enough
// breaks — it never force-splits at an arbitrary point.
// A decorative chapter-opening "drop cap" letter is emitted by the PDF as
// its own out-of-place item, at a reported position that doesn't reliably
// match any single line — so it can't be placed correctly by looking at
// one page in isolation. What IS always true, regardless of where the PDF
// says it sits: it belongs to the very first line of that chapter's own
// body text. Once headings are known, that line is unambiguous — so this
// runs after chapter headings are detected, working on `flat` (the whole
// book in reading order) rather than one page's handful of lines, and uses
// `bodyFontSize` — already computed as a median across every page, so it
// isn't thrown off by a chapter-opening page whose illustration leaves
// only a few short dialogue lines to sample from.
function resolveDropCapLetters(flat, headings, bodyFontSize, imagesByFlatIndex) {
  if (!bodyFontSize) return;
  const isDropCapCandidate = (line) => {
    const t = line.text.trim();
    return t.length >= 1 && t.length <= 2 && line.fontSize >= bodyFontSize * 1.8;
  };
  headings.forEach((heading) => {
    const start = heading.index + 1 + heading.consumeExtra;
    // A drop cap never sits more than a few lines past its own heading —
    // even generously allowing for a full-page illustration in between,
    // this window is plenty and stays well short of the NEXT chapter.
    const searchEnd = Math.min(start + 20, flat.length);
    let capIdx = -1;
    for (let i = heading.index + 1; i < searchEnd; i++) {
      if (isDropCapCandidate(flat[i])) { capIdx = i; break; }
    }
    if (capIdx === -1) return;
    const capText = flat[capIdx].text.trim();
    flat.splice(capIdx, 1);
    const adjustedStart = capIdx < start ? start - 1 : start;
    // Every heading's own index shifts back by one wherever it sat after
    // the line that was just removed — including headings not reached yet.
    headings.forEach((h2) => { if (h2.index > capIdx) h2.index -= 1; });
    // An embedded image's recorded insertion point is also just an index
    // into `flat` — it needs the exact same shift, or a picture originally
    // anchored a few lines after the drop cap would silently drift to
    // print one line later (or earlier) than it actually appears.
    if (imagesByFlatIndex && imagesByFlatIndex.size) {
      const shifted = new Map();
      imagesByFlatIndex.forEach((urls, key) => {
        shifted.set(key > capIdx ? key - 1 : key, urls);
      });
      imagesByFlatIndex.clear();
      shifted.forEach((urls, key) => imagesByFlatIndex.set(key, urls));
    }
    let targetIdx = adjustedStart;
    while (targetIdx < flat.length && !flat[targetIdx].text.trim()) targetIdx++;
    if (targetIdx < flat.length) {
      flat[targetIdx] = { ...flat[targetIdx], text: capText + flat[targetIdx].text };
    }
  });
}

function splitPdfIntoChapters(pages, fallbackTitle) {
  const withPageNums = pages.map((p) => ({ ...p, printedPageNum: extractPrintedPageNumber(p.lines) }));
  const boilerplate = detectBoilerplateLines(withPageNums);
  const cleanedPages = stripBoilerplate(withPageNums, boilerplate);
  const tocInfo = detectTableOfContents(cleanedPages);
  const bodyFontSize = bodyFontSizeOf(cleanedPages);
  const { flat, pageStartIndex, imagesByFlatIndex } = flattenPdfLines(cleanedPages, tocInfo ? tocInfo.tocPageNums : null);

  // Builds one chapter's content string plus the exact character offset
  // (into THAT content string) of every extracted image that falls within
  // its [start,end) slice of `flat` — including any that land before the
  // first line or after the last (a chapter can open or close on a
  // full-page illustration with no line of its own on that side).
  function buildChapterBody(start, end) {
    let content = "";
    const images = [];
    const flushImagesAt = (flatIndex) => {
      const urls = imagesByFlatIndex.get(flatIndex);
      if (urls) urls.forEach((dataUrl) => images.push({ offset: content.length, dataUrl }));
    };
    for (let idx = start; idx < end; idx++) {
      flushImagesAt(idx);
      content += (idx > start ? "\n" : "") + flat[idx].text;
    }
    flushImagesAt(end);
    return { content: content.trim(), images };
  }

  let headings = null;
  const markerHeadings = detectHeadingsByMarker(flat, bodyFontSize);
  if (markerHeadings.length >= 2) {
    headings = reconcileTitlesWithToc(markerHeadings, tocInfo);
  }
  if (!headings) {
    headings = detectHeadingsByTocPages(cleanedPages, tocInfo, pageStartIndex);
  }
  if (!headings) {
    const tocTextHeadings = detectHeadingsByToc(flat, tocInfo);
    if (tocTextHeadings.length >= 2) headings = tocTextHeadings;
  }

  if (!headings || headings.length < 2) {
    const { content, images } = buildChapterBody(0, flat.length);
    return content ? [{ title: fallbackTitle || "הספר המלא", content, images }] : [];
  }

  resolveDropCapLetters(flat, headings, bodyFontSize, imagesByFlatIndex);

  const chapters = [];
  for (let h = 0; h < headings.length; h++) {
    const start = headings[h].index + 1 + headings[h].consumeExtra;
    const end = h + 1 < headings.length ? headings[h + 1].index : flat.length;
    // Recover any illustration that was recorded in the "consumed" gap
    // between the heading marker line and its own separate title line (e.g.
    // an image printed between "CHAPTER TWO" and "A PECK OF OWLS") — this
    // book's chapter-opening art typically sits exactly there. buildChapterBody
    // only scans [start, end), so anything at a flat-index inside that gap
    // would otherwise be silently discarded even though it's real chapter
    // art; recovered images are placed at the very start of the chapter
    // instead, since that's the closest still-valid position to where they
    // actually appeared.
    const leadImages = [];
    for (let gapIdx = headings[h].index + 1; gapIdx < start; gapIdx++) {
      const urls = imagesByFlatIndex.get(gapIdx);
      if (urls) urls.forEach((dataUrl) => leadImages.push({ offset: 0, dataUrl }));
    }
    const { content, images } = buildChapterBody(start, end);
    if (content) chapters.push({ title: headings[h].title || "", content, images: [...leadImages, ...images] });
  }
  if (chapters.length) return chapters;
  const { content, images } = buildChapterBody(0, flat.length);
  return [{ title: fallbackTitle || "הספר המלא", content, images }];
}

// ---------------------------------------------------------------------------
// Web article import: paste a link, get just the article back — no ads, no
// navigation, no comments — as a single-chapter "book", the exact same
// shape PDF import produces (content + images:[{offset,dataUrl}]). Runs
// entirely in the browser: a plain fetch() of the page's HTML, parsed with
// DOMParser, then a lightweight "readability"-style heuristic picks out the
// main article body. This is best-effort, not a real rendering engine —
// most ordinary article/blog pages work well, unusually-built pages may not.
//
// Every story this produces is PERMANENTLY PRIVATE (see the hardcoded
// categoryId check in storyIsPublic) and can never be printed (see
// printStory's own guard) — the text and images belong to whoever
// originally published them, not to the reader who imported them here.
// ---------------------------------------------------------------------------

// Stripped out before any extraction happens, regardless of which container
// ends up being picked as "the article" — navigation, ads, cookie/consent
// banners, share widgets, comment sections, and anything explicitly marked
// as decorative/hidden. Attribute selectors use the case-insensitive "i"
// flag since real-world class/id naming is wildly inconsistent.
const ARTICLE_JUNK_SELECTOR = [
  "script", "style", "noscript", "iframe", "form", "nav", "header", "footer", "aside", "svg",
  "button", "input", "select", "textarea", "ins",
  "[class*='cookie' i]", "[id*='cookie' i]",
  "[class*='consent' i]",
  "[class*='popup' i]", "[class*='modal' i]",
  "[class*='newsletter' i]", "[class*='subscribe' i]",
  "[class*='share' i]", "[class*='social' i]",
  "[class*='comment' i]", "[id*='comment' i]",
  "[class*='sidebar' i]", "[class*='related' i]", "[class*='recommend' i]",
  "[class*='promo' i]", "[class*='banner' i]",
  "[class*='advert' i]", "[id*='advert' i]", "[class*='ads' i]", "[id*='ads' i]",
  "[role='navigation']", "[role='banner']", "[role='contentinfo']",
  "[aria-hidden='true']",
].join(", ");

// Picks the single element that most likely holds "the article" (as opposed
// to a page's chrome around it) — an explicit <article> tag if one has
// enough real paragraphs, otherwise whichever container has the most total
// paragraph text. Falls back to <body> itself if nothing scores well.
function pickArticleContainer(doc) {
  const direct = doc.querySelector("article");
  if (direct && direct.querySelectorAll("p").length >= 3) return direct;

  const candidates = Array.from(doc.querySelectorAll("main, article, div, section"));
  let best = null;
  let bestScore = 0;
  candidates.forEach((el) => {
    const paragraphs = Array.from(el.querySelectorAll("p"));
    if (paragraphs.length < 3) return;
    const textLen = paragraphs.reduce((sum, p) => sum + p.textContent.trim().length, 0);
    if (textLen > bestScore) {
      bestScore = textLen;
      best = el;
    }
  });
  return bestScore >= 200 ? best : doc.body;
}

// Walks the chosen container in document order, turning block-level text
// elements into paragraphs (joined the same way PDF import's chapters are —
// blank-line separated, so ClickableText/print render identically either
// way) and recording every real content image at the character offset it
// appears at — same {offset, url} shape splitPdfIntoChapters uses (just
// "url" instead of an already-decoded "dataUrl", since these still need
// fetching — see resolveArticleImages below).
function extractArticleBody(container, baseUrl) {
  if (!container) return { content: "", images: [] };
  const BLOCK_TAGS = new Set(["P", "H1", "H2", "H3", "H4", "H5", "H6", "BLOCKQUOTE", "LI"]);
  let content = "";
  const images = [];

  function isJunkImage(img) {
    const w = parseInt(img.getAttribute("width") || "0", 10);
    const h = parseInt(img.getAttribute("height") || "0", 10);
    if ((w && w < 60) || (h && h < 60)) return true;
    const src = img.getAttribute("src") || img.getAttribute("data-src") || "";
    return /sprite|1x1|pixel|spacer|blank\.gif|\blogo\b|avatar|favicon/i.test(src);
  }
  function resolveImgUrl(img) {
    const raw =
      img.getAttribute("src") ||
      img.getAttribute("data-src") ||
      img.getAttribute("data-lazy-src") ||
      (img.getAttribute("srcset") ? img.getAttribute("srcset").split(",")[0].trim().split(/\s+/)[0] : "");
    if (!raw) return null;
    try {
      return new URL(raw, baseUrl).href;
    } catch (e) {
      return null;
    }
  }
  function addImage(img) {
    if (isJunkImage(img)) return;
    const url = resolveImgUrl(img);
    if (!url || images.length >= 8 || images.some((im) => im.url === url)) return;
    images.push({ offset: content.length, url });
  }
  function walk(node) {
    if (node.nodeType !== Node.ELEMENT_NODE) return;
    if (node.tagName === "IMG") {
      addImage(node);
      return;
    }
    if (BLOCK_TAGS.has(node.tagName)) {
      // Images occasionally sit INSIDE a paragraph-like tag too — record
      // them at the paragraph's own start before taking its text, so an
      // inline image never gets silently dropped just because its parent
      // was treated as a text block rather than being walked further.
      node.querySelectorAll("img").forEach(addImage);
      const text = node.textContent.replace(/\s+/g, " ").trim();
      if (text) content += (content ? "\n\n" : "") + text;
      return;
    }
    Array.from(node.childNodes).forEach(walk);
  }
  walk(container);
  return { content, images };
}

// Title/author/site name/lead-image, straight from the page's own <meta>
// tags where possible (og:*, twitter:*, standard <meta name="author">) —
// these are what the site itself declares about the page, so they're a more
// reliable source than guessing from the body text.
function extractArticleMeta(doc, pageUrl) {
  let domain = pageUrl;
  try {
    domain = new URL(pageUrl).hostname.replace(/^www\./, "");
  } catch (e) {}
  const metaContent = (selector) => {
    const el = doc.querySelector(selector);
    const v = el ? el.getAttribute("content") : "";
    return (v || "").trim();
  };
  const h1 = doc.querySelector("h1");
  const titleTag = doc.querySelector("title");
  const byline = doc.querySelector("[rel='author'], .author, [class*='byline' i], [itemprop='author']");
  const title =
    metaContent('meta[property="og:title"]') ||
    metaContent('meta[name="twitter:title"]') ||
    (h1 && h1.textContent.trim()) ||
    (titleTag && titleTag.textContent.trim()) ||
    domain;
  const author =
    metaContent('meta[name="author"]') ||
    metaContent('meta[property="article:author"]') ||
    (byline ? byline.textContent.replace(/\s+/g, " ").trim() : "");
  const siteName = metaContent('meta[property="og:site_name"]') || domain;
  const leadImage = metaContent('meta[property="og:image"]') || metaContent('meta[name="twitter:image"]');
  // The standfirst/deck/dek: the one-sentence summary that sits between
  // headline and body on most news/magazine sites. Checked as an actual
  // page element first (common CMS class/attribute names), since that's
  // also the element we need to strip out of the body text below so it
  // isn't extracted twice — once here, once again as a plain paragraph.
  // Falls back to the page's own meta description when no such element
  // exists; there's nothing to strip out for that case since it was never
  // part of the visible body to begin with.
  const standfirstEl = doc.querySelector(
    '[data-gu-name="standfirst"], [data-testid="standfirst"], .standfirst, [class*="standfirst" i], [class*="Standfirst" i], .article-subtitle, .entry-subtitle, .post-subtitle, .article-dek, .dek, .deck, [class*="dek" i][class*="header" i], [class*="subheadline" i], [class*="sub-headline" i], [itemprop="description"]'
  );
  const standfirst =
    (standfirstEl && standfirstEl.textContent.replace(/\s+/g, " ").trim()) ||
    metaContent('meta[property="og:description"]') ||
    metaContent('meta[name="description"]') ||
    "";
  return { title, author, siteName, domain, leadImage, standfirst, h1El: h1 || null, standfirstEl: standfirstEl || null };
}

// Ties the pieces above together: parse → strip junk → find the article →
// extract its text+images → sanity-check there's actually a real article
// here (rather than e.g. a bare homepage or a paywall stub) before handing
// back a result.
async function extractArticleFromHtml(html, pageUrl) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll(ARTICLE_JUNK_SELECTOR).forEach((el) => el.remove());
  const meta = extractArticleMeta(doc, pageUrl);
  // The headline and standfirst are surfaced separately (meta.title /
  // meta.standfirst, rendered as their own styled elements above the
  // chapter text) — remove them from the DOM now so extractArticleBody's
  // walk below can't also sweep them up as ordinary paragraphs, which
  // would duplicate the headline inside the body text.
  if (meta.h1El) meta.h1El.remove();
  if (meta.standfirstEl) meta.standfirstEl.remove();
  const container = pickArticleContainer(doc);
  const { content, images } = extractArticleBody(container, pageUrl);
  if (!content || countWords(content) < 40) {
    throw new Error(
      "לא הצלחנו לזהות כתבה של ממש בעמוד הזה — ייתכן שזה עמוד שער, עמוד עם חסימת תוכן (paywall), או שהאתר בנוי בצורה לא סטנדרטית שהניתוח שלנו לא מזהה."
    );
  }
  if (meta.leadImage) {
    try {
      const abs = new URL(meta.leadImage, pageUrl).href;
      if (!images.some((im) => im.url === abs)) images.unshift({ offset: 0, url: abs });
    } catch (e) {}
  }
  return {
    title: meta.title,
    author: meta.author,
    siteName: meta.siteName,
    domain: meta.domain,
    standfirst: meta.standfirst,
    content,
    images: images.slice(0, 8),
  };
}

// Turns each extracted image's URL into an embedded data URL (so the
// imported article reads offline exactly like an imported PDF's own
// pictures do) — falling back to just linking the original URL directly
// whenever that particular image can't be fetched (most commonly a
// cross-origin/CORS block on the image host), rather than failing the
// whole import over one picture.
async function resolveArticleImages(images, onProgress) {
  const out = [];
  for (let i = 0; i < images.length; i++) {
    const im = images[i];
    if (onProgress) onProgress(`מביאים תמונה ${i + 1} מתוך ${images.length}…`);
    let dataUrl = im.url;
    try {
      const res = await fetch(im.url);
      if (res.ok) {
        const blob = await res.blob();
        if (blob.size > 0 && blob.size < 4 * 1024 * 1024 && /^image\//.test(blob.type)) {
          dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(new Error("image read failed"));
            reader.readAsDataURL(blob);
          });
        }
      }
    } catch (e) {
      // Left as the original remote URL — an ordinary <img src="..."> to
      // the source site, same as any normal web page would show it.
    }
    out.push({ offset: im.offset, dataUrl });
  }
  return out;
}

// ---------------------------------------------------------------------------
// Claude API helpers
// ---------------------------------------------------------------------------

function cleanJson(text) {
  let t = text.trim();
  t = t.replace(/^```json/i, "").replace(/^```/, "").replace(/```\s*$/, "").trim();
  const start = t.indexOf("{");
  const end = t.lastIndexOf("}");
  if (start >= 0 && end > start) t = t.slice(start, end + 1);
  return t;
}

// Plans a book BEFORE writing any chapter content: identifies/creates the
// subtopic, title, tagline, and source attribution, plus — for multi-chapter
// books — the FULL chapter-by-chapter outline (titles + short summaries).
// This is deliberately its own small, fast, low-risk call with no long
// chapter text in it at all, so the outline (and therefore the chapter
// menu) is available immediately, reliably, before the slower/heavier
// chapter-1 content generation even starts.
async function generateBookOutline({ category, level, totalChapters, avoidTopics, forcedQuery, onRateLimitWait }) {
  const info = getLevelInfo(level);
  const system =
    "You plan graded English reading material for Hebrew-speaking ESL learners. You NEVER copy sentences or passages from any existing published work. When asked to name a real author/book, you ONLY ever name a real, verifiable, existing author and work — never invent one. Output ONLY valid JSON, no markdown fences, no commentary before or after.";
  const outlineSpec =
    totalChapters > 1
      ? `,"outline":[{"title":"chapter title","summary":"5-8 word summary of the key event"} , ... exactly ${totalChapters} entries total, in story order]`
      : "";
  // These four categories cover real, factual domains (society, science,
  // history, culture/countries) — left to its own devices the model tends
  // to default every single one into the same "fictional narrative
  // retelling" shape. This explicitly opens up genuine nonfiction prose
  // (a documentary/magazine-style piece that explores the real facts
  // directly, no invented characters needed) as an equally valid, and
  // deliberately varied, alternative to a narrative approach.
  const formVarietyRule = category.nonfictionVariety
    ? `\nVary the LITERARY FORM across different books in this domain rather than always defaulting to the same shape: sometimes write it as an engaging narrative (following real people/events as a story, or a character discovering/experiencing the real facts first-hand), and other times as vivid, well-crafted EXPOSITORY nonfiction prose — a lively documentary/magazine-feature style that explores and explains the real subject directly and engagingly, with no invented characters or plot needed. Pick whichever form best fits THIS specific subtopic, and let the choice vary from book to book rather than always picking the same one. Either way, stay grounded in real, verifiable facts — never invent people, events, or details that did not really happen.`
    : "";
  let user;
  if (forcedQuery) {
    user = `The reader typed this EXACT request for what they want to read (it may be written in Hebrew, in English, or a mix, and may be an approximate/loose title, a character's name, a franchise, or a general topic): "${forcedQuery}"

- If this clearly and confidently identifies one specific real published book/story, base the book directly on THAT work's actual plot/characters/setting, and give its real title and real author for attribution.
- If it names a character, franchise, show, or topic you recognize but that isn't a single "book" (e.g. a cartoon character, a game, a general subject), write an ORIGINAL story whose plot, characters, and setting are directly and unmistakably about that exact character/franchise/topic — do not swap in a different unrelated tale just because you can't attribute it to a classic published book. In that case, use a real, relevant reference work only if one genuinely fits (e.g. a documentary/book that covers the same real-world topic); otherwise set sourceAuthor/sourceWork to describe it honestly as an original story inspired by that subject rather than inventing a fake or irrelevant classic source.
- If the request is too vague, garbled, or unrecognizable to confidently act on, still make your best-effort story stay thematically anchored to whatever recognizable words/subject ARE in the request — never substitute a completely different, unrelated topic.
- The resulting storyTitle, tagline, and (for a multi-chapter book) every outline entry must all be clearly, obviously about the reader's actual request — a reader who typed "${forcedQuery}" and then read only the title/tagline should immediately recognize it as what they asked for.

Difficulty level ${level} (CEFR ${info.band}). This book will have ${totalChapters} chapter(s) total.
Return ONLY this JSON shape:
{"subtopic":"short subtopic label","sourceAuthor":"real author's full name, or an honest description like \\"Original story\\" if no single real source fits","sourceWork":"real book or work title, or an honest description if no single real source fits","storyTitle":"English story title","tagline":"one short English tagline","chapterTitle":"title of chapter 1 (same as story title if there is only 1 chapter)"${outlineSpec}}`;
  } else {
    user = `Topic domain: ${category.topicPrompt}.
Avoid repeating these already-used subtopics/tales: ${avoidTopics && avoidTopics.length ? avoidTopics.join(", ") : "none"}. There is a huge real pool to choose from — do not feel limited to the examples given.
Pick ONE specific, engaging, concrete subtopic within the domain.
Also state the REAL, verifiable author and book/work this subtopic/tale is drawn from or inspired by (this is for reader attribution only; it will be written fully originally).${formVarietyRule}
Difficulty level ${level} (CEFR ${info.band}). This book will have ${totalChapters} chapter(s) total.
Return ONLY this JSON shape:
{"subtopic":"short subtopic label","sourceAuthor":"real author's full name","sourceWork":"real book or work title","storyTitle":"English story title","tagline":"one short English tagline","chapterTitle":"title of chapter 1 (same as story title if there is only 1 chapter)"${outlineSpec}}`;
  }
  const maxTokens = Math.min(3500, 700 + totalChapters * 35);
  // Quality over speed: the reader would rather wait an extra pass than get
  // a broken/placeholder outline, so this keeps trying a genuinely generous
  // number of times before giving up.
  const OUTLINE_ATTEMPTS = 4;
  let lastError = null;
  for (let attempt = 0; attempt < OUTLINE_ATTEMPTS; attempt++) {
    let parsed;
    try {
      const raw = await callClaude(system, user, maxTokens, onRateLimitWait);
      parsed = parseChapterJson(raw);
    } catch (e) {
      lastError = e;
      if (e instanceof MissingApiKeyError) throw e;
      continue;
    }
    if (looksLikeBrokenTitle(parsed.storyTitle) || looksLikeBrokenTitle(parsed.chapterTitle)) {

    }
