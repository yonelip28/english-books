const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ===== storage.js =====
// Simple localStorage-backed replacement for the Claude-artifact `window.storage`
// API, so the app can run as a normal standalone website.
// Same shape: get(key) -> {key, value} | null ; set(key, value) -> {key, value}

const storage = {
  async get(key) {
    const raw = localStorage.getItem(key);
    if (raw === null) return null;
    return { key, value: raw };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
  async list(prefix = "") {
    const keys = Object.keys(localStorage).filter((k) => k.startsWith(prefix));
    return { keys };
  },
};

// ===== api.js =====
// Multi-provider AI client. The app is not locked to Anthropic — from the
// Settings screen (gear icon) you can pick a different provider and paste in
// ITS API key instead: Google (Gemini), OpenAI, or any custom endpoint that
// speaks the OpenAI-compatible chat-completions format (many local/self-hosted
// models and third-party providers support this).
//
// IMPORTANT: every provider here is called directly from the browser with the
// key stored in localStorage — fine for personal, local use, but if you ever
// deploy this app for other people to use, move these calls behind a small
// backend/proxy instead so keys aren't shipped to every visitor (see README).
// Note: some providers (notably OpenAI) do not send CORS headers that allow
// direct browser calls from arbitrary origins — Anthropic and Google do.

const PROVIDERS = [
  { id: "anthropic", label: "Anthropic (Claude)", defaultModel: "claude-sonnet-5", corsNote: "", imageSupport: false },
  { id: "google", label: "Google (Gemini)", defaultModel: "gemini-3.8-flash", corsNote: "אם החיבור נכשל: בדקו ב-Google AI Studio / Google Cloud Console שלמפתח אין הגבלת \"HTTP referrers\" שחוסמת קריאות מהדפדפן שלכם — או הסירו את ההגבלה. אם מופיעה שגיאת 404 על שם המודל, ה-API של גוגל מחליף לפעמים שמות מודלים — טענו את רשימת המודלים העדכנית (כפתור למטה) ובחרו משם.", imageSupport: true },
  { id: "openai", label: "OpenAI", defaultModel: "gpt-5.6-luna", corsNote: "ל-OpenAI יש לרוב הגבלות CORS שחוסמות קריאה ישירה מהדפדפן — ייתכן שתצטרכו שרת-ביניים (ראו README). בנוסף, בשונה מ-Google, מפתח OpenAI חדש דורש הגדרת אמצעי תשלום (גם לשימוש קטן) — בלי זה תתקבל שגיאת 429 \"exceeded your current quota\" כבר בקריאה הראשונה. זו הגבלה של החשבון שלכם ב-OpenAI, לא תקלה באפליקציה.", imageSupport: true },
  { id: "custom", label: "מותאם אישית (תואם OpenAI)", defaultModel: "", corsNote: "מומלץ להשתמש כאן כאחד משני הספקים הראשיים: Groq — מהיר וחינמי. מפתח מתקבלים ב-console.groq.com/keys, מודל מומלץ: openai/gpt-oss-20b (ראו 'הוראות להכנסת מפתח API'). הספק הראשי השני הוא Google (Gemini) — האפליקציה עוברת אוטומטית בין השניים לפי מי מהם יש לו מכסה זמינה כרגע (ראו 'שרשרת גיבוי' למטה). אפשר גם שרתים מקומיים (Ollama, LM Studio וכו') או ספקים תואמי-OpenAI אחרים.", imageSupport: false },
  { id: "custom2", label: "OpenRouter — גיבוי מומלץ ⭐", defaultModel: "openai/gpt-5.6-luna", corsNote: "ספק גיבוי שלישי (#3), נוסף על שני הספקים הראשיים שכבר הגדרתם למעלה — #1 \"מותאם אישית\" (מומלץ Groq) ו-#2 Google — ונכנס לפעולה אוטומטית רק כששניהם (#1 ו-#2) נכשלים או שהמכסה של שניהם נגמרת בו-זמנית (ראו 'שרשרת גיבוי' למעלה). מומלץ במיוחד: יש ב-OpenRouter קרדיט חינמי בהתחלה, וכשהוא נגמר צריך להטעין תשלום כדי להמשיך.", imageSupport: false },
];

const PROVIDER_STORAGE_KEY = "reading-room-provider";
const CUSTOM_BASE_URL_KEY = "reading-room-custom-base-url";

// ===== Quick Connect: paste ANY API key, no need to pick a provider =====
// Recognizes the key just by its shape/prefix and wires up everything
// (provider, base URL, default model) automatically — for well-known
// OpenAI-compatible third-party providers this reuses the existing
// "custom" provider machinery under the hood, so no separate UI/network
// code is needed per provider.
const KNOWN_KEY_PATTERNS = [
  { test: (k) => /^sk-ant-/.test(k), provider: "anthropic", label: "Anthropic (Claude)" },
  { test: (k) => /^AIzaSy/.test(k), provider: "google", label: "Google (Gemini)" },
  { test: (k) => /^sk-or-/.test(k), provider: "custom", label: "OpenRouter",
    baseUrl: "https://openrouter.ai/api/v1/chat/completions", model: "openai/gpt-5.6-luna" },
  { test: (k) => /^gsk_/.test(k), provider: "custom", label: "Groq",
    baseUrl: "https://api.groq.com/openai/v1/chat/completions", model: "openai/gpt-oss-20b" },
  { test: (k) => /^xai-/.test(k), provider: "custom", label: "xAI (Grok)",
    baseUrl: "https://api.x.ai/v1/chat/completions", model: "grok-4.6" },
  { test: (k) => /^sk-proj-|^sk-svcacct-/.test(k), provider: "openai", label: "OpenAI" },
  // Generic "sk-" is ambiguous (OpenAI, DeepSeek, Mistral, Fireworks, etc.
  // all use it) — fall back to plain OpenAI, the most common case; users
  // whose "sk-" key is from another vendor can still switch it manually
  // to "מותאם אישית" and add that vendor's base URL.
  { test: (k) => /^sk-/.test(k), provider: "openai", label: "OpenAI" },
];

function detectProviderFromKey(rawKey) {
  const k = (rawKey || "").trim();
  if (!k) return null;
  for (const pattern of KNOWN_KEY_PATTERNS) {
    if (pattern.test(k)) {
      return { provider: pattern.provider, label: pattern.label, baseUrl: pattern.baseUrl || null, model: pattern.model || null };
    }
  }
  return null; // unrecognized shape — caller should fall back to manual/custom setup
}

function keyStorageKey(provider) {
  return `reading-room-api-key-${provider}`;
}
function modelStorageKey(provider) {
  return `reading-room-model-${provider}`;
}

function getProvider() {
  return localStorage.getItem(PROVIDER_STORAGE_KEY) || "anthropic";
}
function setProvider(provider) {
  localStorage.setItem(PROVIDER_STORAGE_KEY, provider);
}

function getProviderInfo(provider = getProvider()) {
  return PROVIDERS.find((p) => p.id === provider) || PROVIDERS[0];
}

function getApiKey(provider = getProvider()) {
  return localStorage.getItem(keyStorageKey(provider)) || "";
}
function setApiKey(key, provider = getProvider()) {
  if (key) localStorage.setItem(keyStorageKey(provider), key.trim());
  else localStorage.removeItem(keyStorageKey(provider));
}

// The model can be changed live from Settings without editing any code —
// useful whenever a provider ships a newer/better/cheaper model.
function getModel(provider = getProvider()) {
  return localStorage.getItem(modelStorageKey(provider)) || getProviderInfo(provider).defaultModel;
}
function setModel(model, provider = getProvider()) {
  if (model && model.trim()) localStorage.setItem(modelStorageKey(provider), model.trim());
  else localStorage.removeItem(modelStorageKey(provider));
}
function getDefaultModel(provider = getProvider()) {
  return getProviderInfo(provider).defaultModel;
}

// Image-generation model is tracked separately from the text model, since a
// provider's best text model and best image model are usually different
// (e.g. Google's image-generation model, nicknamed "nano banana", is a
// different model id than the plain-text Gemini model you'd chat with).
const IMAGE_MODEL_DEFAULTS = {
  google: "gemini-3.1-flash-image",
  openai: "gpt-image-2.5-flare",
};
function imageModelStorageKey(provider) {
  return `reading-room-image-model-${provider}`;
}
function getImageModel(provider = getProvider()) {
  return localStorage.getItem(imageModelStorageKey(provider)) || IMAGE_MODEL_DEFAULTS[provider] || "";
}
function setImageModel(model, provider = getProvider()) {
  if (model && model.trim()) localStorage.setItem(imageModelStorageKey(provider), model.trim());
  else localStorage.removeItem(imageModelStorageKey(provider));
}
function getDefaultImageModel(provider = getProvider()) {
  return IMAGE_MODEL_DEFAULTS[provider] || "";
}

// Generalized so a SECOND custom (OpenAI-compatible) endpoint — "custom2" —
// can be configured as an automatic backup for the first, without touching
// any existing "custom" data: id defaults to "custom" so every pre-existing
// call site (which never passed an id) keeps reading/writing the exact same
// key it always did.
function customBaseUrlStorageKey(id = "custom") {
  return id === "custom" ? CUSTOM_BASE_URL_KEY : `reading-room-custom-base-url-${id}`;
}
function getCustomBaseUrl(id = "custom") {
  return localStorage.getItem(customBaseUrlStorageKey(id)) || "";
}
function setCustomBaseUrl(url, id = "custom") {
  const key = customBaseUrlStorageKey(id);
  if (url && url.trim()) localStorage.setItem(key, url.trim());
  else localStorage.removeItem(key);
}

// The "custom"/"custom2" provider slots are generic (any OpenAI-compatible
// endpoint), so their label in PROVIDERS is just "מותאם אישית (תואם
// OpenAI)" — which gives no hint that, say, the "custom" slot is actually
// wired up to Groq. This recognizes a handful of well-known services by
// their Base URL (the same domains KNOWN_KEY_PATTERNS / Quick Connect
// already know how to auto-fill) so the fallback-chain status list and its
// on/off toggles can show "Groq" / "OpenRouter" / etc. by name instead of
// the generic label — purely cosmetic, doesn't change which endpoint is
// actually called.
const KNOWN_BASE_URL_SERVICES = [
  { test: (u) => /groq\.com/i.test(u), name: "Groq" },
  { test: (u) => /openrouter\.ai/i.test(u), name: "OpenRouter" },
  { test: (u) => /api\.x\.ai/i.test(u), name: "xAI (Grok)" },
  { test: (u) => /together\.(ai|xyz)/i.test(u), name: "Together AI" },
  { test: (u) => /fireworks\.ai/i.test(u), name: "Fireworks AI" },
  { test: (u) => /api\.deepseek\.com/i.test(u), name: "DeepSeek" },
  { test: (u) => /generativelanguage\.googleapis\.com/i.test(u), name: "Google (Gemini)" },
  { test: (u) => /localhost|127\.0\.0\.1|0\.0\.0\.0/i.test(u), name: "שרת מקומי" },
];
function detectCustomServiceName(id) {
  const url = getCustomBaseUrl(id);
  if (!url) return null;
  const match = KNOWN_BASE_URL_SERVICES.find((s) => s.test(url));
  return match ? match.name : null;
}
// Display label for a provider id — like getProviderInfo(id).label, but for
// the two generic custom slots, whenever the saved Base URL matches a
// known service, the service name LEADS (e.g. "Groq (מותאם אישית)" instead
// of "מותאם אישית (תואם OpenAI) — Groq") so it reads clearly even in the
// narrow chain-status row on a phone, instead of wrapping across several
// lines with the important part (which service) buried at the end. An
// unrecognized custom endpoint (local server, unlisted provider, etc.)
// still falls back to the plain generic label exactly as before — nothing
// stops someone from pointing "מותאם אישית" at any other OpenAI-compatible
// endpoint they want; only the label changes when one happens to be
// recognized.
function getProviderDisplayLabel(id) {
  const base = getProviderInfo(id).label;
  if (id === "custom" || id === "custom2") {
    const detected = detectCustomServiceName(id);
    if (detected) return `${detected} (מותאם אישית)`;
  }
  return base;
}

// ===== Dedicated image-generation provider =====
// By default illustrations are generated through the SAME provider/key as
// the story text. This lets that be overridden so text and images run on
// fully independent accounts/API keys (e.g. text via Anthropic, images via
// a separate Google key) — so the two never compete for the same quota.
// The image AI still only ever runs AFTER the text AI has produced the
// chapter and its scene description (see loadChapterImage), it just calls
// out with its own credentials instead of the text provider's.
const IMAGE_PROVIDER_STORAGE_KEY = "reading-room-image-provider";
function getImageProviderPref() {
  return localStorage.getItem(IMAGE_PROVIDER_STORAGE_KEY) || "same";
}
function setImageProviderPref(pref) {
  if (pref && pref !== "same") localStorage.setItem(IMAGE_PROVIDER_STORAGE_KEY, pref);
  else localStorage.removeItem(IMAGE_PROVIDER_STORAGE_KEY);
}
// Resolves "same" down to whatever the active text provider currently is,
// so callers never need to special-case the "same" sentinel themselves.
function getEffectiveImageProvider() {
  const pref = getImageProviderPref();
  return pref === "same" ? getProvider() : pref;
}

// ===== Rate-limit quota snapshot =====
// Best-effort only: after every API response we peek at whatever rate-limit
// headers the provider sent back. Browsers only let JS read *cross-origin*
// response headers that the server explicitly listed in
// Access-Control-Expose-Headers — most AI providers do NOT do this for their
// rate-limit headers, so in practice there's often nothing to read at all
// (that's a browser/CORS limitation, not a bug in this app). We still record
// a snapshot on every call — including "nothing visible" — so Settings can
// tell the difference between "no request made yet" and "this provider
// doesn't expose quota headers to the browser".
const RATE_LIMIT_STORAGE_PREFIX = "reading-room-ratelimit-";

function captureRateLimitFromHeaders(provider, headers) {
  try {
    if (!headers || typeof headers.get !== "function") return;
    const num = (v) => (v == null || v === "" ? null : Number(v));
    let minuteRemaining = num(headers.get("anthropic-ratelimit-requests-remaining"));
    let minuteLimit = num(headers.get("anthropic-ratelimit-requests-limit"));
    if (minuteRemaining == null) {
      minuteRemaining = num(headers.get("x-ratelimit-remaining-requests"));
      minuteLimit = num(headers.get("x-ratelimit-limit-requests"));
    }
    // A handful of OpenAI-compatible providers (e.g. Groq) also expose an
    // explicit daily-scoped variant of the same headers.
    let dayRemaining = num(headers.get("x-ratelimit-remaining-requests-day"));
    let dayLimit = num(headers.get("x-ratelimit-limit-requests-day"));

    // Generic scan: catch any other rate/quota-flavoured header this
    // provider might use under a name we didn't specifically anticipate,
    // and also tells us how many headers the browser exposed at all — the
    // key signal for distinguishing a CORS block from "no quota headers".
    let visibleHeaderCount = 0;
    const extra = {};
    if (typeof headers.forEach === "function") {
      headers.forEach((value, name) => {
        visibleHeaderCount++;
        if (/ratelimit|rate-limit|quota/i.test(name) && !/anthropic-ratelimit-requests|^x-ratelimit-(remaining|limit)-requests(-day)?$/i.test(name)) {
          extra[name] = value;
        }
      });
    }

    const snapshot = {
      capturedAt: Date.now(),
      minute: minuteRemaining != null ? { remaining: minuteRemaining, limit: minuteLimit } : null,
      day: dayRemaining != null ? { remaining: dayRemaining, limit: dayLimit } : null,
      visibleHeaderCount,
      extra: Object.keys(extra).length ? extra : null,
    };
    localStorage.setItem(RATE_LIMIT_STORAGE_PREFIX + provider, JSON.stringify(snapshot));
  } catch (e) {
    // Shouldn't normally happen, but never let this break the actual API call.
  }
}

function getRateLimitSnapshot(provider) {
  try {
    const raw = localStorage.getItem(RATE_LIMIT_STORAGE_PREFIX + provider);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

// ===== Actual measured token usage (per provider, per day) =====
// Some providers (Google/Gemini chief among them) never expose rate-limit
// headers to the browser at all — but DO report the exact number of tokens
// a call actually used in the response BODY itself (usageMetadata). Since
// there is no way to read "quota remaining" for these providers, this
// instead tracks a running, locally-measured total of what was actually
// spent today, so the reader has a concrete, honest number to compare
// against their plan's published limits (see the quota panel in Settings)
// rather than nothing at all.
const USAGE_STORAGE_PREFIX = "reading-room-usage-";
// Matches nextCooldownUntil's own reasoning: Google's free tier resets at
// Pacific-time midnight specifically, so the "day" a usage tally belongs to
// is computed the same way, not by plain UTC or local device time.
function usageDayKey() {
  try {
    return new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" }); // YYYY-MM-DD, stable & sortable
  } catch (e) {
    return new Date().toISOString().slice(0, 10);
  }
}
function recordProviderUsage(provider, usage) {
  try {
    const key = USAGE_STORAGE_PREFIX + provider;
    const today = usageDayKey();
    let stored = null;
    try {
      stored = JSON.parse(localStorage.getItem(key) || "null");
    } catch (e) {
      stored = null;
    }
    if (!stored || stored.day !== today) {
      stored = { day: today, requests: 0, inputTokens: 0, outputTokens: 0, totalTokens: 0 };
    }
    stored.requests += 1;
    stored.inputTokens += usage.inputTokens || 0;
    stored.outputTokens += usage.outputTokens || 0;
    stored.totalTokens += usage.totalTokens || (usage.inputTokens || 0) + (usage.outputTokens || 0);
    localStorage.setItem(key, JSON.stringify(stored));
  } catch (e) {
    // never let quota bookkeeping break an actual API call
  }
}
function getProviderUsageToday(provider) {
  try {
    const stored = JSON.parse(localStorage.getItem(USAGE_STORAGE_PREFIX + provider) || "null");
    if (!stored || stored.day !== usageDayKey()) return null;
    return stored;
  } catch (e) {
    return null;
  }
}


class MissingApiKeyError extends Error {
  constructor() {
    super("No API key configured for the selected provider.");
    this.name = "MissingApiKeyError";
  }
}

// Recognizes an API error caused by an invalid/expired/revoked API key —
// as opposed to no key being configured at all (MissingApiKeyError) or an
// unrelated failure (network, rate limit, bad model name, etc). Covers the
// common status codes and message shapes across the supported providers:
// Anthropic/OpenAI-compatible use 401, Google sometimes uses 400/403 with
// an "API key not valid" style message.
function isApiKeyAuthError(err) {
  if (!err) return false;
  if (err.status === 401) return true;
  const detail = `${err.detail || ""} ${err.message || ""}`;
  return /invalid[_ ]?api[_ ]?key|api key not valid|incorrect api key|unauthorized|authentication_error|invalid x-api-key/i.test(detail);
}

async function readErrorDetail(response) {
  try {
    const errJson = await response.json();
    return errJson?.error?.message || errJson?.message || "";
  } catch (e) {
    return "";
  }
}

// CRITICAL: the browser's fetch() has NO default timeout — if a request
// stalls (flaky mobile network, an overloaded model taking unusually long,
// a dropped connection with no error), the returned promise can hang
// forever, silently, with no error and no way for the UI to know anything
// went wrong. Every network call in this file goes through this wrapper so
// that a stuck request eventually fails loudly instead of leaving a "loading"
// spinner spinning forever with nothing happening.
async function fetchWithTimeout(url, options = {}, timeoutMs = 90000) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } catch (e) {
    if (e.name === "AbortError") {
      throw new Error(
        `הבקשה ל-API ארכה יותר מ-${Math.round(timeoutMs / 1000)} שניות ובוטלה (תם הזמן הקצוב) — ייתכן שיש בעיית רשת (בדקו חיבור אינטרנט/Wi-Fi מול נתונים סלולריים), או שהמודל תקוע. נסו שוב.`
      );
    }
    if (e instanceof TypeError) {
      // fetch() throws a plain TypeError for DNS failures, CORS blocks, and
      // "no internet connection" — give a much more actionable message.
      throw new Error("הבקשה לרשת נכשלה (Failed to fetch) — בדקו את חיבור האינטרנט שלכם, או שזו עלולה להיות חסימת CORS מצד הספק (ראו ההערה בהגדרות).");
    }
    throw e;
  } finally {
    clearTimeout(timeoutId);
  }
}

// A safe default that comfortably fits inside almost every current model's
// real output-token ceiling, used as an automatic fallback whenever a
// provider rejects our first (larger) request as exceeding its actual limit.
const SAFE_FALLBACK_TOKENS = 4096;

function isTokenLimitMessage(message) {
  return /max[_ ]?tokens|max_output_tokens|max_completion_tokens|token.*limit|maximum.*tokens|context length|too (long|many tokens)/i.test(
    message || ""
  );
}

async function httpError(response) {
  const detail = await readErrorDetail(response);
  const err = new Error(`API request failed: ${response.status} ${detail}`);
  err.status = response.status;
  err.detail = detail;
  return err;
}

// ---------------------------------------------------------------------------
// Anthropic
// ---------------------------------------------------------------------------

async function callAnthropicOnce(model, apiKey, system, user, tokens) {
  const response = await fetchWithTimeout("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model,
      max_tokens: Math.max(tokens, 64),
      system,
      messages: [{ role: "user", content: user }],
    }),
  });
  captureRateLimitFromHeaders("anthropic", response.headers);
  if (!response.ok) throw await httpError(response);
  const data = await response.json();
  const text = (data.content || []).map((b) => b.text || "").join("\n");
  return { text, stopReason: data.stop_reason };
}

async function callAnthropic(system, user, maxTokens, apiKey) {
  const model = getModel("anthropic");
  let result;
  try {
    result = await callAnthropicOnce(model, apiKey, system, user, maxTokens);
  } catch (e) {
    // The model's real max output may be lower than what we asked for —
    // retry once with a conservative, near-universal value before giving up.
    if (e.status === 400 && isTokenLimitMessage(e.detail) && maxTokens > SAFE_FALLBACK_TOKENS) {
      result = await callAnthropicOnce(model, apiKey, system, user, SAFE_FALLBACK_TOKENS);
    } else {
      throw e;
    }
  }
  if (!result.text) {
    throw new Error(`התקבלה תשובה ריקה מ-Anthropic (stop_reason: ${result.stopReason || "לא ידוע"}). בדקו שהמודל הנבחר קיים ותקין.`);
  }
  return result.text;
}

// ---------------------------------------------------------------------------
// Google (Gemini)
// ---------------------------------------------------------------------------

// Gemini 2.5-series models accept `thinkingBudget` (0 disables thinking).
// Gemini 3-series models instead use `thinkingLevel` and CANNOT fully
// disable thinking — sending the wrong field for a given generation causes
// a 400 error, so pick the right one based on the model id. Either way,
// minimizing thinking leaves more of maxOutputTokens free for the actual
// visible answer, which is what was silently getting crowded out on short
// JSON-only requests (empty text, finishReason: MAX_TOKENS).
function googleThinkingConfig(model) {
  if (/gemini-3/i.test(model)) return { thinkingLevel: "low" };
  return { thinkingBudget: 0 };
}

async function callGoogleOnce(model, apiKey, system, user, maxOutputTokens, includeThinkingConfig = true) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const generationConfig = { maxOutputTokens };
  if (includeThinkingConfig) generationConfig.thinkingConfig = googleThinkingConfig(model);
  let response;
  try {
    response = await fetchWithTimeout(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: system }] },
        contents: [{ role: "user", parts: [{ text: user }] }],
        generationConfig,
      }),
    });
  } catch (e) {
    throw e;
  }
  captureRateLimitFromHeaders("google", response.headers);
  if (!response.ok) {
    const err = await httpError(response);
    // Some model/API-version combinations reject the thinkingConfig field
    // outright (unknown field) rather than just ignoring it — if so, retry
    // once with it omitted entirely instead of failing the whole request.
    if (includeThinkingConfig && err.status === 400 && /thinking/i.test(err.detail || "")) {
      return await callGoogleOnce(model, apiKey, system, user, maxOutputTokens, false);
    }
    throw err;
  }
  const data = await response.json();
  // Google doesn't expose rate-limit headers to the browser at all (see
  // captureRateLimitFromHeaders above) — but every response body DOES carry
  // the exact token counts this specific call used, in usageMetadata. Track
  // that locally so Settings can show a real, measured "tokens used today"
  // number for this provider instead of leaving the quota panel empty.
  if (data?.usageMetadata) {
    recordProviderUsage("google", {
      inputTokens: data.usageMetadata.promptTokenCount || 0,
      outputTokens: data.usageMetadata.candidatesTokenCount || 0,
      totalTokens: data.usageMetadata.totalTokenCount || 0,
    });
  }
  const candidate = data?.candidates?.[0];
  const parts = candidate?.content?.parts || [];
  const text = parts.map((p) => p.text || "").join("\n");
  return { text, candidate, hasCandidates: !!data?.candidates };
}

async function callGoogle(system, user, maxTokens, apiKey) {
  const model = getModel("google");

  async function attempt(tokens) {
    try {
      return await callGoogleOnce(model, apiKey, system, user, tokens);
    } catch (e) {
      // Request rejected outright for exceeding this model's real cap —
      // retry once with a conservative, near-universal value.
      if (e.status === 400 && isTokenLimitMessage(e.detail) && tokens > SAFE_FALLBACK_TOKENS) {
        return await callGoogleOnce(model, apiKey, system, user, SAFE_FALLBACK_TOKENS);
      }
      throw e;
    }
  }

  const firstBudget = Math.max(maxTokens, 512);
  let { text, candidate, hasCandidates } = await attempt(firstBudget);

  // Newer Gemini models can spend part of maxOutputTokens on internal
  // "thinking" before writing the visible answer — with a budget that gets
  // fully consumed by that, leaving zero visible text (silently, no error
  // beyond finishReason: MAX_TOKENS). If that happens, retry once with a
  // substantially larger budget so there's room left for the real answer.
  if (!text && candidate?.finishReason === "MAX_TOKENS") {
    const retryBudget = Math.min(16000, firstBudget * 2);
    if (retryBudget > firstBudget) {
      ({ text, candidate, hasCandidates } = await attempt(retryBudget));
    }
  }

  if (!text) {
    const reason = candidate?.finishReason;
    if (reason === "MAX_TOKENS") {
      throw new Error(
        "התשובה נחתכה לפני שהתקבל טקסט גלוי גם אחרי הגדלת מכסת הטוקנים (finishReason: MAX_TOKENS) — ייתכן שהמודל הזה צורך הרבה טוקנים על 'חשיבה' פנימית. נסו מודל אחר מרשימת המודלים (כפתור 'טען רשימת מודלים')."
      );
    }
    if (reason === "SAFETY" || reason === "PROHIBITED_CONTENT" || reason === "RECITATION") {
      throw new Error(`Google חסם את התוכן (finishReason: ${reason}).`);
    }
    if (!hasCandidates) {
      throw new Error("לא התקבלו candidates מגוגל כלל — בדקו שהמפתח תקין ושהמודל הנבחר קיים (טענו רשימת מודלים כדי לוודא).");
    }
    throw new Error(`התקבלה תשובה ריקה מגוגל (finishReason: ${reason || "לא ידוע"}).`);
  }
  return text;
}

// ---------------------------------------------------------------------------
// OpenAI / OpenAI-compatible (also used for "custom" provider)
// ---------------------------------------------------------------------------

function isReasoningModel(model) {
  // o1 / o3 / o4-style OpenAI "reasoning" models use a different
  // token-limit field and historically didn't accept a separate system
  // role the same way. Groq's gpt-oss family (and other hosted "thinking"
  // open-weight models like deepseek-r1 / qwq) are ALSO reasoning models:
  // they spend part of the token budget on a hidden internal reasoning
  // trace the caller never sees, before writing the visible answer. If we
  // don't recognize them here, they silently burn their entire (small)
  // token budget on invisible thinking and return empty content with
  // finish_reason "length" — which is exactly the bug this list fixes.
  return /^o[0-9]/i.test(model || "") || /gpt-oss|deepseek-r1|qwq|-thinking|reasoning/i.test(model || "");
}

// Reasoning models need noticeably more budget than the visible answer
// alone would require, since hidden "thinking" tokens are drawn from the
// same pool before any visible text is produced. We ask for several times
// the caller's requested amount (with a sane floor and ceiling) so there's
// still room left for the actual answer after the model finishes thinking.
function reasoningTokenBudget(tokens) {
  return Math.min(16000, Math.max(tokens * 4, 2000));
}

async function callOpenAiCompatibleOnce(baseUrl, apiKey, model, system, user, tokens) {
  const reasoning = isReasoningModel(model);
  const requestedTokens = reasoning ? reasoningTokenBudget(tokens) : tokens;
  const body = {
    model: model || "gpt-5.6-luna",
    messages: reasoning
      ? [{ role: "user", content: `${system}\n\n${user}` }]
      : [
          { role: "system", content: system },
          { role: "user", content: user },
        ],
  };
  body[reasoning ? "max_completion_tokens" : "max_tokens"] = Math.max(requestedTokens, 64);
  // Groq (and other providers hosting gpt-oss) accept a "reasoning_effort"
  // hint that directly shrinks the hidden thinking trace instead of just
  // hoping a bigger token budget leaves enough room for it — "low" keeps
  // internal reasoning brief so more of the budget reaches the visible
  // answer. Providers that don't recognize the field simply ignore it.
  if (reasoning) body.reasoning_effort = "low";

  const response = await fetchWithTimeout(baseUrl, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      ...(apiKey ? { Authorization: `Bearer ${apiKey}` } : {}),
    },
    body: JSON.stringify(body),
  });
  captureRateLimitFromHeaders(getProvider(), response.headers);
  if (!response.ok) throw await httpError(response);
  const data = await response.json();
  const choice = data?.choices?.[0];
  return { text: choice?.message?.content || "", finishReason: choice?.finish_reason };
}

async function callOpenAiCompatible(system, user, maxTokens, apiKey, baseUrl, model) {
  let result;
  try {
    result = await callOpenAiCompatibleOnce(baseUrl, apiKey, model, system, user, maxTokens);
  } catch (e) {
    if (e.status === 400 && isTokenLimitMessage(e.detail) && maxTokens > SAFE_FALLBACK_TOKENS) {
      result = await callOpenAiCompatibleOnce(baseUrl, apiKey, model, system, user, SAFE_FALLBACK_TOKENS);
    } else {
      throw e;
    }
  }
  // Reasoning models that come back empty because the hidden thinking
  // trace ate the whole budget (finish_reason "length") get ONE retry with
  // a much bigger budget before we give up — the same safety net Google's
  // MAX_TOKENS path already has, just for OpenAI-compatible reasoning
  // models (gpt-oss on Groq and similar).
  if (!result.text && isReasoningModel(model) && result.finishReason === "length") {
    const biggerBudget = Math.min(16000, reasoningTokenBudget(maxTokens) * 2);
    result = await callOpenAiCompatibleOnce(baseUrl, apiKey, model, system, user, biggerBudget);
  }
  if (!result.text) {
    throw new Error(`התקבלה תשובה ריקה מהספק (finish_reason: ${result.finishReason || "לא ידוע"}). בדקו שהמודל הנבחר קיים ותקין.`);
  }
  return result.text;
}

// ---------------------------------------------------------------------------
// Live model listing — so the app never goes stale when a provider
// renames/retires a model. Returns [{id, label}]. Throws on failure (caller
// should show the error, not silently swallow it).
// ---------------------------------------------------------------------------

// Model families that technically support "generateContent" but aren't
// ordinary text/chat models (agents, research tools, embeddings, media
// generation, etc.) — excluded so the picker only shows models that will
// actually work with our plain text-in/text-out calls.
const NON_CHAT_MODEL_PATTERN = /embed|aqa|imagen|veo|vision-only|tts|audio|antigravity|deep-research|computer-use|image-generation|learnlm|nano-?banana/i;

async function listModels(provider, apiKey) {
  if (provider === "google") {
    const res = await fetchWithTimeout(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`, {}, 20000);
    if (!res.ok) throw new Error(`Google models request failed: ${res.status} ${await readErrorDetail(res)}`);
    const data = await res.json();
    return (data.models || [])
      .filter((m) => (m.supportedGenerationMethods || []).includes("generateContent"))
      .filter((m) => !NON_CHAT_MODEL_PATTERN.test(m.name || ""))
      .map((m) => ({ id: (m.name || "").replace(/^models\//, ""), label: m.displayName || m.name }))
      .sort((a, b) => a.id.localeCompare(b.id));
  }
  if (provider === "openai") {
    const res = await fetchWithTimeout("https://api.openai.com/v1/models", { headers: { Authorization: `Bearer ${apiKey}` } }, 20000);
    if (!res.ok) throw new Error(`OpenAI models request failed: ${res.status} ${await readErrorDetail(res)}`);
    const data = await res.json();
    return (data.data || [])
      .map((m) => ({ id: m.id, label: m.id }))
      .filter((m) => /gpt|^o[0-9]|chat/i.test(m.id) && !/embed|whisper|tts|dall-e|moderation/i.test(m.id))
      .sort((a, b) => a.id.localeCompare(b.id));
  }
  if (provider === "anthropic") {
    const res = await fetchWithTimeout(
      "https://api.anthropic.com/v1/models",
      { headers: { "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" } },
      20000
    );
    if (!res.ok) throw new Error(`Anthropic models request failed: ${res.status} ${await readErrorDetail(res)}`);
    const data = await res.json();
    return (data.data || []).map((m) => ({ id: m.id, label: m.display_name || m.id }));
  }
  throw new Error("רשימת מודלים חיה לא נתמכת לספק מותאם אישית — הזינו את שם המודל ידנית.");
}

// Same idea as listModels(), but for image-generation-capable models
// specifically — lets the user pick the current real image model (e.g.
// Google's image-generation model, publicly nicknamed "nano banana") instead
// of relying on a possibly-outdated hardcoded name.
const IMAGE_MODEL_NAME_PATTERN = /image|nano-?banana|dall-?e|imagen/i;

async function listImageModels(provider, apiKey) {
  if (provider === "google") {
    const res = await fetchWithTimeout(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`, {}, 20000);
    if (!res.ok) throw new Error(`Google models request failed: ${res.status} ${await readErrorDetail(res)}`);
    const data = await res.json();
    return (data.models || [])
      .filter((m) => (m.supportedGenerationMethods || []).includes("generateContent"))
      .filter((m) => IMAGE_MODEL_NAME_PATTERN.test(m.name || "") || IMAGE_MODEL_NAME_PATTERN.test(m.displayName || ""))
      .map((m) => ({ id: (m.name || "").replace(/^models\//, ""), label: m.displayName || m.name }))
      .sort((a, b) => a.id.localeCompare(b.id));
  }
  if (provider === "openai") {
    const res = await fetchWithTimeout("https://api.openai.com/v1/models", { headers: { Authorization: `Bearer ${apiKey}` } }, 20000);
    if (!res.ok) throw new Error(`OpenAI models request failed: ${res.status} ${await readErrorDetail(res)}`);
    const data = await res.json();
    return (data.data || [])
      .map((m) => ({ id: m.id, label: m.id }))
      .filter((m) => /dall-?e|gpt-image/i.test(m.id))
      .sort((a, b) => a.id.localeCompare(b.id));
  }
  throw new Error("רשימת מודלים חיה ליצירת תמונות לא נתמכת עבור ספק זה.");
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

// Extracts a suggested wait time (in ms) from a 429 error's message when the
// provider tells us exactly how long to wait (Google does: "Please retry in
// 30.22s"). Falls back to null if none is found.
function parseRetryDelayMs(detail) {
  const match = /retry in\s+([\d.]+)\s*s/i.exec(detail || "");
  if (match) return Math.ceil(parseFloat(match[1]) * 1000);
  return null;
}

// ===== Automatic multi-provider fallback chain =====
// Priority order for automatic failover, three tiers:
//   1. "custom" (Groq) and "google" (Gemini) — the two primary, free/fast
//      providers. There's no fixed "main one" between these two: whichever
//      currently has quota left just gets used, and the cooldown system
//      below is what makes the switching automatic — the moment one of
//      them is exhausted, the very next request lands on the other one,
//      and the moment its own quota resets, requests naturally drift back
//      to it. So in effect they take turns as tokens allow, forever.
//   2. "custom2" (OpenRouter) — only kicks in once BOTH primaries (Groq and
//      Gemini) are simultaneously out of quota/unavailable. As soon as
//      either primary recovers, the very next request goes back to it
//      rather than staying on OpenRouter.
//   3. "openai" / "anthropic" — extra providers, if configured.
// A provider only takes part if it actually has an API key saved (and, for
// the two custom slots, a Base URL too) — so a person using only one
// provider sees no behavior change at all: the "chain" collapses down to
// that one provider, exactly as before.
const FALLBACK_CHAIN_ORDER = ["custom", "google", "custom2", "openai", "anthropic"];

// ===== Manual per-provider on/off switch =====
// Independent of the automatic cooldown system below: lets the reader
// deliberately turn a configured provider OFF (without deleting its saved
// key/model/Base URL) and back ON again at any time. A disabled provider is
// skipped everywhere the fallback chain is built — exactly as if it had no
// key saved at all — and flipping it back on immediately re-includes it, in
// its normal priority position, on the very next request. Nothing else
// needs to be touched manually: every place that reads "the chain" (the
// Settings read-out, the actual request dispatcher, the description text)
// all derive from this same flag, so they can never drift out of sync.
function providerDisabledKey(id) {
  return `reading-room-provider-disabled-${id}`;
}
function isProviderManuallyDisabled(id) {
  return localStorage.getItem(providerDisabledKey(id)) === "1";
}
function setProviderManuallyDisabled(id, disabled) {
  if (disabled) localStorage.setItem(providerDisabledKey(id), "1");
  else localStorage.removeItem(providerDisabledKey(id));
}

// Whether a provider has a key (and, for the two custom slots, a Base URL)
// saved at all — regardless of the manual on/off switch above. Used by the
// Settings UI to list every provider worth showing a toggle for, including
// ones the reader has manually turned off (so they can turn them back on).
function isProviderKeySet(id) {
  if (!getApiKey(id)) return false;
  if (id === "custom" || id === "custom2") return !!getCustomBaseUrl(id);
  return true;
}

function isProviderConfigured(id) {
  if (isProviderManuallyDisabled(id)) return false;
  return isProviderKeySet(id);
}

function getFallbackChain() {
  return FALLBACK_CHAIN_ORDER.filter(isProviderConfigured);
}

// Human-readable summary of the chain exactly as it will actually be tried
// right now — reflects manual on/off switches immediately, so any text
// describing "the backup chain" in Settings can just call this instead of
// hard-coding provider names/order.
function describeFallbackChain() {
  const chain = getFallbackChain();
  if (!chain.length) return "לא מוגדר אף ספק פעיל כרגע.";
  return chain.map((id) => getProviderDisplayLabel(id)).join(" ← ");
}

// ----- Per-provider "cooling down" tracking (survives reloads) -----
// When a provider is found to be exhausted (daily cap, out of credits, or
// just broken/misconfigured), it's marked with a timestamp to skip it until
// — rather than hammering a wall that won't move, or permanently giving up
// on a provider that will recover on its own (daily quotas reset; someone
// may top up OpenRouter credits later).
function providerCooldownKey(id) {
  return `reading-room-provider-cooldown-${id}`;
}
function getProviderCooldownUntil(id) {
  try {
    const raw = localStorage.getItem(providerCooldownKey(id));
    if (!raw) return 0;
    const parsed = JSON.parse(raw);
    return typeof parsed.until === "number" ? parsed.until : 0;
  } catch {
    return 0;
  }
}
function isProviderCoolingDown(id) {
  return getProviderCooldownUntil(id) > Date.now();
}
function clearProviderCooldown(id) {
  localStorage.removeItem(providerCooldownKey(id));
}
// Computes how long to skip a provider for, based on WHY it failed:
//  - "daily": a real daily request/token cap (Google's free_tier_requests,
//    Groq's RPD, etc.) — skip until the next plausible daily reset. Google
//    resets at midnight Pacific Time specifically; everything else is
//    approximated as UTC midnight, which is close enough to avoid retrying
//    for the many hours a genuine daily cap actually blocks for.
//  - "credits": an account/billing wall (OpenRouter's 402 "add credits",
//    etc.) that a request can't fix on its own and isn't time-based — skip
//    for a short while and re-check periodically in case it gets topped up.
//  - "error": anything else (bad key, bad/decommissioned model name, wrong
//    Base URL, network failure...) — skip briefly so a broken provider
//    doesn't get hit on every single request, but recheck soon in case it
//    was fixed.
function nextCooldownUntil(kind, providerId) {
  const now = Date.now();
  if (kind === "credits") return now + 30 * 60 * 1000; // 30 min
  if (kind === "error") return now + 10 * 60 * 1000; // 10 min
  // "daily"
  if (providerId === "google") {
    const ptString = new Date(now).toLocaleString("en-US", { timeZone: "America/Los_Angeles" });
    const pt = new Date(ptString);
    const ptMidnightTomorrow = new Date(pt.getFullYear(), pt.getMonth(), pt.getDate() + 1, 0, 5, 0);
    return now + (ptMidnightTomorrow.getTime() - pt.getTime());
  }
  const d = new Date(now);
  const utcMidnightTomorrow = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + 1, 0, 5, 0);
  return Math.max(now + 5 * 60 * 1000, utcMidnightTomorrow);
}
function markProviderCooldown(id, kind) {
  const until = nextCooldownUntil(kind, id);
  try {
    localStorage.setItem(providerCooldownKey(id), JSON.stringify({ until, kind, markedAt: Date.now() }));
  } catch {}
}
function formatCooldownDuration(ms) {
  if (ms <= 0) return "כמה רגעים";
  const mins = Math.round(ms / 60000);
  if (mins < 60) return `כ-${mins} דקות`;
  const hrs = Math.round(mins / 60);
  return `כ-${hrs} שעות`;
}
// Classifies WHY a call failed, for the fallback chain's purposes only.
// Returns null for failures that are worth a same-provider retry instead of
// immediately hopping to the next provider (handled by the retry loop in
// callClaudeForProvider) — a bare classification of "daily"/"credits"/
// "error" always means "stop retrying this provider, move to the next one".
function classifyProviderFailure(e) {
  const detail = `${e?.detail || ""} ${e?.message || ""}`;
  if (e?.status === 402 || /more credits|insufficient.{0,20}credit|add credits|upgrade to a paid account/i.test(detail)) {
    return "credits";
  }
  if (e?.status === 429) {
    // A 429 that survived callClaudeForProvider's own short-burst retries
    // is treated as a real cap for now (daily or otherwise sustained) —
    // worth handing off to the next provider rather than stalling further.
    return "daily";
  }
  return "error";
}

// Actually dispatches to ONE specific provider by id (used both for the
// currently-selected provider and for every other provider in the fallback
// chain) — includes the short-burst 429 retry (RPM-style throttling) that
// makes sense to retry on the SAME provider before giving up on it.
async function callClaudeForProvider(providerId, system, user, maxTokens, onRateLimitWait) {
  const apiKey = getApiKey(providerId);
  if (!apiKey) throw new MissingApiKeyError();

  async function dispatch() {
    if (providerId === "google") return callGoogle(system, user, maxTokens, apiKey);
    if (providerId === "openai") return callOpenAiCompatible(system, user, maxTokens, apiKey, "https://api.openai.com/v1/chat/completions", getModel("openai"));
    if (providerId === "custom" || providerId === "custom2") {
      const baseUrl = getCustomBaseUrl(providerId);
      if (!baseUrl) throw new Error("צריך להגדיר כתובת (Base URL) לספק המותאם אישית בהגדרות.");
      return callOpenAiCompatible(system, user, maxTokens, apiKey, baseUrl, getModel(providerId));
    }
    return callAnthropic(system, user, maxTokens, apiKey);
  }

  const MAX_RATE_LIMIT_RETRIES = 4;
  for (let attempt = 0; ; attempt++) {
    try {
      return await dispatch();
    } catch (e) {
      if (e.status === 429 && attempt < MAX_RATE_LIMIT_RETRIES) {
        const suggested = parseRetryDelayMs(e.detail);
        const waitMs = suggested != null ? suggested : Math.min(30000, 2000 * Math.pow(2, attempt));
        if (onRateLimitWait) {
          onRateLimitWait(Math.ceil(waitMs / 1000), attempt + 1, MAX_RATE_LIMIT_RETRIES);
        }
        await sleep(waitMs);
        continue;
      }
      throw e;
    }
  }
}

// Kept as `callClaude` for backward compatibility with the rest of the app —
// it now walks the FULL fallback chain (see FALLBACK_CHAIN_ORDER above),
// not just the single provider selected in Settings:
//   1. Skip any provider currently "cooling down" (daily cap / out of
//      credits / broken) — unless EVERY configured provider is cooling
//      down, in which case we still try them in order rather than failing
//      outright without even attempting the closest one to recovery.
//   2. Try providers strictly in priority order (custom → custom2 → google
//      → openai → anthropic, filtered to only those actually configured).
//      The very first one that succeeds wins — that's what makes this
//      "smooth": the moment the primary (e.g. Groq) is exhausted, the very
//      next request transparently lands on the secondary (e.g. OpenRouter)
//      with no user action needed, and the moment the primary's daily cap
//      resets, a later request naturally lands back on it again, because
//      its cooldown will have expired by then.
//   3. A provider that fails gets marked with a cooldown appropriate to WHY
//      it failed (see nextCooldownUntil) and we move on to the next one.
//   4. If every configured provider fails, surface one clear combined error
//      instead of just whichever provider happened to be tried last.
async function callClaude(system, user, maxTokens = 1000, onRateLimitWait) {
  const chain = getFallbackChain();
  if (!chain.length) throw new MissingApiKeyError();

  const notCoolingDown = chain.filter((id) => !isProviderCoolingDown(id));
  const tryOrder = notCoolingDown.length ? notCoolingDown : chain;

  let lastError = null;
  for (const providerId of tryOrder) {
    try {
      const text = await callClaudeForProvider(providerId, system, user, maxTokens, onRateLimitWait);
      clearProviderCooldown(providerId); // this provider is clearly healthy again
      return text;
    } catch (e) {
      lastError = e;
      markProviderCooldown(providerId, classifyProviderFailure(e));
    }
  }

  if (chain.length <= 1) throw lastError; // only one provider configured — nothing to add

  const soonest = chain
    .map((id) => ({ id, until: getProviderCooldownUntil(id) }))
    .sort((a, b) => a.until - b.until)[0];
  const waitNote = soonest
    ? ` הספק הכי קרוב לחזור לפעולה הוא ${getProviderDisplayLabel(soonest.id)}, בעוד ${formatCooldownDuration(soonest.until - Date.now())}.`
    : "";
  const baseMsg = lastError instanceof Error ? lastError.message : "כל הספקים המוגדרים אינם זמינים כרגע.";
  throw new Error(`כל ${chain.length} הספקים המוגדרים נכשלו. השגיאה האחרונה: ${baseMsg}${waitNote}`);
}

// Tells a genuine "the AI provider is out of tokens/requests right now"
// situation apart from every other kind of failure, so the reader gets an
// honest, specific, actionable message ("out of tokens/requests, try again
// in a few minutes") instead of the generic "the model returned invalid
// content" message, which is misleading when the real cause was never
// about content quality at all.
function isQuotaOrRateLimitError(e) {
  if (!e) return false;
  if (e.status === 429 || e.status === 402) return true;
  const msg = `${e.message || ""} ${e.detail || ""}`;
  return /\b429\b|\b402\b|rate[\s-]?limit|too many requests|quota|insufficient.{0,20}credit|add credits|upgrade to a paid account|out of (tokens|credits|requests)/i.test(
    msg
  );
}
function describeGenerationError(e, fallbackPrefix) {
  if (isQuotaOrRateLimitError(e)) {
    return "נגמרו הטוקנים או הבקשות הזמינים כרגע אצל ספק ה-AI. אפשר לנסות שוב בעוד כמה דקות.";
  }
  return `${fallbackPrefix}: ${e?.message || "שגיאה לא ידועה"}`;
}

// Runs one generation step (planning an outline, writing a chapter, etc.)
// with a few silent automatic attempts before finally giving up. A single
// transient hiccup — one bad/garbled response, a momentary network blip, a
// provider that briefly errors — should never by itself surface the "we
// couldn't generate this, try again" screen; that screen is a last resort,
// shown only once every automatic attempt has already failed. Never retries
// MissingApiKeyError — no key configured is not something retrying can fix,
// so that one is thrown straight through on the first try.
async function withAutoRetry(task, { attempts = 3, onRetrying } = {}) {
  let lastError;
  for (let i = 0; i < attempts; i++) {
    try {
      return await task();
    } catch (e) {
      lastError = e;
      if (e instanceof MissingApiKeyError) throw e;
      if (i < attempts - 1) {
        if (onRetrying) onRetrying(i + 1, attempts);
        await sleep(1200 * (i + 1));
      }
    }
  }
  throw lastError;
}

// ---------------------------------------------------------------------------
// Real illustration generation — draws an actual picture of a specific scene
// (not a generic decoration), using an image-generation model. Only OpenAI
// (DALL·E) and Google (Gemini image generation) support this directly from
// the browser today; Anthropic and generic custom endpoints don't offer
// image generation, so those return null and the app falls back to its
// built-in procedural sketch illustration instead (never a hard failure).
// ---------------------------------------------------------------------------

async function generateImageOpenAI(prompt, apiKey, modelOverride) {
  const model = modelOverride || getImageModel("openai") || IMAGE_MODEL_DEFAULTS.openai;
  const response = await fetchWithTimeout("https://api.openai.com/v1/images/generations", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${apiKey}`,
    },
    body: JSON.stringify({ model, prompt, size: "1024x1024", n: 1 }),
  });
  if (!response.ok) throw await httpError(response);
  const data = await response.json();
  const item = data?.data?.[0];
  if (item?.url) return item.url;
  if (item?.b64_json) return `data:image/png;base64,${item.b64_json}`;
  return null;
}

async function generateImageGoogle(prompt, apiKey, modelOverride) {
  const model = modelOverride || getImageModel("google") || IMAGE_MODEL_DEFAULTS.google;
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const response = await fetchWithTimeout(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ role: "user", parts: [{ text: prompt }] }],
      generationConfig: { responseModalities: ["IMAGE", "TEXT"] },
    }),
  });
  if (!response.ok) throw await httpError(response);
  const data = await response.json();
  const parts = data?.candidates?.[0]?.content?.parts || [];
  const imgPart = parts.find((p) => p.inlineData && p.inlineData.data);
  if (!imgPart) return null;
  return `data:${imgPart.inlineData.mimeType || "image/png"};base64,${imgPart.inlineData.data}`;
}

// A model name in the request is unrecognized by the API right now (image
// model ids get renamed/retired more often than text ones) — worth one
// silent retry against the built-in default id instead of surfacing a raw
// 404, but only if the caller wasn't already using that default (no point
// retrying the exact same id that just failed). This is a different-request
// retry (new model id), not a repeat of the identical failed call, so it's
// safe even right after a 429 — see the cooldown note below.
function isModelNotFoundError(e) {
  if (!e) return false;
  if (e.status === 404) return true;
  return /not found|is not supported|unknown model|no such model/i.test(`${e.detail || ""} ${e.message || ""}`);
}

// Genuine overload/quota-burst signal, not a real lasting failure — but
// NOT something to retry inline (see IMAGE_COOLDOWN_MS below for why).
function isTransientImageError(e) {
  if (!e) return false;
  if (e.status === 429 || e.status === 503 || e.status === 500) return true;
  return /overloaded|unavailable|rate[\s-]?limit|too many requests/i.test(`${e.detail || ""} ${e.message || ""}`);
}

// ---------------------------------------------------------------------
// Short, PER-PROVIDER cooldown for image generation specifically — separate
// from the text pipeline's cooldown (markProviderCooldown/nextCooldownUntil
// above), which is measured in hours/until-midnight and wrong for this: an
// image 429 is a short per-minute burst limit, not a daily cap, and using
// the text cooldown's semantics here would silently turn off illustrations
// for the rest of the day over one transient burst.
//
// WHY THIS MATTERS MORE THAN RETRYING: up to MAX_CONCURRENT_JOBS chapters
// can be generating illustrations around the same moment. If each one
// independently retries its own failed call a few times, that's MORE
// requests hitting an already-overloaded endpoint at once — exactly the
// flooding behavior that produces cascading 429/503s. A shared cooldown
// does the opposite: the FIRST 429 anyone hits tells every other
// in-flight/upcoming illustration call (this chapter and any other) to
// skip the network call entirely and go straight to the fallback sketch
// until the cooldown clears — no retry loop, no repeat requests, and the
// text side of the app is completely unaffected either way.
const IMAGE_COOLDOWN_MS = 25000;
function imageCooldownKey(provider) {
  return `reading-room-image-cooldown-${provider}`;
}
function isImageProviderCoolingDown(provider) {
  try {
    const until = Number(localStorage.getItem(imageCooldownKey(provider)) || 0);
    return until > Date.now();
  } catch {
    return false;
  }
}
function markImageProviderCooldown(provider) {
  try {
    localStorage.setItem(imageCooldownKey(provider), String(Date.now() + IMAGE_COOLDOWN_MS));
  } catch {}
}
function clearImageProviderCooldown(provider) {
  try {
    localStorage.removeItem(imageCooldownKey(provider));
  } catch {}
}

// Returns an image URL/data-URI on success, or null if this provider simply
// doesn't support image generation. Throws on an actual failed attempt (bad
// key, network, etc.) so callers can show the real reason instead of
// silently downgrading with no explanation.
//
// Deliberately does NOT retry a transient (429/503/500) failure inline —
// one clean, fast attempt, then straight to the fallback sketch (see
// loadChapterImage), marking the shared cooldown above so nothing else
// piles on right after. The ONE exception is a 404 on the configured model
// id: that's retried once against the built-in default id, since it's a
// different request (not hammering the same failing one) and fixes itself
// permanently instead of just waiting it out.
async function generateIllustration(prompt) {
  const provider = getEffectiveImageProvider();
  const apiKey = getApiKey(provider);
  if (!apiKey) throw new MissingApiKeyError();
  if (provider !== "openai" && provider !== "google") return null; // anthropic / custom: no built-in image generation support (not an error)

  if (isImageProviderCoolingDown(provider)) {
    const err = new Error("הספק בהפסקה קצרה אחרי עומס — מנסים שוב בקריאה הבאה.");
    err.status = 429;
    throw err;
  }

  const configuredModel = getImageModel(provider) || IMAGE_MODEL_DEFAULTS[provider];
  const call = provider === "openai" ? generateImageOpenAI : generateImageGoogle;

  try {
    const result = await call(prompt, apiKey, configuredModel);
    clearImageProviderCooldown(provider);
    return result;
  } catch (e) {
    if (isModelNotFoundError(e) && configuredModel !== IMAGE_MODEL_DEFAULTS[provider]) {
      try {
        const result = await call(prompt, apiKey, IMAGE_MODEL_DEFAULTS[provider]);
        clearImageProviderCooldown(provider);
        return result;
      } catch (e2) {
        if (isTransientImageError(e2)) markImageProviderCooldown(provider);
        throw e2;
      }
    }
    if (isTransientImageError(e)) markImageProviderCooldown(provider);
    throw e;
  }
}

function providerSupportsImages(provider = getEffectiveImageProvider()) {
  return provider === "openai" || provider === "google";
}

// ===== cloud.js =====
// Cross-device backup/restore, keyed by nothing but the reader's email. From
// the reader's side this is always just "type your email" — no project to
// create, no key to paste, no code to copy from anywhere. There are two ways
// to supply the one thing a static HTML file can never provide on its own —
// somewhere to actually store the data by email — and this file tries them
// in order:
//
//   1. NETLIFY MODE (zero extra setup): if this app is deployed on Netlify
//      together with the small `netlify/functions/backup.js` file included
//      alongside this app, that function + Netlify's built-in Blobs storage
//      does the job automatically. Nothing to paste anywhere, ever — just
//      deploy the site (with that functions folder) to Netlify normally.
//      This is the recommended option if you're deploying to Netlify anyway.
//
//   2. FIREBASE MODE (works on any host, incl. opening the file locally):
//      fill in CLOUD_BACKEND_CONFIGS below, once, with your own free Firebase
//      project's details. Useful if you're not using Netlify, or want your
//      backups in your own separate database.
//
// Either way, this is a ONE-TIME step done by whoever maintains this file —
// never something a reader has to do on their device. If CLOUD_BACKEND_CONFIGS
// below has at least one entry filled in, it's used; otherwise the app
// assumes Netlify mode and simply tries calling the bundled function, which
// will only actually exist if this was deployed on Netlify with that
// functions folder included.
//
// POOLED STORAGE (more than one entry): when more than one project is
// listed here, they act as a single pool of backup storage instead of
// separate destinations. The economics:
//   - The FIRST entry is also the "registry" project — it keeps a small
//     directory (which project each reader's backup actually lives in) and
//     a per-project user counter, both used only to decide where new
//     readers land. It holds no reading data of its own beyond that.
//   - The first time a given reader backs up, the app checks the registry
//     project's counters and assigns them to whichever pooled project
//     currently has the fewest backed-up readers, then remembers that
//     choice (in the registry, and locally on the device).
//   - From then on, that reader always backs up to and restores from the
//     SAME project they were first assigned to — regardless of how many
//     projects are configured, or which one this device happens to know
//     about — until that project reports it's out of storage, at which
//     point the reader is reassigned to the next least-loaded project.
//   - A restore always looks the reader up by their own identity, so it
//     finds their data no matter which pooled project it ended up in.

  {
    projectId: "english-books-6a03a", // e.g. "my-reading-app-12345"
    apiKey: "AIzaSyAzMNvGTId5PhiOTSdiPvz2KWxmAk_ykSE", // Firebase Web API key (safe to embed — it's not a secret, Firestore rules do the protecting)
  },
  {
    projectId: "english-books-2",
    apiKey: "AIzaSyDMpufKja4StZlJ4mCM1i7CzyAoadTtlc4",
  },
  {
    projectId: "english-books-3",
    apiKey: "AIzaSyBf7OmTp1LS-VDj3estIypEYWhZT1mG4PE",
  },
  // Add more { projectId, apiKey } entries here any time to grow the pool —
  // existing readers keep backing up to whichever project they're already
  // on; only brand-new readers (and anyone reassigned because their project
  // filled up) can land on a newly added entry.
];

// Firestore data model (only used in Firebase mode; REST API, no SDK needed):
//   reader_backups/{docId}                     — metadata: learning progress,
//                                                 reading prefs, library sort,
//                                                 the list of story ids and
//                                                 word ids backed up so far,
//                                                 email, last-updated.
//   reader_backups/{docId}/stories/{storyId}    — one full story per document
//                                                 (kept separate from the
//                                                 metadata doc so a big
//                                                 library doesn't risk
//                                                 hitting Firestore's ~1MB
//                                                 per-document size limit).

//                                                 same reasoning as stories.

// (one cheap read up front tells us what's already there), and a restore

// Nothing already backed up gets re-written, and nothing already on a

function getFirebaseAuthInstanceForConfig(config) {
  if (!config || typeof firebase === "undefined") return null;
  if (firebaseAuthInstances.has(config.projectId)) return firebaseAuthInstances.get(config.projectId);
  const app = firebase.initializeApp(
    { apiKey: config.apiKey, projectId: config.projectId, authDomain: `${config.projectId}.firebaseapp.com` },
    `reader-backup-auth-${config.projectId}`
  );
  const auth = firebase.auth(app);
  firebaseAuthInstances.set(config.projectId, auth);
  return auth;
}

function getFirebaseAuthInstance() {
  return getFirebaseAuthInstanceForConfig(getCloudConfig());
}

// Drops every cached sign-in instance — used when the backup project's
// details are changed or cleared from Settings (switching to/from a custom
// project invalidates any pooled-mode instances too), so the next call
// re-initializes cleanly against the new config. Also drops the local
// pooled-project assignment cache, since it no longer applies once the
// project set itself has changed.
function resetFirebaseAuth() {
  firebaseAuthInstances.forEach((auth) => {
    try { auth.app.delete(); } catch (e) {}
  });
  firebaseAuthInstances.clear();
  cachedGoogleCredential = null;
  clearLocalAssignedProjectId();
}

function getGoogleUser(config) {
  const auth = getFirebaseAuthInstanceForConfig(config || getCloudConfig());
  const u = auth && auth.currentUser;
  return u ? { uid: u.uid, email: u.email, displayName: u.displayName, photoURL: u.photoURL } : null;
}

function onGoogleAuthChanged(callback) {
  const auth = getFirebaseAuthInstance();
  if (!auth) return () => {};
  return auth.onAuthStateChanged((u) =>
    callback(u ? { uid: u.uid, email: u.email, displayName: u.displayName, photoURL: u.photoURL } : null)
  );
}

// forceAccountChooser: true when switching accounts (see "שינוי חשבון
// Google מחובר" below) — without this, Google silently re-signs the reader
// back into whichever account is already cached instead of letting them
// pick a different one. config defaults to the primary/registry project;
// pass an explicit config to sign in to a specific pooled project instead.
async function signInWithGoogle(forceAccountChooser, config) {
  const auth = getFirebaseAuthInstanceForConfig(config || getCloudConfig());
  if (!auth) throw new Error("יש להגדיר קודם פרטי פרויקט Firebase (מזהה פרויקט ומפתח API).");
  const provider = new firebase.auth.GoogleAuthProvider();
  if (forceAccountChooser) provider.setCustomParameters({ prompt: "select_account" });
  // A popup is the default here — it keeps the reader on this page instead
  // of navigating away. Some mobile browsers / embedded webviews block or
  // simply never open popups though, so as a fallback in that case only,
  // fall back to a full-page redirect (which always works, and brings the
  // reader right back into the app once they're done).
  try {
    const result = await auth.signInWithPopup(provider);
    const cred = firebase.auth.GoogleAuthProvider.credentialFromResult(result);
    if (cred) cachedGoogleCredential = cred;
    const u = result.user;
    return { uid: u.uid, email: u.email, displayName: u.displayName, photoURL: u.photoURL };
  } catch (e) {
    const code = e && e.code;
    if (
      code === "auth/popup-blocked" ||
      code === "auth/operation-not-supported-in-this-environment" ||
      code === "auth/cancelled-popup-request"
    ) {
      await auth.signInWithRedirect(provider);
      return null; // page navigates away; sign-in is picked up on return via onAuthStateChanged
    }
    throw e;
  }
}

// Signs in to a specific project SILENTLY using the Google credential
// captured from an earlier sign-in on another project — no popup, no
// redirect, nothing for the reader to click. Returns null (never throws) if
// there's no cached credential yet, or if it's expired/invalid, so the
// caller can fall back to a normal interactive sign-in in that case.
async function signInSilentlyWithCredential(config) {
  if (!cachedGoogleCredential) return null;
  const auth = getFirebaseAuthInstanceForConfig(config);
  if (!auth) return null;
  try {
    const result = await auth.signInWithCredential(cachedGoogleCredential);
    const u = result.user;
    return { uid: u.uid, email: u.email, displayName: u.displayName, photoURL: u.photoURL };
  } catch (e) {
    return null; // e.g. credential expired — caller falls back to interactive
  }
}

// Signs out of every project instance touched so far, not just the primary
// one — otherwise a reader could still be silently signed in on a pooled
// project after tapping "sign out".
async function signOutGoogle() {
  for (const auth of firebaseAuthInstances.values()) {
    try { await auth.signOut(); } catch (e) {}
  }
  cachedGoogleCredential = null;
  clearLocalAssignedProjectId();
}

// Ensures a Google user is signed in before a Firestore call, for a given
// project (defaults to the primary/registry project). First tries the
// cached Google credential from a sign-in on another project (silent, no
// popup — see signInSilentlyWithCredential); only falls back to an
// interactive popup if that isn't available or has gone stale.
// interactive=true (the default — used for taps on "גבה עכשיו" / "שחזר
// מהגיבוי" / "התחבר עם Google") is allowed to open the sign-in popup.
// interactive=false (used by the silent background auto-backup) is not —
// it simply reports "not signed in" instead, so auto-backup never pops up
// a Google sign-in window on its own while the reader is just reading.
async function ensureGoogleSignedIn(onProgress, interactive, config) {
  const cfg = config || getCloudConfig();
  const existing = getGoogleUser(cfg);
  if (existing) return existing;
  const silent = await signInSilentlyWithCredential(cfg);
  if (silent) return silent;
  if (!interactive) throw new Error("לא מחוברים ל-Google — גיבוי אוטומטי מדולג עד שמתחברים ידנית.");
  if (onProgress) onProgress("מתחברים עם Google…");
  return signInWithGoogle(false, cfg);
}

async function getGoogleIdToken(config) {
  const auth = getFirebaseAuthInstanceForConfig(config || getCloudConfig());
  const u = auth && auth.currentUser;
  return u ? u.getIdToken() : null;
}

// Completes a signInWithRedirect() flow after the app reloads. Doesn't
// need to be awaited to pick up the signed-in user (onAuthStateChanged
// handles that on its own) — this is only here to surface a sign-in error
// (e.g. an unauthorized domain, or the reader closing/cancelling on
// Google's side) that would otherwise pass by silently.
async function checkGoogleRedirectResult() {
  const auth = getFirebaseAuthInstance();
  if (!auth) return null;
  const result = await auth.getRedirectResult();
  const u = result && result.user;
  if (u) {
    const cred = firebase.auth.GoogleAuthProvider.credentialFromResult(result);
    if (cred) cachedGoogleCredential = cred;
  }
  return u ? { uid: u.uid, email: u.email, displayName: u.displayName, photoURL: u.photoURL } : null;
}

function friendlyFirestoreError(status, isWrite) {
  if (status === 403) {
    return `אין הרשאה ${isWrite ? "לשמור" : "לגשת"} לגיבוי (403). ודאו שהתחברתם עם Google ושחוקי ה-Rules ב-Firestore מאפשרים גישה למשתמש מחובר.`;
  }
  return `שגיאת ${isWrite ? "שמירת" : "גישת"} גיבוי (${status}).`;
}

// Recognizes a Firestore project that's run out of its (free-tier) storage
// or write quota — 429/RESOURCE_EXHAUSTED — vs. any other failure. Used only
// in pooled mode, to trigger reassigning a reader to the next project
// instead of surfacing a raw error.
function isStorageFullError(e) {
  const msg = (e && e.message) || "";
  return /\(429\)|RESOURCE_EXHAUSTED|quota/i.test(msg);
}

// Fast, non-cryptographic string hash (cyrb53) — good enough to turn an
// arbitrary string into a short, stable, non-reversible-looking id. Used
// both for the email->doc-id mapping below and for fingerprinting imported
// PDF books (see fingerprintPdfBook further down).
function cyrb53(str) {
  let h1 = 0xdeadbeef ^ str.length,
    h2 = 0x41c6ce57 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}

// Stable, non-reversible-looking id derived from the email (cyrb53 hash),
// so the raw email address isn't used verbatim as a public document id.
function hashEmailToDocId(email) {
  const str = (email || "").trim().toLowerCase();
  return "u_" + cyrb53(str).toString(36);
}

function firestoreBaseUrl(config) {
  return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(config.projectId)}/databases/(default)/documents`;
}

async function firestoreGet(config, path) {
  const token = await getGoogleIdToken(config);
  const headers = token ? { Authorization: `Bearer ${token}` } : {};
  const res = await fetch(`${firestoreBaseUrl(config)}/${path}?key=${encodeURIComponent(config.apiKey)}`, { headers });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(friendlyFirestoreError(res.status, false));
  return res.json();
}

async function firestoreSet(config, path, fields) {
  const token = await getGoogleIdToken(config);
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch(`${firestoreBaseUrl(config)}/${path}?key=${encodeURIComponent(config.apiKey)}`, {
    method: "PATCH",
    headers,
    body: JSON.stringify({ fields }),
  });
  if (!res.ok) throw new Error(friendlyFirestoreError(res.status, true));
  return res.json();
}

async function firestoreDelete(config, path) {
  const token = await getGoogleIdToken(config);
  const headers = token ? { Authorization: `Bearer ${token}` } : {};
  const res = await fetch(`${firestoreBaseUrl(config)}/${path}?key=${encodeURIComponent(config.apiKey)}`, {
    method: "DELETE",
    headers,
  });
  // 404 just means it's already gone — fine for a delete, not an error.
  if (!res.ok && res.status !== 404) throw new Error(friendlyFirestoreError(res.status, true));
}

function strField(v) {
  return { stringValue: v };
}
function intField(v) {
  return { integerValue: String(v) };
}
// Approximate UTF-8 byte size of a string — used only for the pooled
// storage-usage estimate shown in Settings, not for anything that needs to
// be exact.
function utf8ByteLength(str) {
  if (!str) return 0;
  if (typeof Blob !== "undefined") return new Blob([str]).size;
  return unescape(encodeURIComponent(str)).length;
}
function formatBytes(n) {
  if (!Number.isFinite(n)) return "0 MB";
  const mb = n / (1024 * 1024);
  if (mb < 1) return `${Math.max(0, Math.round(n / 1024))} KB`;
  if (mb < 1024) return `${mb.toFixed(mb < 10 ? 2 : 1)} MB`;
  return `${(mb / 1024).toFixed(2)} GB`;
}
function arrayField(f) {
  return ((f && f.arrayValue && f.arrayValue.values) || []).map((v) => v.stringValue);
}
// Compresses a JSON-serializable value with gzip (level 9 — see
// PDF_GZIP_OPTIONS) and returns it as a Firestore string field, base64-
// encoded exactly like a PDF chunk (see uint8ToBase64/pushFileChunksIfMissing
// above). Used for every JSON blob pushed to Firestore — story records, word
// records, category/word index lists, settings — not just PDF binaries:
// JSON's repetitive punctuation, key names and whitespace compresses
// especially well, and every KB saved here is a KB still free in the shared,
// pooled ~3GB budget (see CLOUD_BACKEND_CONFIGS).
function compressJsonToField(value) {
  const bytes = new TextEncoder().encode(JSON.stringify(value));
  return strField(uint8ToBase64(pako.gzip(bytes, PDF_GZIP_OPTIONS)));
}
// Reads back anything written by compressJsonToField — and, transparently,
// anything written the OLD way too, as plain uncompressed JSON text, before
// this compression existed. No migration needed: a valid gzip stream always
// starts with the two magic bytes 0x1f 0x8b once base64-decoded, so that's
// used to tell the two shapes apart automatically rather than needing a
// separate flag or field name for "is this one compressed".
function parseJsonField(field, fallback) {
  const raw = field && field.stringValue;
  if (!raw) return fallback;
  try {
    const bytes = base64ToUint8(raw);
    if (bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b) {
      return JSON.parse(new TextDecoder().decode(pako.ungzip(bytes)));
    }
  } catch (e) {
    // Not valid base64/gzip at all — fall through and try it as legacy
    // plain JSON text instead, below.
  }
  try {
    return JSON.parse(raw);
  } catch (e) {
    console.error("parseJsonField: value is neither valid compressed nor valid plain JSON:", (e && e.message) || e);
    return fallback;
  }
}
function jsonEqual(a, b) {
  try {
    return JSON.stringify(a) === JSON.stringify(b);
  } catch (e) {
    return false;
  }
}
// A category's progress counts as "not started yet" — safe for a restore to
// fill in from a backup without clobbering real progress made on this device.
function isEmptyCategoryProgress(p) {
  return !p || (p.level === 1 && !(p.storyIds && p.storyIds.length) && !p.currentStoryId && !(p.usedSubtopics && p.usedSubtopics.length));
}
// Reconstructs a category's own reading-level progress purely from the
// reader's own generated stories in that category — never from books
// downloaded off the public library (fromPublicLibrary) or imported PDFs
// (isImported), since those were never part of that category's own
// sequential level progression (see addDownloadedPublicStory above) and
// would wrongly inflate the level if counted. Used as a safety net during
// restore: if a backup's categoryProgress metadata is missing, stale, or
// simply never made it into the metadata doc for some reason, the levels
// can still be recovered from the stories themselves, since every
// self-generated story already carries its own level/subtopic/read state.
function deriveCategoryProgressFromOwnStories(stories, catId) {
  const own = Object.values(stories || {}).filter(
    (s) => s && s.categoryId === catId && !s.fromPublicLibrary && !s.isImported
  );
  if (!own.length) return null;
  const level = own.reduce((max, s) => Math.max(max, s.level || 1), 1);
  const storyIds = own
    .slice()
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0))
    .map((s) => s.id);
  const usedSubtopics = Array.from(new Set(own.map((s) => s.subtopic).filter(Boolean)));
  const unread = own
    .slice()
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
    .find((s) => !s.read);
  return { level, storyIds, usedSubtopics, currentStoryId: unread ? unread.id : null };
}

// Additively merges a restore "patch" (containing only the stories/words/
// category-progress that were missing on this device) into the current
// local state. Never removes or overwrites anything already here — see the
// cloud.js header comment above for why.
function mergeBackupPatch(prev, patch) {
  if (!prev || !patch) return prev;
  const stories =
    patch.stories && Object.keys(patch.stories).length ? { ...prev.stories, ...patch.stories } : prev.stories;
  let categoryProgress = { ...prev.categoryProgress };
  if (patch.categoryProgress) {
    Object.keys(patch.categoryProgress).forEach((catId) => {
      if (isEmptyCategoryProgress(categoryProgress[catId])) {
        categoryProgress[catId] = patch.categoryProgress[catId];
      }
    });
  }
  // Safety net: for any category still empty after the metadata-based
  // restore above (e.g. an older backup written before categoryProgress was
  // included, or the field simply didn't come back for some other reason),
  // try to recover its level/progress from the stories that just got
  // restored — so the reading level always comes back in step with the
  // books it belongs to, not just when the metadata happens to agree.
  Object.keys(categoryProgress).forEach((catId) => {
    if (!isEmptyCategoryProgress(categoryProgress[catId])) return;
    const derived = deriveCategoryProgressFromOwnStories(stories, catId);
    if (derived) categoryProgress[catId] = derived;
  });
  return {
    ...prev,
    stories,
    words: patch.words && Object.keys(patch.words).length ? { ...prev.words, ...patch.words } : prev.words,
    categoryProgress,
  };
}

// Backs up only what Firestore doesn't already have. Reads the small
// metadata doc once to see which story/word ids are already backed up, then
// writes just the new ones (by id) plus an updated metadata doc — and only
// if something actually changed. Never re-writes content already backed up,
// and never drops a remote story/word that's simply not on this device yet
// (e.g. it was added from another device and hasn't been restored here).
async function pushBackupFirebase(config, identity, state, onProgress) {
  const docId = identity.uid;
  const localStoryIds = Object.keys(state.stories || {});
  const localWordIds = Object.keys(state.words || {});
  let bytesWritten = 0; // approximate — sum of the JSON payloads actually sent this call

  if (onProgress) onProgress("בודקים מה כבר מגובה…");
  const existingMeta = await firestoreGet(config, `${BACKUP_COLLECTION}/${docId}`);
  const ef = (existingMeta && existingMeta.fields) || {};
  const remoteStoryIds = arrayField(ef.storyIds);
