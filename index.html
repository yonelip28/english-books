  }
  throw lastError || new Error("תכנון הספר נכשל — התוכן שהתקבל לא עמד בדרישות האיכות.");
}

async function generateChapter({ category, level, isFirst, chapterIndex, totalChapters, storyTitle, subtopic, previousExcerpt, avoidTopics, forcedQuery, outlineEntry, fullOutline, onRateLimitWait }) {
  const info = getLevelInfo(level);
  const system =
    "You write graded English reading material for Hebrew-speaking ESL learners. You strictly follow the requested difficulty level and word count. You NEVER copy sentences or passages from any existing published work — every retelling is written entirely in your own original words, only inspired by the named work's plot, characters or theme. When asked to name a real author/book, you ONLY ever name a real, verifiable, existing author and work — never invent one. Output ONLY valid JSON, no markdown fences, no commentary before or after.";
  // The image-scene description used to be a SEPARATE API call after this one
  // (same cost as a whole extra chapter request). It's now folded into this
  // same JSON response as "imagePrompt" — one fewer request per chapter,
  // with no separate system prompt to pay for again.
  const imagePromptSpec =
    '"imagePrompt":"a 3-5 sentence illustration brief for ONE specific, fully composed scene from THIS chapter\'s text — name the actual characters/creatures and what they look like, the specific setting and its details, and precisely what is happening (foreground, background, mood/lighting if implied); only things literally in this chapter, nothing invented"';
  const lengthRule = `This chapter MUST be AT LEAST ${info.wordsPerChapter} words long — that is a strict minimum, not a suggestion. Write generously and in full detail (more description, dialogue, and events) rather than stopping early; a chapter that is too short is a failure. It is fine, and expected, to go somewhat over ${info.wordsPerChapter} words.`;
  const varietyRule = `This chapter is a direct continuation of the same ongoing story — the same characters, setting, and unresolved threads carry over exactly as the previous chapter left them; do not re-introduce characters or re-explain settings as if starting a new, separate tale. Vary HOW this chapter opens compared to earlier chapters: do not reuse the same opening pattern every time (for example, don't always start with a time-of-day/weather line, or always with a character's name, or always with the same sentence structure) — pick whichever opening (dialogue, action, a thought, a description, a sound) best fits this specific moment in the story. Also avoid repeating scene-setups, phrases, or descriptions already used earlier in the book, so the chapters read as varied and rich rather than repetitive.`;
  // Poetry needs a genuinely different register than the other categories'
  // prose-oriented instructions — "Sentence style: sentences roughly N-M
  // words long" actively pushes toward complete narrated sentences merely
  // broken into lines, which produces exactly the failure mode to avoid: a
  // story that happens to rhyme, instead of an actual poem. So poetry gets
  // its own sentence-style line and an explicit warning added to every
  // prompt branch below.
  const isPoetry = category.id === "poetry";
  const isPlay = category.id === "plays";
  const sentenceStyleLine = isPoetry
    ? `Line style: poetic lines, NOT prose sentences — favor condensed, image-rich, evocative phrasing over plainly-narrated complete sentences; line length and rhythm should serve the poem's meter/form, not a target word count.`
    : `Sentence style: ${info.sentence}`;
  const poetryWarning = isPoetry
    ? ` CRITICAL: this must read as an actual poem, not a short story that happens to rhyme — favor figurative language (metaphor, simile, personification, imagery), compressed and evocative word choice, and emotional/lyrical resonance over plainly narrating a sequence of events in ordinary conversational sentences. Even a narrative/ballad-style poem should stay in a poetic register throughout (vivid images, sound devices, rhythm) rather than reading like prose that was simply chopped into lines.`
    : "";
  // The single most common failure mode at every level: technically correct
  // sentences that never connect to each other — a flat list of short,
  // independent statements (often all starting with "The") instead of an
  // actual flowing story. This rule is deliberately explicit and repeated in
  // every prompt branch below (not just varietyRule's "vary the opening")
  // because "vary the opening" alone still leaves the other 90% of the
  // chapter reading like disconnected sentences strung together.
  const flowRule =
    !isPoetry && !isPlay
      ? `CRITICAL — write as one connected, flowing narrative, never as a list of short, independent, disconnected statements. Link sentences and ideas with real cause, contrast, sequence and consequence (because, so, but, when, after, until, as soon as, meanwhile, even though, etc.) so each sentence grows naturally out of the one before it, the way a real published story reads — not a set of standalone facts placed one after another. Vary how sentences begin across the WHOLE chapter, not only at its start: do not let most sentences open with "The" or with the same subject/pattern every time — let some sentences open instead with an action, a line of dialogue, a short phrase, a time or place clause, a character's thought, or a connecting word. Vary sentence length and rhythm too (mix short, punchy sentences with longer, more complex ones). Every paragraph must read like it belongs to an absorbing story with momentum and voice — never like a checklist of unconnected sentences that merely happen to be in the same order as the plot. CRITICAL — paragraph length: this is a real book chapter, not a list of one- or two-sentence fragments. Each paragraph should normally hold several connected sentences (roughly 4-8 or more) that develop one continuous beat — a scene, an action, a stretch of dialogue and reaction, a train of thought — before moving on. Start a new paragraph only when something genuinely shifts (the scene or setting changes, real time passes, the speaker changes, or a new idea/beat begins), never merely to keep paragraphs short. A chapter made of many tiny, choppy paragraphs is a failure just like disconnected sentences are.`
      : "";
  // For multi-chapter books, the very first call also plans out ALL chapter
  // titles/summaries up front (the reader can later jump to any chapter by
  // its title, out of order — see outlineEntry/fullOutline below).
  const outlineSpec =
    totalChapters > 1
      ? `,"outline":[{"title":"chapter title","summary":"5-8 word summary of the key event"} , ... exactly ${totalChapters} entries total, in story order — entry 1 must match THIS chapter's own chapterTitle, the rest briefly plan out the remaining book (keep each summary very short — a phrase, not a sentence)]`
      : "";
  // Same reasoning as generateBookOutline's identical rule: these categories
  // are real/factual domains that shouldn't always be forced into the same
  // fictional-narrative-retelling shape.
  const formVarietyRule = category.nonfictionVariety
    ? `\nVary the LITERARY FORM across different books in this domain rather than always defaulting to the same shape: sometimes write it as an engaging narrative (following real people/events as a story, or a character discovering/experiencing the real facts first-hand), and other times as vivid, well-crafted EXPOSITORY nonfiction prose — a lively documentary/magazine-feature style that explores and explains the real subject directly and engagingly, with no invented characters or plot needed. Pick whichever form best fits THIS specific subtopic, and let the choice vary from book to book rather than always picking the same one. Either way, stay grounded in real, verifiable facts — never invent people, events, or details that did not really happen.`
    : "";
  let user;
  if (isFirst && forcedQuery) {
    user = `The reader typed this request for what they want to read (it may be written in Hebrew, in English, or a mix, and may be an approximate/loose title): "${forcedQuery}"
Identify the real, specific book, story, or topic they most likely mean. If it refers to a real published work, confirm its REAL title and REAL author (for attribution only — do not copy any text from it; write fully original prose in your own words, only inspired by its plot/characters/theme). If it is a general topic rather than a specific work, treat it as the subject to write about, and still name a real, relevant author/book for attribution.
Difficulty level ${level} (CEFR ${info.band}).
Grammar rules: ${info.tense}
Vocabulary rules: ${info.vocab}
${sentenceStyleLine}${poetryWarning}
${flowRule}
This is chapter 1 of ${totalChapters} total chapter(s). ${lengthRule}
Write in English only. Return ONLY this JSON shape:
{"subtopic":"short subtopic label","sourceAuthor":"real author's full name","sourceWork":"real book or work title","storyTitle":"English story title","tagline":"one short English tagline","chapterTitle":"title of this chapter (same as story title if there is only 1 chapter)","content":"the chapter text — at least ${info.wordsPerChapter} words, do not stop short",${imagePromptSpec}${outlineSpec}}`;
  } else if (isFirst) {
    user = `Topic domain: ${category.topicPrompt}.
Avoid repeating these already-used subtopics/tales: ${avoidTopics.length ? avoidTopics.join(", ") : "none"}. There is a huge real pool to choose from — do not feel limited to the examples given.
Pick ONE specific, engaging, concrete subtopic within the domain.
Also state the REAL, verifiable author and book/work this subtopic/tale is drawn from or inspired by (this is for reader attribution only; do not copy any text from it — write fully original prose).${formVarietyRule}
Difficulty level ${level} (CEFR ${info.band}).
Grammar rules: ${info.tense}
Vocabulary rules: ${info.vocab}
${sentenceStyleLine}${poetryWarning}
${flowRule}
This is chapter 1 of ${totalChapters} total chapter(s). ${lengthRule}
Write in English only. Return ONLY this JSON shape:
{"subtopic":"short subtopic label","sourceAuthor":"real author's full name","sourceWork":"real book or work title","storyTitle":"English story title","tagline":"one short English tagline","chapterTitle":"title of this chapter (same as story title if there is only 1 chapter)","content":"the chapter text — at least ${info.wordsPerChapter} words, do not stop short",${imagePromptSpec}${outlineSpec}}`;
  } else if (outlineEntry) {
    // Writing a specific chapter chosen from the pre-planned outline — this
    // may be requested out of order (earlier chapters might not exist yet),
    // so it's grounded in the outline's own title+summary plus just its
    // immediate neighbors (not the whole book's outline dumped every time —
    // that stayed unused context weight on every single chapter request).
    const prevEntry = chapterIndex > 0 ? fullOutline[chapterIndex - 1] : null;
    const nextEntry = chapterIndex + 1 < totalChapters ? fullOutline[chapterIndex + 1] : null;
    user = `Continue the story titled "${storyTitle}" (subtopic: ${subtopic}), domain: ${category.topicPrompt}.
This is chapter ${chapterIndex + 1} of ${totalChapters}: "${outlineEntry.title}"${outlineEntry.summary ? ` — ${outlineEntry.summary}` : ""}
${prevEntry ? `Previous chapter: "${prevEntry.title}"${prevEntry.summary ? ` — ${prevEntry.summary}` : ""}` : "This is the first chapter."}
${nextEntry ? `Next chapter after this one: "${nextEntry.title}"${nextEntry.summary ? ` — ${nextEntry.summary}` : ""} (so end THIS chapter in a way that leads into it)` : "This is the final chapter — end the whole book here."}
${
  previousExcerpt
    ? `The previous chapter's text ended with: "...${previousExcerpt}"`
    : "The previous chapter's exact text has not been written yet — write THIS chapter as a natural, self-contained continuation consistent with the previous/next chapter summaries above, without needing its exact wording."
}
Difficulty level ${level} (CEFR ${info.band}).
Grammar rules: ${info.tense}
Vocabulary rules: ${info.vocab}
${sentenceStyleLine}${poetryWarning}
${varietyRule}
${flowRule}
${lengthRule} Move the story naturally toward ${
      chapterIndex + 1 === totalChapters ? "a satisfying ending" : "the next part"
    }.
Write in English only. Return ONLY this JSON shape:
{"chapterTitle":"${outlineEntry.title.replace(/"/g, "'")}","content":"the chapter text — at least ${info.wordsPerChapter} words, do not stop short",${imagePromptSpec}}`;
  } else {
    user = `Continue the story titled "${storyTitle}" (subtopic: ${subtopic}), domain: ${category.topicPrompt}.
This is chapter ${chapterIndex + 1} of ${totalChapters}.
The previous chapter ended with: "...${previousExcerpt}"
Difficulty level ${level} (CEFR ${info.band}).
Grammar rules: ${info.tense}
Vocabulary rules: ${info.vocab}
${sentenceStyleLine}${poetryWarning}
${varietyRule}
${flowRule}
${lengthRule} Move the story naturally toward ${
      chapterIndex + 1 === totalChapters ? "a satisfying ending" : "the next part"
    }.
Write in English only. Return ONLY this JSON shape:
{"chapterTitle":"title of this chapter","content":"the chapter text — at least ${info.wordsPerChapter} words, do not stop short",${imagePromptSpec}}`;
  }
  // Cap the token budget of this FIRST pass conservatively (most models cap
  // real output around 4096-8192 tokens regardless of what we ask for; if
  // we request more than that upfront, providers either reject the request
  // outright — triggering our SAFE_FALLBACK_TOKENS=4096 retry, which then
  // truncates a long chapter badly and can even cut the JSON off mid-way —
  // or they simply take a very long time on one giant call). Chapters
  // longer than that are completed reliably afterward via the same
  // continuation loop already used to top up short chapters, in a couple of
  // fast, small, low-risk follow-up calls instead of one huge fragile one.
  const firstPassWords = Math.min(info.wordsPerChapter, 3200);
  const maxTokens = Math.min(7000, Math.round(firstPassWords * 1.8) + 600);
  const minWordsRequired = Math.round(info.wordsPerChapter * 0.9);

  // Quality comes before efficiency: a "successful" API call can still
  // return a refusal, a meta-placeholder ("[text would go here]"), or a
  // chapter that never reaches minWordsRequired even after top-up attempts.
  // None of that is ever returned to the caller to be saved as a chapter —
  // this retries the WHOLE chapter from scratch (fresh sampling, not
  // patching broken text) a couple of times, and only gives up with a clear
  // error if every attempt still fails quality — better an honest "couldn't
  // write this chapter, try again" than a book with broken English in it.
  // Quality over speed, deliberately: the reader would much rather wait
  // longer for a real, working chapter than get something fast that's
  // broken, too short, or incoherent. So this is a generous budget, not a
  // stingy one — better to spend a few extra passes here than to hand back
  // a bad chapter or crash the reader's book.
  const CHAPTER_ATTEMPTS = 5;
  let lastError = null;
  for (let attempt = 0; attempt < CHAPTER_ATTEMPTS; attempt++) {
    let parsed;
    try {
      const raw = await callClaude(system, user, maxTokens, onRateLimitWait);
      parsed = parseChapterJson(raw);
    } catch (e) {
      lastError = e;
      if (e instanceof MissingApiKeyError) throw e; // retrying without a key configured can never succeed
      continue;
    }

    if (looksLikeBrokenGeneration(parsed.content)) {
      lastError = new Error("המודל החזיר טקסט לא תקין (הודעת סירוב או placeholder) במקום תוכן פרק אמיתי.");
      continue;
    }

    // Models reliably undershoot long word-count targets on a single pass,
    // so enforce the minimum here: if the chapter came back short, ask for
    // a direct continuation (not a rewrite) and append it, repeating a few
    // times if needed until the minimum is actually met. A continuation
    // that itself looks broken, OR that just circles back and re-describes
    // something already written instead of advancing the plot (see
    // looksLikeDuplicateContinuation), is discarded rather than appended —
    // but discarding it no longer gives up on the whole chapter: it costs
    // one of this loop's attempts and tries again, since a single weak
    // continuation call shouldn't be enough to doom an otherwise-good
    // chapter to a "too short" failure.
    let guard = 0;
    while (countWords(parsed.content) < minWordsRequired && guard < 7) {
      guard++;
      let more;
      try {
        more = await continueChapterContent({
          existingContent: parsed.content,
          targetWords: info.wordsPerChapter,
          level,
          info,
          onRateLimitWait,
          isPoetry,
          category,
          storyTitle,
          subtopic,
          outlineEntry,
          chapterIndex,
          totalChapters,
        });
      } catch (e) {
        continue; // network/quota hiccup mid-continuation — try again rather than giving up immediately
      }
      if (!more || !more.trim() || looksLikeBrokenGeneration(more)) continue;
      if (looksLikeDuplicateContinuation(more, parsed.content)) continue; // circled back instead of advancing — discard and retry
      // Poetry needs a real stanza break before the continuation, not a
      // plain space — a space would glue the new lines onto the end of the
      // poem's last existing line instead of starting a fresh one.
      parsed.content = isPoetry ? `${parsed.content.trim()}\n\n${more.trim()}` : `${parsed.content.trim()} ${more.trim()}`;
    }

    if (countWords(parsed.content) < minWordsRequired || looksLikeBrokenGeneration(parsed.content)) {
      lastError = new Error(
        `הפרק יצא קצר או פגום מדי (${countWords(parsed.content)} מילים, נדרשות לפחות ${minWordsRequired}) גם אחרי ניסיונות השלמה.`
      );
      continue;
    }

    // Final editorial pass: a chapter can pass every check above (real JSON,
    // long enough, not an obvious refusal) and still be broken in ways those
    // cheap heuristics can't catch — a paragraph that repeats itself, a
    // sudden jump in level/vocabulary, a scene that contradicts itself, a
    // continuation that trails off mid-thought. This is deliberately an
    // extra, separate read of the finished chapter (its own pass, on top of
    // the writing pass) rather than trying to catch everything in one shot —
    // slower, but a chapter that fails this is retried from scratch rather
    // than ever being shown to the reader.
    try {
      const review = await reviewChapterContent({ content: parsed.content, level, info, isPoetry, onRateLimitWait });
      if (!review.ok) {
        lastError = new Error(`הפרק לא עבר את בדיקת האיכות הסופית: ${review.reason || "התוכן לא עומד ברמה הנדרשת"}.`);
        continue;
      }
    } catch (e) {
      // The review call itself failing (network hiccup, provider hiccup) is
      // never a reason to throw away an otherwise-good chapter — only an
      // explicit "not ok" verdict from a review that actually completed is.
    }

    return parsed; // passed every quality check — safe to save and show
  }
  throw lastError || new Error("יצירת הפרק נכשלה — התוכן שהתקבל לא עמד בדרישות האיכות.");
}

// A dedicated, separate "editor" pass over an already-finished chapter —
// deliberately a second read by the model with fresh eyes, after writing is
// done, rather than trying to get everything right in the single writing
// pass. Looks specifically for the failure modes that slip past the cheap
// mechanical checks above: repeated/duplicated paragraphs or sentences, an
// abrupt unfinished ending, internal contradictions (a detail that
// contradicts something stated earlier in the same text), or English that
// doesn't actually match the requested CEFR level. Returns a conservative
// verdict — defaults to "ok" whenever the model's answer can't be parsed
// cleanly, since a shaky review response should never itself sink an
// otherwise-fine chapter.
async function reviewChapterContent({ content, level, info, isPoetry, onRateLimitWait }) {
  const system = isPoetry
    ? "You are a strict editor reviewing a finished English poem written for a Hebrew-speaking ESL learner. Check ONLY for real, concrete problems: (1) it reads as genuine prose chopped into lines rather than an actual poem, (2) a stanza or line is duplicated or nearly repeated elsewhere in the poem, (3) it stops abruptly mid-thought instead of ending as a real poem should, (4) the English is clearly far above or below the stated level. Output ONLY strict JSON: {\"ok\":true} if none of these problems are present, or {\"ok\":false,\"reason\":\"short specific reason\"} if any is. Do not flag stylistic choices, subject matter, or anything that isn't one of these four concrete problems."
    : "You are a strict editor reviewing a finished chapter of English reading material written for a Hebrew-speaking ESL learner. Check ONLY for real, concrete problems: (1) a paragraph, sentence, or scene is duplicated or nearly repeated elsewhere in the same text, (2) the chapter stops abruptly mid-sentence or mid-scene instead of reaching a real stopping point, (3) a clear internal contradiction (e.g. a character or detail described one way, then a contradicting way, within this same text), (4) the English is clearly far above or below the stated CEFR level, (5) the text is visibly not real narrative/expository prose (e.g. leftover instructions, placeholder text, or a list of notes instead of the chapter itself). Output ONLY strict JSON: {\"ok\":true} if none of these problems are present, or {\"ok\":false,\"reason\":\"short specific reason\"} if any is. Do not flag stylistic choices, plot content, or anything that isn't one of these five concrete problems.";
  const user = `Difficulty level ${level} (CEFR ${info.band}).\n\nChapter text:\n"""${content}"""\n\nReturn ONLY the JSON verdict.`;
  const raw = await callClaude(system, user, 150, onRateLimitWait);
  try {
    const cleaned = cleanJson(raw);
    const parsed = JSON.parse(cleaned);
    if (typeof parsed.ok === "boolean") return parsed;
  } catch (e) {
    // Unparseable verdict — treat as inconclusive, not as a failure.
  }
  return { ok: true };
}

// Parses the model's chapter JSON, with one safety net: if output got cut
// off near the very end (most likely inside the trailing "outline" array,
// since that field is always placed last in the schema), a plain parse
// would fail and lose the ENTIRE chapter. Recover by dropping the broken
// trailing "outline" field and re-parsing, so at minimum the chapter's own
// title/content/imagePrompt (which come first) still come through intact —
// a missing/short outline gracefully falls back to generic titles anyway
// (see sanitizeOutline), so this loses nothing critical.
//
// This is the #1 source of "failed to load chapter" errors specifically in
// LONG books/high levels: "content" is by far the biggest field in the
// schema and is written FIRST, so when a response gets cut off by the
// provider's output-token ceiling mid-generation (a long chapter is exactly
// what pushes closest to that ceiling), it almost always happens WHILE
// still inside the "content" string itself — leaving no closing quote/brace
// at all, and nothing left over for the (later) "outline"-stripping
// recovery above to work with. Level 3 below handles that specific case by
// manually salvaging chapterTitle/content out of the still-open JSON
// instead of giving up on the whole chapter.
function parseChapterJson(raw) {
  const cleaned = cleanJson(raw);
  try {
    return JSON.parse(cleaned);
  } catch (e) {
    // Level 1: content (and imagePrompt) parsed fine, only the trailing
    // "outline" array got cut off — drop it and re-parse.
    const stripped = cleaned.replace(/,\s*"outline"\s*:\s*\[[\s\S]*$/, "").trim();
    const candidate = stripped.endsWith("}") ? stripped : stripped + "}";
    try {
      return JSON.parse(candidate);
    } catch (e2) {
      // Level 2: the far more common case for long chapters — "content"
      // itself is truncated mid-string (unterminated), so there is no
      // valid closing brace anywhere. Manually salvage whatever fields we
      // can read out of the raw text without relying on JSON.parse at all.
      const salvaged = salvageChapterFields(cleaned);
      if (salvaged && salvaged.content && countWords(salvaged.content) >= 30) {
        return salvaged;
      }
      // Level 3: nothing usable — most likely the model returned a refusal
      // or apology instead of JSON at all (no "content" field ever
      // appeared), rather than a genuine mid-write truncation. Surface a
      // clear, specific error instead of the raw, confusing "Unexpected
      // token" message, so this failure mode is distinguishable (in logs
      // and in the retry loop) from a real truncation.
      const looksLikeRefusal = /^\s*(i'?m sorry|i cannot|i can'?t|sorry,|as an ai|i apologize|unfortunately,? i)/i.test(
        cleaned
      );
      const err = new Error(
        looksLikeRefusal
          ? "המודל החזיר הודעת סירוב/התנצלות במקום תוכן JSON — מנסים שוב אוטומטית."
          : `תשובת המודל לא הייתה JSON תקין ולא ניתן היה לשחזר ממנה תוכן שימושי (${e.message}).`
      );
      err.isChapterParseFailure = true;
      throw err;
    }
  }
}

// Manually extracts chapterTitle/content/etc. straight out of raw (possibly
// truncated, invalid) JSON text via direct string scanning — used only as a
// last-resort recovery when JSON.parse has already failed twice over (see
// parseChapterJson above). Deliberately does NOT try to salvage imagePrompt
// or outline: both already have solid fallbacks elsewhere (a missing
// imagePrompt triggers describeSceneForImage as a follow-up call; a missing
// outline falls back to generic per-chapter titles via sanitizeOutline), so
// there is no reason to make this recovery path more fragile by depending
// on fields that are even less likely to have survived a truncation than
// content itself.
function salvageChapterFields(text) {
  const content = extractJsonStringField(text, "content");
  if (!content) return null;
  return {
    chapterTitle: extractJsonStringField(text, "chapterTitle") || extractJsonStringField(text, "storyTitle") || "",
    content,
    imagePrompt: null,
    outline: null,
    subtopic: extractJsonStringField(text, "subtopic") || undefined,
    sourceAuthor: extractJsonStringField(text, "sourceAuthor") || undefined,
    sourceWork: extractJsonStringField(text, "sourceWork") || undefined,
    storyTitle: extractJsonStringField(text, "storyTitle") || undefined,
    tagline: extractJsonStringField(text, "tagline") || undefined,
  };
}

// Reads the value of one `"fieldName": "..."` JSON string field directly
// out of raw text by scanning characters (handling \", \\, \n, \t, \r, \uXXXX
// escapes) — unlike JSON.parse, this never fails on a string that runs off
// the end of the text (an unterminated/truncated string): it just returns
// everything that was readable up to that point, which is exactly the
// "give back whatever survived" behavior this recovery path needs.
function extractJsonStringField(text, fieldName) {
  const keyIdx = text.indexOf(`"${fieldName}"`);
  if (keyIdx === -1) return null;
  let i = text.indexOf(":", keyIdx + fieldName.length);
  if (i === -1) return null;
  i++;
  while (i < text.length && /\s/.test(text[i])) i++;
  if (text[i] !== '"') return null;
  i++;
  let out = "";
  while (i < text.length) {
    const ch = text[i];
    if (ch === "\\") {
      const next = text[i + 1];
      if (next === undefined) break; // truncated mid-escape-sequence
      const simple = { n: "\n", t: "\t", r: "\r", '"': '"', "\\": "\\", "/": "/", b: "\b", f: "\f" };
      if (next in simple) {
        out += simple[next];
        i += 2;
        continue;
      }
      if (next === "u") {
        const hex = text.slice(i + 2, i + 6);
        if (/^[0-9a-fA-F]{4}$/.test(hex)) {
          out += String.fromCharCode(parseInt(hex, 16));
          i += 6;
          continue;
        }
        break; // truncated unicode escape — stop here, keep what we have
      }
      out += next;
      i += 2;
      continue;
    }
    if (ch === '"') return out; // reached a clean, unescaped closing quote
    out += ch;
    i++;
  }
  // Ran off the end of the text mid-string: the field was truncated by the
  // provider's output limit. Still return what was actually written so far
  // rather than nothing — trimmed, since a cut usually lands mid-word.
  return out.trim() ? out : null;
}

// Used only to top up a chapter that came back under its required minimum
// word count — asks for a plain-text continuation (not JSON, not a rewrite)
// picking up exactly where the existing content left off. Takes the same
// plot context (story title, subtopic, chapter's own outline entry) as the
// main chapter-writing call — without it, the model has nothing to move the
// plot toward and tends to "continue" by re-describing whatever scene/image
// is already at the tail of the text (the exact bug this used to produce:
// the same sentence/paragraph appearing over and over), instead of
// advancing to a new beat.
async function continueChapterContent({
  existingContent,
  targetWords,
  level,
  info,
  onRateLimitWait,
  isPoetry,
  category,
  storyTitle,
  subtopic,
  outlineEntry,
  chapterIndex,
  totalChapters,
}) {
  const have = countWords(existingContent);
  // Only the tail is needed for the model to pick up naturally — sending
  // the whole chapter-so-far as it gets longer would just burn extra input
  // tokens and slow every subsequent continuation call down for no benefit.
  const tailWords = existingContent.trim().split(/\s+/).slice(-500).join(" ");
  const system = isPoetry
    ? "You continue an English poem for Hebrew-speaking ESL learners, matching exactly the style, form, vocabulary level and voice already established in the verse given to you. Output ONLY the continuation text itself — plain text, no JSON, no titles, no headers, no commentary — picking up smoothly (as a new stanza) from precisely where the poem stops, in real line breaks with a blank line between stanzas, never as prose."
    : "You continue a piece of graded English reading material for Hebrew-speaking ESL learners, matching exactly the style, vocabulary level and grammar already established in the passage given to you. Output ONLY the continuation text itself — plain text, no JSON, no titles, no headers, no commentary, and do not repeat any earlier sentence — picking up smoothly from precisely where the passage stops.";
  const askWords = Math.min(2500, Math.max(200, targetWords - have));
  // Plot context so the continuation has somewhere concrete to go, instead
  // of only ever seeing the last ~500 words in isolation.
  const contextLine =
    !isPoetry && storyTitle
      ? `This is part of the story "${storyTitle}"${subtopic ? ` (${subtopic})` : ""}${
          category && category.topicPrompt ? `, domain: ${category.topicPrompt}` : ""
        }. This is chapter ${chapterIndex + 1} of ${totalChapters}${
          outlineEntry && outlineEntry.title ? `: "${outlineEntry.title}"` : ""
        }${outlineEntry && outlineEntry.summary ? ` — ${outlineEntry.summary}` : ""}.\n`
      : "";
  const antiStallRule = !isPoetry
    ? `CRITICAL — the chapter is NOT finished yet: do not wrap up, conclude, or re-describe the moment/scene/image that the text above already ends on. Move the plot forward with a genuinely NEW concrete event, action, piece of dialogue, or development — something that has not happened yet in this chapter. Do not reuse any sentence, phrase, or description (even reworded) that already appears above.\n`
    : "";
  const user = isPoetry
    ? `Here is the END of a poem in progress (currently about ${have} words total, needs to reach at least ${targetWords} words):
"""...${tailWords}"""

Difficulty level ${level} (CEFR ${info.band}).
Grammar rules: ${info.tense}
Vocabulary rules: ${info.vocab}
Continue this SAME poem with about ${askWords} more words of genuinely poetic verse (more stanzas, in the same form/voice/rhyme scheme) — not a prose summary or explanation, and not a new, different poem.`
    : `${contextLine}Here is the END of a chapter in progress (currently about ${have} words total, needs to reach at least ${targetWords} words):
"""...${tailWords}"""

Difficulty level ${level} (CEFR ${info.band}).
Grammar rules: ${info.tense}
Vocabulary rules: ${info.vocab}
Sentence style: ${info.sentence}
CRITICAL — keep writing as one connected, flowing narrative, never as a list of short, independent, disconnected statements. Link sentences and ideas with real cause, contrast, sequence and consequence (because, so, but, when, after, until, as soon as, meanwhile, even though, etc.). Vary how sentences begin — do not let most sentences open with "The" or with the same subject/pattern every time — and vary sentence length and rhythm (mix short, punchy sentences with longer, more complex ones).
CRITICAL — paragraph length: keep writing in real, well-developed paragraphs (roughly 4-8+ connected sentences developing one continuous beat), matching the paragraphing of the chapter so far — never break into a string of tiny one- or two-sentence paragraphs. Only start a new paragraph where something genuinely shifts (scene, real time passing, speaker, or a new beat).
${antiStallRule}Continue this SAME chapter smoothly from exactly where it stops — do not repeat, summarize, or restart anything already written, and do not add a title. Write about ${askWords} more words that continue this exact scene naturally with the same characters, setting and voice.`;
  const tokens = Math.min(6000, Math.round(askWords * 1.8) + 400);
  const raw = await callClaude(system, user, tokens, onRateLimitWait);
  return raw.trim();
}

const ILLUSTRATION_STYLE =
  "detailed storybook illustration, fine pencil and ink linework with soft warm hand-tinted color, in the style of a classic 19th-century children's book engraving — not flat, not abstract, not a vector icon, not a cartoon, not a logo";

// Fallback only: used if a chapter response somehow arrived without an
// imagePrompt (e.g. an older cached story, or a model that dropped the
// field). Normally generateChapter already includes this, saving a whole
// extra API call per chapter.
async function describeSceneForImage(chapterContent) {
  const system =
    "You write rich, detailed, concrete image-generation prompts that depict ONE specific, fully-composed visual scene explicitly described in a given passage of English text. You only include characters, setting, objects, and action that are literally in the passage — never invent unrelated elements — but you DO include every visual detail already present (who is there, exactly what they look like if described, where they are, what is happening, foreground and background elements, mood/lighting if implied). The result must read like a full illustration brief, not a single flat icon or generic symbol. Output ONLY the image prompt itself, three to five sentences, no preamble, no quotes, no markdown.";
  const user = `Passage:\n"""${chapterContent}"""\n\nWrite a detailed illustration brief (3-5 sentences) for ONE specific, fully composed scene from this exact passage. Name the actual characters/creatures and what they look like, the specific setting and its details, and precisely what is happening — a complete scene an illustrator could paint, not a single generic object or symbol.`;
  const raw = await callClaude(system, user, 300);
  return raw.trim();
}

// Trims a (possibly very long) passage down to a window of plain-text words
// centered on the target word/phrase, so translateWord only ever pays for
// the LOCAL context that actually affects meaning — not the entire chapter.
// This matters most for real, full-length reference/"library" texts (a
// genuine book chapter can be several thousand words), where sending the
// whole thing as context on every single word click can burn most of a
// provider's per-minute token budget (e.g. Groq's free-tier gpt-oss models
// cap at 8,000 TPM) in just one or two clicks, causing 429s.
function localTranslationContext(word, context, radiusWords = 150) {
  if (!context) return word;
  const words = context.split(/\s+/);
  if (words.length <= radiusWords * 2) return context; // already short enough
  const needle = word.split(/\s+/)[0]?.toLowerCase();
  let centerIdx = words.findIndex((w) => w.toLowerCase().includes(needle));
  if (centerIdx === -1) centerIdx = Math.floor(words.length / 2);
  const start = Math.max(0, centerIdx - radiusWords);
  const end = Math.min(words.length, centerIdx + radiusWords);
  return words.slice(start, end).join(" ");
}

// Builds translation context from the EXACT click position (tokenIndex into
// the same tokens array ClickableText rendered), not a fuzzy re-search of
// the word inside the passage. This matters whenever the same word/phrase
// appears more than once in a chapter with a different sense each time —
// searching for "the first match of this word" (the old approach) could
// silently center the context window on the WRONG occurrence. Windowing by
// the actual token the reader tapped is exact by construction.
function buildLocalTranslationContext(meta, fallbackWord) {
  const RADIUS_TOKENS = 260; // includes punctuation/whitespace tokens, so this is roughly ~130 real words each side
  if (meta && Array.isArray(meta.tokens) && Number.isInteger(meta.tokenIndex)) {
    const { tokens, tokenIndex } = meta;
    const start = Math.max(0, tokenIndex - RADIUS_TOKENS);
    const end = Math.min(tokens.length, tokenIndex + RADIUS_TOKENS + 1);
    const windowed = tokens.slice(start, end).join("");
    if (windowed.trim()) return windowed;
  }
  return (meta && meta.content) || fallbackWord;
}

// Powers the extra detail lines shown for each saved word in "המילים שלי":
// a very short (1-2 word) Hebrew gloss of the word's general meaning, plus a
// short original English example sentence that uses the word. Kept separate
// from translateWord's contextual translation (which reflects how the word
// was used at that specific spot in the story, and can be a longer idiom) —
// this is a plain, general-purpose dictionary-style gloss instead.
async function fetchWordExtras(word, translation, context) {
  const system =
    "You are a concise English dictionary for a language learner. Given an English word/phrase (and, for reference only, its contextual Hebrew translation and the passage it came from), respond with ONLY valid JSON, no markdown fences, no commentary: {\"meaning\":\"a plain-English gloss of the word's general/base meaning, about 1-2 words, e.g. a simple synonym or category — must NOT simply repeat the word/phrase itself\",\"example\":\"one short, simple original English sentence (under 12 words) that uses the exact word or phrase\"}.";
  const user = `Word/phrase: "${word}"\nContextual Hebrew translation given elsewhere in the app (for reference only): "${translation || ""}"\nPassage it appeared in (for reference only): """${(context || "").slice(0, 300)}"""`;
  const raw = await callClaude(system, user, 150);
  const parsed = JSON.parse(cleanJson(raw));
  let meaning = typeof parsed.meaning === "string" ? parsed.meaning.trim() : "";
  // Defensive: if the model just echoed the word/phrase back as its own
  // "gloss" (the one thing it was explicitly told not to do), drop it
  // rather than show a useless self-referential line.
  if (meaning && meaning.toLowerCase().replace(/[.!?]+$/, "") === word.toLowerCase().trim()) meaning = "";
  return {
    meaning,
    example: typeof parsed.example === "string" ? parsed.example.trim() : "",
  };
}

// Wraps the first (case-insensitive) occurrence of `word` inside `sentence`
// in a <strong>, for the bolded-word example line — falls back to the plain
// sentence untouched if the word can't be found verbatim (e.g. a different
// inflection was used).
function boldWordInSentence(sentence, word) {
  if (!sentence || !word) return sentence || "";
  const idx = sentence.toLowerCase().indexOf(word.toLowerCase());
  if (idx === -1) return sentence;
  return (
    <>
      {sentence.slice(0, idx)}
      <strong>{sentence.slice(idx, idx + word.length)}</strong>
      {sentence.slice(idx + word.length)}
    </>
  );
}

// Isolates the exact, complete sentence within `context` that contains
// `word` — split on sentence-ending punctuation (. ! ?) — instead of an
// arbitrary word-count window. A translation model does far better with one
// full, grammatically complete sentence (subject, verb, full clause
// structure intact) than with a ragged partial window that may start or end
// mid-clause, since tense, number and idiom all depend on the sentence's
// complete grammatical shape. Falls back to the raw context (or the word
// itself) if no sentence boundary containing the word can be found — e.g. a
// context with no terminal punctuation at all.
function extractExactSentence(word, context) {
  if (!context) return word;
  const trimmedContext = context.trim();
  if (!trimmedContext) return word;
  // Split into sentences, keeping each one's terminating punctuation
  // attached (a plain /[.!?]/ split would throw the punctuation away).
  const sentences = trimmedContext.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [trimmedContext];
  const needle = word.trim().split(/\s+/)[0]?.toLowerCase().replace(/[^a-z']/g, "");
  if (needle) {
    const match = sentences.find((s) => s.toLowerCase().includes(needle));
    if (match) return match.trim();
  }
  // Word not found in any single sentence (e.g. it straddles a sentence
  // boundary in the windowed context) — fall back to the sentence closest to
  // the middle of the passage, which is where buildLocalTranslationContext
  // centers its window on the actual clicked token.
  const middle = sentences[Math.floor(sentences.length / 2)];
  return (middle || trimmedContext).trim();
}

// A selection of more than this many words is treated as a full sentence
// or short passage rather than a word/short-phrase lookup — phrasal verbs
// and idioms (the main reason a "phrase" selection exists at all) are
// essentially never longer than this, so anything past the threshold is
// almost certainly the reader dragging across a whole sentence (or more)
// and wanting it translated in full, not condensed into a short gloss.
const SENTENCE_MODE_WORD_THRESHOLD = 6;

async function translateWord(word, context) {
  const trimmedWord = (word || "").trim();
  const wordCount = trimmedWord ? trimmedWord.split(/\s+/).length : 0;
  if (wordCount > SENTENCE_MODE_WORD_THRESHOLD) {
    return translateFullSentence(trimmedWord, context);
  }

  const system =
    "You are a professional English-to-Hebrew translator producing dictionary-grade contextual translations for a language learner reading a story. You will be given ONE complete sentence and a word or phrase from within it. Your task requires absolute contextual precision:\n\n" +
    "1. GRAMMATICAL EXACTNESS: Translate the word/phrase exactly as it functions in THIS sentence — its precise part of speech, grammatical tense, and singular/plural number — never its default dictionary form if that differs from actual usage here. A past-tense verb must be rendered in Hebrew past tense, not the infinitive or present; a plural noun must be rendered plural; a word used as one part of speech (e.g. a noun used as a verb) must be translated as that same part of speech in Hebrew.\n\n" +
    "2. PHRASAL VERBS AND IDIOMS AS WHOLE UNITS: If the given word/phrase is (or is part of) a phrasal verb, fixed expression, or idiom (e.g. \"give up\", \"look forward to\", \"break the ice\"), you MUST translate it as a single complete semantic unit using its true Hebrew idiomatic equivalent — NEVER translate it word-by-word/literally. A literal, compositional translation that would sound nonsensical, wrong, or merely 'foreign-literal' to a native Hebrew speaker is a failure. Identify the real meaning of the whole expression in context first, then find how a native Hebrew speaker would actually express that same meaning.\n\n" +
    "3. NATURAL MODERN HEBREW: Output only fluent, natural, contemporary spoken/written Hebrew — the way a native speaker would really say it today. Never use nikud (vowel points). Never use archaic, biblical, liturgical, or overly literary/poetic vocabulary. Never choose an obscure, overly formal, or academic synonym when a simple, common word conveys the same meaning.\n\n" +
    "4. NAMES: If the given text is or includes a proper noun (a person's or place's name), keep it as a standard Hebrew transliteration and translate only any surrounding word(s) — never substitute an unrelated Hebrew word for a name.\n\n" +
    "Before answering, silently re-read the full sentence with your Hebrew translation substituted in place of the original word/phrase, and verify it reads as something a native Hebrew speaker would naturally say — matching tense, number, part of speech and idiom exactly. If it doesn't fit perfectly, revise it before responding.\n\n" +
    "Respond with ONLY the final Hebrew translation, 1 to 4 words, no nikud, no quotes, no punctuation, no explanation — nothing else.";
  const localContext = localTranslationContext(word, context);
  const exactSentence = extractExactSentence(word, localContext);
  const user = `Sentence:\n"""${exactSentence}"""\n\nWord or phrase to translate, exactly as it is used in THIS sentence: "${word}"`;
  // A translation is a few words at most — an explicit small ceiling instead
  // of the 1000-token default keeps this call's worst case cheap.
  try {
    const raw = await callClaude(system, user, 60);
    return raw.trim().replace(/^["'\u05f4\u05f3]+|["'\u05f4\u05f3]+$/g, "");
  } catch (e) {
    // Surface the real reason to the console instead of only ever letting
    // the UI collapse it into a generic "translation error" — otherwise a
    // 429/rate-limit, an auth problem, and a genuinely broken model all
    // look identical to the person using the app.
    console.error("translateWord failed:", e?.status, e?.message || e);
    throw e;
  }
}

// Full-sentence / short-passage translation — used when the reader selects
// a whole sentence (or a short multi-sentence passage) rather than a single
// word or short idiom. Unlike translateWord's dictionary-style 1-4-word
// gloss, this must render EVERY word of the source, start to finish: no
// shortening, no dropped clauses, no "summary" of the gist. The literary
// register matters here too — this is prose from a story or an expository
// text, not a dictionary entry, so the Hebrew must read as real, fluent,
// standard (תקנית) Hebrew prose that a native speaker would actually write,
// while staying faithful to the source's exact meaning and nuance.
async function translateFullSentence(text, context) {
  const system =
    "You are a professional literary and expository translator producing publication-quality Hebrew translations of full sentences and short passages for a language learner reading a story or informational text. You will be given a passage of surrounding context (for reference/disambiguation only) and a complete sentence or short passage to translate. Requirements:\n\n" +
    "1. COMPLETE, UNABRIDGED TRANSLATION: Translate the ENTIRE given text from its very first word to its very last word. Every clause and every sentence in the source must appear, translated, in your output. NEVER skip, drop, merge, paraphrase-away, condense, or summarize any part of it — however long the passage is. The Hebrew translation must be a full, faithful rendering of the complete source text, not a shortened version, a gist, or a synopsis.\n\n" +
    "2. STANDARD, FLUENT, NATURAL HEBREW: Write in fluent, grammatically correct standard modern Hebrew (עברית תקנית) that reads as genuine, natural prose a native speaker would actually write — not a stiff or overly literal word-for-word rendering. Preserve the source's exact meaning, tone, register, and nuance (literary passages should read like literary Hebrew prose; expository/informational passages should read like clear expository Hebrew prose). Never use nikud (vowel points).\n\n" +
    "3. CONTEXTUAL ACCURACY: Use the surrounding context only to resolve ambiguity (pronoun references, word sense, idioms) — translate ONLY the given text itself, not the surrounding context around it.\n\n" +
    "4. NAMES: Render proper nouns (people, places) as standard Hebrew transliterations; do not substitute unrelated Hebrew words for names.\n\n" +
    "Before answering, silently verify that every sentence and clause of the source is represented in your Hebrew translation and that nothing was omitted or condensed. Respond with ONLY the complete Hebrew translation of the given text — no preamble, no quotes, no explanation, nothing else.";
  const localContext = localTranslationContext(text, context, 150);
  const user = `Surrounding context (for reference only — do NOT translate this part, use it only to resolve ambiguity):\n"""${localContext}"""\n\nFull text to translate, in its entirety, omitting nothing:\n"""${text}"""`;
  // Unlike the short dictionary lookup, a full-sentence/passage translation
  // can legitimately run long — size the ceiling to the input so longer
  // selections aren't cut off mid-sentence.
  const maxTokens = Math.min(1500, Math.max(300, Math.ceil(text.length * 1.5)));
  try {
    const raw = await callClaude(system, user, maxTokens);
    return raw.trim().replace(/^["'\u05f4\u05f3]+|["'\u05f4\u05f3]+$/g, "");
  } catch (e) {
    console.error("translateFullSentence failed:", e?.status, e?.message || e);
    throw e;
  }
}

// Finds every exact word-sequence in a chapter's text that demonstrates a
// given grammar rule, so the app can highlight it directly in the story.
// Returns a uniform shape regardless of rule type: an array of "groups",
// where each group is an array of one or more exact-substring spans found in
// the passage. Plain grammar rules (and most poetry rules) yield one span
// per group — a flat list, essentially. "Paired" rules (rule.paired: true,
// e.g. rhyme, refrain, alliteration — devices that only make sense as a
// relationship between two or more spans) instead ask the model directly for
// each related group together, so the reader can be shown "these words go
// together" rather than just a list of isolated highlights.
//
// Exhaustiveness is the whole point of this feature — a partial list of
// examples defeats it. A single AI call over a full chapter (which can run
// to several thousand words) reliably tends to come back with only a
// handful of "representative" examples rather than truly every instance,
// and a long instance list risks being cut off by the token limit and
// silently discarded as unparseable JSON. To fix both failure modes, plain
// (non-paired) rules are scanned chunk by chunk — each chunk a modest,
// paragraph-sized piece the model can realistically scan exhaustively —
// and every chunk's findings are merged; a chunk that fails to parse gets
// one retry before being (individually) given up on, so one bad chunk never
// wipes out everything found in the rest of the chapter. "Paired" rules
// stay a single whole-passage call (a rhyme pair can sit far apart in the
// text, so chunking would sever real pairs), just with a much larger token
// budget and the same exhaustiveness instructions.
// Kept deliberately small (a short paragraph's worth, not a whole page) —
// smaller chunks mean each AI call has far less text to scan and far fewer
// spans to return, which is what actually avoids slow responses/time-outs.
// Bigger chunks did not meaningfully reduce the number of network calls
// anyway, because the module-level queue below (createConcurrencyLimiter)
// already paces how many run at once — they just made EACH call slower and
// more likely to be cut off, which is the opposite of what we want.
const GRAMMAR_CHUNK_TARGET_WORDS = 180;
// Chunking (above) multiplies how many network calls ONE rule on ONE
// chapter makes, and the reader can turn on many rules at once (there's a
// "mark all" button — dozens of curriculum rules by the higher levels).
// Without a shared cap, that combination could fire off dozens of chunk
// calls across dozens of rules all in the same instant — the exact way to
// blow through a provider's rate limit or burn through a token budget
// fast. This is a single MODULE-LEVEL queue (not per-story, not
// per-component) that every grammar-scan network call funnels through, so
// no matter how many rules/chunks are pending at once, only a small,
// steady number are ever actually in flight — the rest simply wait their
// turn. Turning on "מסומן הכל" still eventually marks everything; it just
// arrives gradually instead of as one giant burst.
function createConcurrencyLimiter(maxConcurrent) {
  let active = 0;
  const queue = [];
  function pump() {
    if (active >= maxConcurrent || queue.length === 0) return;
    active++;
    const { fn, resolve, reject } = queue.shift();
    fn().then(
      (v) => {
        active--;
        resolve(v);

// Reset app (device display only) + restoring afterwards
// ---------------------------------------------------------------------------
// "Reset app" clears reading levels, the library and saved words shown on
// THIS DEVICE only, for the reader's convenience (e.g. wanting to start
// fresh without deleting years of real progress). It is NOT a local backup
// of its own: the actual safety net is the same private cloud repository
// already used for ordinary cross-device backup (see pushBackup/pullBackup
// below) — the very same repository whose public stories also feed the
// shared, ever-growing public library. Resetting never writes to or deletes
// from that repository; it only clears what's rendered locally. Restoring
// afterwards (see ResetDataPanel) simply reuses the normal backup pull, so
// nothing beyond what already exists for a regular restore needs to exist

// for a front/back cover to make sense — a single-chapter story doesn't

function bookHasCover(story, readingPrefs) {
  return !!(readingPrefs && readingPrefs.showCover && story && story.totalChapters >= 3);

// front cover if this book has one (see bookHasCover), otherwise straight

function initialChapterIndex(story, readingPrefs, fallback) {
  return bookHasCover(story, readingPrefs) ? -1 : fallback;

// Normalizes a search query / title for duplicate-detection comparisons:
// lowercases, strips diacritics (Hebrew nikud + Latin accents), collapses
// punctuation/whitespace — so "Alice in Wonderland" and "alice   in wonderland!"

function normalizeSearchQuery(s) {

    .replace(/[\u0300-\u036f\u0591-\u05C7]/g, "") // Latin accents + Hebrew nikud/cantillation
