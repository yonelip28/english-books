<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ספריית אנגלית</title>

  <!-- PWA: lets the site be "installed" to the phone's home screen with its
       own name + icon (Android reads the manifest below; iOS/Safari mostly
       relies on the apple-* meta tags and apple-touch-icon instead, since it
       doesn't fully support the manifest). icon-192.png, icon-512.png and
       apple-touch-icon.png live in public/ and are copied to the site root by Vite. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="icon" href="/icon-512.png" sizes="512x512" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#23342E" />
  <meta name="application-name" content="ספריית אנגלית" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ספריית אנגלית" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="אפליקציית קריאה מדורגת ברמות ללימוד אנגלית." />

  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { background: #ECEEE6; font-family: sans-serif; }
    #boot {
      height: 100%; display: flex; align-items: center; justify-content: center;
      color: #23342E; font-size: 15px; flex-direction: column; gap: 10px;
    }
    #boot .ring {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid #3E7C7440; border-top-color: #3E7C74;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

</head>
<body>
  <div id="root"><div id="boot"><div class="ring"></div><div>טוען את חדר קריאה…</div></div></div>

  <!-- ===== Domain lock =====
       Runs before anything else loads. If this copy of the page is being
       served from a domain that isn't ours, it blanks the page with a
       clear message and sets window.__APP_DOMAIN_LOCKED__ = true, which
       the app checks again right before it renders (see the
       ReactDOM.createRoot(...).render(...) call near the bottom of this
       file) so a copied index.html can't be brought back to life by
       deleting just this block.
       Update ALLOWED_DOMAINS below once the final custom domain (if any)
       is known — for now, any "*.netlify.app" subdomain is allowed so the
       app keeps working across Netlify preview/branch deploys. -->
  <script>
    (function () {
      var ALLOWED_DOMAINS = [
        // Exact-match hostnames:
        "localhost",
        "127.0.0.1",
        // Add the final custom domain here once it's registered, e.g.:
        // "reading-room.co.il",
      ];
      var ALLOWED_SUFFIXES = [
        ".netlify.app", // covers every Netlify subdomain (prod + deploy previews)
      ];

      var host = (window.location.hostname || "").toLowerCase();
      var isLocalFile = window.location.protocol === "file:"; // opening the .html directly, useful for local dev/testing
      var isAllowed =
        isLocalFile ||
        ALLOWED_DOMAINS.indexOf(host) !== -1 ||
        ALLOWED_SUFFIXES.some(function (suffix) {
          return host.slice(-suffix.length) === suffix;
        });

      if (!isAllowed) {
        window.__APP_DOMAIN_LOCKED__ = true;
        document.getElementById("root").innerHTML =
          '<div style="height:100%;display:flex;align-items:center;justify-content:center;' +
          'flex-direction:column;gap:12px;padding:24px;text-align:center;' +
          'font-family:sans-serif;color:#23342E;background:#ECEEE6;">' +
          '<div style="font-size:17px;font-weight:700;">' +
          "האפליקציה הזו מורשית להפעלה רק בדומיין הרשמי." +
          "</div>" +
          '<div style="font-size:14px;color:#5c665f;max-width:420px;">' +
          "This application is licensed to run only on its official domain." +
          "</div>" +
          "</div>";
      }
    })();
  </script>

  <script>
    // Safety net: if the app has not drawn itself (script failed to load or crashed
    // during start-up), offer a reload.
    (function () {
      var shown = false;
      function fail() {
        var root = document.getElementById("root");
        if (shown || !root || !document.getElementById("boot")) return; // app already on screen
        shown = true;
        root.innerHTML =
          '<div style="height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center;font-family:sans-serif;color:#23342E;background:#ECEEE6;">' +
          '<div style="font-size:17px;font-weight:700;">האפליקציה לא עלתה כמו שצריך</div>' +
          '<div style="font-size:14px;color:#5c665f;max-width:420px;">הנתונים שלכם שמורים. אפשר לנסות לרענן.</div>' +
          '<button onclick="location.reload()" style="font-size:15px;padding:10px 18px;border-radius:10px;border:0;background:#3E7C74;color:#fff;">רענון</button></div>';
      }
      window.__bootFail = fail;
      window.addEventListener("error", function () { setTimeout(fail, 0); });
      window.addEventListener("unhandledrejection", function () { setTimeout(fail, 0); });
      setTimeout(fail, 25000);
    })();
  </script>
  <script type="module" src="/src/main.jsx" onerror="window.__bootFail && window.__bootFail()"></script>

  <script>
    // This app used to register a separate sw.js file as a service worker.
    // That's exactly what made earlier fixes look like they "didn't work":
    // replacing index.html doesn't touch a service worker that's already
    // installed and controlling the page, so the browser kept serving
    // whatever the OLD worker had cached, indefinitely, until it was
    // manually cleared. (A service worker also can't be registered from an
    // inline script/Blob URL — browsers require a real same-origin file —
    // so "keep it inline" and "keep a service worker" aren't both possible
    // at once here.)
    //
    // Given everything should live in this one file, and the service
    // worker was the source of the caching bugs rather than something
    // actively needed, the fix is to drop it entirely — and to actively
    // unregister any worker a previous version of this page already
    // installed in this browser, so this class of bug can't resurface on
    // its own. This runs every time the page loads; once any old worker is
    // gone it's a fast no-op.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        regs.forEach((reg) => {
          // Keep the push-notification worker (push-sw.js); remove any other.
          const url = (reg.active || reg.waiting || reg.installing || {}).scriptURL || "";
          if (!url.endsWith("/push-sw.js")) reg.unregister();
        });
      }).catch(() => {});
      if (window.caches) {
        caches.keys().then((names) => {
          names.forEach((name) => caches.delete(name));
        }).catch(() => {});
      }
    }
  </script>
</body>
</html>
