        <SecondaryButton onClick={() => setBookSearchOpen(false)} style={{ padding: "7px 9px" }}>
          <AppIcon name="X" size={13} />
        </SecondaryButton>
      </div>
      {bookSearchQuery.trim().length >= 2 && (
        <div style={{ marginTop: 7, maxHeight: 220, overflowY: "auto" }}>
          {bookSearchResults.length === 0 ? (
            <div style={{ fontSize: 12.5, color: "#8a9089", padding: "6px 3px" }}>לא נמצאו תוצאות.</div>
          ) : (
            bookSearchResults.map((r, i) => (
              <button
                key={i}
                onClick={() => jumpToSearchHit(r)}
                style={{
                  display: "block",
                  width: "100%",
                  textAlign: "left",
                  border: "none",
                  borderBottom: "1px solid var(--line)",
                  background: "transparent",
                  padding: "7px 3px",
                  cursor: "pointer",
                }}
              >
                <div style={{ fontSize: 10.5, color: category.color, fontWeight: 700, marginBottom: 2, direction: "rtl", textAlign: "right" }}>
                  {r.title}
                </div>
                <div style={{ fontSize: 12.5, color: "var(--ink)", lineHeight: 1.45, direction: "ltr", textAlign: "left" }}>
                  …{r.prefix}
                  <span style={{ background: "rgba(255,196,0,0.55)", fontWeight: 700 }}>{r.match}</span>
                  {r.suffix}…
                </div>
              </button>
            ))
          )}
        </div>
      )}
    </div>
  );

  // Which end of the (new) chapter to land on once we arrive there: "first"
  // for swiping forward into the next chapter, "last" for swiping backward
  // into the previous one (like flipping back to where you'd naturally
  // have left off) — only meaningful in classic pagination mode.
  const pendingPageTargetRef = useRef("first");
  useEffect(() => {
    if (!paginated) {
      setPageIndex(0);
      return;
    }
    if (pendingPageTargetRef.current === "last") {
      if (pages && pages.length > 0) {
        setPageIndex(pages.length - 1);
        pendingPageTargetRef.current = "first"; // consumed
      }
      // else: this chapter is still being generated (pages not ready yet) —
      // leave pageIndex alone for now (the loading overlay covers it) and
      // re-check once `pages` updates with the real content.
      return;
    }
    setPageIndex(0);
  }, [chapterIndex, paginated, pages]);

  // Swiping between chapters: in scroll mode, any recognized horizontal
  // swipe moves a whole chapter (there's no in-chapter paging to exhaust
  // first). In classic pagination mode, swiping continues through pages as
  // before, and only steps into the next/previous CHAPTER once you're
  // already on the last/first page — a seamless continuation of the same
  // gesture, like flipping past the end of a physical chapter. Either way,
  // moving to a chapter that hasn't been written yet auto-generates it —
  // exactly like picking it from the chapter menu.
  const touchStartRef = useRef(null);
  const SWIPE_MIN_DISTANCE = 45;
  function handlePageTouchStart(e) {
    const t = e.touches[0];
    touchStartRef.current = { x: t.clientX, y: t.clientY };
  }
  function handlePageTouchEnd(e) {
    if (!touchStartRef.current) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartRef.current.x;
    const dy = t.clientY - touchStartRef.current.y;
    touchStartRef.current = null;
    if (Math.abs(dx) < SWIPE_MIN_DISTANCE || Math.abs(dx) < Math.abs(dy)) return;
    const forward = dx < 0; // right-to-left = forward/next (RTL reading direction)

    if (paginated && pages && pages.length > 1) {
      if (forward && pageIndex < pages.length - 1) {
        setPageIndex((p) => p + 1);
        return;
      }
      if (!forward && pageIndex > 0) {
        setPageIndex((p) => p - 1);
        return;
      }
      // otherwise: already at the chapter's last/first page — fall through
      // to cross into the next/previous chapter below.
    }

    const minIndex = hasCover ? -1 : 0;
    const maxIndex = hasCover ? story.totalChapters : story.totalChapters - 1;
    if (minIndex === maxIndex) return; // single chapter, no cover — nothing to swipe to
    if (forward) {
      if (chapterIndex + 1 <= maxIndex) {
        pendingPageTargetRef.current = "first";
        onSelectChapter(chapterIndex + 1);
      }
    } else if (chapterIndex - 1 >= minIndex) {
      pendingPageTargetRef.current = "last";
      onSelectChapter(chapterIndex - 1);
    }
  }

  // Books with no curriculum level (e.g. a real book imported from a PDF,
  // kept in its original wording rather than leveled) don't map onto the
  // curricula by level — so instead of showing "0 rules", offer the whole
  // curriculum as available to mark.
  const hasLevel = !!story.level;
  const isPoetry = story.categoryId === "poetry";
  const grammarCumulative = hasLevel ? getCumulativeGrammar(story.level) : GRAMMAR_CURRICULUM;
  const grammarNewest = hasLevel ? getNewGrammarAtLevel(story.level) : [];
  // Poetry Grammar now mirrors the regular grammar rules exactly: leveled
  // books show only the poetics devices introduced up to their level (with a
  // "new in this poem" callout), while non-leveled books (e.g. a real poem
  // imported from a PDF) fall back to the full glossary as available to mark.
  const poetryCumulative = hasLevel ? getCumulativePoetry(story.level) : POETRY_CURRICULUM;
  const poetryNewest = hasLevel ? getNewestPoetryAtOrBelowLevel(story.level) : [];

  // Rule state for the currently-open chapter only, in the shape the
  // GrammarModal already knows how to render: { ruleKey: {loading, spans, color} }.
  const chapterHighlights = useMemo(() => {
    const out = {};
    Object.entries(grammarHighlights).forEach(([key, h]) => {
      const forChapter = h.byChapter[chapterIndex];
      out[key] = {
        loading: !forChapter || forChapter.loading,
        spans: (forChapter && forChapter.groups) || [],
        color: h.color,
        progress: forChapter && forChapter.progress,
      };
    });
    return out;
  }, [grammarHighlights, chapterIndex]);

  const highlightRanges = useMemo(() => {
    const ranges = [];
    Object.entries(grammarHighlights).forEach(([key, h]) => {
      const forChapter = h.byChapter[chapterIndex];
      if (forChapter && !forChapter.loading && forChapter.groups && forChapter.groups.length) {
        buildHighlightRanges(chapter.content, forChapter.groups, h.color, h.rule.heTitle, key).forEach((r) => {
          ranges.push({ ...r, emphasized: !!(activeGroup && activeGroup.ruleKey === r.ruleKey && activeGroup.groupId === r.groupId) });
        });
      }
    });
    // Highlight EVERY occurrence of the active search term in this
    // chapter — not just the one result that was clicked — so a repeated
    // word shows up marked wherever it appears on the page.
    const q = bookSearchQuery.trim();
    if (q.length >= 2 && bookSearchHit && bookSearchHit.chapterIndex === chapterIndex) {
      const lower = chapter.content.toLowerCase();
      const qLower = q.toLowerCase();
      let from = 0;
      while (true) {
        const at = lower.indexOf(qLower, from);
        if (at === -1) break;
        ranges.push({ start: at, end: at + q.length, color: "rgba(255,196,0,0.55)" });
        from = at + q.length;
      }
    }
    return ranges;
  }, [grammarHighlights, chapter.content, bookSearchHit, bookSearchQuery, chapterIndex, activeGroup]);

  // Fetches (or re-fetches) the spans for one active rule in one chapter.
  // Local-cache fast path: if this exact rule was already scanned for this
  // exact chapter content before, the result comes straight back from
  // localStorage with no network call at all — genuinely instant, not just
  // "fast". Only a real cache miss falls through to the AI scan, in which
  // case onProgress keeps the reader informed of exactly how much of the
  // chapter has been scanned so far instead of an indefinite spinner.
  async function fetchRuleForChapter(key, rule, chapterIdx, content) {
    const cached = getCachedGrammarSpans(story.id, chapterIdx, key, content);
    if (cached) {
      setGrammarHighlights((prev) => {
        const entry = prev[key];
        if (!entry) return prev; // rule was turned off before this ran
        return { ...prev, [key]: { ...entry, byChapter: { ...entry.byChapter, [chapterIdx]: { loading: false, groups: cached } } } };
      });
      return;
    }
    setGrammarHighlights((prev) => {
      const entry = prev[key];
      if (!entry) return prev; // rule was turned off before this ran
      return { ...prev, [key]: { ...entry, byChapter: { ...entry.byChapter, [chapterIdx]: { loading: true, groups: [], progress: { done: 0, total: 0 } } } } };
    });
    function reportProgress(done, total) {
      setGrammarHighlights((prev) => {
        const entry = prev[key];
        const forChapter = entry && entry.byChapter[chapterIdx];
        if (!entry || !forChapter || !forChapter.loading) return prev; // turned off / already resolved
        return { ...prev, [key]: { ...entry, byChapter: { ...entry.byChapter, [chapterIdx]: { ...forChapter, progress: { done, total } } } } };
      });
    }
    try {
      const groups = await findGrammarSpans(content, rule, reportProgress);
      setCachedGrammarSpans(story.id, chapterIdx, key, content, groups);
      setGrammarHighlights((prev) => {
        const entry = prev[key];
        if (!entry) return prev; // turned off while loading
        return { ...prev, [key]: { ...entry, byChapter: { ...entry.byChapter, [chapterIdx]: { loading: false, groups } } } };
      });
    } catch (e) {
      setGrammarHighlights((prev) => {
        const entry = prev[key];
        if (!entry) return prev;
        return { ...prev, [key]: { ...entry, byChapter: { ...entry.byChapter, [chapterIdx]: { loading: false, groups: [] } } } };
      });
    }
  }

  function toggleRuleHighlight(rule) {
    const key = ruleKey(rule);
    if (grammarHighlights[key]) {
      // turn the rule off everywhere in this story
      setGrammarHighlights((prev) => {
        const next = { ...prev };
        delete next[key];
        return next;
      });
      return;
    }
    // turn the rule on for the whole story — the effect below picks up that
    // the current chapter has no entry yet and fetches it immediately,
    // then keeps fetching automatically as the reader turns pages. The
    // modal stays open (closed only via its own X) so several rules can
    // be turned on one after another.
    setGrammarHighlights((prev) => ({ ...prev, [key]: { rule, color: grammarColorFor(rule), byChapter: {} } }));
  }

  // Turns on every rule passed in (keeping any that are already on, and
  // whatever spans they've already fetched, instead of re-fetching them).
  function selectAllRules(rules) {
    setGrammarHighlights((prev) => {
      const next = { ...prev };
      rules.forEach((rule) => {
        const key = ruleKey(rule);
        if (!next[key]) next[key] = { rule, color: grammarColorFor(rule), byChapter: {} };
      });
      return next;
    });
  }

  // Clears only the rules passed in (i.e. one curriculum's worth) rather
  // than every active highlight — so clearing poetry rules from the poetry
  // modal doesn't also wipe out grammar rules the reader had going, and
  // vice versa.
  function clearRules(rules) {
    const keysToRemove = new Set(rules.map(ruleKey));
    setGrammarHighlights((prev) => {
      const next = {};
      Object.entries(prev).forEach(([k, v]) => {
        if (!keysToRemove.has(k)) next[k] = v;
      });
      return next;
    });
  }

  // Whenever the reader moves to a chapter that a currently-active rule
  // hasn't been checked against yet, fetch it — this is what makes a
  // toggled-on rule stay marked across the whole book, not just the one
  // chapter it was turned on in.
  useEffect(() => {
    if (!chapter.content) return;
    Object.entries(grammarHighlights).forEach(([key, h]) => {
      if (!h.byChapter[chapterIndex]) {
        fetchRuleForChapter(key, h.rule, chapterIndex, chapter.content);
      }
    });
  }, [chapterIndex, chapter.content, grammarHighlights]);

  function handleHighlightClick(hl, e) {
    const rect = e.currentTarget.getBoundingClientRect();
    // For a "paired" rule (rhyme, refrain, etc.) hl.groupId is set, so every
    // other span sharing that same rule+group lights up together with this
    // one — not just this single tapped word.
    setGrammarTooltip({
      title: hl.groupId != null && hl.groupSize > 1 ? `${hl.ruleTitle} (מסומן גם במקום/מקומות נוספים)` : hl.ruleTitle,
      x: rect.left + rect.width / 2,
      y: rect.top,
    });
    setActiveGroup(hl.groupId != null ? { ruleKey: hl.ruleKey, groupId: hl.groupId } : null);
  }

  // Dismiss the grammar-type popup (and any emphasized group) on any tap
  // elsewhere, or if the page scrolls (its x/y position is fixed, so it
  // would drift away from the word otherwise).
  useEffect(() => {
    if (!grammarTooltip) return;
    const dismiss = () => {
      setGrammarTooltip(null);
      setActiveGroup(null);
    };
    window.addEventListener("scroll", dismiss, true);
    document.addEventListener("touchstart", dismiss, true);
    document.addEventListener("mousedown", dismiss, true);
    return () => {
      window.removeEventListener("scroll", dismiss, true);
      document.removeEventListener("touchstart", dismiss, true);
      document.removeEventListener("mousedown", dismiss, true);
    };
  }, [grammarTooltip]);

  // ---- Read-aloud: start position + auto-continue into the next page/chapter ----
  const textContainerRef = useRef(null);
  const readAloudRef = useRef(null);
  const autoReadPendingRef = useRef(false);
  const lastHeadingLengthRef = useRef(0);
  const lastHeadingPrefixLenRef = useRef(0);
  const lastBaseOffsetRef = useRef(0);
  const [highlightOffset, setHighlightOffset] = useState(null);
  const [headingHighlightOffset, setHeadingHighlightOffset] = useState(null);
  const [readAloudStatus, setReadAloudStatus] = useState("idle");
  const [topControlsVisible, setTopControlsVisible] = useState(true);
  const topSentinelRef = useRef(null);


  // The spoken heading is "CHAPTER SIX. " (a plain, non-word-tokenized
  // badge — not itself highlightable) followed by the actual chapter
  // title text (which IS tokenized and can be highlighted). Recorded here
  // so handleWordBoundary can tell which part of the heading is currently
  // being read and, for the title part, map the offset onto it.
  function chapterHeadingPrefixLen() {
    if (!chapter.title) return 0;
    const alreadyNumbered = /^chapter\s+\S+\s*[:.\-–]/i.test(chapter.title.trim());
    return story.totalChapters > 1 && !alreadyNumbered ? `${chapterHeading(chapterIndex + 1)}. `.length : 0;
  }

  function spokenChapterHeading() {
    if (!chapter.title) return "";
    const alreadyNumbered = /^chapter\s+\S+\s*[:.\-–]/i.test(chapter.title.trim());
    const prefix = story.totalChapters > 1 && !alreadyNumbered ? `${chapterHeading(chapterIndex + 1)}. ` : "";
    return `${prefix}${chapter.title}. `;
  }

  // Computed fresh at the moment "הקראה" is pressed (not from a stale prop),
  // so it reflects exactly where the reader currently is:
  // - pagination mode: the page currently on screen.
  // - scroll mode: the word currently at/just below the top of the viewport.
  // Either way, if that's the very start of the chapter, the chapter heading
  // and title are read first; picking up mid-chapter skips straight to the text.
  // Also records the heading length + base offset used, so word-boundary
  // events (for the moving highlight) can be mapped back to the right span.
  function resolveReadAloudText() {
    // A word tapped while paused/stopped (see onWordClick above) wins over
    // the normal "wherever the reader is scrolled/paged to" detection —
    // consumed (cleared) the moment it's used, so it only redirects the
    // very next play/resume and never sticks around after that.
    const manualOffset = pendingWordResumeRef.current ? pendingWordResumeRef.current.absoluteOffset : null;
    pendingWordResumeRef.current = null;

    if (paginated) {
      const pageText = (pages && pages[pageIndex]) || "";
      const pageBase = pageStartOffset(pageIndex);
      const relativeStart =
        manualOffset != null ? Math.max(0, Math.min(pageText.length, manualOffset - pageBase)) : 0;
      const heading = relativeStart === 0 && pageIndex === 0 ? spokenChapterHeading() : "";
      const body = relativeStart > 0 ? pageText.slice(relativeStart) : pageText;
      lastHeadingLengthRef.current = heading.length;
      lastHeadingPrefixLenRef.current = heading ? chapterHeadingPrefixLen() : 0;
      lastBaseOffsetRef.current = relativeStart;
      return `${heading}${body}`;
    }
    let startOffset = 0;
    if (manualOffset != null) {
      startOffset = Math.max(0, Math.min(chapter.content.length, manualOffset));
    } else {
      const container = textContainerRef.current;
      if (container) {
        const spans = container.querySelectorAll("span[data-tts-start]");
        for (let i = 0; i < spans.length; i++) {
          const rect = spans[i].getBoundingClientRect();
          if (rect.top >= 0) {
            startOffset = parseInt(spans[i].getAttribute("data-tts-start"), 10) || 0;
            break;
          }
        }
      }
    }
    const scrollHeading = startOffset === 0 ? spokenChapterHeading() : "";
    const bodyText = startOffset > 0 ? chapter.content.slice(startOffset) : chapter.content;
    lastHeadingLengthRef.current = scrollHeading.length;
    lastHeadingPrefixLenRef.current = scrollHeading ? chapterHeadingPrefixLen() : 0;
    lastBaseOffsetRef.current = startOffset;
    return `${scrollHeading}${bodyText}`;
  }

  // Called on every spoken word (best-effort — depends on the browser
  // supporting speechSynthesis word-boundary events). Maps the offset back
  // to a position in the currently-rendered text so the matching word can
  // be highlighted and scrolled into view.
  function handleWordBoundary(offsetInSpokenText) {
    const headingLen = lastHeadingLengthRef.current;
    if (offsetInSpokenText < headingLen) {
      setHighlightOffset(null); // body not reached yet — still reading the heading
      const prefixLen = lastHeadingPrefixLenRef.current;
      // Still inside the plain "CHAPTER SIX" badge (not tokenized, so
      // nothing to highlight there) — clear until we reach the title itself.
      setHeadingHighlightOffset(offsetInSpokenText < prefixLen ? null : offsetInSpokenText - prefixLen);
      return;
    }
    setHeadingHighlightOffset(null);
    const bodyLocalOffset = offsetInSpokenText - headingLen;
    const domOffset = paginated ? bodyLocalOffset : lastBaseOffsetRef.current + bodyLocalOffset;
    setHighlightOffset(domOffset);
  }

  function handleReadAloudStatusChange(status) {
    setReadAloudStatus(status);
    if (status === "idle") {
      setHighlightOffset(null);
      setHeadingHighlightOffset(null);
    }
  }

  // Called when a page/chapter finishes reading naturally (not on manual
  // stop). Moves on to the next page (pagination) or the next chapter, and
  // flags that reading should resume automatically once that text is ready.
  function handleReadAloudFinished() {
    if (paginated && pages && pageIndex < pages.length - 1) {
      autoReadPendingRef.current = true;
      setPageIndex((p) => p + 1);
      return;
    }
    if (hasNextSlot) {
      pendingPageTargetRef.current = "first";
      autoReadPendingRef.current = true;
      if (chapterAt(story, chapterIndex + 1)) {
        setChapterIndex(chapterIndex + 1);
      } else {
        onNextChapter();
      }
    }
  }

  // Fires the pending auto-continue once the new page's text is ready.
  useEffect(() => {
    if (!autoReadPendingRef.current || !paginated) return;
    const pageText = pages && pages[pageIndex];
    if (pageText && pageText.trim()) {
      autoReadPendingRef.current = false;
      const t = setTimeout(() => {
        if (readAloudRef.current) readAloudRef.current.play();
      }, 200);
      return () => clearTimeout(t);
    }
  }, [pageIndex, paginated, pages]);

  // Fires the pending auto-continue once the new chapter's text is ready
  // (scroll mode — pagination mode is handled by the effect above instead).
  useEffect(() => {
    if (!autoReadPendingRef.current || paginated) return;
    if (chapter.content && chapter.content.trim()) {
      autoReadPendingRef.current = false;
      const t = setTimeout(() => {
        if (readAloudRef.current) readAloudRef.current.play();
      }, 200);
      return () => clearTimeout(t);
    }
  }, [chapter.content, paginated]);

  // Keeps the moving highlight on screen as the reading progresses: only
  // nudges the scroll position when the current word drifts near the edges
  // of the viewport, rather than re-centering on every single word.
  useEffect(() => {
    if (highlightOffset == null) return;
    const container = textContainerRef.current;
    if (!container) return;
    const el = container.querySelector(`span[data-tts-start="${highlightOffset}"]`);
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const topBand = 90;
    const bottomBand = window.innerHeight - 120;
    if (rect.top < topBand || rect.bottom > bottomBand) {
      el.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }, [highlightOffset]);

  // Shows the floating mini controls (read-aloud + search) once the main
  // controls near the top of the page have scrolled out of view. Uses a
  // plain scroll listener + getBoundingClientRect rather than
  // IntersectionObserver — the observer's first callback can fire before
  // layout has settled (e.g. while the chapter image is still loading),
  // which was leaving topControlsVisible stuck on the wrong value instead
  // of actually tracking scroll position.
  useEffect(() => {
    function updateVisibility() {
      const el = topSentinelRef.current;
      if (!el) return;
      const rect = el.getBoundingClientRect();
      setTopControlsVisible(rect.bottom > 0);
    }
    updateVisibility();
    window.addEventListener("scroll", updateVisibility, { passive: true });
    window.addEventListener("resize", updateVisibility);
    return () => {
      window.removeEventListener("scroll", updateVisibility);
      window.removeEventListener("resize", updateVisibility);
    };
    // isGeneratingThisChapter is included because the sentinel element only
    // exists in the DOM once the loading page hands off to the real chapter
    // content — without it, this effect (tied only to chapterIndex, which
    // doesn't change again on that handoff) never re-measures, and the
    // floating buttons could get stuck showing (or hidden) based on a stale
    // scroll position from before the chapter finished generating.
  }, [chapterIndex, isGeneratingThisChapter]);

  const showFloatingReadAloud =
    prefs.floatingReadAloud !== false && !topControlsVisible && readAloudStatus !== "idle";
  const showFloatingSearch = !topControlsVisible;

  // Front/back "cover" pages are pseudo-chapters at index -1 and
  // story.totalChapters, only reachable when the reader turned the
  // cover-page setting on. Reached exactly like any other chapter — by
  // swiping (handlePageTouchStart/End, extended below to cross into/out of
  // these two indices) or from the chapter menu — never a dedicated button,
  // so it's part of the book's normal continuous flow. Built once here so
  // the exact same menu (button + dropdown) can be shown both on regular
  // chapter pages and on the cover pages below.
  const chapterMenuUI = (story.totalChapters > 1 || hasCover) && (
        <div style={{ marginBottom: 16 }}>
          <button
            onClick={() => setChapterMenuOpen((v) => !v)}
            style={{
              display: "flex",
              alignItems: "center",
              gap: 6,
              border: "1.5px solid var(--line-strong)",
              background: "var(--paper-raised)",
              borderRadius: 10,
              padding: "8px 13px",
              fontSize: 13,
              fontWeight: 700,
              color: "var(--ink)",
              cursor: "pointer",
              width: "100%",
              textAlign: "right",
            }}
          >
            <AppIcon name="BookOpen" size={14} />
            <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {chapterIndex === -1
                ? "כריכה קדמית"
                : chapterIndex === story.totalChapters
                ? "כריכה אחורית"
                : `פרק ${chapterIndex + 1} מתוך ${story.totalChapters}${chapterMenuTitle(chapterIndex) ? `: ${chapterMenuTitle(chapterIndex)}` : ""}`}
            </span>
            <AppIcon name={chapterMenuOpen ? "ChevronRight" : "ChevronLeft"} size={13} />
          </button>
          {chapterMenuOpen && (
            <div
              style={{
                marginTop: 8,
                border: "1px solid var(--line)",
                borderRadius: 12,
                background: "var(--paper)",
                maxHeight: 320,
                overflowY: "auto",
              }}
            >
              {hasCover && (
                <button
                  onClick={() => {
                    setChapterMenuOpen(false);
                    onSelectChapter(-1);
                  }}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 8,
                    width: "100%",
                    textAlign: "right",
                    border: "none",
                    borderBottom: "1px solid var(--line)",
                    background: chapterIndex === -1 ? `${category.color}14` : "transparent",
                    padding: "10px 13px",
                    cursor: "pointer",
                    fontFamily: "'Assistant', sans-serif",
                  }}
                >
                  <span
                    style={{
                      flexShrink: 0,
                      width: 22,
                      height: 22,
                      borderRadius: "50%",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      background: chapterIndex === -1 ? category.color : "transparent",
                      border: chapterIndex === -1 ? "none" : "1.5px dashed var(--line-strong)",
                    }}
                  >
                    <AppIcon name="BookOpen" size={12} color={chapterIndex === -1 ? "var(--paper)" : "#8a9089"} />
                  </span>
                  <span style={{ flex: 1, fontSize: 13.5, fontWeight: chapterIndex === -1 ? 700 : 600 }}>כריכה קדמית</span>
                </button>
              )}
              {Array.from({ length: story.totalChapters }).map((_, i) => {
                const active = i === chapterIndex;
                const generated = !!chapterAt(story, i);
                // For outline-driven books, every chapter can be jumped to
                // directly (it'll be written on demand). For older/legacy
                // books with no outline, chapters can only be generated in
                // order, so only the next un-written slot is reachable.
                const unlocked = generated || (hasOutline ? true : i <= story.chapters.length);
                const title = chapterMenuTitle(i);
                return (
                  <button
                    key={i}
                    disabled={!unlocked}
                    onClick={() => {
                      if (!unlocked) return;
                      setChapterMenuOpen(false);
                      pendingPageTargetRef.current = "first";
                      onSelectChapter(i);
                    }}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 8,
                      width: "100%",
                      textAlign: "right",
                      border: "none",
                      borderBottom: i < story.totalChapters - 1 ? "1px solid var(--line)" : "none",
                      background: active ? `${category.color}14` : "transparent",
                      padding: "10px 13px",
                      cursor: unlocked ? "pointer" : "default",
                      fontFamily: "'Assistant', sans-serif",
                    }}
                  >
                    <span
                      style={{
                        flexShrink: 0,
                        width: 22,
                        height: 22,
                        borderRadius: "50%",
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        fontSize: 11,
                        fontWeight: 700,
                        fontFamily: "'IBM Plex Mono', monospace",
                        background: active ? category.color : generated ? "#2E6EB5" : "transparent",
                        border: active || generated ? "none" : "1.5px dashed var(--line-strong)",
                        color: active || generated ? "var(--paper)" : "#8a9089",
                      }}
                    >
                      {i + 1}
                    </span>
                    <span
                      style={{
                        flex: 1,
                        minWidth: 0,
                        fontSize: 13.5,
                        fontWeight: active ? 700 : 600,
                        color: unlocked ? "var(--ink)" : "#b7b2a0",
                        overflow: "hidden",
                        textOverflow: "ellipsis",
                        whiteSpace: "nowrap",
                      }}
                    >
                      {title || `פרק ${i + 1}`}
                    </span>
                  </button>
                );
              })}
              {hasCover && (
                <button
                  onClick={() => {
                    setChapterMenuOpen(false);
                    onSelectChapter(story.totalChapters);
                  }}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 8,
                    width: "100%",
                    textAlign: "right",
                    border: "none",
                    background: chapterIndex === story.totalChapters ? `${category.color}14` : "transparent",
                    padding: "10px 13px",
                    cursor: "pointer",
                    fontFamily: "'Assistant', sans-serif",
                  }}
                >
                  <span
                    style={{
                      flexShrink: 0,
                      width: 22,
                      height: 22,
                      borderRadius: "50%",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      background: chapterIndex === story.totalChapters ? category.color : "transparent",
                      border: chapterIndex === story.totalChapters ? "none" : "1.5px dashed var(--line-strong)",
                    }}
                  >
                    <AppIcon name="BookOpen" size={12} color={chapterIndex === story.totalChapters ? "var(--paper)" : "#8a9089"} />
                  </span>
                  <span style={{ flex: 1, fontSize: 13.5, fontWeight: chapterIndex === story.totalChapters ? 700 : 600 }}>כריכה אחורית</span>
                </button>
              )}
            </div>
          )}
        </div>
  );

  if (isGeneratingThisChapter && !chapterAt(story, chapterIndex)) {
    // The reader is looking at exactly the chapter that's still being
    // written — the page itself IS the loading state, not an empty chapter
    // with a small floating pill elsewhere on screen.
    return <StoryLoadingPage story={story} category={category} chapterIndex={chapterIndex} job={loadingJob} onBack={onBack} />;
  }

  if (hasCover && (chapterIndex === -1 || chapterIndex === story.totalChapters)) {
    return (
      <CoverPageView
        story={story}
        category={category}
        isFront={chapterIndex === -1}
        onBack={onBack}
        onToggleLiked={onToggleLiked}
        onTouchStart={handlePageTouchStart}
        onTouchEnd={handlePageTouchEnd}
        chapterMenu={chapterMenuUI}
        prefs={prefs}
      />
    );
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 18 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <LevelStamp level={story.level} color={category.color} small />
          <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: "#5c665f" }}>
            <AppIcon name={Icon} size={14} color={category.color} />
            {category.name}
          </div>
          {story.read && (
            <div style={{ fontSize: 12, color: "#3E7C74", fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}>
              <AppIcon name="Check" size={13} /> נקרא
            </div>
          )}
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <SecondaryButton
            onClick={onToggleLiked}
            style={story.liked ? { padding: "7px 10px", fontSize: 13, background: "#B5658A18", borderColor: "#B5658A", color: "#B5658A" } : { padding: "7px 10px", fontSize: 13 }}
            title={story.liked ? "הסירו מהספרים שאהבתי" : "הוסיפו לספרים שאהבתי"}
          >
            <AppIcon name={story.liked ? "HeartFill" : "Heart"} size={15} color={story.liked ? "#B5658A" : undefined} />
          </SecondaryButton>
          {story.categoryId !== "webImport" && (
          <SecondaryButton onClick={() => printStory(story, category, prefs)} style={{ padding: "7px 10px", fontSize: 13 }} title="הדפסה / שמירה כ-PDF">
            <AppIcon name="Printer" size={15} />
          </SecondaryButton>
          )}
          <SecondaryButton onClick={onBack} style={{ padding: "7px 12px", fontSize: 13 }}>
            חזרה
            <AppIcon name="ChevronRight" size={15} />
          </SecondaryButton>
        </div>
      </div>

      <div style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 13, color: "#8a9089", marginBottom: 2 }}>{story.subtopic}</div>
        <div style={{ fontFamily: "'Frank Ruhl Libre', serif", fontSize: 28, fontWeight: 700, direction: "ltr", textAlign: "left" }}>
          <ClickableText
            as="span"
            content={story.storyTitle}
            source="title"
            savedWordsLower={savedWordsLower}
            onWordClick={onWordClick}
            phraseAnchor={phraseAnchor}
          />
        </div>
        <div style={{ fontStyle: "italic", color: "#5c665f", fontSize: 14, direction: "ltr", textAlign: "left", marginTop: 2 }}>
          <ClickableText
            as="span"
            content={story.tagline}
            source="tagline"
            savedWordsLower={savedWordsLower}
            onWordClick={onWordClick}
            phraseAnchor={phraseAnchor}
          />
        </div>
        {story.categoryId === "webImport" && story.standfirst && (
          // The article's standfirst/deck — the one-line summary between
          // headline and body on the original page. Lives right under the
          // main title (which is only ever shown ONCE, up here) rather than
          // inside the reading box below, which used to repeat the headline
          // a second time right above this same text.
          <div
            style={{
              fontFamily: "'Lora', serif",
              fontSize: 15.5,
              fontWeight: 600,
              fontStyle: "italic",
              color: "#5c665f",
              lineHeight: 1.55,
              direction: "ltr",
              textAlign: "left",
              marginTop: 6,
            }}
          >
            <ClickableText
              as="span"
              content={story.standfirst}
              source="story-standfirst"
              savedWordsLower={savedWordsLower}
              onWordClick={onWordClick}
              phraseAnchor={phraseAnchor}
            />
          </div>
        )}
        {story.source && (
          <div
            style={{
              marginTop: 8,
              display: "inline-flex",
              alignItems: "center",
              gap: 6,
              fontSize: 12.5,
              color: category.color,
              background: `${category.color}12`,
              border: `1px solid ${category.color}30`,
              borderRadius: 999,
              padding: "4px 11px",
            }}
          >
            <AppIcon name="BookMarked" size={12} />
            <span style={{ fontWeight: 700 }}>מבוסס על:</span>
            <span>{story.source}</span>
          </div>
        )}
        {story.categoryId === "webImport" && story.webSource && (
          <div
            style={{
              marginTop: 8,
              background: "var(--paper-raised)",
              border: "1px solid var(--line)",
              borderRadius: 10,
              padding: "9px 12px",
              fontSize: 12,
              color: "#5c665f",
              lineHeight: 1.6,
            }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 5, flexWrap: "wrap" }}>
              <AppIcon name="Link" size={12} />
              <span>מקור:</span>
              <a
                href={story.webSource.url}
                target="_blank"
                rel="noopener noreferrer"
                style={{ color: category.color, wordBreak: "break-all" }}
              >
                {story.webSource.domain}
              </a>
            </div>
            <div style={{ marginTop: 4 }}>
              כל הזכויות בטקסט ובתמונות שייכות לאתר המקורי. הכתבה נשמרה כאן לשימוש אישי בלבד — פרטית, ללא אפשרות הפצה, פרסום או הדפסה.
            </div>
          </div>
        )}
        {story.totalChapters > 10 && (
          <div style={{ marginTop: 6, fontSize: 12, color: "#8a9089" }}>
            כרך של {story.totalChapters.toLocaleString("he")} פרקים · פרק {chapterIndex + 1} מתוך {story.totalChapters.toLocaleString("he")}
          </div>
        )}
      </div>

      <div ref={topSentinelRef} style={{ marginBottom: 16 }}>
        {/* Row 1: navigation + tool buttons. flex:1/minWidth:0 on each lets
            them shrink to whatever the row needs to fit exactly — no
            wrapping to a second line and no horizontal scrolling — with the
            label text itself truncating (ellipsis) only in the extreme case
            where there simply isn't room, rather than breaking the layout. */}
        <div
          style={{
            display: "flex",
            alignItems: "center",
            gap: 5,
            flexWrap: "nowrap",
            marginBottom: 6,
          }}
        >
          {!isSearchStory && hasNextLevelStory && (
            <SecondaryButton onClick={onGoToNextLevel} title="עבור לסיפור ברמה הבאה" style={toolbarBtnStyle}>
              <AppIcon name="ChevronLeft" size={12} style={{ flexShrink: 0 }} />
              <span style={toolbarLabelStyle}>סיפור הבא</span>
            </SecondaryButton>
          )}
          {resumeTarget && (
            <SecondaryButton onClick={handleResumeToLastPosition} style={toolbarBtnStyle}>
              <AppIcon name="History" size={12} style={{ flexShrink: 0 }} />
              <span style={toolbarLabelStyle}>עבור למיקום אחרון</span>
            </SecondaryButton>
          )}
          <SecondaryButton onClick={() => setShowGrammar(true)} style={toolbarBtnStyle}>
            <AppIcon name="GraduationCap" size={12} style={{ flexShrink: 0 }} />
            <span style={toolbarLabelStyle}>{isPoetry ? "חוקי דקדוק בשיר זה" : "חוקי דקדוק בסיפור זה"}</span>
          </SecondaryButton>
          {story.categoryId === "poetry" && (
            <SecondaryButton onClick={() => setShowPoetryGrammar(true)} style={toolbarBtnStyle}>
              <AppIcon name="Feather" size={12} style={{ flexShrink: 0 }} />
              <span style={toolbarLabelStyle}>דקדוק שירה</span>
            </SecondaryButton>
          )}
          <div style={{ position: "relative", flexShrink: 0 }}>
            <SecondaryButton
              onClick={() => setBookSearchOpen((v) => !v)}
              title="חיפוש בספר"
              style={{
                padding: "6px 8px",
                flexShrink: 0,
                background: bookSearchOpen ? `${category.color}18` : undefined,
                borderColor: bookSearchOpen ? category.color : undefined,
              }}
            >
              <AppIcon name="Search" size={12} />
            </SecondaryButton>
            {bookSearchOpen && topControlsVisible && (
              <div style={{ position: "absolute", top: "calc(100% + 6px)", right: 0, zIndex: 61 }}>{searchPanelInner}</div>
            )}
          </div>
          {!isSearchStory && hasPreviousLevelStory && (
            <SecondaryButton onClick={onGoToPreviousLevel} title="עבור לסיפור ברמה הקודמת" style={toolbarBtnStyle}>
              <span style={toolbarLabelStyle}>סיפור קודם</span>
              <AppIcon name="ChevronRight" size={12} style={{ flexShrink: 0 }} />
            </SecondaryButton>
          )}
        </div>
        {/* Row 2: read-aloud (play/pause/stop) together with the speed pills,
            in their own fixed row below — never mixed with row 1. */}
        <div style={{ display: "flex", alignItems: "center", gap: 5, flexWrap: "nowrap", overflow: "hidden" }}>
          <ReadAloudButton
            ref={readAloudRef}
            text={chapter.content}
            color={category.color}
            resolveText={resolveReadAloudText}
            onFinished={handleReadAloudFinished}
            onBoundary={handleWordBoundary}
            onStatusChange={handleReadAloudStatusChange}
            pendingManualResumeRef={pendingWordResumeRef}
          />
        </div>
      </div>

      {chapterMenuUI}

      <div
        onTouchStart={handlePageTouchStart}
        onTouchEnd={handlePageTouchEnd}
        style={{
          background: bgDef.bg,
          border: "1px solid var(--line)",
          borderRadius: 14,
          padding: "26px 28px",
          touchAction: "pan-y",
        }}
      >
        {/* A web-imported article is always exactly one "chapter" whose
            title is identical to story.storyTitle, already shown once in
            the page header above (see there) — showing it again here would
            just duplicate it. Its standfirst moved up there too. So this
            whole title block is for multi-chapter books only. */}
        {story.totalChapters > 1 && (!paginated || pageIndex === 0) && (
          <div style={{ marginBottom: 14, direction: "ltr", textAlign: "left" }}>
            {!/^chapter\s+\S+\s*[:.\-–]/i.test((chapter.title || "").trim()) && (
              <div
                style={{
                  fontFamily: "'IBM Plex Mono', monospace",
                  fontSize: 13,
                  fontWeight: 700,
                  letterSpacing: "0.12em",
                  color: category.color,
                  marginBottom: 4,
                }}
              >
                {chapterHeading(chapterIndex + 1)}
              </div>
            )}
            <div style={{ fontFamily: "'Frank Ruhl Libre', serif", fontSize: 20, fontWeight: 700 }}>
              <ClickableText
                as="span"
                content={chapter.title}
                source={`chapter-title-${chapterIndex}`}
                savedWordsLower={savedWordsLower}
                onWordClick={onWordClick}
                phraseAnchor={phraseAnchor}
                speakingOffset={headingHighlightOffset}
              />
            </div>
          </div>
        )}
        {(imageAbove || paginated) && pageIndex === 0 && (
          <ChapterImage seed={`${story.id}-${chapterIndex}`} color={category.color} motif={category.artMotif} chapter={chapter} onRetry={onRetryChapterImage ? () => onRetryChapterImage(story.id, chapterIndex) : null} />
        )}
        <div
          ref={textContainerRef}
          style={{
            direction: "ltr",
            textAlign: "left",
            fontFamily,
            fontSize: fontPx,
            lineHeight: 1.85,
            color: bgDef.text,
          }}
        >
          {paginated ? (
            <ClickableText
              content={pages[pageIndex] || ""}
              source={`chapter-${chapterIndex}-page-${pageIndex}`}
              savedWordsLower={savedWordsLower}
              onWordClick={onWordClick}
              onHighlightClick={handleHighlightClick}
              phraseAnchor={phraseAnchor}
              highlightRanges={(() => {
                const pageStart = pages.slice(0, pageIndex).reduce((a, p) => a + p.length, 0);
                return highlightRanges.map((r) => ({ ...r, start: r.start - pageStart, end: r.end - pageStart }));
              })()}
              dropCap={pageIndex === 0}
              dropCapColor={dropCapColor}
              speakingOffset={highlightOffset}
              inlineImages={pdfImagesByPage ? pdfImagesByPage.get(pageIndex) : null}
            />
          ) : imageAbove ? (
            <ClickableText
              content={chapter.content}
              source={`chapter-${chapterIndex}`}
              savedWordsLower={savedWordsLower}
              onWordClick={onWordClick}
              onHighlightClick={handleHighlightClick}
              phraseAnchor={phraseAnchor}
              highlightRanges={highlightRanges}
              dropCap
              dropCapColor={dropCapColor}
              speakingOffset={highlightOffset}
              inlineImages={chapter.pdfImages}
            />
          ) : (
            <>
              <ClickableText
                content={firstHalf}
                source={`chapter-${chapterIndex}`}
                savedWordsLower={savedWordsLower}
                onWordClick={onWordClick}
                onHighlightClick={handleHighlightClick}
                phraseAnchor={phraseAnchor}
                highlightRanges={highlightRanges}
                dropCap
                dropCapColor={dropCapColor}
              />
              <ChapterImage seed={`${story.id}-${chapterIndex}`} color={category.color} motif={category.artMotif} chapter={chapter} onRetry={onRetryChapterImage ? () => onRetryChapterImage(story.id, chapterIndex) : null} />
              {secondHalf && (
                <ClickableText
                  content={secondHalf}
                  source={`chapter-${chapterIndex}`}
                  savedWordsLower={savedWordsLower}
                  onWordClick={onWordClick}
                  onHighlightClick={handleHighlightClick}
                  phraseAnchor={phraseAnchor}
                  highlightRanges={highlightRanges.map((r) => ({ ...r, start: r.start - firstHalf.length, end: r.end - firstHalf.length }))}
                />
              )}
            </>
          )}
        </div>

        {paginated && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 20, paddingTop: 16, borderTop: `1px solid ${category.color}20` }}>
            <SecondaryButton onClick={() => setPageIndex((p) => Math.min(pages.length - 1, p + 1))} disabled={pageIndex === pages.length - 1} style={{ padding: "7px 14px" }}>
              עמוד הבא
              <AppIcon name="ChevronLeft" size={15} />
            </SecondaryButton>
            <span style={{ fontSize: 12.5, color: "#8a9089", fontFamily: "'IBM Plex Mono', monospace" }}>
              עמוד {pageIndex + 1} מתוך {pages.length}
            </span>
            <SecondaryButton onClick={() => setPageIndex((p) => Math.max(0, p - 1))} disabled={pageIndex === 0} style={{ padding: "7px 14px" }}>
              <AppIcon name="ChevronRight" size={15} />
              עמוד קודם
            </SecondaryButton>
          </div>
        )}
      </div>

      {errorMsg && (
        <div style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <div style={{ color: "#8B3A3A", fontSize: 13, fontWeight: 600, flex: 1, minWidth: 200 }}>{errorMsg}</div>
          <SecondaryButton onClick={() => onSelectChapter(chapterIndex)} style={{ padding: "7px 14px", flexShrink: 0 }}>
            <AppIcon name="RefreshCw" size={14} />
            נסה שוב
          </SecondaryButton>
        </div>
      )}

      <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginTop: 20 }}>
        {atStoryEnd && hasCover && (
          <SecondaryButton
            onClick={() => {
              pendingPageTargetRef.current = "first";
              setChapterIndex(story.totalChapters);
            }}
          >
            כריכה אחורית
            <AppIcon name="ChevronLeft" size={15} />
          </SecondaryButton>
        )}
        {hasNextSlot && !chapterAt(story, chapterIndex + 1) && (
          <PrimaryButton
            onClick={() => {
              pendingPageTargetRef.current = "first";
              onNextChapter();
            }}
            style={{ background: category.color }}
          >
            הפרק הבא
            <AppIcon name="ChevronLeft" size={16} />
          </PrimaryButton>
        )}
        {atStoryEnd && !isSearchStory && (
          <>
            <PrimaryButton onClick={() => onStartNext(true)} style={{ background: category.color }}>
              {category.itemLabel || "סיפור"} חדש · רמה {story.level + 1}
              <AppIcon name="ChevronLeft" size={16} />
            </PrimaryButton>
            <SecondaryButton onClick={() => onStartNext(false)}>
              <AppIcon name="RotateCw" size={14} />
              {category.itemLabel || "סיפור"} נוסף באותה רמה
            </SecondaryButton>
          </>
        )}
        {atStoryEnd && isSearchStory && (
          <div style={{ fontSize: 13, color: "#5c665f", display: "flex", alignItems: "center" }}>
            הגעתם לסוף כל הפרקים שנוצרו לספר הזה 📖
          </div>
        )}
        {chapterIndex > 0 && !chapterAt(story, chapterIndex - 1) && (
          <PrimaryButton
            onClick={() => {
              pendingPageTargetRef.current = "first";
              onSelectChapter(chapterIndex - 1);
            }}
            style={{ background: category.color }}
          >
            <AppIcon name="ChevronRight" size={16} />
            הפרק הקודם
          </PrimaryButton>
        )}
        {chapterIndex > 0 && chapterAt(story, chapterIndex - 1) && (
          <PrimaryButton
            onClick={() => {
              pendingPageTargetRef.current = "first";
              setChapterIndex(chapterIndex - 1);
            }}
            style={{ background: "#3E7C74" }}
          >
            <AppIcon name="ChevronRight" size={16} />
            הפרק הקודם
          </PrimaryButton>
        )}
        {hasNextSlot && chapterAt(story, chapterIndex + 1) && (
          <PrimaryButton
            onClick={() => {
              pendingPageTargetRef.current = "first";
              setChapterIndex(chapterIndex + 1);
            }}
            style={{ background: "#3E7C74" }}
          >
            הפרק הבא
            <AppIcon name="ChevronLeft" size={16} />
          </PrimaryButton>
        )}
        <SecondaryButton
          onClick={onToggleRead}
          style={story.read ? { background: "#3E7C7418", borderColor: "#3E7C74", color: "#3E7C74" } : {}}
        >
          <AppIcon name="Check" size={15} />
          {story.read ? "נקרא · לביטול הסימון" : "סמן כנקרא"}
        </SecondaryButton>
        <SecondaryButton onClick={() => setShowGrammar(true)}>
          <AppIcon name="GraduationCap" size={15} />
          {isPoetry ? "חוקי דקדוק בשיר זה" : "חוקי דקדוק בסיפור זה"}
        </SecondaryButton>
        {story.categoryId === "poetry" && (
          <SecondaryButton onClick={() => setShowPoetryGrammar(true)}>
            <AppIcon name="Feather" size={15} />
            דקדוק שירה
          </SecondaryButton>
        )}
        <SecondaryButton
          onClick={() => {
            setPhraseAnchor(null);
            setPhraseMode((v) => !v);
          }}
          style={phraseMode ? { background: "#3E7C7418", borderColor: "#3E7C74", color: "#3E7C74" } : {}}
        >
          <AppIcon name="Plus" size={14} />
          {phraseMode ? "מצב ביטוי: פועל" : "תרגום ביטוי/משפט"}
        </SecondaryButton>
      </div>
      <div style={{ marginTop: 14, fontSize: 12.5, color: "#8a9089" }}>
        {phraseMode
          ? "לחצו על המילה הראשונה ואז על המילה האחרונה של הביטוי או המשפט כדי לתרגם אותם יחד (עובד גם על הכותרות)."
          : "לחצו על כל מילה — גם בכותרות — כדי לראות תרגום ולשמור אותה ברשימת המילים שלכם."}
      </div>

      {showGrammar && (
        <RuleHighlightModal
          title={isPoetry ? "כללי דקדוק בשיר זה" : "כללי דקדוק בסיפור זה"}
          cumulativeHeading="כל הכללים שנלמדו עד כה"
          cumulativeHeadingLevelless="כל כללי הדקדוק"
          levellessNote={`${grammarCumulative.length} כללי דקדוק זמינים לסימון`}
          hasLevel={hasLevel}
          level={story.level}
          cumulative={grammarCumulative}
          newest={grammarNewest}
          newestHeading={isPoetry ? "חדש בשיר הזה 🎉" : "חדש בסיפור הזה 🎉"}
          onClose={() => setShowGrammar(false)}
          color={category.color}
          grammarHighlights={chapterHighlights}
          onToggleRuleHighlight={toggleRuleHighlight}
          onSelectAllRules={selectAllRules}
          onClearAllRules={() => clearRules(grammarCumulative)}
        />

// ---------------------------------------------------------------------------
// Words
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Vocabulary quiz ("בחן את עצמיך") — flashcard-style multiple-choice quiz
// built from the words saved in "המילים שלי". Runs entirely client-side:
// distractor answers are drawn from the other saved words, so no AI call is
// needed to generate the quiz.
// ---------------------------------------------------------------------------

function speakEnglishWord(text) {
  if (typeof window === "undefined" || !("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-US";
    window.speechSynthesis.speak(utter);
  } catch (e) {
    // speech synthesis not available/blocked — fail silently
  }
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Builds the 4 multiple-choice options for one flashcard: the correct answer
// plus up to 3 unique distractors pulled from the other saved words' values
// for that same field (translation for en→he mode, word for he→en mode).
function buildQuizOptions(words, currentWord, mode) {
  const field = mode === "en2he" ? "translation" : "word";
  const correct = currentWord[field];
  const seen = new Set([correct]);
  const pool = [];
  for (const w of shuffleArray(words.filter((w2) => w2.id !== currentWord.id))) {
    const val = w[field];
    if (!seen.has(val)) {
      seen.add(val);
      pool.push(val);
    }
    if (pool.length >= 3) break;
  }
  return shuffleArray([correct, ...pool]);
}

const QUIZ_SIZE_CAP = 15;

// Chooses which words a NEW quiz opens with, and in what order — weighted
// toward words with no recorded success yet or a low cumulative success
// rate (using the persistent quizCorrect/quizAttempts stats saved on each
// word across every quiz ever taken), while still folding in some already
// well-known words for variety rather than testing weak words in isolation
// forever. The draw itself is randomized every time, so repeated quizzes
// don't settle into the same fixed lineup.
function buildQuizWordOrder(words) {
  function weightOf(w) {
    const attempts = w.quizAttempts || 0;
    if (attempts === 0) return 5; // never tested yet — highest priority
    const rate = w.quizCorrect / attempts;
    if (rate < 0.5) return 4; // struggling with this one
    if (rate < 0.8) return 2; // getting there
    return 1; // already well-known — still eligible, just less often
  }
  if (words.length <= QUIZ_SIZE_CAP) {
    return shuffleArray(words.map((w) => w.id));
  }
  // Weighted sample without replacement: repeatedly draw one word out of
  // whatever remains, with probability proportional to its priority weight,
  // until the quiz is full.
  const pool = words.map((w) => ({ id: w.id, weight: weightOf(w) }));
  const picked = [];
  for (let i = 0; i < QUIZ_SIZE_CAP && pool.length > 0; i++) {
    const total = pool.reduce((a, p) => a + p.weight, 0);
    let r = Math.random() * total;
    let idx = 0;
    for (; idx < pool.length - 1; idx++) {
      r -= pool[idx].weight;
      if (r <= 0) break;
    }
    picked.push(pool.splice(idx, 1)[0].id);
  }
  return picked; // already a randomized draw order
}

function QuizModal({ words, onClose, onRecordAnswer, quizHistory, onQuizFinished }) {
  const [mode, setMode] = useState("en2he"); // "en2he" = word→meaning, "he2en" = meaning→word
  const [order, setOrder] = useState(() => buildQuizWordOrder(words));
  const [index, setIndex] = useState(0);
  // Keyed by word id (not by question index) so navigating back to a
  // question already answered still shows that exact choice highlighted.
  const [selectedMap, setSelectedMap] = useState({});
  const [results, setResults] = useState({}); // wordId -> boolean (correct?) — this quiz session only
  const [showResults, setShowResults] = useState(false);
  const [showStats, setShowStats] = useState(false);
  // Which past quiz (from quizHistory) the reader tapped into to view, or
  // null while showing the plain list of past quizzes. Nested inside
  // showStats rather than a sibling of it, so "back" from a viewed quiz
  // returns to the list, not all the way out to the live flashcards.
  const [viewingHistoryId, setViewingHistoryId] = useState(null);
  // Guards against saving the same finished session twice (e.g. if the
  // reader pages back into the last question and forward again).
  const finishedSavedRef = useRef(false);

  const wordsById = useMemo(() => Object.fromEntries(words.map((w) => [w.id, w])), [words]);
  const currentWord = wordsById[order[index]];
  const selected = currentWord ? selectedMap[currentWord.id] || null : null;

  // Deliberately keyed on currentWord?.id (not the whole `words` array,
  // which gets a new reference whenever ANY word's data changes elsewhere —
  // e.g. a background gloss/example backfill, or this very quiz recording a
  // stat) — otherwise the options could silently reshuffle themselves out
  // from under an already-answered question, which is exactly what made the
  // correct answer's position look inconsistent before.
  const options = useMemo(() => {
    if (!currentWord) return [];
    return buildQuizOptions(words, currentWord, mode);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [currentWord?.id, mode]);

  function restart(newMode) {
    setMode(newMode);
    setOrder(buildQuizWordOrder(words));
    setIndex(0);
    setSelectedMap({});
    setResults({});
    setShowResults(false);
    setShowStats(false);
    setViewingHistoryId(null);
    finishedSavedRef.current = false;
  }

  function handleAnswer(opt) {
    if (selected) return;
    const field = mode === "en2he" ? "translation" : "word";
    const isCorrect = opt === currentWord[field];
    setSelectedMap((prev) => ({ ...prev, [currentWord.id]: opt }));
    setResults((prev) => ({ ...prev, [currentWord.id]: isCorrect }));
    if (onRecordAnswer) onRecordAnswer(currentWord.id, isCorrect);
  }

  function goNext() {
    if (index + 1 < order.length) {
      setIndex(index + 1);
    } else {
      setShowResults(true);
      // First time reaching the end of this exact session — snapshot it
      // into quiz history. The word/translation text is copied in as it
      // stood at quiz time, so this stays viewable later even if the word
      // itself gets edited or removed from "המילים שלי" afterward.
      if (!finishedSavedRef.current && onQuizFinished) {
        finishedSavedRef.current = true;
        const questions = order.map((id) => {
          const w = wordsById[id];
          return {
            wordId: id,
            word: w ? w.word : null,
            translation: w ? w.translation : null,
            answered: results[id] !== undefined,
            correct: results[id] === true,
          };
        });
        const answeredCount2 = questions.filter((q) => q.answered).length;
        const correctCount2 = questions.filter((q) => q.correct).length;
        onQuizFinished({
          id: uid(),
          ts: Date.now(),
          mode,
          questions,
          total: order.length,
          answeredCount: answeredCount2,
          correctCount: correctCount2,
        });
      }
    }
  }
  function goPrev() {
    if (index > 0) setIndex(index - 1);
  }

  const answeredCount = Object.keys(results).length;
  const correctCount = Object.values(results).filter(Boolean).length;
  const pct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

  const field = mode === "en2he" ? "translation" : "word"; // field the options are drawn from
  const promptField = mode === "en2he" ? "word" : "translation"; // field shown on the card

  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(35,52,46,0.5)",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        zIndex: 95,
        padding: 16,
      }}
      onClick={onClose}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: "var(--paper)",
          borderRadius: 18,
          padding: 22,
          maxWidth: 460,
          width: "100%",
          maxHeight: "88vh",
          overflowY: "auto",
          boxShadow: "0 20px 50px rgba(0,0,0,0.3)",
          display: "flex",
          flexDirection: "column",
          gap: 16,
        }}
      >
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
          <div style={{ fontFamily: "'Frank Ruhl Libre', serif", fontSize: 19, fontWeight: 700 }}>
            בוחן: כרטיסיות מילים
          </div>
          <div style={{ display: "flex", gap: 6, flexShrink: 0, flexWrap: "wrap", justifyContent: "flex-end" }}>
            <SecondaryButton
              onClick={() => {
                setShowResults((s) => !s);
                setShowStats(false);
                setViewingHistoryId(null);
              }}
              style={{ padding: "6px 10px", fontSize: 12.5 }}
            >
              <AppIcon name="BarChart2" size={14} />
              תוצאות
            </SecondaryButton>
            <SecondaryButton
              onClick={() => {
                setShowStats((s) => !s);
                setShowResults(false);
                setViewingHistoryId(null);
              }}
              style={{ padding: "6px 10px", fontSize: 12.5 }}
            >
              <AppIcon name="TrendingUp" size={14} />
              סטטיסטיקת בחנים
            </SecondaryButton>
            <button
              onClick={onClose}
              style={{ background: "none", border: "none", cursor: "pointer", color: "#8a9089", padding: 4 }}
            >
              <AppIcon name="X" size={18} />
            </button>
          </div>
        </div>

        <div style={{ display: "flex", gap: 6 }}>
          <button
            onClick={() => mode !== "en2he" && restart("en2he")}
            style={{
              flex: 1,
              padding: "8px 0",
              borderRadius: 999,
              fontSize: 12.5,
              fontWeight: 700,
              cursor: "pointer",
              border: `1.5px solid ${mode === "en2he" ? "var(--ink)" : "var(--line-strong)"}`,
              background: mode === "en2he" ? "var(--ink)" : "transparent",
              color: mode === "en2he" ? "var(--paper)" : "var(--ink)",
            }}
          >
            אנגלית ← עברית
          </button>
          <button
            onClick={() => mode !== "he2en" && restart("he2en")}
            style={{
              flex: 1,
              padding: "8px 0",
              borderRadius: 999,
              fontSize: 12.5,
              fontWeight: 700,
              cursor: "pointer",
              border: `1.5px solid ${mode === "he2en" ? "var(--ink)" : "var(--line-strong)"}`,
              background: mode === "he2en" ? "var(--ink)" : "transparent",
              color: mode === "he2en" ? "var(--paper)" : "var(--ink)",
            }}
          >
            עברית ← אנגלית
          </button>
        </div>

        {showStats ? (
          viewingHistoryId ? (
            (() => {
              const historyList = Array.isArray(quizHistory) ? quizHistory : Object.values(quizHistory || {});
              const entry = historyList.find((h) => h.id === viewingHistoryId);
              if (!entry) {
                // Shouldn't normally happen (entry removed from under us) —
                // fall back to the list rather than showing a blank screen.
                setViewingHistoryId(null);
                return null;
              }
              const entryPct = entry.answeredCount > 0 ? Math.round((entry.correctCount / entry.answeredCount) * 100) : 0;
              const dateLabel = new Date(entry.ts).toLocaleString("he-IL", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
              });
              return (
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  <div style={{ textAlign: "center", padding: "6px 0" }}>
                    <div style={{ fontSize: 30, fontWeight: 700, fontFamily: "'IBM Plex Mono', monospace", color: "#3E7C74" }}>
                      {entryPct}%
                    </div>
                    <div style={{ fontSize: 12.5, color: "#8a9089" }}>
                      {entry.answeredCount} מתוך {entry.total} נענו · {entry.correctCount} נכונות
                    </div>
                    <div style={{ fontSize: 11.5, color: "#8a9089", marginTop: 2 }}>
                      {dateLabel} · {entry.mode === "en2he" ? "אנגלית ← עברית" : "עברית ← אנגלית"}
                    </div>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {entry.questions.map((q, i) => (
                      <div
                        key={q.wordId || i}
                        style={{
                          display: "flex",
                          alignItems: "center",
                          gap: 10,
                          padding: "8px 12px",
                          borderRadius: 10,
                          border: "1px solid var(--line)",
                          background: !q.answered ? "var(--paper-raised)" : q.correct ? "#E9F3EC" : "#F6E8E8",
                        }}
                      >
                        <AppIcon
                          name={!q.answered ? "Minus" : q.correct ? "Check" : "X"}
                          size={14}
                          color={!q.answered ? "#8a9089" : q.correct ? "#3E7C74" : "#8B3A3A"}
                        />
                        <span style={{ fontFamily: "'Lora', serif", direction: "ltr", fontWeight: 600, flexShrink: 0 }}>
                          {q.word || "מילה שנמחקה"}
                        </span>
                        <span style={{ fontSize: 12.5, color: "#8a9089", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                          {q.translation || ""}
                        </span>
                      </div>
                    ))}
                  </div>
                  <SecondaryButton onClick={() => setViewingHistoryId(null)} style={{ width: "100%", padding: "9px 0", fontSize: 13 }}>
                    <AppIcon name="ChevronRight" size={14} />
                    חזרה לרשימת הבחנים
                  </SecondaryButton>
                </div>
              );
            })()
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <div style={{ fontSize: 12.5, color: "#8a9089", textAlign: "center" }}>
                היסטוריית בחנים — אחוז ההצלחה של כל מבחן שהושלם. לחצו על מבחן כדי לצפות בו.
              </div>
              {(() => {
                const historyList = [...(Array.isArray(quizHistory) ? quizHistory : Object.values(quizHistory || {}))].sort(
                  (a, b) => b.ts - a.ts
                );
                if (historyList.length === 0) {
                  return (
                    <div style={{ textAlign: "center", color: "#8a9089", fontSize: 13, padding: "16px 0" }}>
                      עדיין אין מבחנים שהושלמו — סיימו בוחן כדי לראות אותו כאן.
                    </div>
                  );
                }
                return (
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {historyList.map((entry) => {
                      const pct = entry.answeredCount > 0 ? Math.round((entry.correctCount / entry.answeredCount) * 100) : 0;
                      const color = pct >= 80 ? "#3E7C74" : pct >= 50 ? "#9C7A2E" : "#8B3A3A";
                      const dateLabel = new Date(entry.ts).toLocaleString("he-IL", {
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit",
                      });
                      return (
                        <div
                          key={entry.id}
                          onClick={() => setViewingHistoryId(entry.id)}
                          style={{
                            display: "flex",
                            alignItems: "center",
                            gap: 10,
                            padding: "8px 12px",
                            borderRadius: 10,
                            border: "1px solid var(--line)",
                            cursor: "pointer",
                          }}
                        >
                          <div style={{ display: "flex", flexDirection: "column", flex: 1, minWidth: 0 }}>
                            <span style={{ fontSize: 12.5, fontWeight: 600 }}>{dateLabel}</span>
                            <span style={{ fontSize: 11, color: "#8a9089" }}>
                              {entry.mode === "en2he" ? "אנגלית ← עברית" : "עברית ← אנגלית"}
                            </span>
                          </div>
                          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, fontSize: 13, color, flexShrink: 0 }}>
                            {pct}% ({entry.correctCount}/{entry.answeredCount})
                          </span>
                          <AppIcon name="ChevronLeft" size={14} color="#8a9089" />
                        </div>
                      );
                    })}
                  </div>
                );
              })()}
              <SecondaryButton
                onClick={() => {
                  setShowStats(false);
                  setViewingHistoryId(null);

                style={{ width: "100%", padding: "9px 0", fontSize: 13 }}

          )
        ) : showResults ? (

              <div style={{ fontSize: 12.5, color: "#8a9089" }}>

              {order.map((id) => {

                  <div

                      padding: "8px 12px",

                      border: "1px solid var(--line)",
                      background: r === undefined ? "var(--paper-raised)" : r ? "#E9F3EC" : "#F6E8E8",
                    }}
                  >
                    <AppIcon
                      name={r === undefined ? "Minus" : r ? "Check" : "X"}
                      size={14}
                      color={r === undefined ? "#8a9089" : r ? "#3E7C74" : "#8B3A3A"}
                    />
                    <span style={{ fontFamily: "'Lora', serif", direction: "ltr", fontWeight: 600, flexShrink: 0 }}>
                      {w.word}
                    </span>
                    <span style={{ fontSize: 12.5, color: "#8a9089", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
