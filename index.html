  let remoteWordIds = arrayField(ef.wordIds);

  // Legacy backups (before words got their own per-document storage) kept
  // every word inline in one blob on the metadata doc. Migrate that blob's
  // words into individual documents now, so nothing is lost once the
  // metadata doc below gets rewritten without that old `words` field.
  if (!ef.wordIds && ef.words) {
    const legacyWords = parseJsonField(ef.words, {});
    const legacyIds = Object.keys(legacyWords);
    if (legacyIds.length && onProgress) onProgress(`משדרגים ${legacyIds.length} מילים לפורמט החדש…`);
    for (let i = 0; i < legacyIds.length; i++) {
      const id = legacyIds[i];
      const field = compressJsonToField(legacyWords[id]);
      await firestoreSet(config, `${BACKUP_COLLECTION}/${docId}/words/${encodeURIComponent(id)}`, {
        data: field,
      });
      bytesWritten += field.stringValue.length;
    }
    remoteWordIds = legacyIds;
  }

  const newStoryIds = localStoryIds.filter((id) => !remoteStoryIds.includes(id));
  const newWordIds = localWordIds.filter((id) => !remoteWordIds.includes(id));

  if (newStoryIds.length && onProgress) onProgress(`מגבים ${newStoryIds.length} ספרים חדשים…`);
  for (let i = 0; i < newStoryIds.length; i++) {
    const id = newStoryIds[i];
    const field = compressJsonToField(state.stories[id]);
    await firestoreSet(config, `${BACKUP_COLLECTION}/${docId}/stories/${encodeURIComponent(id)}`, {
      data: field,
    });
    bytesWritten += field.stringValue.length;
  }

  if (newWordIds.length && onProgress) onProgress(`מגבים ${newWordIds.length} מילים חדשות…`);
  for (let i = 0; i < newWordIds.length; i++) {
    const id = newWordIds[i];
    const field = compressJsonToField(state.words[id]);
    await firestoreSet(config, `${BACKUP_COLLECTION}/${docId}/words/${encodeURIComponent(id)}`, {
      data: field,
    });
    bytesWritten += field.stringValue.length;
  }

  // Also push every imported PDF book's ORIGINAL FILE into this same
  // private backup — not just whichever chapters this reader has already
  // opened (all that travels with the story JSON above, see
  // writeChapterAt). Without this, a PRIVATE import (isPublic: false, so it
  // never reaches the public catalog either) could only ever be reopened
  // one chapter at a time on the exact device that imported it — every
  // other chapter would be permanently stuck once the story is restored to
  // a new device. Retried on every backup, not just when the story is
  // brand-new, via a local "already pushed" flag (see
  // PDF_CHAPTERS_BACKUP_TRACK_KEY) so a book whose push failed once (or was
  // imported before this existed) still gets a chance to catch up, while
  // one that already succeeded is never re-sent for nothing.
  const pdfBackupTrack = getPdfChaptersPushTrack(PDF_CHAPTERS_BACKUP_TRACK_KEY);
  const importedIds = localStoryIds.filter((id) => state.stories[id] && state.stories[id].isImported && !pdfBackupTrack[id]);
  if (importedIds.length && onProgress) onProgress(`מגבים את קובצי ה-PDF המקוריים…`);
  for (let i = 0; i < importedIds.length; i++) {
    const id = importedIds[i];
    const pdfBytes = await loadPdfFileBytes(id);
    if (pdfBytes && pdfBytes.length) {
      // Only flag as done when the push actually succeeded — otherwise a
      // book whose upload failed (offline, auth not ready yet, ...) would
      // get marked "done" anyway and never be retried on a future backup.
      const ok = await pushPdfFileToBackupCloud(config, docId, id, pdfBytes);
      if (ok) setPdfChaptersPushed(PDF_CHAPTERS_BACKUP_TRACK_KEY, id);
    }
  }

  // Union, never shrink — a story/word missing locally might just not have
  // synced down from another device yet, so its remote copy stays listed.
  const storyIds = Array.from(new Set([...remoteStoryIds, ...localStoryIds]));
  const wordIds = Array.from(new Set([...remoteWordIds, ...localWordIds]));

  // Protective merge, mirroring pushBackupNetlify below: a category that's
  // "empty" on this device (fresh install, or right after a local "reset
  // app") must never overwrite real progress already sitting in the remote
  // backup — it just means this device hasn't caught up yet, not that the
  // reader actually lost that progress. Only categories with genuine local
  // progress push their own (newer) values.
  const remoteCategoryProgress = parseJsonField(ef.categoryProgress, null);
  const mergedCategoryProgress = { ...(state.categoryProgress || {}) };
  if (remoteCategoryProgress) {
    Object.keys(remoteCategoryProgress).forEach((catId) => {
      if (isEmptyCategoryProgress(mergedCategoryProgress[catId])) {
        mergedCategoryProgress[catId] = remoteCategoryProgress[catId];
      }
    });
  }

  const nextMeta = {
    email: identity.email || "",
    storyIds,
    wordIds,
    categoryProgress: mergedCategoryProgress,
    readingPrefs: state.readingPrefs || {},
    librarySort: state.librarySort || {},
  };
  const prevMeta = {
    email: (ef.email && ef.email.stringValue) || "",
    storyIds: remoteStoryIds,
    wordIds: remoteWordIds,
    categoryProgress: remoteCategoryProgress,
    readingPrefs: parseJsonField(ef.readingPrefs, null),
    librarySort: parseJsonField(ef.librarySort, null),
  };

  // Skip the metadata write entirely if nothing actually changed — no new
  // stories/words and no settings changes means there's nothing to save.
  if (!jsonEqual(nextMeta, prevMeta)) {
    if (onProgress) onProgress("מעדכנים גיבוי…");
    const categoryProgressField = compressJsonToField(nextMeta.categoryProgress);
    const readingPrefsField = compressJsonToField(nextMeta.readingPrefs);
    const librarySortField = compressJsonToField(nextMeta.librarySort);
    const metaFields = {
      email: strField(nextMeta.email),
      updatedAt: intField(Date.now()),
      storyIds: { arrayValue: { values: storyIds.map(strField) } },
      wordIds: { arrayValue: { values: wordIds.map(strField) } },
      categoryProgress: categoryProgressField,
      readingPrefs: readingPrefsField,
      librarySort: librarySortField,
    };
    await firestoreSet(config, `${BACKUP_COLLECTION}/${docId}`, metaFields);
    bytesWritten +=
      utf8ByteLength(nextMeta.email) +
      utf8ByteLength(JSON.stringify(storyIds)) +
      utf8ByteLength(JSON.stringify(wordIds)) +
      categoryProgressField.stringValue.length +
      readingPrefsField.stringValue.length +
      librarySortField.stringValue.length;
  }

  return { newStoryCount: newStoryIds.length, newWordCount: newWordIds.length, bytesWritten };
}

// Pulls down only the stories/words that are listed in the backup but
// aren't already present on this device (by id) — nothing already here is
// re-fetched or overwritten. Returns null only if no backup exists at all
// for this identity; otherwise returns a small "patch" of just the new
// pieces (possibly empty, if this device already has everything).
async function pullBackupFirebase(config, identity, localState, onProgress) {
  const docId = identity.uid;

  if (onProgress) onProgress("מאתרים גיבוי…");
  const meta = await firestoreGet(config, `${BACKUP_COLLECTION}/${docId}`);
  if (!meta || !meta.fields) return null;

  const f = meta.fields;
  const remoteStoryIds = arrayField(f.storyIds);
  let remoteWordIds = arrayField(f.wordIds);
  let legacyWords = null;
  if (!f.wordIds && f.words) {
    // Legacy backup format — every word lived inline in one blob.
    legacyWords = parseJsonField(f.words, {});
    remoteWordIds = Object.keys(legacyWords);
  }

  const localStoryIds = new Set(Object.keys((localState && localState.stories) || {}));
  const localWordIds = new Set(Object.keys((localState && localState.words) || {}));
  const missingStoryIds = remoteStoryIds.filter((id) => !localStoryIds.has(id));
  const missingWordIds = remoteWordIds.filter((id) => !localWordIds.has(id));

  if (missingStoryIds.length && onProgress) onProgress(`משחזרים ${missingStoryIds.length} ספרים חדשים…`);
  const stories = {};
  for (let i = 0; i < missingStoryIds.length; i++) {
    const id = missingStoryIds[i];
    const doc = await firestoreGet(config, `${BACKUP_COLLECTION}/${docId}/stories/${encodeURIComponent(id)}`);
    // parseJsonField auto-detects gzip-compressed vs legacy plain JSON — see
    // its own comment above — so a story backed up before compression
    // existed restores exactly the same way a freshly-compressed one does.
    const parsed = doc && doc.fields && parseJsonField(doc.fields.data, null);
    if (parsed) stories[id] = parsed;
    // (a missing/corrupt doc is skipped rather than failing the whole restore)
  }

  const words = {};
  if (legacyWords) {
    missingWordIds.forEach((id) => {
      if (legacyWords[id]) words[id] = legacyWords[id];
    });
  } else if (missingWordIds.length) {
    if (onProgress) onProgress(`משחזרים ${missingWordIds.length} מילים חדשות…`);
    for (let i = 0; i < missingWordIds.length; i++) {
      const id = missingWordIds[i];
      const doc = await firestoreGet(config, `${BACKUP_COLLECTION}/${docId}/words/${encodeURIComponent(id)}`);
      const parsed = doc && doc.fields && parseJsonField(doc.fields.data, null);
      if (parsed) words[id] = parsed;
      // (a missing/corrupt doc is skipped rather than failing the whole restore)
    }
  }

  const remoteCategoryProgress = parseJsonField(f.categoryProgress, null);
  const categoriesRestoredCount = countRestorableCategories(localState, remoteCategoryProgress, stories);

  return {
    patch: {
      stories,
      words,
      categoryProgress: remoteCategoryProgress,
    },
    newStoryCount: missingStoryIds.length,
    newWordCount: Object.keys(words).length,
    categoriesRestoredCount,
  };
}

// Counts how many categories a restore patch would actually fill in — i.e.
// categories that are still at the untouched base level locally but would
// come back with real progress (level, current story, used subtopics...),
// either straight from the backup's metadata or — if that's missing/stale —
// derived from the reader's own stories being restored alongside it (see
// deriveCategoryProgressFromOwnStories above). Used so the UI can tell the
// reader their levels/current-stories came back even when every story/word
// file was already present on this device (so newStoryCount/newWordCount
// alone would look like "nothing to restore"), and so the count stays
// accurate even when levels are recovered via the stories fallback.
function countRestorableCategories(localState, remoteCategoryProgress, patchStories) {
  const localCategoryProgress = (localState && localState.categoryProgress) || {};
  const combinedStories = { ...((localState && localState.stories) || {}), ...(patchStories || {}) };
  const catIds = new Set([...Object.keys(remoteCategoryProgress || {}), ...CATEGORIES.map((c) => c.id)]);
  let count = 0;
  catIds.forEach((catId) => {
    if (!isEmptyCategoryProgress(localCategoryProgress[catId])) return;
    const fromMeta = remoteCategoryProgress && remoteCategoryProgress[catId];
    const wouldRestore =
      (fromMeta && !isEmptyCategoryProgress(fromMeta)) || !!deriveCategoryProgressFromOwnStories(combinedStories, catId);
    if (wouldRestore) count++;
  });
  return count;
}

// Netlify mode: one bundled serverless function (netlify/functions/backup.js)
// backed by Netlify Blobs, holding the entire state as a single value per
// email — no per-document size juggling needed. Only works if this app was
// actually deployed on Netlify with that functions folder included; a clean
// error is thrown otherwise so the UI can explain that plainly.
// Since Blobs can't be partially written, this reads the existing value
// first and (a) skips the write entirely if nothing new would be saved,
// and (b) when there IS something to save, merges the remote copy's
// stories/words/category-progress in underneath the local ones first, so a
// device that's behind (missing something another device already backed
// up) can never wipe that out just by backing up itself.
async function pushBackupNetlify(email, state, onProgress) {
  if (onProgress) onProgress("בודקים מה כבר מגובה…");
  let existing = null;
  try {
    const checkRes = await fetch(`${NETLIFY_FUNCTION_URL}?email=${encodeURIComponent(email)}`);
    if (checkRes.ok) {
      const json = await checkRes.json();
      if (json.found) existing = json.data || {};
    }
  } catch (e) {
    // Can't check what's already there — fall through and let the write
    // below surface a clearer connectivity error if the function truly
    // isn't reachable.
  }

  const localStoryIds = Object.keys(state.stories || {});
  const localWordIds = Object.keys(state.words || {});
  const remoteStoryIds = existing ? Object.keys(existing.stories || {}) : [];
  const remoteWordIds = existing ? Object.keys(existing.words || {}) : [];
  const newStoryCount = localStoryIds.filter((id) => !remoteStoryIds.includes(id)).length;
  const newWordCount = localWordIds.filter((id) => !remoteWordIds.includes(id)).length;
  const settingsChanged =
    !existing ||
    !jsonEqual(state.categoryProgress || {}, existing.categoryProgress || {}) ||
    !jsonEqual(state.readingPrefs || {}, existing.readingPrefs || {}) ||
    !jsonEqual(state.librarySort || {}, existing.librarySort || {});

  if (existing && !newStoryCount && !newWordCount && !settingsChanged) {
    return { newStoryCount: 0, newWordCount: 0 };
  }

  const mergedCategoryProgress = { ...(state.categoryProgress || {}) };
  if (existing && existing.categoryProgress) {
    Object.keys(existing.categoryProgress).forEach((catId) => {
      if (isEmptyCategoryProgress(mergedCategoryProgress[catId])) {
        mergedCategoryProgress[catId] = existing.categoryProgress[catId];
      }
    });
  }
  const body = {
    ...state,
    stories: { ...((existing && existing.stories) || {}), ...state.stories },
    words: { ...((existing && existing.words) || {}), ...state.words },
    categoryProgress: mergedCategoryProgress,
  };

  if (onProgress) onProgress("מעלים גיבוי…");
  let res;
  try {
    res = await fetch(`${NETLIFY_FUNCTION_URL}?email=${encodeURIComponent(email)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  } catch (e) {
    throw new Error("לא ניתן להגיע לפונקציית הגיבוי. ודאו שהאתר פרוס ב-Netlify עם תיקיית netlify/functions כלולה בפריסה.");
  }
  if (!res.ok) {
    throw new Error(
      res.status === 404
        ? "פונקציית הגיבוי לא נמצאה. ודאו שהאתר פרוס ב-Netlify עם תיקיית netlify/functions כלולה, או הגדירו פרויקט Firebase משלכם."
        : `שגיאת גיבוי מהשרת (${res.status}).`
    );
  }
  return { newStoryCount, newWordCount };
}

// Fetches the backup and returns only the stories/words/category-progress
// that aren't already present in localState — nothing already on this
// device is touched. Returns null only if no backup exists at all for this
// email.
async function pullBackupNetlify(email, localState, onProgress) {
  if (onProgress) onProgress("מאתרים גיבוי…");
  let res;
  try {
    res = await fetch(`${NETLIFY_FUNCTION_URL}?email=${encodeURIComponent(email)}`);
  } catch (e) {
    throw new Error("לא ניתן להגיע לפונקציית הגיבוי. ודאו שהאתר פרוס ב-Netlify עם תיקיית netlify/functions כלולה בפריסה.");
  }
  if (!res.ok) {
    throw new Error(
      res.status === 404
        ? "פונקציית הגיבוי לא נמצאה. ודאו שהאתר פרוס ב-Netlify עם תיקיית netlify/functions כלולה, או הגדירו פרויקט Firebase משלכם."
        : `שגיאת שחזור מהשרת (${res.status}).`
    );
  }
  const json = await res.json();
  if (!json.found) return null;
  const remote = json.data || {};

  const localStoryIds = new Set(Object.keys((localState && localState.stories) || {}));
  const localWordIds = new Set(Object.keys((localState && localState.words) || {}));
  const stories = {};
  Object.keys(remote.stories || {}).forEach((id) => {
    if (!localStoryIds.has(id)) stories[id] = remote.stories[id];
  });
  const words = {};
  Object.keys(remote.words || {}).forEach((id) => {
    if (!localWordIds.has(id)) words[id] = remote.words[id];
  });

  const remoteCategoryProgress = remote.categoryProgress || null;
  const categoriesRestoredCount = countRestorableCategories(localState, remoteCategoryProgress, stories);

  return {
    patch: { stories, words, categoryProgress: remoteCategoryProgress },
    newStoryCount: Object.keys(stories).length,
    newWordCount: Object.keys(words).length,
    categoriesRestoredCount,
  };
}

// ---------------------------------------------------------------------------
// Pooled storage: registry + per-project counters (both live in the
// registry project, CLOUD_BACKEND_CONFIGS[0]) and the logic that decides,
// for a given reader, which pooled project their backup belongs to.
// ---------------------------------------------------------------------------

async function writeRegistryEntry(registryConfig, emailDocId, projectId) {
  await firestoreSet(registryConfig, `${REGISTRY_COLLECTION}/${emailDocId}`, {
    projectId: strField(projectId),
    assignedAt: intField(Date.now()),
  });
}

// Reads each pooled project's { userCount, bytesUsed, full } from the
// registry project's counters. A project that fails to read (or was never
// written) counts as { userCount: 0, bytesUsed: 0, full: false } rather
// than failing the whole lookup — best-effort, not exact.
async function getProjectStats(registryConfig, activeConfigs) {
  const stats = {};
  await Promise.all(
    activeConfigs.map(async (c) => {
      try {
        const doc = await firestoreGet(registryConfig, `${PROJECT_STATS_COLLECTION}/${encodeURIComponent(c.projectId)}`);
        const f = (doc && doc.fields) || {};
        const n = f.userCount ? parseInt(f.userCount.integerValue, 10) : 0;
        const b = f.bytesUsed ? parseInt(f.bytesUsed.integerValue, 10) : 0;
        stats[c.projectId] = {
          userCount: Number.isFinite(n) ? n : 0,
          bytesUsed: Number.isFinite(b) ? b : 0,
          full: !!(f.full && f.full.booleanValue),
        };
      } catch (e) {
        stats[c.projectId] = { userCount: 0, bytesUsed: 0, full: false };
      }
    })
  );
  return stats;
}

// Best-effort read-modify-write increment (not transactional — a rare
// concurrent signup could under-count by one, which is fine for load
// balancing, not billing).
async function incrementProjectUserCount(registryConfig, projectId) {
  try {
    const path = `${PROJECT_STATS_COLLECTION}/${encodeURIComponent(projectId)}`;
    const doc = await firestoreGet(registryConfig, path);
    const f = (doc && doc.fields) || {};
    const current = f.userCount ? parseInt(f.userCount.integerValue, 10) : 0;
    await firestoreSet(registryConfig, path, { userCount: intField((Number.isFinite(current) ? current : 0) + 1) });
  } catch (e) {
    // A failed counter update never blocks the actual backup — it just
    // means load balancing is slightly less accurate next time.
  }
}

// Adds to a pooled project's running storage-usage estimate (see
// utf8ByteLength — sum of the JSON payloads this app itself has written).
// Best-effort and approximate: it only accounts for writes made through
// this pooling feature, so it undercounts a project that already had data
// in it before pooling was added, and doesn't include Firestore's own
// per-document/index overhead. Good enough for a rough "how full is the
// pool" indicator, not a byte-exact billing figure.
async function addProjectBytes(registryConfig, projectId, deltaBytes) {
  if (!deltaBytes) return;
  try {
    const path = `${PROJECT_STATS_COLLECTION}/${encodeURIComponent(projectId)}`;
    const doc = await firestoreGet(registryConfig, path);
    const f = (doc && doc.fields) || {};
    const current = f.bytesUsed ? parseInt(f.bytesUsed.integerValue, 10) : 0;
    await firestoreSet(registryConfig, path, { bytesUsed: intField((Number.isFinite(current) ? current : 0) + deltaBytes) });
  } catch (e) {
    // Same best-effort reasoning as incrementProjectUserCount.
  }
}

// Firestore's free-tier ("Spark plan") storage cap per project, used only
// to show a rough "X of Y used" line in Settings.
const FIRESTORE_FREE_TIER_BYTES = 1024 * 1024 * 1024; // 1 GiB

// Total estimated storage used across the whole pool, plus the combined
// free-tier cap (1 GiB × number of pooled projects). Returns null if not
// in pooled mode, or if the registry project can't be reached (e.g. not
// signed in yet) — the caller should simply not show the line in that case
// rather than surface an error, since this is a nice-to-have indicator.
async function getPoolStorageUsage(registryIdentity) {
  const activeConfigs = getActiveProjectConfigs();
  if (activeConfigs.length <= 1) return null;
  const registryConfig = activeConfigs[0];
  try {
    const stats = await getProjectStats(registryConfig, activeConfigs);
    const usedBytes = activeConfigs.reduce((sum, c) => sum + ((stats[c.projectId] && stats[c.projectId].bytesUsed) || 0), 0);
    return { usedBytes, capBytes: activeConfigs.length * FIRESTORE_FREE_TIER_BYTES, projectCount: activeConfigs.length };
  } catch (e) {
    return null;
  }
}

async function markProjectFull(registryConfig, projectId) {
  try {
    await firestoreSet(registryConfig, `${PROJECT_STATS_COLLECTION}/${encodeURIComponent(projectId)}`, {
      full: { booleanValue: true },
    });
  } catch (e) {}
}

// Picks the least-loaded, non-full project among candidates.
function pickLeastLoaded(candidates, stats) {
  let best = candidates[0];
  candidates.forEach((c) => {
    const bestFull = stats[best.projectId] && stats[best.projectId].full;
    const cFull = stats[c.projectId] && stats[c.projectId].full;
    const bestCount = (stats[best.projectId] && stats[best.projectId].userCount) || 0;
    const cCount = (stats[c.projectId] && stats[c.projectId].userCount) || 0;
    if (bestFull && !cFull) best = c;
    else if (cFull === bestFull && cCount < bestCount) best = c;
  });
  return best;
}

// Resolves which pooled project a given reader's backup belongs to.
// allowAssign=true (backup) may create a brand-new registry assignment for
// a reader with no existing one; allowAssign=false (restore) only ever
// looks one up, returning null if nothing is found anywhere (meaning: no
// backup exists for this reader yet).
async function resolveBackupProject(registryIdentity, onProgress, allowAssign) {
  const activeConfigs = getActiveProjectConfigs();
  if (activeConfigs.length <= 1) return activeConfigs[0] || null;

  const cachedId = getLocalAssignedProjectId(registryIdentity.email);
  if (cachedId) {
    const cachedConfig = activeConfigs.find((c) => c.projectId === cachedId);
    if (cachedConfig) return cachedConfig;
  }

  const registryConfig = activeConfigs[0];
  const emailDocId = hashEmailToDocId(registryIdentity.email);

  if (onProgress) onProgress("מאתרים את פרויקט הגיבוי…");
  const regDoc = await firestoreGet(registryConfig, `${REGISTRY_COLLECTION}/${emailDocId}`);
  const regProjectId = regDoc && regDoc.fields && regDoc.fields.projectId && regDoc.fields.projectId.stringValue;
  if (regProjectId) {
    const found = activeConfigs.find((c) => c.projectId === regProjectId) || registryConfig;
    setLocalAssignedProjectId(registryIdentity.email, found.projectId);
    return found;
  }

  // No registry entry yet. Backward-compat: a reader who backed up to the
  // registry project directly, before pooling existed, has no registry doc
  // but does have a backup doc there under their (registry-project) uid.
  const legacy = await firestoreGet(registryConfig, `${BACKUP_COLLECTION}/${registryIdentity.uid}`);
  if (legacy) {
    if (allowAssign) await writeRegistryEntry(registryConfig, emailDocId, registryConfig.projectId);
    setLocalAssignedProjectId(registryIdentity.email, registryConfig.projectId);
    return registryConfig;
  }

  if (!allowAssign) return null; // nothing to restore, and nothing to assign

  // Brand-new reader: assign to the least-loaded, non-full pooled project.
  if (onProgress) onProgress("בוחרים אחסון פנוי…");
  const stats = await getProjectStats(registryConfig, activeConfigs);
  const best = pickLeastLoaded(activeConfigs, stats);
  await writeRegistryEntry(registryConfig, emailDocId, best.projectId);
  await incrementProjectUserCount(registryConfig, best.projectId);
  setLocalAssignedProjectId(registryIdentity.email, best.projectId);
  return best;
}

// Called when a write to a reader's currently-assigned pooled project fails
// with a storage-full error: marks that project full in the registry, picks
// the next least-loaded project among the rest, and re-points the registry
// (and local cache) at it. The reader keeps their existing backup on the
// old project — it isn't moved — but all future backups/restores go to the
// new one.
async function reassignFullProject(registryIdentity, fullConfig, onProgress) {
  const activeConfigs = getActiveProjectConfigs();
  const registryConfig = activeConfigs[0];
  if (onProgress) onProgress("האחסון הנוכחי מלא, עוברים לאחסון פנוי…");
  await markProjectFull(registryConfig, fullConfig.projectId);
  const candidates = activeConfigs.filter((c) => c.projectId !== fullConfig.projectId);
  if (!candidates.length) throw new Error("כל פרויקטי הגיבוי מלאים.");
  const stats = await getProjectStats(registryConfig, candidates);
  const best = pickLeastLoaded(candidates, stats);
  const emailDocId = hashEmailToDocId(registryIdentity.email);
  await writeRegistryEntry(registryConfig, emailDocId, best.projectId);
  await incrementProjectUserCount(registryConfig, best.projectId);
  setLocalAssignedProjectId(registryIdentity.email, best.projectId);
  return best;
}

// Resolves the identity to use ON a given target project. If the target is
// the registry project, the identity we already have applies directly;
// otherwise a (usually silent, since the same Google account was already
// used once before) sign-in to that specific project's Auth instance is
// needed, since each Firebase project has its own separate Auth user pool.
async function identityForProject(registryIdentity, targetConfig, onProgress, interactive) {
  const registryConfig = getActiveProjectConfigs()[0];
  if (!registryConfig || targetConfig.projectId === registryConfig.projectId) return registryIdentity;
  return ensureGoogleSignedIn(onProgress, interactive, targetConfig);
}

// Pushes only what's new to the cloud — via Firebase (signing in with
// Google on demand first) if a Firebase project is configured, otherwise
// via the bundled Netlify function under the saved backup email. Returns
// {newStoryCount, newWordCount} so the UI can say exactly what was saved.
// interactive=false (used by the silent background auto-backup) will not
// pop open a Google sign-in window — see ensureGoogleSignedIn.
async function pushBackup(state, onProgress, interactive) {
  const config = getCloudConfig();
  let result;
  if (config) {
    const registryIdentity = await ensureGoogleSignedIn(onProgress, interactive !== false);
    let targetConfig = await resolveBackupProject(registryIdentity, onProgress, true);
    let targetIdentity = await identityForProject(registryIdentity, targetConfig, onProgress, interactive !== false);
    try {
      result = await pushBackupFirebase(targetConfig, targetIdentity, state, onProgress);
    } catch (e) {
      if (isPooledMode() && isStorageFullError(e)) {
        targetConfig = await reassignFullProject(registryIdentity, targetConfig, onProgress);
        targetIdentity = await identityForProject(registryIdentity, targetConfig, onProgress, interactive !== false);
        result = await pushBackupFirebase(targetConfig, targetIdentity, state, onProgress);
      } else {
        throw e;
      }
    }
    if (isPooledMode() && result && result.bytesWritten) {
      await addProjectBytes(getActiveProjectConfigs()[0], targetConfig.projectId, result.bytesWritten);
    }
  } else {
    const email = getCloudEmail();
    if (!email) throw new Error("יש להגדיר מייל לפני הגיבוי.");
    result = await pushBackupNetlify(email, state, onProgress);
  }
  setLastSync(Date.now());
  // Best-effort: also share whatever's newly eligible with the public
  // catalog (see pushAllToPublicCatalog above). Both underlying push
  // functions already swallow their own errors, so this can't fail the
  // private backup itself.
  await pushAllToPublicCatalog(state, onProgress);
  return result || { newStoryCount: 0, newWordCount: 0 };
}

// Pulls down only what's missing from this device (Firebase, signing in
// with Google on demand first, or Netlify under the saved email). Returns
// null if no backup exists yet for that identity; otherwise
// {patch, newStoryCount, newWordCount} — patch is meant to be merged in via
// mergeBackupPatch, never used to replace state outright. See pushBackup
// re: interactive.
async function pullBackup(state, onProgress, interactive) {
  const config = getCloudConfig();
  let result;
  if (config) {
    const registryIdentity = await ensureGoogleSignedIn(onProgress, interactive !== false);
    const targetConfig = await resolveBackupProject(registryIdentity, onProgress, false);
    if (!targetConfig) return null; // no registry entry and no legacy backup — this reader has never backed up
    const targetIdentity = await identityForProject(registryIdentity, targetConfig, onProgress, interactive !== false);
    result = await pullBackupFirebase(targetConfig, targetIdentity, state, onProgress);
  } else {
    const email = getCloudEmail();
    if (!email) throw new Error("יש להגדיר מייל לפני השחזור.");
    result = await pullBackupNetlify(email, state, onProgress);
  }
  if (result) setLastSync(Date.now());
  return result;
}

// ---------------------------------------------------------------------------
// Public library: a shared, cross-reader catalog of books, layered on top of
// the personal backup system above but deliberately kept separate from it.
//
// Lives ONLY in the primary/registry Firebase project (CLOUD_BACKEND_CONFIGS[0])
// — regardless of which pooled project a given reader's own PERSONAL backup
// happens to be assigned to — since browsing/downloading only makes sense if
// every reader's public books sit in the one place everyone reads from.
// Firebase mode only: Netlify Blobs has no querying, and building an
// equivalent there would need its own dedicated serverless function; in
// Netlify mode publicLibraryAvailable() below just returns false and the
// feature quietly doesn't appear.
//
// Data model:
//   public_library/{storyId}          — one doc per public book: `data` is
//                                        the full story JSON (identical shape
//                                        to a personal library story), plus a
//                                        few plain fields for reference.
//   public_library_index/{categoryId} — one small doc per category: `entries`
//                                        is a JSON array of light preview
//                                        objects (id/title/tagline/level/
//                                        chapter counts/source) so the browse
//                                        page can list an entire category
//                                        with ONE read, instead of a read per
//                                        book. (This does mean that one doc
//                                        eventually caps how many books a
//                                        single category can list — fine at
//                                        realistic scale for this app, but
//                                        worth revisiting if any one category
//                                        ever grows into the thousands.)
//
// Reads (browsing, downloading) never require Google sign-in, so looking at
// the catalog never pops up a sign-in prompt. Writes (a reader's own new/
// updated book going public) attach whatever Google identity is already
// silently available and are skipped — never blocked on, never prompted for
// — if there isn't one; the book simply gets pushed automatically the next
// time a chapter is written after the reader does sign in. This mirrors the
// existing "never let backup mechanics interrupt reading" rule above.
// ---------------------------------------------------------------------------

const PUBLIC_LIBRARY_COLLECTION = "public_library";
const PUBLIC_LIBRARY_INDEX_COLLECTION = "public_library_index";
// Maps a PDF book's content fingerprint (see fingerprintPdfBook) to the
// storyId that already holds it in PUBLIC_LIBRARY_COLLECTION — lets a
// second (third, fourth...) reader who imports the exact same file reuse
// the existing cloud copy instead of uploading a full duplicate (raw text
// + embedded images) of a book that's already there.
const PUBLIC_PDF_FINGERPRINT_COLLECTION = "public_pdf_fingerprints";
const PUBLIC_PUSH_TRACK_KEY = "reader-public-push-track";
// Tracks, per storyId, whether an imported PDF's original FILE has already
// been confirmed pushed somewhere durable — separately for the public
// catalog and for this reader's own private backup, since a book can be in
// one, the other, both, or (briefly, right after import) neither. The file
// never changes after import, so once a flag is set it's set for good —
// this is purely a "don't re-send it every backup" cache, not a
// correctness signal. See pushPdfFileToPublicCloud / pushPdfFileToBackupCloud,
// and the retry loops in pushAllToPublicCatalog / pushBackupFirebase that
// consult it.
const PDF_CHAPTERS_PUBLIC_TRACK_KEY = "reader-pdf-chapters-public-track";
const PDF_CHAPTERS_BACKUP_TRACK_KEY = "reader-pdf-chapters-backup-track";
function getPdfChaptersPushTrack(key) {
  try {
    return JSON.parse(localStorage.getItem(key) || "{}");
  } catch (e) {
    return {};
  }
}
function setPdfChaptersPushed(key, storyId) {
  try {
    const all = getPdfChaptersPushTrack(key);
    all[storyId] = true;
    localStorage.setItem(key, JSON.stringify(all));
  } catch (e) {
    // best-effort only — worst case, a book's chapters get re-sent once more than necessary
  }
}

function publicLibraryConfig() {
  return getCloudConfig(); // always the primary/registry project — see header comment above
}
function publicLibraryAvailable() {
  return !!publicLibraryConfig();
}

// A story belongs in the shared catalog if it's from one of the app's
// general topic categories (always public — no per-reader choice, per the
// product requirement), or it's a personal search/PDF-import book the
// reader didn't explicitly mark private (public is the default there too).
function storyIsPublic(story) {
  if (!story) return false;
  // Articles imported from a link are NEVER public — no exception, no
  // per-story override, regardless of any isPublic value that might be set
  // on the object. This is intentionally checked before anything else and
  // ignores story.isPublic entirely, since the whole point is that this
  // can't be flipped by a bug, a future feature, or a stray flag.
  if (story.categoryId === "webImport") return false;
  if (story.categoryId === "search" || story.categoryId === "pdfImport") {
    return story.isPublic !== false; // default true unless explicitly marked private
  }
  return true; // any other categoryId is one of the general topics
}

function getPublicPushTrack() {
  try {
    return JSON.parse(localStorage.getItem(PUBLIC_PUSH_TRACK_KEY) || "{}");
  } catch (e) {
    return {};
  }
}
function setPublicPushTrack(storyId, chapterCount) {
  try {
    const all = getPublicPushTrack();
    all[storyId] = chapterCount;
    localStorage.setItem(PUBLIC_PUSH_TRACK_KEY, JSON.stringify(all));
  } catch (e) {
    // best-effort only — worst case, a story gets re-pushed once more than necessary
  }
}

function publicLibraryPreview(story) {
  return {
    id: story.id,
    categoryId: story.categoryId,
    level: story.level,
    storyTitle: story.storyTitle,
    tagline: story.tagline || "",
    source: story.source || "",
    totalChapters: story.totalChapters,
    generatedChapters: generatedChapterCount(story),
    updatedAt: Date.now(),
    // Creation date of the story itself — set once, the first time the
    // story is pushed, and never touched again on later pushes (those only
    // refresh updatedAt above). Older catalog entries pushed before this
    // field existed won't have it; the library UI falls back gracefully
    // when it's missing rather than showing a bad date.
    createdAt: story.createdAt || null,
  };
}

// Adds/updates this story's entry in its category's index doc — a small
// read-modify-write of one shared per-category document. Not transactional
// (a rare simultaneous push from two readers in the same category could
// clobber one write with another), but the worst case is one preview
// briefly missing from a browse list until the next push corrects it —
// never data loss for the actual story, which lives in its own document.
async function upsertPublicLibraryIndexEntry(config, story) {
  const path = `${PUBLIC_LIBRARY_INDEX_COLLECTION}/${encodeURIComponent(story.categoryId)}`;
  const existing = await firestoreGet(config, path);
  const ef = (existing && existing.fields) || {};
  const entries = parseJsonField(ef.entries, []);
  const preview = publicLibraryPreview(story);
  const idx = entries.findIndex((e) => e.id === story.id);
  if (idx === -1) entries.push(preview);
  else entries[idx] = preview;
  await firestoreSet(config, path, { entries: compressJsonToField(entries) });
}

// Best-effort, silent push of one story to the public catalog — never
// throws, never surfaces an error to the reader, and never triggers an
// interactive Google sign-in. Called after every chapter is written for a
// public story; maybePushStoryToPublicLibrary (below) is what actually
// guards against redundant re-pushes and should be the normal entry point.
async function pushStoryToPublicLibrary(story) {
  if (!publicLibraryAvailable() || !storyIsPublic(story)) return;
  const config = publicLibraryConfig();
  let ownerUid = "";
  try {
    const identity = getGoogleUser(config) || (await signInSilentlyWithCredential(config));
    ownerUid = (identity && identity.uid) || "";
  } catch (e) {
    ownerUid = "";
  }
  try {
    await firestoreSet(config, `${PUBLIC_LIBRARY_COLLECTION}/${encodeURIComponent(story.id)}`, {
      data: compressJsonToField(story),
      categoryId: strField(story.categoryId),
      level: intField(story.level || 1),
      storyTitle: strField(story.storyTitle || ""),
      updatedAt: intField(Date.now()),
      ownerUid: strField(ownerUid),
    });
    await upsertPublicLibraryIndexEntry(config, story);
  } catch (e) {
    // The public catalog is a nice-to-have layered on top of the reader's
    // own library, which already saved successfully regardless — a failure
    // here (offline, quota, rules) is logged, never shown to the reader.
    console.error("pushStoryToPublicLibrary failed:", (e && e.message) || e);
  }
}

// PDF-imported books keep their exact original file on this device's own
// IndexedDB only (see PDF_FILE_STORE above) — normally enough, since the
// reader who imported it already has it locally. But once the book is
// shared to the public catalog, a DIFFERENT reader's device has no such
// local copy: only whichever chapters the importer had already opened (and
// so got baked into story.chapters, see writeChapterAt/maybePushStoryTo-
// PublicLibrary) travel along with the story's own JSON. Any chapter the
// importer never got to would otherwise be permanently unreachable on
// every other device.
//
// The fix: push the ORIGINAL PDF FILE itself to the cloud (gzip-compressed,
// see the pako <script> tag in <head>, then split into fixed-size chunks —
// never one giant document, so even a huge book stays well under
// Firestore's ~1MB per-document limit no matter how many chapters or
// pictures it has). Any device that needs a chapter it doesn't have locally
// downloads the file ONCE and runs the exact same local extraction
// (extractPdfText/splitPdfIntoChapters) this device used at import time —
// producing identical chapters/images, no separate cloud format to keep in
// sync with the extraction logic.
//
// Firestore's hard cap is ~1,048,487 bytes per document — chunks are sized
// well under that (comfortably under even after base64, which adds ~33%).
const PDF_FILE_CHUNK_RAW_BYTES = 650000;

// Each chunk (and its "meta" doc recording how many chunks exist) lives in
// a subcollection literally named "pdf_chunks", with each document's own id
// spelling out exactly what it is — "{storyId}_{index}" for a chunk,
// "{storyId}_meta" for the count — e.g. a full path reads
// public_library/{storyId}/pdf_chunks/{storyId}_0. Kept as a subcollection
// UNDER the story's existing document (rather than one giant flat top-level
// collection) so it stays covered by whichever Firestore security rule
// already scopes that parent path (see BackupSettingsPanel's rules
// snippet for the reader_backups/{uid}/{document=**} rule in particular) —
// a flat collection would need its own new rule to actually be reachable.
const PDF_CHUNKS_SUBCOLLECTION = "pdf_chunks";
// Books imported before this naming existed pushed their chunks under a
// bare "pdfFile" subcollection with plain numeric doc ids (0, 1, 2, ...
// "meta") instead. fetchFileChunks below still knows how to fall back to
// that shape, so nothing already in the cloud needs migrating.
const PDF_CHUNKS_LEGACY_SUBCOLLECTION = "pdfFile";

// Compression level for pako.gzip on the original PDF bytes. Level 9 is
// pako's slowest setting but squeezes out the most bytes — deliberately
// chosen over the faster defaults: the pooled backup budget is a hard
// ~3GB total (see CLOUD_BACKEND_CONFIGS, 3 pooled 1GiB-free-tier Firestore
// projects), a fixed ceiling that many readers share, while a bit of extra
// client-side CPU time during import/restore costs nothing but a few
// seconds on one device. Trading a little more loading time for
// meaningfully less consumed storage is the right tradeoff here.
const PDF_GZIP_OPTIONS = { level: 9 };

function uint8ToBase64(bytes) {
  let binary = "";
  const step = 0x8000; // avoid a giant call stack from String.fromCharCode(...bytes)
  for (let i = 0; i < bytes.length; i += step) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
  }
  return btoa(binary);
}
function base64ToUint8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

// Pushes one file's bytes (already gzip-compressed by the caller) to
// `${basePath}/0`, `${basePath}/1`, ... plus a `${basePath}/meta` document
// recording the chunk count, so a downloader knows how many pieces to ask
// for. Skips entirely — no reads, no writes — if `meta` is already there:
// this exact file was already uploaded (by this reader or another one), so
// there is nothing new to send. This is the "no duplicate file upload"
// behavior: only a file that doesn't already exist in the cloud gets
// pushed at all.
// basePath is the story's own subcollection path (e.g.
// `public_library/{storyId}/pdf_chunks`) — storyId is passed separately
// purely to build the self-describing "{storyId}_{index}" doc ids described
// above. Returns the number of compressed bytes actually written this call
// (0 if the file was already there and nothing new was sent) so callers can
// feed it into the pooled storage-usage estimate (see addProjectBytes).
async function pushFileChunksIfMissing(config, basePath, storyId, compressedBytes) {
  const metaPath = `${basePath}/${storyId}_meta`;
  const existingMeta = await firestoreGet(config, metaPath);
  if (existingMeta) return 0; // already uploaded — nothing to do
  const chunkCount = Math.max(1, Math.ceil(compressedBytes.length / PDF_FILE_CHUNK_RAW_BYTES));
  for (let i = 0; i < chunkCount; i++) {
    const slice = compressedBytes.subarray(i * PDF_FILE_CHUNK_RAW_BYTES, (i + 1) * PDF_FILE_CHUNK_RAW_BYTES);
    await firestoreSet(config, `${basePath}/${storyId}_${i}`, { data: strField(uint8ToBase64(slice)) });
  }
  await firestoreSet(config, metaPath, { chunkCount: intField(chunkCount) });
  return compressedBytes.length;
}

// Downloads and reassembles a file previously pushed by pushFileChunksIfMissing,
// returning its original (decompressed) bytes, or null if it isn't there /
// is incomplete.
// Tries the current pdf_chunks/{storyId}_{index} naming first; if there's
// no meta doc there, falls back to the legacy bare "pdfFile" subcollection
// with plain numeric doc ids (0, 1, 2, ... "meta") that older imports used —
// see PDF_CHUNKS_LEGACY_SUBCOLLECTION — so nothing uploaded before this
// naming existed needs migrating to stay downloadable. legacyBasePath may be
// omitted by a caller that knows only the new shape can apply.
async function fetchFileChunks(config, basePath, storyId, legacyBasePath) {
  let meta, idFor;
  try {
    meta = await firestoreGet(config, `${basePath}/${storyId}_meta`);
    idFor = (i) => `${basePath}/${storyId}_${i}`;
    if (!meta && legacyBasePath) {
      meta = await firestoreGet(config, `${legacyBasePath}/meta`);
      idFor = (i) => `${legacyBasePath}/${i}`;
    }
  } catch (e) {
    console.error("fetchFileChunks: reading meta failed:", (e && e.message) || e, { storyId });
    return null;
  }
  const chunkCount = meta && meta.fields && meta.fields.chunkCount && Number(meta.fields.chunkCount.integerValue);
  if (!chunkCount) return null;
  try {
    const parts = [];
    let totalLen = 0;
    for (let i = 0; i < chunkCount; i++) {
      const doc = await firestoreGet(config, idFor(i));
      const b64 = doc && doc.fields && doc.fields.data && doc.fields.data.stringValue;
      if (!b64) {
        // Incomplete upload — treat as unavailable rather than return a
        // corrupt file, but make sure this is visible somewhere: silently
        // returning null here with no trace made a partial/interrupted
        // upload indistinguishable from "never uploaded at all".
        console.error(`fetchFileChunks: chunk ${i}/${chunkCount} missing for story ${storyId} — treating upload as incomplete.`);
        return null;
      }
      const bytes = base64ToUint8(b64);
      parts.push(bytes);
      totalLen += bytes.length;
    }
    const compressed = new Uint8Array(totalLen);
    let offset = 0;
    parts.forEach((p) => { compressed.set(p, offset); offset += p.length; });
    return pako.ungzip(compressed);
  } catch (e) {
    console.error("fetchFileChunks: downloading/reassembling chunks failed:", (e && e.message) || e, { storyId });
    return null;
  }
}

// Returns true if the file is already in the cloud (or was just uploaded
// successfully); false only on an actual failure — callers use this to
// decide whether it's safe to mark the book as "done" (see
// PDF_FILE_PUBLIC_TRACK_KEY below): treating a failed push as done would
// mean it never gets retried, ever.
async function pushPdfFileToPublicCloud(storyId, pdfBytes) {
  const config = publicLibraryConfig();
  if (!config) return false;
  try {
    getGoogleUser(config) || (await signInSilentlyWithCredential(config)); // best-effort, same as pushStoryToPublicLibrary — no popup
    const compressed = pako.gzip(pdfBytes, PDF_GZIP_OPTIONS);
    const bytesWritten = await pushFileChunksIfMissing(
      config,
      `${PUBLIC_LIBRARY_COLLECTION}/${encodeURIComponent(storyId)}/${PDF_CHUNKS_SUBCOLLECTION}`,
      storyId,
      compressed
    );
    if (bytesWritten && isPooledMode()) {
      // The public catalog always lives on the primary/registry project
      // (see publicLibraryConfig) — the same project pooled private
      // backups can also land on. Without this, that project's usage
      // estimate silently ignores everything the public catalog itself
      // writes there, and it keeps getting handed new readers even once
      // it's actually filling up from shared PDF uploads.
      await addProjectBytes(getActiveProjectConfigs()[0], config.projectId, bytesWritten);
    }
    return true;
  } catch (e) {
    // Best-effort, exactly like pushStoryToPublicLibrary above — the
    // reader's own copy already saved successfully on this device
    // regardless of whether this cloud copy succeeds. But unlike that
    // function, our callers DO need to know about the failure (to avoid
    // marking this book as pushed when it wasn't) — hence returning false
    // instead of just swallowing it.
    console.error("pushPdfFileToPublicCloud failed:", (e && e.message) || e, { storyId });
    return false;
  }
}

// Fetches the original PDF file from the public catalog — the fallback used
// when a chapter isn't in this device's own local IndexedDB (see
// writeChapterAt's isImported branch below), which is always the case right
// after downloading someone else's imported book from the public library
// and opening a chapter its importer never got to.
async function fetchPdfFileFromPublicCloud(storyId) {
  const config = publicLibraryConfig();
  if (!config) return null;
  try {
    return await fetchFileChunks(
      config,
      `${PUBLIC_LIBRARY_COLLECTION}/${encodeURIComponent(storyId)}/${PDF_CHUNKS_SUBCOLLECTION}`,
      storyId,
      `${PUBLIC_LIBRARY_COLLECTION}/${encodeURIComponent(storyId)}/${PDF_CHUNKS_LEGACY_SUBCOLLECTION}`
    );
  } catch (e) {
    console.error("fetchPdfFileFromPublicCloud failed:", (e && e.message) || e, { storyId });
    return null;
  }
}

// Same idea as pushPdfFileToPublicCloud/fetchPdfFileFromPublicCloud above,
// but for a PRIVATE imported PDF (isPublic === false, so it's never written
// to the public catalog at all) — the file instead rides along with this
// reader's own personal backup, under the same
// reader_backups/{uid}/stories/{storyId} document the story JSON itself
// already lives in. Covered by the existing `reader_backups/{uid}/{document=**}`
// security rule (see BackupSettingsPanel's rules snippet), since that rule
// is recursive over everything nested under the reader's own uid.
async function pushPdfFileToBackupCloud(config, docId, storyId, pdfBytes) {
  try {
    const compressed = pako.gzip(pdfBytes, PDF_GZIP_OPTIONS);
    const bytesWritten = await pushFileChunksIfMissing(
      config,
      `${BACKUP_COLLECTION}/${docId}/stories/${encodeURIComponent(storyId)}/${PDF_CHUNKS_SUBCOLLECTION}`,
      storyId,
      compressed
    );
    if (bytesWritten && isPooledMode()) {
      // Count these bytes against the TARGET project's own quota estimate
      // (config here may be a different pooled project than the registry),
      // recorded on the registry project's stats collection — see
      // addProjectBytes. Without this, a reader who imports several large
      // PDFs could quietly push their assigned project well past its real
      // free-tier limit before the pool ever notices it's full.
      await addProjectBytes(getActiveProjectConfigs()[0], config.projectId, bytesWritten);
    }
    return true;
  } catch (e) {
    // Best-effort, same as the public-catalog version — the reader's own
    // local copy (IndexedDB) already has everything regardless. But the
    // caller still needs to know this failed, so it doesn't mark the book
    // as backed-up when it isn't — hence returning false here.
    console.error("pushPdfFileToBackupCloud failed:", (e && e.message) || e, { storyId, docId });
    return false;
  }
}
async function fetchPdfFileFromBackupCloud(config, docId, storyId) {
  try {
    return await fetchFileChunks(
      config,
      `${BACKUP_COLLECTION}/${docId}/stories/${encodeURIComponent(storyId)}/${PDF_CHUNKS_SUBCOLLECTION}`,
      storyId,
      `${BACKUP_COLLECTION}/${docId}/stories/${encodeURIComponent(storyId)}/${PDF_CHUNKS_LEGACY_SUBCOLLECTION}`
    );
  } catch (e) {
    console.error("fetchPdfFileFromBackupCloud failed:", (e && e.message) || e, { storyId, docId });
    return null;
  }
}
// Resolves this reader's own backup identity (Firebase mode only — Netlify
// mode has no per-file fetch capability, see pushBackupNetlify's single-blob
// storage) non-interactively — never pops up a Google sign-in window, so
// this is safe to call just from opening a chapter. Used as the last
// fallback in writeChapterAt's isImported branch, for a private PDF import
// restored to a device that never extracted it locally.
async function fetchPdfFileFromPersonalBackup(storyId) {
  try {
    const config = getCloudConfig();
    if (!config) return null;
    const registryIdentity = await ensureGoogleSignedIn(undefined, false);
    if (!registryIdentity) return null;
    const targetConfig = await resolveBackupProject(registryIdentity, undefined, false);
    if (!targetConfig) return null;
    const targetIdentity = await identityForProject(registryIdentity, targetConfig, undefined, false);
    if (!targetIdentity) return null;
    return await fetchPdfFileFromBackupCloud(targetConfig, targetIdentity.uid, storyId);
  } catch (e) {
    console.error("fetchPdfFileFromPersonalBackup failed:", (e && e.message) || e, { storyId });
    return null;
  }
}

// Mirrors fetchPdfFileFromPersonalBackup's identity resolution, but to PUSH
// this reader's own private backup copy of a freshly-imported PDF file
// immediately (see backupImportedPdfNow) instead of waiting for the next
// full, debounced auto-backup pass. That full pass still covers this book
// too, as a safety net — see the importedIds retry loop inside
// pushBackupFirebase — in case this immediate attempt fails, or auto-backup
// was switched off at the moment of import.
async function pushPdfFileToPersonalBackupNow(storyId, pdfBytes) {
  const config = getCloudConfig();
  if (!config) return true; // Netlify mode: no per-file push path — the single whole-state blob backup covers it instead, nothing missing here
  try {
    const registryIdentity = await ensureGoogleSignedIn(undefined, false); // never pops a sign-in window
    if (!registryIdentity) return true; // not signed in yet — the periodic full backup will pick this book up once the reader connects
    const targetConfig = await resolveBackupProject(registryIdentity, undefined, true);
    const targetIdentity = await identityForProject(registryIdentity, targetConfig, undefined, false);
    if (!targetIdentity) return true;
    return await pushPdfFileToBackupCloud(targetConfig, targetIdentity.uid, storyId, pdfBytes);
  } catch (e) {
    console.error("pushPdfFileToPersonalBackupNow failed:", (e && e.message) || e, { storyId });
    return false;
  }
}

// Runs right after a PDF import finishes (see importPdfStory) — pushes the
// ORIGINAL FILE to every cloud destination it belongs in, immediately and
// in the background, instead of relying only on the debounced general
// auto-backup (which may be switched off, or simply hasn't fired yet).
// Never silent about failure: every failed destination is logged to the
// console with real detail, and — whenever a cloud destination is actually
// configured — reflected in the visible sync status line, so a reader
// importing a big book is never left thinking it's safely backed up when it
// isn't. A failure here doesn't block reading (the reader is already
// reading chapter 1 locally either way) and is always retried automatically
// on the next full backup pass regardless — see the PDF_CHAPTERS_*_TRACK_KEY
// -guarded retry loops in pushBackupFirebase / pushAllToPublicCatalog.
async function backupImportedPdfNow(storyId, pdfBytes, alsoPushPublic, setCloudSyncStatus) {
  if (!cloudReady()) return; // nothing configured to back up to at all
  if (setCloudSyncStatus) setCloudSyncStatus({ state: "syncing", message: "מגבים את קובץ ה-PDF לענן…" });
  const jobs = [pushPdfFileToPersonalBackupNow(storyId, pdfBytes)];
  if (alsoPushPublic) jobs.push(pushPdfFileToPublicCloud(storyId, pdfBytes));
  const results = await Promise.allSettled(jobs);
  results.forEach((r, i) => {
    if (r.status === "rejected") console.error(`backupImportedPdfNow: destination #${i} rejected unexpectedly:`, r.reason, { storyId });
  });
  const anyFailed = results.some((r) => r.status === "rejected" || r.value === false);
  if (!setCloudSyncStatus) return;
  if (anyFailed) {
    setCloudSyncStatus({ state: "error", message: "גיבוי קובץ ה-PDF לענן נכשל — ננסה שוב בגיבוי הבא" });
  } else {
    setCloudSyncStatus({ state: "done", message: "קובץ ה-PDF גובה בהצלחה" });
  }
}

// Best-effort cleanup of a PRIVATE import's cloud-backed-up file chunks,
// called when the reader deletes that book locally (see deleteStory).
// Deliberately never used for a PUBLIC book — a public PDF's cloud copy may
// be the ONLY copy other readers who downloaded that book still depend on,
// to read chapters they personally haven't opened yet; deleting it here
// would break other people's libraries. This only ever removes THIS
// reader's own private backup copy, which nobody else can reach anyway —
// freeing up real quota inside the pooled 3GB budget instead of leaving
// orphaned chunks behind forever.
async function deletePdfFileChunksFromBackupCloud(config, docId, storyId) {
  const basePath = `${BACKUP_COLLECTION}/${docId}/stories/${encodeURIComponent(storyId)}/${PDF_CHUNKS_SUBCOLLECTION}`;
  try {
    const meta = await firestoreGet(config, `${basePath}/${storyId}_meta`);
    const chunkCount = meta && meta.fields && meta.fields.chunkCount && Number(meta.fields.chunkCount.integerValue);
    if (!chunkCount) return;
    for (let i = 0; i < chunkCount; i++) {
      await firestoreDelete(config, `${basePath}/${storyId}_${i}`);
    }
    await firestoreDelete(config, `${basePath}/${storyId}_meta`);
  } catch (e) {
    console.error("deletePdfFileChunksFromBackupCloud failed (cloud copy may remain until a manual cleanup):", (e && e.message) || e, { storyId });
  }
}

// Fingerprints an imported PDF book by its exact extracted text. Two
// readers uploading the identical file get the identical fingerprint, so
// this is how a second (third, fourth...) upload of the SAME book is
// recognized and deduped instead of creating its own full copy in the
// public catalog. Deliberately exact-text-based (not just title/author):
// different editions/scans of "the same" book can extract slightly
// differently, and it's much safer to occasionally miss a dedup
// opportunity than to ever merge two books that aren't actually identical.
function fingerprintPdfBook(rawChapters) {
  const fullText = rawChapters.map((c) => c.content || "").join("\n");
  return cyrb53(fullText).toString(36);
}

// Checks whether this exact book was already imported and published by some
// other reader. If so, returns its full public story object so this import
// can reuse it — same storyId, same outline/level/cover, zero new bytes
// written to the cloud. Best-effort: any failure (offline, no fingerprint
// registered yet, corrupt/stale pointer) is treated as "no match" and the
// caller just falls back to the normal single-uploader path.
async function findExistingPublicPdfBook(config, fingerprint, expectedChapterCount) {
  try {
    const fpDoc = await firestoreGet(config, `${PUBLIC_PDF_FINGERPRINT_COLLECTION}/${fingerprint}`);
    const storyId = fpDoc && fpDoc.fields && fpDoc.fields.storyId && fpDoc.fields.storyId.stringValue;
    if (!storyId) return null;
    const story = await fetchPublicLibraryStory(storyId);
    // Cheap sanity check in case of a stale/corrupt pointer (e.g. the
    // original story was somehow removed) — a real match must still have
    // the same chapter count as what we just extracted.
    if (!story || story.totalChapters !== expectedChapterCount) return null;
    return story;
  } catch (e) {
    return null;
  }
}

// Registers this book's fingerprint -> storyId so the NEXT reader who
// imports the identical file reuses this copy instead of duplicating it.
// Best-effort and non-blocking, same reasoning as
// pushPdfFileToPublicCloud above.
async function registerPdfFingerprint(config, fingerprint, storyId) {
  try {
    await firestoreSet(config, `${PUBLIC_PDF_FINGERPRINT_COLLECTION}/${fingerprint}`, {
      storyId: strField(storyId),
    });
  } catch (e) {
    // Worst case, the next identical upload just isn't deduped this time.
  }
}

// Pushes only if this story actually has new chapters since the last push
// (tracked locally by chapter count) — so reopening the app, or writing a
// chapter of some OTHER story, never re-sends a book that hasn't changed.
function maybePushStoryToPublicLibrary(story) {
  if (!publicLibraryAvailable() || !storyIsPublic(story)) return;
  const have = generatedChapterCount(story);
  const track = getPublicPushTrack();
  if (track[story.id] === have) return; // nothing new since the last push
  pushStoryToPublicLibrary(story).then(() => setPublicPushTrack(story.id, have));
}

// Lists every public book currently on file for one category, as light
// preview objects — ONE read regardless of how many books that is.
async function fetchPublicLibraryIndex(categoryId) {
  const config = publicLibraryConfig();
  if (!config) return [];
  const doc = await firestoreGet(config, `${PUBLIC_LIBRARY_INDEX_COLLECTION}/${encodeURIComponent(categoryId)}`);
  const ef = (doc && doc.fields) || {};
  return parseJsonField(ef.entries, []);
}

// Fetches one full public book, ready to drop straight into a reader's own
// state.stories — same JSON shape either way.
async function fetchPublicLibraryStory(storyId) {
  const config = publicLibraryConfig();
  if (!config) return null;
  const doc = await firestoreGet(config, `${PUBLIC_LIBRARY_COLLECTION}/${encodeURIComponent(storyId)}`);
  // parseJsonField auto-detects gzip-compressed vs legacy plain JSON — see
  // its own comment above — so books published before compression existed
  // still download exactly the same way a freshly-compressed one does.
  return (doc && doc.fields && parseJsonField(doc.fields.data, null)) || null;
}

// Lists every public book across every category in one go (one Firestore
// read per category index, same cost model as fetchPublicLibraryIndex) —
// used by the public library's category-independent "size" sort and by the
// explicit "download all" action, never automatically on every visit.
async function fetchAllPublicStoryPreviews() {
  const config = publicLibraryConfig();
  if (!config) return [];
  const categoryIds = [...CATEGORIES.map((c) => c.id), SEARCH_CATEGORY.id, PDF_IMPORT_CATEGORY.id];
  const lists = await Promise.all(categoryIds.map((id) => fetchPublicLibraryIndex(id).catch(() => [])));
  const all = [];
  lists.forEach((list) => all.push(...list));
  return all;
}

// ---------------------------------------------------------------------------
// Public word dictionary: a shared, cross-reader English→Hebrew dictionary
// that sits IN FRONT OF the AI translation call — every word actually costs
// an API call/token only the first time ANYONE, anywhere, translates it;
// after that, every reader (including the one who translated it originally)
// gets it straight from this shared dictionary at zero cost. This is
// deliberately word-level, not context-level (same tradeoff the existing
// personal per-word correction cache — getCustomTranslation/setCustomTranslation,
// see translateWord above — already makes): a shared cache keyed only by
// context would rarely hit, defeating the point.
//
// Same primary/registry Firebase project as the public library (see its
// header comment above) — one canonical place, Firebase mode only.
//
// Data model:
//   public_words/{wordKey}          — one tiny doc per distinct word:
//                                      {word, translation, updatedAt}. wordKey
//                                      is the lowercased word, URL-encoded —
//                                      this is what makes a single-word
//                                      lookup ONE direct doc read (no query
//                                      needed) before ever calling the AI.
//   public_words_index/{letter}     — 27 shard docs (a–z, plus "misc" for
//                                      anything else) — each `words` field is
//                                      a JSON array of {word, translation}
//                                      for that shard. Sharded by first
//                                      letter (mirrors the app's own A–Z
//                                      dictionary view) specifically so that
//                                      "download the whole public dictionary"
//                                      is 27 reads instead of one document
//                                      that grows forever and eventually hits
//                                      Firestore's 1MB doc cap.
// ---------------------------------------------------------------------------

const PUBLIC_WORDS_COLLECTION = "public_words";
const PUBLIC_WORDS_INDEX_COLLECTION = "public_words_index";

function publicWordKey(word) {
  const clean = (word || "").trim().toLowerCase();
  return clean ? encodeURIComponent(clean) : "";
}
function publicWordShard(word) {
  const c = (word || "").trim().charAt(0).toLowerCase();
  return /^[a-z]$/.test(c) ? c : "misc";
}

// Direct single-doc lookup — this is the whole point: no token spent if this
// resolves. Never throws to the caller; a failed/missing lookup just means
// "fall through to the normal AI translation", same as a cache miss.
async function fetchPublicWordTranslation(word) {
  const config = publicLibraryConfig();
  const key = publicWordKey(word);
  if (!config || !key) return null;
  try {
    const doc = await firestoreGet(config, `${PUBLIC_WORDS_COLLECTION}/${key}`);
    const t = doc && doc.fields && doc.fields.translation && doc.fields.translation.stringValue;
    return t || null;
  } catch (e) {
    return null;
  }
}

async function upsertPublicWordIndexEntry(config, word, translation) {
  const path = `${PUBLIC_WORDS_INDEX_COLLECTION}/${publicWordShard(word)}`;
  const existing = await firestoreGet(config, path);
  const ef = (existing && existing.fields) || {};
  const list = parseJsonField(ef.words, []);
  const key = word.trim().toLowerCase();
  const idx = list.findIndex((w) => (w.word || "").toLowerCase() === key);
  const entry = { word: word.trim(), translation };
  if (idx === -1) list.push(entry);
  else list[idx] = entry;
  await firestoreSet(config, path, { words: compressJsonToField(list) });
}

// Best-effort, silent — never throws, never surfaces an error to the reader,
// never prompts an interactive sign-in (same posture as pushStoryToPublicLibrary
// above, and for the same reason: this is a nice-to-have layered on top of
// a translation that already succeeded either way).
async function pushWordToPublicDictionary(word, translation) {
  if (!publicLibraryAvailable() || !word || !translation) return;
  const config = publicLibraryConfig();
  const key = publicWordKey(word);
  if (!key) return;
  try {
    await firestoreSet(config, `${PUBLIC_WORDS_COLLECTION}/${key}`, {
      word: strField(word.trim()),
      translation: strField(translation),
      updatedAt: intField(Date.now()),
    });
    await upsertPublicWordIndexEntry(config, word, translation);
  } catch (e) {
    console.error("pushWordToPublicDictionary failed:", (e && e.message) || e);
  }
}

// Local-only record of which words have already been shared with the public
// dictionary (by normalized key), so pushAllToPublicCatalog below doesn't
// keep re-checking/re-writing the same words on every backup. Mirrors
// getPublicPushTrack/setPublicPushTrack above for stories.
const PUBLIC_WORD_PUSH_TRACK_KEY = "reader-public-word-push-track";
function getPublicWordPushTrack() {
  try {
    return JSON.parse(localStorage.getItem(PUBLIC_WORD_PUSH_TRACK_KEY) || "{}");
  } catch (e) {
    return {};
  }
}
function setPublicWordPushed(key) {
  try {
    const all = getPublicWordPushTrack();
    all[key] = true;
    localStorage.setItem(PUBLIC_WORD_PUSH_TRACK_KEY, JSON.stringify(all));
  } catch (e) {
    // best-effort only — worst case, a word gets re-checked once more than necessary
  }
}

// Checks the shared dictionary before ever spending a token; on a miss, does
// the normal context-aware AI translation and then contributes the result
// back to the shared dictionary for the next reader (or the same reader,
// next time) to reuse for free.
//
// IMPORTANT latency note: this was originally a plain `await
// fetchPublicWordTranslation(word)` before ever starting the AI call — which
// meant EVERY tap, including ones that end up missing the cache anyway, paid
// for a full network round-trip to Firestore serially, in addition to (not
// instead of) the AI call. That's what made translation visibly slower after
// this feature shipped. Fixed by racing the dictionary lookup against a
// short timeout: a fast cache hit (the common case on decent networks)
// still returns immediately with the token saved; a slow/absent connection
// falls through to the normal AI translation after, at most, ~450ms lost —
// never "however long Firestore happens to take" on top of the AI call.
function timeoutAfter(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms)); // resolves to undefined
}
async function translateWordCached(word, context) {
  const cached = await Promise.race([fetchPublicWordTranslation(word), timeoutAfter(450)]);
  if (cached) return cached;
  const translation = await translateWord(word, context);
  pushWordToPublicDictionary(word, translation).then(() => setPublicWordPushed(publicWordKey(word))); // fire-and-forget
  return translation;
}

// Fetches the ENTIRE public dictionary (27 shard reads) — used only by the
// explicit "download all" action in "המילים שלי", never automatically.
async function fetchAllPublicWords() {
  const config = publicLibraryConfig();
  if (!config) return [];
  const shards = "abcdefghijklmnopqrstuvwxyz".split("").concat(["misc"]);
  const docs = await Promise.all(
    shards.map((s) => firestoreGet(config, `${PUBLIC_WORDS_INDEX_COLLECTION}/${s}`).catch(() => null))
  );
  const all = [];
  docs.forEach((doc) => {
    const ef = (doc && doc.fields) || {};
    all.push(...parseJsonField(ef.words, []));
  });
  return all;
}

// Retroactively shares every eligible book and translated word already
// sitting in this reader's own private state with the shared public catalog
// — not just whatever happened to get pushed live while it was written (see
// maybePushStoryToPublicLibrary / translateWordCached above for that live
// path). Called after every ordinary private backup (see pushBackup below),
// so becoming public is never limited to content generated after some
// earlier failure/offline moment or a Netlify-mode period. Uses the same
// local dedup tracking as the live path, so a run with nothing new to share
// does no network work at all beyond the initial in-memory scan.
async function pushAllToPublicCatalog(state, onProgress) {
  if (!publicLibraryAvailable()) return { storiesPushed: 0, wordsPushed: 0 };

  let storiesPushed = 0;
  const storyTrack = getPublicPushTrack();
  const stories = Object.values(state.stories || {}).filter(storyIsPublic);
  const storiesToPush = stories.filter((story) => storyTrack[story.id] !== generatedChapterCount(story));
  for (let i = 0; i < storiesToPush.length; i++) {
    const story = storiesToPush[i];
    if (onProgress) onProgress(`משתפים ספרים עם המאגר הציבורי (${i + 1}/${storiesToPush.length})…`);
    await pushStoryToPublicLibrary(story);
    setPublicPushTrack(story.id, generatedChapterCount(story));
    storiesPushed++;
  }

  // Also retry pushing each PUBLIC imported PDF's ORIGINAL FILE — the story
  // shell pushed just above only ever carries whichever chapters this
  // reader has personally opened (see writeChapterAt); every other chapter
  // depends entirely on pushPdfFileToPublicCloud, which normally only runs
  // once, fire-and-forget, right at import time (see the PDF-import flow).
  // If that one-time push didn't fully finish — offline, closed the tab
  // early, a big file — the book would otherwise be permanently
  // unreachable (beyond chapter 1) from any other device. This retries it
  // on every backup instead, skipping any book already flagged as done
  // (PDF_CHAPTERS_PUBLIC_TRACK_KEY) so it costs nothing once caught up —
  // and pushPdfFileToPublicCloud itself skips the actual upload if this
  // exact file is already sitting in the cloud (see pushFileChunksIfMissing),
  // so no file is ever uploaded twice.
  const pdfPublicTrack = getPdfChaptersPushTrack(PDF_CHAPTERS_PUBLIC_TRACK_KEY);
  const importedPublicStories = stories.filter((s) => s.isImported && !pdfPublicTrack[s.id]);
  for (let i = 0; i < importedPublicStories.length; i++) {
    const s = importedPublicStories[i];
    const pdfBytes = await loadPdfFileBytes(s.id);
    if (pdfBytes && pdfBytes.length) {
      // Same fix as the private-backup loop above: only flag as done on an
      // actual success, so a failed attempt gets retried on the next backup
      // instead of being marked "done" forever.
      const ok = await pushPdfFileToPublicCloud(s.id, pdfBytes);
      if (ok) setPdfChaptersPushed(PDF_CHAPTERS_PUBLIC_TRACK_KEY, s.id);
    }
  }

  let wordsPushed = 0;
  const wordTrack = getPublicWordPushTrack();
  const words = Object.values(state.words || {}).filter((w) => w.word && w.translation);
  const wordsToPush = words.filter((w) => !wordTrack[publicWordKey(w.word)]);
  for (let i = 0; i < wordsToPush.length; i++) {
    const w = wordsToPush[i];
    if (onProgress) onProgress(`משתפים מילים עם המאגר הציבורי (${i + 1}/${wordsToPush.length})…`);
    await pushWordToPublicDictionary(w.word, w.translation);
    setPublicWordPushed(publicWordKey(w.word));
    wordsPushed++;
  }

  return { storiesPushed, wordsPushed };
}

function getCumulativeGrammar(level) {
  return GRAMMAR_CURRICULUM.filter((g) => g.level <= level);
}
function getNewGrammarAtLevel(level) {
  return GRAMMAR_CURRICULUM.filter((g) => g.level === level);
}

// gaps), POETRY_CURRICULUM's levels are sparse — poems aren't written at
// every single level, so a poem's own level often lands between two
// curriculum entries (e.g. a level-3 poem, with the curriculum jumping
// straight from level 2 to level 4). A plain "level === this poem's level"
// check would then find nothing and the "new in this poem" card would just
// never appear for that poem. Instead: find the most advanced poetry device
// that's cumulatively available by this level (i.e. the highest curriculum
// level that doesn't exceed it) and treat that as what's newly worth
// showcasing in this poem — the same device may then keep appearing as
// "new" across a run of poems until the level climbs past the next
// curriculum entry, which is fine: it's still the most advanced tool
// currently in reach, shown with its full description card.

// chapter — the model "continuing" by circling back instead of moving
// forward. Compares the START of the new text (its opening sentence/phrase,
// where this failure shows up first) against the ENTIRE chapter-so-far;

// easily be a few MB, and localStorage's entire quota across the whole app

    req.onsuccess = () => resolve(req.result || null);
