              })}
            </div>
            <SecondaryButton onClick={() => setShowResults(false)} style={{ width: "100%", padding: "9px 0", fontSize: 13 }}>
              חזרה לבוחן
            </SecondaryButton>
          </div>
        ) : currentWord ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <div style={{ fontSize: 12, color: "#8a9089", textAlign: "center" }}>
              שאלה {index + 1} מתוך {order.length}
            </div>
            <div
              style={{
                background: "var(--paper-raised)",
                border: "1px solid var(--line)",
                borderRadius: 14,
                padding: "22px 18px",
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                justifyContent: "center",
                gap: 12,
              }}
            >
              <div
                style={{
                  fontFamily: mode === "en2he" ? "'Lora', serif" : "'Frank Ruhl Libre', serif",
                  fontWeight: 700,
                  fontSize: 22,
                  direction: mode === "en2he" ? "ltr" : "rtl",
                  textAlign: "center",
                }}
              >
                {currentWord[promptField]}
              </div>
              <button
                onClick={() => speakEnglishWord(currentWord.word)}
                title="השמע הגייה באנגלית"
                style={{
                  background: "none",
                  border: "1.5px solid var(--line-strong)",
                  borderRadius: 999,
                  width: 34,
                  height: 34,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  cursor: "pointer",
                  color: "#3E7C74",
                }}
              >
                <AppIcon name="Volume2" size={16} />
              </button>
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {options.map((opt, i) => {
                const isCorrectOpt = opt === currentWord[field];
                const isSelected = selected === opt;
                let bg = "var(--paper-raised)";
                let border = "var(--line)";
                if (selected) {
                  if (isCorrectOpt) {
                    bg = "#E9F3EC";
                    border = "#3E7C74";
                  } else if (isSelected) {
                    bg = "#F6E8E8";
                    border = "#8B3A3A";
                  }
                }
                return (
                  <button
                    key={i}
                    onClick={() => handleAnswer(opt)}
                    disabled={!!selected}
                    style={{
                      padding: "11px 14px",
                      borderRadius: 10,
                      border: `1.5px solid ${border}`,
                      background: bg,
                      color: "var(--ink)",
                      fontSize: 14.5,
                      fontWeight: 600,
                      textAlign: "center",
                      cursor: selected ? "default" : "pointer",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "space-between",
                      gap: 8,
                    }}
                  >
                    <span style={{ direction: field === "word" ? "ltr" : "rtl" }}>{opt}</span>
                    {selected && isCorrectOpt && <AppIcon name="Check" size={17} color="#3E7C74" />}
                    {selected && isSelected && !isCorrectOpt && <AppIcon name="X" size={17} color="#8B3A3A" />}
                  </button>
                );
              })}
            </div>

            <div style={{ display: "flex", gap: 8 }}>
              <SecondaryButton
                onClick={goPrev}
                disabled={index === 0}
                style={{ flex: 1, padding: "10px 0", opacity: index === 0 ? 0.45 : 1, cursor: index === 0 ? "default" : "pointer" }}
              >
                <AppIcon name="ChevronRight" size={15} />
                שאלה קודמת
              </SecondaryButton>
              <PrimaryButton onClick={goNext} style={{ flex: 1, padding: "10px 0" }}>
                {index + 1 < order.length ? "השאלה הבאה" : "סיום וצפייה בתוצאות"}
                <AppIcon name="ChevronLeft" size={15} />
              </PrimaryButton>
            </div>
          </div>
        ) : null}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Dictionary ("מילון") — an English→Hebrew dictionary view of every word ever
// saved to "המילים שלי", plus words added directly here. Words are grouped
// into A–Z tabs (external sort order) and alphabetized within each tab
// (internal sort order). Since this reads live from state.words, any word
// saved from a story elsewhere in the app shows up here automatically, fully
// sorted, with no extra bookkeeping required.
// ---------------------------------------------------------------------------

const DICTIONARY_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

function DictionaryModal({ state, setState, onClose }) {
  const allWords = useMemo(() => Object.values(state.words), [state.words]);

  const { byLetter, other } = useMemo(() => {
    const map = {};
    DICTIONARY_ALPHABET.forEach((l) => (map[l] = []));
    const rest = [];
    for (const w of allWords) {
      const first = (w.word || "").trim().charAt(0).toUpperCase();
      if (map[first]) map[first].push(w);
      else rest.push(w);
    }
    const collator = new Intl.Collator("en", { sensitivity: "base" });
    DICTIONARY_ALPHABET.forEach((l) => {
      map[l].sort((a, b) => collator.compare(a.word, b.word) || collator.compare(a.translation || "", b.translation || ""));
    });
    rest.sort((a, b) => collator.compare(a.word, b.word));
    return { byLetter: map, other: rest };
  }, [allWords]);

  const lettersWithWords = DICTIONARY_ALPHABET.filter((l) => byLetter[l].length > 0);
  const [activeLetter, setActiveLetter] = useState(null);
  const effectiveLetter = activeLetter && (byLetter[activeLetter] || []).length > 0
    ? activeLetter
    : (lettersWithWords[0] || "A");

  const [showAdd, setShowAdd] = useState(false);
  const [newWord, setNewWord] = useState("");
  const [newTranslation, setNewTranslation] = useState("");
  const [addError, setAddError] = useState("");

  function addWord() {
    const w = newWord.trim();
    const t = newTranslation.trim();
    if (!w || !t) {
      setAddError("יש למלא מילה באנגלית ותרגום לעברית.");
      return;
    }
    if (!/^[A-Za-z][A-Za-z' -]*$/.test(w)) {
      setAddError("המילה צריכה להיות באותיות אנגליות.");
      return;
    }
    const id = uid();
    const entry = {
      id,
      word: w,
      translation: t,
      context: "",
      storyId: null,
      storyTitle: "נוסף ידנית למילון",
      categoryId: "dictionary",
      level: null,
      createdAt: Date.now(),
    };
    setState((prev) => ({ ...prev, words: { ...prev.words, [id]: entry } }));
    setActiveLetter(w.charAt(0).toUpperCase());
    setNewWord("");
    setNewTranslation("");
    setAddError("");
    setShowAdd(false);
  }

  function removeWord(id) {
    setState((prev) => {
      const words = { ...prev.words };
      delete words[id];
      return { ...prev, words };
    });
  }
  const [pendingDeleteWordId, setPendingDeleteWordId] = useState(null);

  const currentEntries = effectiveLetter === "#" ? other : byLetter[effectiveLetter] || [];

  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(35,52,46,0.5)",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        zIndex: 95,
        padding: 16,
      }}
      onClick={onClose}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: "var(--paper)",
          borderRadius: 18,
          padding: 22,
          maxWidth: 560,
          width: "100%",
          maxHeight: "88vh",
          overflowY: "auto",
          boxShadow: "0 20px 50px rgba(0,0,0,0.3)",
          display: "flex",
          flexDirection: "column",
          gap: 14,
        }}
      >
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
          <div>
            <div style={{ fontFamily: "'Frank Ruhl Libre', serif", fontSize: 19, fontWeight: 700 }}>מילון אנגלי–עברי</div>
            <div style={{ color: "#5c665f", fontSize: 12.5, marginTop: 2 }}>
              כל המילים ששמרתם, ממוינות א'-ת' לפי האות הראשונה באנגלית ולפי סדר א'-ב' פנימי.
            </div>
          </div>
          <button
            onClick={onClose}
            style={{ background: "none", border: "none", cursor: "pointer", color: "#8a9089", padding: 4, flexShrink: 0 }}
          >
            <AppIcon name="X" size={18} />
          </button>
        </div>

        <SecondaryButton onClick={() => setShowAdd((s) => !s)} style={{ alignSelf: "flex-start", padding: "7px 12px", fontSize: 13 }}>
          <AppIcon name="Plus" size={14} />
          הוספת מילה למילון
        </SecondaryButton>

        {showAdd && (
          <div
            style={{
              background: "var(--paper-raised)",
              border: "1px solid var(--line)",
              borderRadius: 12,
              padding: 14,
              display: "flex",
              flexDirection: "column",
              gap: 8,
            }}
          >
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <input
                type="text"
                value={newWord}
                onChange={(e) => setNewWord(e.target.value)}
                placeholder="מילה באנגלית"
                dir="ltr"
                style={{
                  flex: 1,
                  minWidth: 140,
                  padding: "10px 12px",
                  borderRadius: 10,
                  border: "1.5px solid var(--line-strong)",
                  fontSize: 14,
                  boxSizing: "border-box",
                  background: "var(--paper)",
                  color: "var(--ink)",
                  fontFamily: "'Lora', serif",
                  textAlign: "left",
                }}
              />
              <input
                type="text"
                value={newTranslation}
                onChange={(e) => setNewTranslation(e.target.value)}
                placeholder="תרגום לעברית"
                style={{
                  flex: 1,
                  minWidth: 140,
                  padding: "10px 12px",
                  borderRadius: 10,
                  border: "1.5px solid var(--line-strong)",
                  fontSize: 14,
                  boxSizing: "border-box",
                  background: "var(--paper)",
                  color: "var(--ink)",
                }}
              />
            </div>
            {addError && <div style={{ color: "#8B3A3A", fontSize: 12.5 }}>{addError}</div>}
            <PrimaryButton onClick={addWord} style={{ alignSelf: "flex-start", padding: "8px 16px", fontSize: 13.5 }}>
              <AppIcon name="Check" size={14} />
              הוספה למילון
            </PrimaryButton>
          </div>
        )}

        <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
          {DICTIONARY_ALPHABET.map((l) => {
            const count = byLetter[l].length;
            const isActive = effectiveLetter === l;
            return (
              <button
                key={l}
                onClick={() => count > 0 && setActiveLetter(l)}
                disabled={count === 0}
                title={count > 0 ? `${count} מילים` : "אין מילים באות זו"}
                style={{
                  width: 28,
                  height: 28,
                  borderRadius: 8,
                  border: `1.5px solid ${isActive ? "var(--ink)" : "var(--line)"}`,
                  background: isActive ? "var(--ink)" : "transparent",
                  color: isActive ? "var(--paper)" : count > 0 ? "var(--ink)" : "#c7c2b0",
                  fontSize: 12.5,
                  fontWeight: 700,
                  fontFamily: "'IBM Plex Mono', monospace",
                  cursor: count > 0 ? "pointer" : "default",
                  opacity: count > 0 ? 1 : 0.5,
                  flexShrink: 0,
                }}
              >
                {l}
              </button>
            );
          })}
          {other.length > 0 && (
            <button
              onClick={() => setActiveLetter("#")}
              style={{
                minWidth: 28,
                height: 28,
                padding: "0 6px",
                borderRadius: 8,
                border: `1.5px solid ${effectiveLetter === "#" ? "var(--ink)" : "var(--line)"}`,
                background: effectiveLetter === "#" ? "var(--ink)" : "transparent",
                color: effectiveLetter === "#" ? "var(--paper)" : "var(--ink)",
                fontSize: 12.5,
                fontWeight: 700,
                fontFamily: "'IBM Plex Mono', monospace",
                cursor: "pointer",
                flexShrink: 0,
              }}
            >
              #
            </button>
          )}
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 6, minHeight: 120 }}>
          {allWords.length === 0 && (
            <div style={{ color: "#8a9089", fontSize: 14, padding: "24px 0", textAlign: "center" }}>
              המילון ריק עדיין. שמרו מילים תוך כדי קריאה, או הוסיפו מילה ישירות כאן.
            </div>
          )}
          {allWords.length > 0 && currentEntries.length === 0 && (
            <div style={{ color: "#8a9089", fontSize: 13, padding: "16px 0", textAlign: "center" }}>אין מילים באות זו.</div>
          )}
          {currentEntries.map((w) => {
            const cat = CAT_BY_ID[w.categoryId] || DICTIONARY_CATEGORY;
            return (
              <div
                key={w.id}
                style={{
                  background: "var(--paper-raised)",
                  border: "1px solid var(--line)",
                  borderRadius: 10,
                  padding: "10px 14px",
                  display: "flex",
                  alignItems: "center",
                  gap: 12,
                }}
              >
                <div style={{ minWidth: 100, display: "flex", alignItems: "center", gap: 6 }}>
                  <button
                    onClick={() => speakEnglishWord(w.word)}
                    title="השמע הגייה באנגלית"
                    style={{
                      background: "none",
                      border: "1.5px solid var(--line-strong)",
                      borderRadius: 999,
                      width: 24,
                      height: 24,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      cursor: "pointer",
                      color: "#3E7C74",
                      flexShrink: 0,
                      padding: 0,
                    }}
                  >
                    <AppIcon name="Volume2" size={12} />
                  </button>
                  <div style={{ fontFamily: "'Lora', serif", fontWeight: 600, fontSize: 15, direction: "ltr", textAlign: "left" }}>
                    {w.word}
                  </div>
                </div>
                <div style={{ fontWeight: 700, flex: 1 }}>{w.translation}</div>
                <div style={{ fontSize: 11.5, color: cat.color, whiteSpace: "nowrap" }}>
                  {w.storyId ? w.storyTitle : cat.name}
                </div>
                <button onClick={() => setPendingDeleteWordId(w.id)} style={{ background: "none", border: "none", color: "#b7b2a0", cursor: "pointer", padding: 4, flexShrink: 0 }}>
                  <AppIcon name="Trash2" size={15} />
                </button>
              </div>
            );
          })}
        </div>
      </div>
      {pendingDeleteWordId && state.words[pendingDeleteWordId] && (
        <ConfirmDeleteWordModal
          word={state.words[pendingDeleteWordId]}
          onClose={() => setPendingDeleteWordId(null)}
          onConfirm={() => {
            removeWord(pendingDeleteWordId);
            setPendingDeleteWordId(null);
          }}
        />
      )}
    </div>
  );
}

function WordsView({ state, setState, onOpenStory }) {
  const words = Object.values(state.words || {}).sort((a, b) => b.createdAt - a.createdAt);
  const [showQuiz, setShowQuiz] = useState(false);
  const [showDictionary, setShowDictionary] = useState(false);
  const [quizBlockedMsg, setQuizBlockedMsg] = useState(null);
  const [downloadingAll, setDownloadingAll] = useState(false);
  const [downloadAllMsg, setDownloadAllMsg] = useState(null);
  // Words saved before the gloss/example feature existed (or from the public
  // word bank, which never has this data) won't have meaningEn/exampleEn yet.
  // Backfill them lazily, one at a time, rather than firing dozens of calls
  // at once on first load.
  const backfillingRef = useRef(new Set());
  useEffect(() => {
    const needsBackfill = words.find((w) => w.meaningEn == null && !backfillingRef.current.has(w.id));
    if (!needsBackfill) return;
    backfillingRef.current.add(needsBackfill.id);
    fetchWordExtras(needsBackfill.word, needsBackfill.translation, needsBackfill.context)
      .then(({ meaning, example }) => {
        setState((prev) => {
          const existingWord = prev.words[needsBackfill.id];
          if (!existingWord) return prev;
          return { ...prev, words: { ...prev.words, [needsBackfill.id]: { ...existingWord, meaningEn: meaning, exampleEn: example } } };
        });
      })
      .catch((e) => console.error("fetchWordExtras backfill failed:", e?.message || e));
  }, [words, setState]);
  function remove(id) {
    setState((prev) => {
      const w = { ...prev.words };
      delete w[id];
      return { ...prev, words: w };
    });
  }
  const [pendingDeleteId, setPendingDeleteId] = useState(null);
  // Inline editing of a saved word's English text / Hebrew translation,
  // right there in the "המילים שלי" card — no separate modal needed.
  const [editingWordId, setEditingWordId] = useState(null);
  const [editWordText, setEditWordText] = useState("");
  const [editTranslationText, setEditTranslationText] = useState("");
  function startEditWord(w) {
    setEditingWordId(w.id);
    setEditWordText(w.word);
    setEditTranslationText(w.translation);
  }
  function cancelEditWord() {
    setEditingWordId(null);
  }
  function saveEditWord(id) {
    const w = editWordText.trim();
    const t = editTranslationText.trim();
    if (!w || !t) return;
    setState((prev) => {
      const existing = prev.words[id];
      if (!existing) return prev;
      return { ...prev, words: { ...prev.words, [id]: { ...existing, word: w, translation: t } } };
    });
    setEditingWordId(null);
  }
  // Persists each quiz answer onto the word itself (quizCorrect/quizAttempts,
  // cumulative across every quiz ever taken) — powers both "סטטיסטיקת בחנים"
  // and the priority-weighted selection when a new quiz starts.
  function recordQuizAnswer(wordId, correct) {
    setState((prev) => {
      const w = prev.words[wordId];
      if (!w) return prev;
      return {
        ...prev,
        words: {
          ...prev.words,
          [wordId]: { ...w, quizAttempts: (w.quizAttempts || 0) + 1, quizCorrect: (w.quizCorrect || 0) + (correct ? 1 : 0) },
        },
      };
    });
  }
  // Persists each completed quiz session (score + per-question snapshot) so
  // "סטטיסטיקת בחנים" can list every quiz ever taken and let the reader open
  // one back up — separate from recordQuizAnswer above, which only feeds
  // the per-word cumulative stats used for weighting new quizzes.
  function recordQuizFinished(entry) {
    setState((prev) => ({
      ...prev,
      quizHistory: { ...(prev.quizHistory || {}), [entry.id]: entry },
    }));
  }
  function handleQuizTap() {
    if (words.length < 4) {
      // A `disabled` + `title` tooltip is invisible on mobile (no hover), so
      // tapping a disabled button here would look exactly like "the quiz
      // button doesn't work" with zero feedback. Keep the button tappable
      // and say why out loud instead.
      setQuizBlockedMsg(`שמרו עוד ${4 - words.length} מילים לפחות כדי לפתוח בוחן (יש לכם ${words.length}).`);
      return;
    }
    setQuizBlockedMsg(null);
    setShowQuiz(true);
  }
  async function handleDownloadAllPublicWords() {
    setDownloadingAll(true);
    setDownloadAllMsg(null);
    try {
      const all = await fetchAllPublicWords();
      const existingLower = new Set(Object.values(state.words || {}).map((w) => w.word.toLowerCase()));
      const toAdd = all.filter((w) => w.word && w.translation && !existingLower.has(w.word.toLowerCase()));
      setState((prev) => {
        const nextWords = { ...prev.words };
        toAdd.forEach((w) => {
          const id = uid();
          nextWords[id] = {
            id,
            word: w.word,
            translation: w.translation,
            context: "",
            storyId: null,
            storyTitle: "מהמאגר הציבורי",
            categoryId: "dictionary",
            level: null,
            createdAt: Date.now(),
          };
        });
        return { ...prev, words: nextWords };
      });
      setDownloadAllMsg(
        toAdd.length > 0
          ? `נוספו ${toAdd.length.toLocaleString("he")} מילים חדשות (מתוך ${all.length.toLocaleString("he")} במאגר — השאר כבר היו אצלכם).`
          : `כל ${all.length.toLocaleString("he")} המילים שבמאגר כבר נמצאות אצלכם.`
      );
    } catch (e) {
      setDownloadAllMsg("שגיאה בהורדת המאגר: " + (e.message || "לא ידועה"));
    } finally {
      setDownloadingAll(false);
    }
  }
  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10, marginBottom: 18 }}>
        <div>
          <div style={{ fontFamily: "'Frank Ruhl Libre', serif", fontSize: 24, fontWeight: 700 }}>המילים שלי</div>
          <div style={{ color: "#5c665f", fontSize: 14, marginTop: 4 }}>מילים וביטויים ששמרתם תוך כדי קריאה.</div>
        </div>
        <div style={{ display: "flex", gap: 8, flexShrink: 0, flexWrap: "wrap" }}>
          <SecondaryButton onClick={() => setShowDictionary(true)} style={{ padding: "8px 12px", fontSize: 13 }}>
            <AppIcon name="BookMarked" size={14} />
            מילון
          </SecondaryButton>
          <SecondaryButton onClick={handleQuizTap} style={{ padding: "8px 12px", fontSize: 13, opacity: words.length < 4 ? 0.75 : 1 }}>
            <AppIcon name="Sparkles" size={14} />
            בחן את עצמיך
          </SecondaryButton>
        </div>
      </div>
      {quizBlockedMsg && (
        <div
          style={{
            marginBottom: 14,
            fontSize: 12.5,
            color: "#5c665f",
            background: "var(--paper-raised)",
            border: "1px solid var(--line)",
            borderRadius: 10,
            padding: "8px 12px",
          }}
        >
          {quizBlockedMsg}
        </div>
      )}
      {publicLibraryAvailable() && (
        <div
          style={{
            marginBottom: 16,
            background: "var(--paper-raised)",
            border: "1px solid var(--line)",
            borderRadius: 12,
            padding: "12px 14px",
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            gap: 10,
            flexWrap: "wrap",
          }}
        >
          <div>
            <div style={{ fontWeight: 700, fontSize: 13.5 }}>מאגר המילים הציבורי</div>
            <div style={{ fontSize: 12, color: "#8a9089", marginTop: 2 }}>
              כל מילה שכל קורא באפליקציה תרגם אי-פעם — אפשר להוריד את כולן ולהוסיף לרשימה שלכם (מילים שכבר יש לכם לא יתווספו שוב).
            </div>
            {downloadAllMsg && <div style={{ fontSize: 12, color: "#3E7C74", marginTop: 6 }}>{downloadAllMsg}</div>}
          </div>
          <SecondaryButton onClick={handleDownloadAllPublicWords} disabled={downloadingAll} style={{ padding: "7px 12px", fontSize: 12.5, whiteSpace: "nowrap" }}>
            {downloadingAll ? <AppIcon name="Loader2" size={14} className="spin" /> : <AppIcon name="Plus" size={14} />}
            הורידו את כל המאגר
          </SecondaryButton>
        </div>
      )}
      {showQuiz && (
        <QuizModal
          words={words}
          onClose={() => setShowQuiz(false)}
          onRecordAnswer={recordQuizAnswer}
          quizHistory={state.quizHistory}
          onQuizFinished={recordQuizFinished}
        />
      )}
      {showDictionary && <DictionaryModal state={state} setState={setState} onClose={() => setShowDictionary(false)} />}
      {pendingDeleteId && state.words[pendingDeleteId] && (
        <ConfirmDeleteWordModal
          word={state.words[pendingDeleteId]}

                  <button
                    onClick={cancelEditWord}

                  >
                    <AppIcon name="X" size={16} />

                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ fontFamily: "'Lora', serif", fontWeight: 600, fontSize: 15, direction: "ltr", whiteSpace: "nowrap", flexShrink: 0 }}>
                    {w.word}
                  </div>
                  <div style={{ fontWeight: 700, fontSize: 14, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{w.translation}</div>
                  <div style={{ flex: 1 }} />
                  <button onClick={() => startEditWord(w)} style={{ background: "none", border: "none", color: "#b7b2a0", cursor: "pointer", padding: 4, flexShrink: 0 }}>
                    <AppIcon name="Pencil" size={15} />
                  </button>
                  <button onClick={() => setPendingDeleteId(w.id)} style={{ background: "none", border: "none", color: "#b7b2a0", cursor: "pointer", padding: 4, flexShrink: 0 }}>
                    <AppIcon name="Trash2" size={16} />
                  </button>
                </div>
              )}
              {/* Row 2: a bare-bones 1-2 word ENGLISH gloss of the word's
                  general meaning (separate from the Hebrew contextual
                  translation above, and never just the word repeated). */}
              {w.meaningEn ? (
                <div style={{ fontSize: 12.5, color: "#5c665f", fontFamily: "'Lora', serif", direction: "ltr", textAlign: "left" }}>{w.meaningEn}</div>
              ) : w.meaningEn === undefined ? (
                <div style={{ fontSize: 12, color: "#b7b2a0", fontStyle: "italic" }}>טוען פירוש…</div>
              ) : null}
              {/* Row 3: a short original English sentence using the word, the
                  word itself bolded. */}
              {w.exampleEn && (
                <div style={{ fontSize: 13, fontFamily: "'Lora', serif", direction: "ltr", textAlign: "left", color: "#3d443f" }}>
                  {boldWordInSentence(w.exampleEn, w.word)}
                </div>
              )}
              {/* Row 4: tiny source line — the story it first came from, and its level. */}
              <div
                onClick={w.storyId ? () => onOpenStory(w) : undefined}
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 6,
                  fontSize: 11,
                  color: "#a8a398",
                  cursor: w.storyId ? "pointer" : "default",
                  overflow: "hidden",
                }}
              >
                {w.storyId ? (
                  <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    מתוך: {w.storyTitle} · <span style={{ color: cat.color }}>{cat.name}</span>
                  </span>
                ) : (
                  <span style={{ color: cat.color, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{w.storyTitle}</span>
                )}
                {w.level != null && <LevelStamp level={w.level} color={cat.color} small />}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function timeAgoLabel(ts) {
  if (!ts) return "טרם נקרא";
  const diffMs = Date.now() - ts;
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return "נקרא זה עתה";
  if (min < 60) return `נקרא לפני ${min.toLocaleString("he")} דק׳`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `נקרא לפני ${hr.toLocaleString("he")} שע׳`;
  const day = Math.floor(hr / 24);
  if (day < 30) return `נקרא לפני ${day.toLocaleString("he")} ימים`;
  return `נקרא ב-${new Date(ts).toLocaleDateString("he")}`;
}

// Creation date only — never a "last modified"/"last read"/"last synced"
// date. Used under every book/story listing (personal library and the
// public catalog alike), no exceptions. Returns null (render nothing) when
// there's no timestamp to show, rather than printing a bogus date. Includes
// hour:minute (not just the date) so two books uploaded on the same day are
// still distinguishable from one another.
function createdDateLabel(ts) {
  if (!ts) return null;
  const d = new Date(ts);
  const datePart = d.toLocaleDateString("he", { year: "numeric", month: "long", day: "numeric" });
  const timePart = d.toLocaleTimeString("he", { hour: "2-digit", minute: "2-digit" });
  return `נוצר ב-${datePart}, ${timePart}`;
}

// For a book that came from the public catalog (story.fromPublicLibrary),
// "creation date" in the personal library means the date THIS reader added
// it to their own library — not the original author's creation date — and
// is flagged as such with "(מספרייה ציבורית)" so it's never mistaken for a
// book the reader wrote themselves. Falls back to the story's own createdAt
// only for books downloaded before this distinction existed (no
// downloadedAt recorded yet).
function libraryDateLabel(story) {
  if (story.fromPublicLibrary) {
    const label = createdDateLabel(story.downloadedAt || story.createdAt);
    return label ? `${label} (מספרייה ציבורית)` : null;
  }
  return createdDateLabel(story.createdAt);
}

function LibraryView({ state, setState, onOpen, onRequestDelete }) {
  // Sort/filter choice lives in persisted app state (not local component
  // state) so it survives navigating away and back, and even app reloads —
  // it only changes when the reader explicitly picks a different option.
  const librarySort = state.librarySort || { mode: "size", sizeFilter: "all", topicFilter: "all", visFilter: null };
  const sortMode = librarySort.mode;
  const sizeFilter = librarySort.sizeFilter;
  const topicFilter = librarySort.topicFilter;
  // visFilter is independent of topicFilter: it toggles on/off (click again
  // to clear it back to null / "both"), so it can be combined with any
  // topic category at the same time — e.g. "ציבורי" + a specific category.
  const visFilter = librarySort.visFilter || null;
  function updateLibrarySort(patch) {
    setState((prev) => ({
      ...prev,
      librarySort: {
        ...(prev.librarySort || { mode: "size", sizeFilter: "all", topicFilter: "all", visFilter: null }),
        ...patch,
      },
    }));
  }
  function toggleVisFilter(value) {
    updateLibrarySort({ visFilter: visFilter === value ? null : value });
  }

  const allStories = useMemo(() => {
    const list = Object.values(state.stories);
    if (sortMode === "lastRead") {
      return list.sort((a, b) => (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0) || b.createdAt - a.createdAt);
    }
    return list.sort((a, b) => b.createdAt - a.createdAt);
  }, [state.stories, sortMode]);

  // Always show every topic as a filter option — including ones with no
  // books yet — rather than only topics some story already exists in, so
  // the filter row doesn't reshuffle/disappear options as the library grows.
  const topicOptions = useMemo(() => [...CATEGORIES, SEARCH_CATEGORY, PDF_IMPORT_CATEGORY, ARTICLE_IMPORT_CATEGORY], []);

  const stories = allStories.filter((s) => {
    if (sortMode === "size") {
      if (sizeFilter !== "all" && bookSizeBand(s.totalChapters).key !== sizeFilter) return false;
    } else if (sortMode === "topic") {
      if (visFilter === "private" && storyIsPublic(s)) return false;
      if (visFilter === "public" && !storyIsPublic(s)) return false;
      if (topicFilter !== "all" && s.categoryId !== topicFilter) return false;
    } else if (sortMode === "liked") {
      if (!s.liked) return false;
    }
    return true;
  });

  function toggleLiked(storyId) {
    setState((prev) => {
      const s = prev.stories[storyId];
      if (!s) return prev;
      return { ...prev, stories: { ...prev.stories, [storyId]: { ...s, liked: !s.liked } } };
    });
  }

  // A story can be flagged "public" locally (see storyIsPublic) long before
  // it actually lands in the shared Firestore catalog — that only happens
  // once a cloud backup successfully runs (see pushAllToPublicCatalog). To
  // show readers which of their public-eligible books haven't made it there
  // yet, fetch the real catalog once (same cost as browsing the public
  // library) and compare IDs — never blocks the list from rendering meanwhile.
  const [syncedPublicIds, setSyncedPublicIds] = useState(null); // null = not checked yet
  useEffect(() => {
    if (!publicLibraryAvailable()) return;
    let cancelled = false;
    fetchAllPublicStoryPreviews()
      .then((list) => {
        if (!cancelled) setSyncedPublicIds(new Set(list.map((p) => p.id)));
      })
      .catch(() => {
        if (!cancelled) setSyncedPublicIds(null);
      });
    return () => {
      cancelled = true;
    };
  }, []);

  // Tapping the "טרם סונכרן למאגר" badge opens a small explainer with a
  // manual "sync now" action — rather than doing nothing useful on tap
  // (its only prior behavior was bubbling up into opening the story).
  const [syncInfoStory, setSyncInfoStory] = useState(null);
  const [syncingNow, setSyncingNow] = useState(false);
  const [syncNowMsg, setSyncNowMsg] = useState("");
  const [syncNowResult, setSyncNowResult] = useState(null);
  async function handleSyncNow() {
    setSyncingNow(true);
    setSyncNowResult(null);
    setSyncNowMsg("");
    try {
      await pushBackup(state, setSyncNowMsg);
      const list = await fetchAllPublicStoryPreviews();
      setSyncedPublicIds(new Set(list.map((p) => p.id)));
      setSyncNowResult({ ok: true, message: "הסנכרון הושלם." });
    } catch (e) {
      setSyncNowResult({ ok: false, message: e.message || "הסנכרון נכשל. נסו שוב מאוחר יותר." });
    } finally {
      setSyncingNow(false);
      setSyncNowMsg("");
    }
  }

  return (
    <div>
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontFamily: "'Frank Ruhl Libre', serif", fontSize: 24, fontWeight: 700 }}>הספרייה שלי</div>
        <div style={{ color: "#5c665f", fontSize: 14, marginTop: 4 }}>כל הסיפורים שיצרתם, מקוטלגים לפי גודל הספר או לפי נושא.</div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
        <span style={{ fontSize: 11.5, color: "#8a9089", fontWeight: 600 }}>מיון לפי:</span>
        <select
          value={sortMode}
          onChange={(e) => updateLibrarySort({ mode: e.target.value })}
          style={{
            border: "1.5px solid var(--line-strong)",
            background: "var(--paper-raised)",
            color: "var(--ink)",
            borderRadius: 999,
            padding: "4px 10px",
            fontSize: 11.5,
            fontWeight: 600,
            cursor: "pointer",
          }}
        >
          <option value="size">גודל</option>
          <option value="topic">נושא</option>
          <option value="lastRead">אחרון שנקרא</option>
          <option value="liked">הספרים שאהבתי</option>
        </select>
      </div>
      {sortMode === "topic" && (
        <div style={{ color: "#8a9089", fontSize: 11.5, marginBottom: 8, lineHeight: 1.5 }}>
          אפשר לסמן "פרטי" או "ציבורי" ביחד עם קטגוריה נוספת, כדי לסנן לפי שניהם יחד. לחיצה חוזרת על "פרטי"/"ציבורי" מבטלת את הסימון ומציגה שוב את שני הסוגים. בחירת "הכל" מנקה גם את סימון הפרטי/ציבורי. "מאמר מקישור" הוא תמיד פרטי — לכן הוא נעול על "פרטי", ו"ציבורי" לא ניתן לסימון במקביל אליו.
        </div>
      )}
      {sortMode !== "lastRead" && sortMode !== "liked" && (
        <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 16 }}>
          {sortMode === "size" ? (
            <>
              <button
                onClick={() => updateLibrarySort({ sizeFilter: "all" })}
                style={{
                  border: `1.5px solid ${sizeFilter === "all" ? "var(--ink)" : "var(--line-strong)"}`,
                  background: sizeFilter === "all" ? "var(--ink)" : "transparent",
                  color: sizeFilter === "all" ? "var(--paper)" : "var(--ink)",
                  borderRadius: 999,
                  padding: "5px 11px",
                  fontSize: 11,
                  fontWeight: 600,
                  cursor: "pointer",
                }}
              >
                הכל
              </button>
              {BOOK_SIZE_BANDS.map((b) => (
                <button
                  key={b.key}
                  onClick={() => updateLibrarySort({ sizeFilter: b.key })}
                  style={{
                    border: `1.5px solid ${sizeFilter === b.key ? "var(--ink)" : "var(--line-strong)"}`,
                    background: sizeFilter === b.key ? "var(--ink)" : "transparent",
                    color: sizeFilter === b.key ? "var(--paper)" : "var(--ink)",
                    borderRadius: 999,
                    padding: "5px 11px",
                    fontSize: 11,
                    fontWeight: 600,
                    cursor: "pointer",
                  }}
                >
                  {bookSizeBandLabel(b)}
                </button>
              ))}
            </>
          ) : (
            <>
              {(() => {
                // "מאמר מקישור" (webImport) stories are always private (see
                // storyIsPublic) — pairing that category with "ציבורי" can
                // only ever produce zero results, which is exactly the
                // confusing empty-list case this is meant to prevent. So
                // while that category is the active topic filter, "ציבורי"
                // is locked out and "פרטי" is locked on. The lock releases
                // the moment a different topic chip (including "הכל") is
                // chosen.
                const webImportLocked = topicFilter === "webImport";
                // "הכל" here means "no filtering at all" — both category
                // and visibility wide open — not just "any category". So
                // selecting it also clears any active פרטי/ציבורי, and it
                // only shows as the selected chip when nothing else is
                // narrowing the list.
                const allSelected = topicFilter === "all" && visFilter === null;
                return (
                  <>
                    <button
                      onClick={() => updateLibrarySort({ topicFilter: "all", visFilter: null })}
                      style={{
                        border: `1.5px solid ${allSelected ? "var(--ink)" : "var(--line-strong)"}`,
                        background: allSelected ? "var(--ink)" : "transparent",
                        color: allSelected ? "var(--paper)" : "var(--ink)",
                        borderRadius: 999,
                        padding: "5px 11px",
                        fontSize: 11,
                        fontWeight: 600,
                        cursor: "pointer",
                      }}
                    >
                      הכל
                    </button>
                    <button
                      onClick={() => {
                        if (webImportLocked) return;
                        toggleVisFilter("public");
                      }}
                      disabled={webImportLocked}
                      style={{
                        display: "inline-flex",
                        alignItems: "center",
                        gap: 5,
                        border: `1.5px solid ${visFilter === "public" ? "var(--ink)" : "var(--line-strong)"}`,
                        background: visFilter === "public" ? "var(--ink)" : "transparent",
                        color: visFilter === "public" ? "var(--paper)" : "var(--ink)",
                        borderRadius: 999,
                        padding: "5px 11px",
                        fontSize: 11,
                        fontWeight: 600,
                        cursor: webImportLocked ? "not-allowed" : "pointer",
                        opacity: webImportLocked ? 0.4 : 1,
                      }}
                    >
                      <AppIcon name="Globe" size={11} />
                      ציבורי
                    </button>
                    <button
                      onClick={() => {
                        if (webImportLocked) return; // locked on, can't toggle off
                        toggleVisFilter("private");
                      }}
                      style={{
                        display: "inline-flex",
                        alignItems: "center",
                        gap: 5,
                        border: `1.5px solid ${visFilter === "private" || webImportLocked ? "var(--ink)" : "var(--line-strong)"}`,
                        background: visFilter === "private" || webImportLocked ? "var(--ink)" : "transparent",
                        color: visFilter === "private" || webImportLocked ? "var(--paper)" : "var(--ink)",
                        borderRadius: 999,
                        padding: "5px 11px",
                        fontSize: 11,
                        fontWeight: 600,
                        cursor: webImportLocked ? "default" : "pointer",
                      }}
                    >
                      <AppIcon name="Lock" size={11} />
                      פרטי
                    </button>
                    {topicOptions.map((c) => (
                      <button
                        key={c.id}
                        onClick={() =>
                          updateLibrarySort(
                            c.id === "webImport"
                              ? { topicFilter: c.id, visFilter: "private" }
                              : { topicFilter: c.id }
                          )
                        }
                        style={{
                          border: `1.5px solid ${topicFilter === c.id ? c.color : "var(--line-strong)"}`,
                          background: topicFilter === c.id ? c.color : "transparent",
                          color: topicFilter === c.id ? "var(--paper)" : "var(--ink)",
                          borderRadius: 999,
                          padding: "5px 11px",
                          fontSize: 11,
                          fontWeight: 600,
                          cursor: "pointer",
                          display: "inline-flex",
                          alignItems: "center",
                          gap: 5,
                        }}
                      >
                        <AppIcon name={c.icon} size={11} color={topicFilter === c.id ? "var(--paper)" : c.color} />
                        {c.name}
                      </button>
                    ))}
                  </>
                );
              })()}
            </>
          )}
        </div>
      )}
      {stories.length > 0 && (
        <div style={{ fontSize: 12.5, color: "#8a9089", fontWeight: 600, marginBottom: 8 }}>
          {stories.length === 1 ? "ספר אחד" : `${stories.length.toLocaleString("he")} ספרים`}
        </div>
      )}
      {stories.length === 0 && (
        <div style={{ color: "#8a9089", fontSize: 14, padding: "30px 0", textAlign: "center" }}>
          {allStories.length === 0
            ? "עדיין אין סיפורים. התחילו לקרוא מדף הבית."
            : sortMode === "liked"
            ? "עדיין לא סימנתם שום ספר בלב. לחצו על הלב ליד ספר כדי להוסיף אותו לכאן."
            : "אין סיפורים התואמים את הסינון שנבחר."}
        </div>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {stories.map((s) => {
          const cat = CAT_BY_ID[s.categoryId];
          const Icon = cat.icon;
          return (
            <div
              key={s.id}
              className="lib-row"
              onClick={() => onOpen(s.id)}
              style={{
                background: "var(--paper-raised)",
                border: "1px solid var(--line)",
                borderRadius: 12,
                padding: "13px 16px",
                cursor: "pointer",
              }}
            >
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div
                  style={{
                    width: 32,
                    height: 32,
                    borderRadius: 8,
                    background: `${cat.color}18`,
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    flexShrink: 0,
                  }}
                >
                  <AppIcon name={Icon} size={15} color={cat.color} />
                </div>
                <div
                  style={{
                    flex: 1,
                    minWidth: 0,
                    fontFamily: "'Lora', serif",
                    fontWeight: 600,
                    fontSize: 14,
                    direction: "ltr",
                    textAlign: "left",
                    lineHeight: 1.3,
                    wordBreak: "break-word",
                  }}
                >
                  {s.storyTitle}
                </div>
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    toggleLiked(s.id);
                  }}
                  title={s.liked ? "הסירו מהספרים שאהבתי" : "הוסיפו לספרים שאהבתי"}
                  style={{ background: "none", border: "none", color: s.liked ? "#B5658A" : "#b7b2a0", cursor: "pointer", padding: 4, flexShrink: 0 }}
                >
                  <AppIcon name={s.liked ? "HeartFill" : "Heart"} size={16} color={s.liked ? "#B5658A" : undefined} />
                </button>
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    onRequestDelete(s.id);
                  }}
                  title="מחק ספר"
                  style={{ background: "none", border: "none", color: "#b7b2a0", cursor: "pointer", padding: 4, flexShrink: 0 }}
                >
                  <AppIcon name="Trash2" size={16} />
                </button>
              </div>
              <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 8, marginTop: 6, paddingRight: 44 }}>
                <div style={{ fontSize: 12, color: "#8a9089" }}>
                  {cat.name} · {generatedChapterCount(s)}/{s.totalChapters} פרקים · {bookSizeBand(s.totalChapters).label}
                </div>
                {libraryDateLabel(s) && (
                  <div style={{ fontSize: 11.5, color: "#8a9089" }}>{libraryDateLabel(s)}</div>
                )}
                {sortMode === "lastRead" && (
                  <div style={{ fontSize: 11.5, color: "#3E7C74", fontWeight: 600 }}>{timeAgoLabel(s.lastOpenedAt)}</div>
                )}
                {s.source && (
                  <div style={{ fontSize: 11.5, color: cat.color }}>מבוסס על: {s.source}</div>
                )}
                {s.read ? (
                  <div style={{ fontSize: 12, color: "#3E7C74", fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}>
                    <AppIcon name="Check" size={13} /> נקרא
                  </div>
                ) : (
                  <div style={{ fontSize: 12, color: "#C08A3E", fontWeight: 700 }}>בתהליך</div>
                )}
                {syncedPublicIds && storyIsPublic(s) && !syncedPublicIds.has(s.id) && (
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      setSyncInfoStory(s);
                      setSyncNowResult(null);
                    }}
                    style={{
                      fontSize: 11.5,
                      color: "#C08A3E",
                      fontWeight: 700,
                      display: "flex",
                      alignItems: "center",
                      gap: 4,
                      background: "none",
                      border: "none",
                      padding: 0,
                      cursor: "pointer",
                      textDecoration: "underline",
                      textDecorationStyle: "dotted",
                    }}
                  >
                    <AppIcon name="CloudOff" size={13} /> טרם סונכרן למאגר
                  </button>
                )}
                <LevelStamp level={s.level} color={cat.color} small />
              </div>
            </div>
          );
        })}
      </div>
      {syncInfoStory && (
        <SyncInfoModal
          story={syncInfoStory}
          onClose={() => setSyncInfoStory(null)}
          onSyncNow={handleSyncNow}
          syncing={syncingNow}
          progressMsg={syncNowMsg}
          result={syncNowResult}
        />
      )}
    </div>
  );
}

function GrammarRefCard({ g, learned }) {

    <div
      style={{
        background: "var(--paper-raised)",
        border: `1px solid ${learned ? "#3E7C7440" : "var(--line)"}`,
        borderRadius: 12,
        padding: "13px 16px",
        display: "flex",
        gap: 14,
        alignItems: "flex-start",
        opacity: learned ? 1 : 0.65,
      }}
    >
      <div
        style={{
          fontFamily: "'IBM Plex Mono', monospace",
          fontWeight: 700,
          fontSize: 12,
          color: learned ? "#3E7C74" : "#8a9089",
          border: `1.5px solid ${learned ? "#3E7C74" : "var(--line-strong)"}`,
          borderRadius: 999,
          padding: "3px 9px",
          flexShrink: 0,
          marginTop: 2,
        }}
      >
        L{g.level}
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <div style={{ fontWeight: 700, fontSize: 14.5 }}>{g.heTitle}</div>
          {learned && (
            <div style={{ fontSize: 11, color: "#3E7C74", fontWeight: 700, display: "flex", alignItems: "center", gap: 3 }}>
              <AppIcon name="Check" size={11} /> נלמד
            </div>
          )}
        </div>
        <div style={{ fontSize: 13, color: "#3d453f", marginTop: 3 }}>{g.heDesc}</div>
        {g.structure && (
          <div style={{ marginTop: 8 }}>
            <div style={{ fontSize: 11.5, fontWeight: 700, color: "#3E7C74", marginBottom: 2 }}>מבנה</div>
            <div style={{ fontSize: 13, color: "#3d453f", lineHeight: 1.55 }}>{g.structure}</div>
          </div>
        )}
        {g.usage && (
          <div style={{ marginTop: 6 }}>
            <div style={{ fontSize: 11.5, fontWeight: 700, color: "#3E7C74", marginBottom: 2 }}>מתי משתמשים</div>
            <div style={{ fontSize: 13, color: "#3d453f", lineHeight: 1.55 }}>{g.usage}</div>
          </div>
        )}
        {g.examples && g.examples.length > 0 && (
          <div style={{ marginTop: 6 }}>
            <div style={{ fontSize: 11.5, fontWeight: 700, color: "#3E7C74", marginBottom: 3 }}>דוגמאות</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
              {g.examples.map((ex, i) => (
                <div key={i} style={{ fontFamily: "'Lora', serif", fontStyle: "italic", fontSize: 13, direction: "ltr", textAlign: "left", color: "#5c665f" }}>
                  {ex}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function GrammarReferenceView({ state }) {
  const overallLevel = Math.max(1, ...Object.values(state.categoryProgress).map((p) => p.level));
  const [tab, setTab] = useState("grammar"); // grammar | poetry
  const curriculum = tab === "poetry" ? POETRY_CURRICULUM : GRAMMAR_CURRICULUM;
  return (
    <div>
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontFamily: "'Frank Ruhl Libre', serif", fontSize: 24, fontWeight: 700 }}>חוקי דקדוק</div>
        <div style={{ color: "#5c665f", fontSize: 14, marginTop: 4 }}>
          {tab === "poetry"
            ? "כל כללי הדקדוק הפואטי, המשקל, החריזה והסגנון של שירה ופואמות באנגלית — לסקירה וללימוד עצמי, ללא קשר לשיר ספציפי."
            : "כל כללי הדקדוק באנגלית, מהבסיס ועד לרמה ספרותית — לסקירה וללימוד עצמי, ללא קשר לסיפור ספציפי."}
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <SecondaryButton
          onClick={() => setTab("grammar")}
          style={{ background: tab === "grammar" ? "#3E7C7418" : undefined, borderColor: tab === "grammar" ? "#3E7C74" : undefined }}
        >
          <AppIcon name="GraduationCap" size={14} />
          דקדוק רגיל
        </SecondaryButton>
        <SecondaryButton
          onClick={() => setTab("poetry")}
          style={{ background: tab === "poetry" ? "#3E7C7418" : undefined, borderColor: tab === "poetry" ? "#3E7C74" : undefined }}
        >
          <AppIcon name="Feather" size={14} />
          דקדוק שירה ופואמה
        </SecondaryButton>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {curriculum.map((g) => (
          <GrammarRefCard key={ruleKey(g)} g={g} learned={g.level <= overallLevel} />
        ))}
        <div
          style={{
            background: "var(--paper-raised)",
            border: "1px solid var(--line)",
            borderRadius: 12,
            padding: "13px 16px",
            fontSize: 13,
            color: "#5c665f",
            lineHeight: 1.6,
          }}
        >
          {tab === "poetry" ? (
            <>
              מרמה {POETRY_CURRICULUM[POETRY_CURRICULUM.length - 1].level + 1} ואילך: כל כללי השירה הבסיסיים כבר נלמדו. ההתקדמות ממשיכה
              דרך העשרת אוצר המילים, בחירת צורות פואטיות שאפתניות יותר (סונטה, אודה, פנטמטר יאמבי ועוד) והעמקת הסגנון — בדיוק כמו אצל
              משורר מוכר.
            </>
          ) : (
            <>
              מרמה {GRAMMAR_CURRICULUM[GRAMMAR_CURRICULUM.length - 1].level + 1} ואילך: כל כללי הדקדוק הבסיסיים כבר נלמדו. ההתקדמות ממשיכה
              דרך העשרת אוצר המילים, הארכת המשפטים והעמקת הסגנון הספרותי — בדיוק כמו בספרים אמיתיים.
            </>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    // This app used to register a separate sw.js file as a service worker.
    // That's exactly what made earlier fixes look like they "didn't work":
    // replacing index.html doesn't touch a service worker that's already
    // installed and controlling the page, so the browser kept serving
    // whatever the OLD worker had cached, indefinitely, until it was
    // manually cleared. (A service worker also can't be registered from an
    // inline script/Blob URL — browsers require a real same-origin file —
    // so "keep it inline" and "keep a service worker" aren't both possible
    // at once here.)
    //
    // Given everything should live in this one file, and the service
    // worker was the source of the caching bugs rather than something
    // actively needed, the fix is to drop it entirely — and to actively
    // unregister any worker a previous version of this page already
    // installed in this browser, so this class of bug can't resurface on
    // its own. This runs every time the page loads; once any old worker is
    // gone it's a fast no-op.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        regs.forEach((reg) => reg.unregister());
      }).catch(() => {});
      if (window.caches) {
        caches.keys().then((names) => {
          names.forEach((name) => caches.delete(name));
        }).catch(() => {});
      }
    }
  </script>
