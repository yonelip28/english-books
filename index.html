// ---------------------------------------------------------------------------
// Read aloud — uses the browser's built-in speech synthesis (SpeechSynthesis
// API): free, works offline, no API key or cost involved. Reads the current
// chapter's English text out loud, with play/pause/stop and a speed control.
// ---------------------------------------------------------------------------

// The chosen playback speed is persisted to localStorage (not just React
// state) because this component gets fully unmounted and remounted at
// several points during normal reading — most notably while a brand-new
// chapter is being generated, when the parent swaps in <StoryLoadingPage>
// in place of this button entirely (see StoryView's isGeneratingThisChapter
// branch) — as well as on page reload. A plain useState(1) would silently
// reset to the default rate every time that happens, even mid auto-read;
// reading from/writing to storage means whatever speed the reader last
// chose keeps being used across page turns, chapter turns, and newly
// generated chapters, exactly like it does within a single chapter today.
const TTS_RATE_STORAGE_KEY = "reading-room-tts-rate";
const TTS_RATE_OPTIONS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
function loadStoredTtsRate() {
  try {
    const v = parseFloat(window.localStorage.getItem(TTS_RATE_STORAGE_KEY));
    if (TTS_RATE_OPTIONS.includes(v)) return v;
  } catch (e) {
    // localStorage unavailable (private mode, etc.) — fall back silently.
  }
  return 1;
}
function storeTtsRate(newRate) {
  try {
    window.localStorage.setItem(TTS_RATE_STORAGE_KEY, String(newRate));
  } catch (e) {
    // Ignore — worst case the rate just doesn't persist this session.
  }
}

const ReadAloudButton = React.forwardRef(function ReadAloudButton({ text, color, onFinished, resolveText, onBoundary, onStatusChange, afterControls, pendingManualResumeRef }, ref) {
  const [status, setStatus] = useState("idle"); // idle | speaking | paused
  const [rate, setRate] = useState(loadStoredTtsRate);
  const supported = typeof window !== "undefined" && "speechSynthesis" in window;

  // Kept fresh every render so speakChunk (defined once, called async via
  // timers/events) always calls the CURRENT onFinished passed by the parent,
  // never a stale one captured from an earlier render.
  const onFinishedRef = useRef(onFinished);
  useEffect(() => {
    onFinishedRef.current = onFinished;
  }, [onFinished]);
  const resolveTextRef = useRef(resolveText);
  useEffect(() => {
    resolveTextRef.current = resolveText;
  }, [resolveText]);
  const onBoundaryRef = useRef(onBoundary);
  useEffect(() => {
    onBoundaryRef.current = onBoundary;
  }, [onBoundary]);

  useEffect(() => {
    if (typeof onStatusChange === "function") onStatusChange(status);
  }, [status, onStatusChange]);

  // Picks the best-sounding available English voice, instead of leaving it
  // to whatever the browser/device defaults to — device default voices are
  // often the flattest, most "robotic" option installed, while the same
  // device usually also has a considerably more natural-sounding one
  // available under the same language. Re-checked whenever the browser's
  // voice list (re)loads, since on many browsers it's empty at first and
  // only populates asynchronously.
  const voiceRef = useRef(null);
  useEffect(() => {
    if (!supported) return;
    function pickVoice() {
      const voices = window.speechSynthesis.getVoices() || [];
      const en = voices.filter((v) => v.lang && v.lang.toLowerCase().startsWith("en"));
      if (!en.length) return null;
      return (
        en.find((v) => /natural|neural|enhanced|wavenet|premium/i.test(v.name)) ||
        en.find((v) => v.lang.toLowerCase() === "en-us" && !v.localService) ||
        en.find((v) => v.lang.toLowerCase() === "en-us") ||
        en[0]
      );
    }
    voiceRef.current = pickVoice();
    function handleVoicesChanged() {
      voiceRef.current = pickVoice();
    }
    window.speechSynthesis.addEventListener("voiceschanged", handleVoicesChanged);
    return () => window.speechSynthesis.removeEventListener("voiceschanged", handleVoicesChanged);
  }, [supported]);

  // Long chapters (now up to ~7000 words) reliably break a single
  // SpeechSynthesisUtterance in most browsers — many engines silently stop
  // after ~15 seconds on one long utterance (a well-known Chrome bug), or
  // just refuse/truncate very long text outright. The fix is to split the
  // text into short chunks (see splitIntoChunks below) and speak each as
  // ONE continuous utterance — natural, normal-paced narration, never
  // word-by-word — queued back-to-back.
  //
  // The moving highlight (see speakChunk below) prefers the browser's own
  // real per-word "boundary" events whenever they fire, and only falls
  // back to a calibrated per-word timer for words it doesn't get real
  // events for — see the comment on speakChunk for exactly how the two
  // combine.
  const chunksRef = useRef([]);
  const chunkStartsRef = useRef([]);
  const chunkIndexRef = useRef(0);
  const stoppedRef = useRef(false);
  const simTimersRef = useRef([]);
  function clearSimTimers() {
    simTimersRef.current.forEach(clearTimeout);
    simTimersRef.current = [];
  }
  const msPerCharRef = useRef(65); // seed: ~65ms/char at rate 1 (~150 wpm, ~6.2 chars/word incl. space)
  // How many chunks have contributed a real timing measurement so far in
  // this reading session. Used to weight fresh measurements more heavily
  // early on (converging to this voice's real pace within the first
  // couple of clauses) and more gently once warmed up (so one atypical
  // clause later on doesn't swing an already-good estimate too far).
  const measureCountRef = useRef(0);
  const chunkStartTimeRef = useRef(0);

  const supportedRef = useRef(supported);
  useEffect(() => {
    supportedRef.current = supported;
  }, [supported]);

  // Chunk boundaries are every comma, period, semicolon, colon, and
  // sentence-ending mark — not just full sentences — so utterances stay
  // short. Every chunk boundary is also a recalibration point (see
  // speakChunk's onend below), so shorter, clause-level chunks mean drift
  // between the highlight and the actual audio gets corrected far more
  // often, keeping the two tightly matched all the way through, not just
  // once per (potentially long) sentence.
  //
  // This is a manual character scan, deliberately NOT a single regex
  // matched globally over the whole text: a regex built as an alternation
  // of "clause up to punctuation" vs "trailing text with no punctuation"
  // can fail to match at a given position (e.g. a delimiter immediately
  // followed by a closing quote, as in `"Tarzan!"` or `"Where are you?"` —
  // extremely common in dialogue) — and when the global regex simply finds
  // no match at a position, it silently skips forward to the next one that
  // matches, silently dropping the untouched text in between from both the
  // spoken queue AND the highlight. A manual scan can't skip characters:
  // every position is visited, so every character ends up in exactly one
  // chunk.
  function pushCapped(str, absStart, chunks, starts) {
    const trimmed = str.trim();
    if (!trimmed) return;
    if (trimmed.length <= 220) {
      const leadingWs = str.length - str.trimStart().length;
      chunks.push(trimmed);
      starts.push(absStart + leadingWs);
      return;
    }
    // Safety net only: an unusually long clause with no internal
    // punctuation (rare) is still capped, so no single utterance risks the
    // ~15s browser cutoff bug on very long text.
    let rest = str;
    let cursor = absStart;
    while (rest.trim().length > 220) {
      const leadingWs = rest.length - rest.trimStart().length;
      const body = rest.slice(leadingWs);
      let cut = body.lastIndexOf(" ", 220);
      if (cut <= 0) cut = 220;
      chunks.push(body.slice(0, cut).trim());
      starts.push(cursor + leadingWs);
      cursor += leadingWs + cut;
      rest = body.slice(cut);
    }
    if (rest.trim()) {
      const leadingWs = rest.length - rest.trimStart().length;
      chunks.push(rest.trim());
      starts.push(cursor + leadingWs);
    }
  }
  function splitIntoChunks(fullText) {
    const text = fullText || "";
    const chunks = [];
    const starts = [];
    const isDelim = (ch) => ch === "," || ch === "." || ch === "!" || ch === "?" || ch === ";" || ch === ":";
    // Closing quotes/brackets that can trail right after a delimiter
    // (the `!"` / `?"` case above) — these stay attached to the clause
    // they close, not pushed onto the start of the next one.
    const isCloser = (ch) => ch === '"' || ch === "'" || ch === "\u2019" || ch === "\u201D" || ch === ")" || ch === "]";
    const isSpace = (ch) => /\s/.test(ch);
    let start = 0;
    let i = 0;
    while (i < text.length) {
      if (isDelim(text[i])) {
        let j = i + 1;
        while (j < text.length && isDelim(text[j])) j++;
        while (j < text.length && isCloser(text[j])) j++;
        pushCapped(text.slice(start, j), start, chunks, starts);
        while (j < text.length && isSpace(text[j])) j++;
        start = j;
        i = j;
      } else {
        i++;
      }
    }
    if (start < text.length) {
      pushCapped(text.slice(start), start, chunks, starts);
    }
    return { chunks, starts };
  }

  // Finds the exact start offset of every "word" in the chunk — using the
  // SAME definition of "word" as ClickableText's own tokenizer
  // (/^[A-Za-z]+(?:'[A-Za-z]+)?$/). This match matters: a looser \S+ match
  // (any non-space run) would grab punctuation glued to a word — a leading
  // quote mark, an em dash before dialogue, a bracket — as part of the same
  // token, landing the highlight offset on that punctuation character
  // instead of on the actual word. ClickableText only ever highlights real
  // word-tokens (punctuation renders as its own separate, non-highlightable
  // token), so any such mismatch meant the highlight silently never landed
  // — systematically, on every word preceded by attached punctuation, which
  // in ordinary prose (quotation marks, dashes) is constant. Matching the
  // exact same regex guarantees every offset broadcast here corresponds to
  // a token ClickableText will actually light up.
  function wordStartsIn(chunkText) {
    const wordRe = /[A-Za-z]+(?:'[A-Za-z]+)?/g;
    const starts = [];
    let m;
    while ((m = wordRe.exec(chunkText))) starts.push(m.index);
    return starts;
  }

  // Drives the moving highlight for one chunk. Two sources feed it, and
  // real always wins over estimated:
  //  - REAL: the browser's own SpeechSynthesisUtterance "boundary" event,
  //    when it fires — the true instant that word starts being spoken.
  //    Supported inconsistently across browsers/voices (notably missing or
  //    partial on Android Chrome), so it can't be relied on alone.
  //  - ESTIMATED: a per-word timer seeded from msPerCharRef (character-
  //    based, so longer words get more time), scheduled the moment the
  //    chunk starts, as a baseline in case no real events arrive at all.
  // Whenever a real event DOES arrive, it (a) fires that word immediately
  // instead of waiting for its timer, and (b) re-times every word still
  // pending in this same chunk using the pace just observed — so on a
  // browser that does support boundary events the highlight locks onto the
  // true audio word-for-word, and on one that doesn't, the estimate simply
  // carries on uninterrupted. Either way, onend (below) guarantees the
  // chunk's last word is caught up by the moment its audio truly ends.
  function speakChunk(i, rateToUse) {
    if (!supportedRef.current || stoppedRef.current) return;
    const chunks = chunksRef.current;
    if (i >= chunks.length) {
      setStatus("idle");
      if (!stoppedRef.current && typeof onFinishedRef.current === "function") {
        onFinishedRef.current();
      }
      return;
    }
    const chunkText = chunks[i];
    const chunkStart = chunkStartsRef.current[i] || 0;
    const wordStarts = wordStartsIn(chunkText);
    const utter = new SpeechSynthesisUtterance(chunkText);
    utter.lang = "en-US";
    utter.rate = rateToUse;
    if (voiceRef.current) utter.voice = voiceRef.current;
    // A small lift over flat/neutral (1.0), for narration that reads a
    // little more like storytelling and a little less like a dry technical
    // readout — subtle enough not to sound artificial or affect timing.
    utter.pitch = 1.05;

    let utteranceStartTime = 0;
    // word index -> its pending fallback timer id; removed once fired
    // (by the timer OR by a real boundary event for that word), so a word
    // is never signaled twice.
    const pending = new Map();
    function scheduleWord(idx, delayMs) {
      const t = setTimeout(() => {
        if (stoppedRef.current || !pending.has(idx)) return;
        pending.delete(idx);
        if (typeof onBoundaryRef.current === "function") {
          onBoundaryRef.current(chunkStart + wordStarts[idx]);
        }
      }, Math.max(0, delayMs));
      pending.set(idx, t);
      simTimersRef.current.push(t);
    }

    utter.onstart = () => {
      if (stoppedRef.current) return;
      utteranceStartTime = performance.now();
      chunkStartTimeRef.current = utteranceStartTime;
      const msPerChar = Math.max(15, msPerCharRef.current);
      wordStarts.forEach((charIndex, idx) => scheduleWord(idx, charIndex * msPerChar));
    };
    utter.onboundary = (event) => {
      if (stoppedRef.current) return;
      if (event.name && event.name !== "word") return;
      const charIndex = event.charIndex || 0;
      let idx = -1;
      for (let k = wordStarts.length - 1; k >= 0; k--) {
        if (wordStarts[k] <= charIndex) {
          idx = k;
          break;
        }
      }
      if (idx === -1 || !pending.has(idx)) return; // already fired, or no matching word
      clearTimeout(pending.get(idx));
      pending.delete(idx);
      if (typeof onBoundaryRef.current === "function") {
        onBoundaryRef.current(chunkStart + wordStarts[idx]);
      }
      const elapsed = performance.now() - utteranceStartTime;
      if (charIndex <= 0 || elapsed <= 0) return;
      const observedMsPerChar = elapsed / charIndex;
      const w = measureCountRef.current < 3 ? 0.75 : 0.3; // converge fast at first, then stabilize
      msPerCharRef.current = msPerCharRef.current * (1 - w) + observedMsPerChar * w;
      measureCountRef.current += 1;
      // Re-time every word still waiting in this chunk against the pace
      // just observed, so accuracy keeps improving word by word rather
      // than only once at the very end.
      const stillPending = Array.from(pending.keys());
      stillPending.forEach((wIdx) => {
        clearTimeout(pending.get(wIdx));
        pending.delete(wIdx);
      });
      stillPending.forEach((wIdx) => {
        const predictedAbs = wordStarts[wIdx] * observedMsPerChar;
        scheduleWord(wIdx, predictedAbs - elapsed);
      });
    };
    utter.onend = () => {
      if (stoppedRef.current) return;
      pending.forEach((timerId) => clearTimeout(timerId));
      pending.clear();
      // By the time the chunk's audio has actually finished, jump the
      // highlight straight to its last word if it hasn't landed there yet
      // — so the marking always finishes exactly together with the speech
      // itself, every single chunk, regardless of any residual drift.
      if (wordStarts.length && typeof onBoundaryRef.current === "function") {
        onBoundaryRef.current(chunkStart + wordStarts[wordStarts.length - 1]);
      }
      // Refine the pace estimate (used to seed the NEXT chunk, and as the
      // fallback whenever real boundary events don't show up at all) from
      // how long this chunk actually took, smoothed against the running
      // average so one unusually punctuation-heavy or short chunk doesn't
      // swing it too far.
      const elapsed = performance.now() - utteranceStartTime;
      if (chunkText.length > 0 && elapsed > 0) {
        const measured = elapsed / chunkText.length;
        const w = measureCountRef.current < 3 ? 0.75 : 0.5; // converge fast at first, then stabilize
        msPerCharRef.current = msPerCharRef.current * (1 - w) + measured * w;
        measureCountRef.current += 1;
      }
      chunkIndexRef.current = i + 1;
      speakChunk(i + 1, rateToUse);
    };
    utter.onerror = () => {
      if (stoppedRef.current) return;
      pending.forEach((timerId) => clearTimeout(timerId));
      pending.clear();
      // Skip a chunk that errored rather than dying silently, so one bad
      // chunk doesn't just stop the whole reading with no feedback.
      chunkIndexRef.current = i + 1;
      speakChunk(i + 1, rateToUse);
    };
    window.speechSynthesis.speak(utter);
  }

  useEffect(() => {
    // Chapter text changed (or component unmounted) — stop and reset.
    stoppedRef.current = true;
    clearSimTimers();
    if (supported) window.speechSynthesis.cancel();
    const built = splitIntoChunks(text);
    chunksRef.current = built.chunks;
    chunkStartsRef.current = built.starts;
    chunkIndexRef.current = 0;
    setStatus("idle");
    return () => {
      stoppedRef.current = true;
      clearSimTimers();
      if (supported) window.speechSynthesis.cancel();
    };
  }, [text]);

  function play() {
    if (!supported) return;
    stoppedRef.current = false;
    clearSimTimers();
    msPerCharRef.current = 65 / (rate || 1); // fresh baseline scaled to the chosen rate; self-corrects after chunk 1
    measureCountRef.current = 0; // fresh session — converge to real pace fast again
    window.speechSynthesis.cancel();
    const startText = typeof resolveTextRef.current === "function" ? resolveTextRef.current() || text : text;
    const built = splitIntoChunks(startText);
    chunksRef.current = built.chunks;
    chunkStartsRef.current = built.starts;
    chunkIndexRef.current = 0;
    speakChunk(0, rate);
    setStatus("speaking");
  }
  // Pause/resume deliberately avoid the browser's native
  // speechSynthesis.pause()/resume() — on many mobile browsers (notably
  // Android Chrome) these are unreliable: pause() can silently kill the
  // utterance for good, or resume() can leave it stuck with no way to
  // tell it never actually restarted. Instead, pause cancels the current
  // utterance outright (interrupting mid-chunk) and resume just re-speaks
  // the same chunk from its start — same cancel-and-respeak approach
  // changeRate uses below. It may repeat a few words of the current
  // sentence, but it reliably continues every time.
  function pause() {
    if (!supported) return;
    stoppedRef.current = true;
    clearSimTimers();
    window.speechSynthesis.cancel();
    setStatus("paused");
  }
  function resume() {
    if (!supported) return;
    // The reader tapped a different word while paused (resolveText, passed
    // in via the resolveText prop, is what actually reads/consumes this
    // same ref) — honor that by starting a fresh read from there instead of
    // literally continuing the old chunk queue from wherever it paused.
    if (pendingManualResumeRef && pendingManualResumeRef.current) {
      play();
      return;
    }
    stoppedRef.current = false;
    window.speechSynthesis.cancel();
    speakChunk(chunkIndexRef.current, rate);
    setStatus("speaking");
  }
  function stop() {
    if (!supported) return;
    stoppedRef.current = true;
    clearSimTimers();
    window.speechSynthesis.cancel();
    chunkIndexRef.current = 0;
    setStatus("idle");
  }
  function changeRate(newRate) {
    // Rescale the learned pace estimate immediately by the ratio of old to
    // new rate, so the highlight speed jumps right away instead of waiting
    // for the next chunk to self-correct it.
    msPerCharRef.current = (msPerCharRef.current * (rate || 1)) / (newRate || 1);
    setRate(newRate);
    storeTtsRate(newRate);
    if (status !== "idle") {
      stoppedRef.current = false;
      clearSimTimers();
      window.speechSynthesis.cancel();
      speakChunk(chunkIndexRef.current, newRate);
      setStatus("speaking");
    }
  }


  React.useImperativeHandle(ref, () => ({ play, pause, resume, stop }));

  if (!supported) return null;

  return (
    <>
      {status === "idle" && (
        <SecondaryButton onClick={play} style={{ padding: "6px 7px", fontSize: 11.5, flexShrink: 0, whiteSpace: "nowrap" }}>
          <AppIcon name="Play" size={12} />
          הקראה
        </SecondaryButton>
      )}
      {status === "speaking" && (
        <SecondaryButton onClick={pause} style={{ background: `${color}18`, borderColor: color, color, padding: "6px 7px", fontSize: 11.5, flexShrink: 0, whiteSpace: "nowrap" }}>
          <AppIcon name="Pause" size={12} />
          השהיה
        </SecondaryButton>
      )}
      {status === "paused" && (
        <SecondaryButton onClick={resume} style={{ background: `${color}18`, borderColor: color, color, padding: "6px 7px", fontSize: 11.5, flexShrink: 0, whiteSpace: "nowrap" }}>
          <AppIcon name="Play" size={12} />
          המשך
        </SecondaryButton>
      )}
      {status !== "idle" && (
        <SecondaryButton onClick={stop} style={{ padding: "6px 6px", fontSize: 11.5, flexShrink: 0 }}>
          <AppIcon name="X" size={12} />
        </SecondaryButton>
      )}
      {afterControls}
      <div style={{ display: "flex", alignItems: "center", gap: 2, flexWrap: "nowrap", flex: "1 1 0%", minWidth: 0, overflow: "hidden", justifyContent: "flex-end" }}>
        {TTS_RATE_OPTIONS.map((r) => (
          <button
            key={r}
            onClick={() => changeRate(r)}
            title={`מהירות ×${r}`}
            style={{
              flexShrink: 1,
              minWidth: 0,
              border: `1.5px solid ${rate === r ? "var(--ink)" : "var(--line-strong)"}`,
              background: rate === r ? "var(--ink)" : "transparent",
              color: rate === r ? "var(--paper)" : "var(--ink)",
              borderRadius: 999,
              padding: "3px 5px",
              fontSize: 10,
              fontWeight: 600,
              cursor: "pointer",
              fontFamily: "'IBM Plex Mono', monospace",
              whiteSpace: "nowrap",
            }}
          >
            {r}
          </button>
        ))}
      </div>
    </>
  );
});

// ---------------------------------------------------------------------------
// Print / export the whole book (all generated chapters at once) as a nicely
// formatted document — uses the browser's native print dialog ("Save as PDF"),
// so it needs no extra libraries and works everywhere.
// ---------------------------------------------------------------------------

function escapeHtml(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Builds a chapter's printed body HTML, interleaving any PDF-extracted
// inline images (see chapter.pdfImages) at their exact character offset
// within `content` — walking the same `\n+` paragraph boundaries the plain
// (no-images) path below splits on, so a chapter with no images produces
// byte-identical output to before.
function chapterBodyHtml(content, pdfImages) {
  if (!pdfImages || !pdfImages.length) {
    return content
      .split(/\n+/)
      .filter((p) => p.trim())
      .map((p, pi) => `<p class="${pi === 0 ? "chapter-open" : ""}">${escapeHtml(p)}</p>`)
      .join("");
  }
  const sorted = [...pdfImages].sort((a, b) => a.offset - b.offset);
  let imgIdx = 0;
  let html = "";
  let pi = 0;
  let cursor = 0;
  const flushImagesUpTo = (offset) => {
    while (imgIdx < sorted.length && sorted[imgIdx].offset <= offset) {
      html += `<img src="${escapeHtml(sorted[imgIdx].dataUrl)}" style="width:100%;max-height:520px;object-fit:contain;border-radius:8px;margin:18px 0;" />`;
      imgIdx++;
    }
  };
  const re = /\n+/g;
  let m;
  while ((m = re.exec(content))) {
    flushImagesUpTo(cursor);
    const para = content.slice(cursor, m.index);
    if (para.trim()) {
      html += `<p class="${pi === 0 ? "chapter-open" : ""}">${escapeHtml(para)}</p>`;
      pi++;
    }
    cursor = re.lastIndex;
  }
  flushImagesUpTo(cursor);
  const last = content.slice(cursor);
  if (last.trim()) html += `<p class="${pi === 0 ? "chapter-open" : ""}">${escapeHtml(last)}</p>`;
  flushImagesUpTo(content.length);
  return html;
}

function printStory(story, category, readingPrefs) {
  // Web-imported articles are never printable — the text and images belong
  // to whoever originally published them, not to this reader. This check is
  // deliberately here (not just a hidden button) so calling this function
  // any other way can't bypass it either.
  if (story.categoryId === "webImport") {
    alert("אי אפשר להדפיס כתבה שיובאה מקישור — הזכויות על הטקסט והתמונות שייכות לאתר המקורי בלבד.");
    return;
  }
  const prefs = readingPrefs || defaultReadingPrefs();
  const showCover = bookHasCover(story, prefs);
  const bodyFontFamily = (READING_FONTS[prefs.fontFamily] || READING_FONTS.lora).family;
  const dropCapColor = dropCapColorFor(story, prefs.background, category.color);

  // Keep each chapter's TRUE index (its real chapter number) even though we
  // only print the ones actually written — sparse arrays (new-format
  // stories written out of order) may have gaps, and the printed "CHAPTER
  // N" heading must reflect the real position, not its position in this
  // filtered list.
  const writtenChapters = story.chapters.map((ch, i) => (ch ? { ...ch, realIndex: i } : null)).filter(Boolean);
  const chaptersHtml = writtenChapters
    .map((ch, i) => {
      const imgHtml =
        ch.imageStatus === "done" && ch.image
          ? `<img src="${escapeHtml(ch.image)}" style="width:100%;max-height:440px;object-fit:cover;border-radius:8px;margin:18px 0;" />`
          : "";
      const titleAlreadyNumbered = /^chapter\s+\S+\s*[:.\-–]/i.test((ch.title || "").trim());
      const titleHtml =
        story.totalChapters > 1
          ? `${titleAlreadyNumbered ? "" : `<div class="chapter-label">${chapterHeading(ch.realIndex + 1)}</div>`}<h2 id="chapter-${ch.realIndex}">${escapeHtml(ch.title)}</h2>`
          : "";
      const bodyHtml = chapterBodyHtml(ch.content, ch.pdfImages);
      return `<section style="${i > 0 ? "page-break-before: always;" : ""}">${titleHtml}${imgHtml}${bodyHtml}</section>`;
    })
    .join("");

  const notice =
    writtenChapters.length < story.totalChapters
      ? `<div class="notice">מכיל ${writtenChapters.length} מתוך ${story.totalChapters} פרקים שנוצרו עד כה בספר זה.</div>`
      : "";

  // A table of contents page, printed on its own, between the front cover
  // and the story itself — only makes sense once there's more than one
  // chapter to list.
  const tocHtml =
    story.totalChapters > 1 && writtenChapters.length > 0
      ? `<section class="toc" style="page-break-after: always;">
           <div class="toc-title">Table of Contents</div>
           <ol class="toc-list">
             ${writtenChapters
               .map(
                 (ch) =>
                   `<li><a href="#chapter-${ch.realIndex}"><span class="toc-num">${chapterHeading(ch.realIndex + 1)}</span><span class="toc-chapter-title">${escapeHtml(
                     ch.title || ""
                   )}</span></a></li>`
               )
               .join("")}
           </ol>
         </section>`
      : "";

  // Front/back cover pages for the exported document — same rule as the
  // in-app reader: a real imported cover image if one exists, otherwise a
  // generated title/blurb page using the exact same fonts as the in-app
  // cover (Libre Baskerville for the title, EB Garamond for the tagline/
  // blurb, IBM Plex Mono for the small caps credit line) so print matches
  // what's shown on screen.
  const credit = coverCreditLine(story, category);
  const coverPageStyle =
    "page-break-after: always; min-height: 90vh; display:flex; flex-direction:column; align-items:center; justify-content:space-between; text-align:center; background:linear-gradient(160deg,#2b1210 0%,#6e2a1c 45%,#8a3a20 100%); color:#f6d98a; border-radius:10px; padding:40px 24px;";
  const frontCoverHtml = showCover
    ? story.frontCoverImage
      ? `<section style="page-break-after: always;"><img src="${escapeHtml(story.frontCoverImage)}" style="width:100%;display:block;" /></section>`
      : `<section style="${coverPageStyle}">
           <div class="cover-label">FRONT COVER</div>
           <div>
             <div style="font-family:'Libre Baskerville',Georgia,serif;font-size:30px;font-weight:700;">${escapeHtml(story.storyTitle)}</div>
             ${story.tagline ? `<div style="margin-top:16px;font-family:'EB Garamond',serif;font-style:italic;font-size:14px;color:#f2e2c0;max-width:360px;">${escapeHtml(story.tagline)}</div>` : ""}
           </div>
           <div class="cover-credit">${escapeHtml(credit)}</div>
         </section>`
    : "";
  const backCoverHtml = showCover
    ? story.backCoverImage
      ? `<section style="page-break-before: always;"><img src="${escapeHtml(story.backCoverImage)}" style="width:100%;display:block;" /></section>`
      : `<section style="${coverPageStyle} page-break-before: always;">
           <div class="cover-label">BACK COVER</div>
           <div>
             <div style="font-family:'EB Garamond',serif;font-style:italic;font-size:16px;max-width:380px;">${escapeHtml(story.tagline || story.storyTitle)}</div>
             <div style="margin-top:16px;font-size:14px;color:#f2e2c0;max-width:380px;">${escapeHtml(
               `הספר "${story.storyTitle}" עוסק ב${story.subtopic || category.tagline}. סיפור מתוך ${category.name}.`
             )}</div>
           </div>
           <div class="cover-credit">${escapeHtml(credit)}</div>
         </section>`
    : "";

  const html = `<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>${escapeHtml(story.storyTitle)}</title>
<style>
  body { font-family: ${bodyFontFamily}; max-width: 720px; margin: 40px auto; line-height: 1.75; color: #222; direction: ltr; }
  h1 { font-family: 'Frank Ruhl Libre', ${bodyFontFamily}; font-size: 32px; margin-bottom: 4px; }
  .tagline { font-family: 'EB Garamond', serif; font-style: italic; color: #555; margin-bottom: 4px; }
  .source { font-size: 13px; color: ${category.color}; margin-bottom: 10px; }
  .notice { font-size: 12px; color: #a06010; background: #fff6e6; border: 1px solid #f0d090; border-radius: 6px; padding: 8px 12px; margin-bottom: 30px; direction: rtl; text-align: right; }
  .chapter-label { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: ${category.color}; margin-bottom: 4px; }
  h2 { font-family: 'Frank Ruhl Libre', serif; font-size: 22px; font-weight: 700; margin-top: 10px; border-bottom: 1px solid #ccc; padding-bottom: 6px; }
  p { margin: 0 0 14px 0; text-align: justify; }
  /* Drop cap on the first paragraph of each chapter — same treatment as the in-app reader. */
  p.chapter-open::first-letter {
    float: left;
    font-family: 'EB Garamond', serif;
    font-weight: 700;
    font-size: 3em;
    line-height: 0.82;
    color: ${dropCapColor};
    padding: 0.09em 0.06em 0 0.01em;
  }
  .cover-label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #f2c879; }
  .cover-credit { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: rgba(246,217,138,0.85); }
  .toc-title { font-family: 'Frank Ruhl Libre', serif; font-size: 26px; font-weight: 700; margin-bottom: 26px; text-align: center; }
  .toc-list { list-style: none; margin: 0; padding: 0; }
  .toc-list li { border-bottom: 1px dotted #ccc; padding: 10px 0; }
  .toc-list a { display: flex; justify-content: space-between; gap: 14px; color: #222; text-decoration: none; }
  .toc-num { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: ${category.color}; flex-shrink: 0; }
  .toc-chapter-title { font-family: 'Frank Ruhl Libre', serif; text-align: left; flex: 1; }
  @media print { section { break-inside: avoid-page; } a { color: inherit; text-decoration: none; } }
</style></head>
<body>
  ${frontCoverHtml}
  ${tocHtml}
  <h1>${escapeHtml(story.storyTitle)}</h1>
  <div class="tagline">${escapeHtml(story.tagline || "")}</div>
  ${story.source ? `<div class="source">Based on: ${escapeHtml(story.source)}</div>` : ""}
  ${notice}
  ${chaptersHtml}
  ${backCoverHtml}
</body></html>`;

  const win = window.open("", "_blank");
  if (!win) {
    alert("הדפדפן חסם את חלון ההדפסה — אפשרו חלונות קופצים באתר הזה ונסו שוב.");
    return;
  }
  win.document.open();
  win.document.write(html);
  win.document.close();
  const doPrint = () => {
    try {
      win.focus();
      win.print();
    } catch (e) {
      /* ignore */
    }
  };
  win.onload = doPrint;
  setTimeout(doPrint, 600); // fallback in case onload doesn't fire (some browsers)
}

// Splits chapter text into sentence-respecting "pages" of roughly wordsPerPage
// words each, for classic page-by-page reading mode.
//
// Walks the sentence-boundary regex manually (instead of content.match())
// and glues any unmatched gap onto the following (or, for a trailing gap,
// the preceding) sentence. content.match() alone silently DROPS any text
// where the pattern can't find a clean "[.!?] immediately followed by
// whitespace/end" boundary — which happens constantly in real books, e.g.
// dialogue like `"Said Harry blankly."` where the closing quote sits right
// against the period with no space after it. That previously erased whole
// lines (often exactly the first/last lines of a chapter) with no error,
// visible only in pagination mode since scroll mode renders chapter.content
// directly and never goes through this function.
function splitIntoPages(content, wordsPerPage) {
  const re = /[^.!?]+[.!?]+(?:\s+|$)/g;
  const sentences = [];
  let lastEnd = 0;
  let m;
  while ((m = re.exec(content)) !== null) {
    if (m.index > lastEnd) {
      // Unmatched gap right before this match (e.g. text ending in a quote
      // right after terminal punctuation) — keep it by prefixing it to this
      // sentence instead of letting content.match() silently discard it.
      sentences.push(content.slice(lastEnd, m.index) + m[0]);
    } else {
      sentences.push(m[0]);
    }
    lastEnd = re.lastIndex;
    if (m[0].length === 0) re.lastIndex++; // guard against a zero-length match looping forever
  }
  if (lastEnd < content.length) {
    // Trailing leftover with no terminal punctuation at all (common at a
    // chapter's very last line) — append to the last sentence rather than
    // dropping it, or start a new one if there was no earlier match.
    if (sentences.length) sentences[sentences.length - 1] += content.slice(lastEnd);
    else sentences.push(content.slice(lastEnd));
  }
  if (!sentences.length) sentences.push(content);

  const pages = [];
  let current = "";
  let words = 0;
  for (const sentence of sentences) {
    const sWords = sentence.trim().split(/\s+/).filter(Boolean).length;
    if (words + sWords > wordsPerPage && current) {
      pages.push(current);
      current = "";
      words = 0;
    }
    current += sentence;
    words += sWords;
  }
  if (current) pages.push(current);
  return pages.length ? pages : [content];
}

function splitAtMidpoint(content) {
  const sentences = content.match(/[^.!?]+[.!?]+(\s+|$)/g) || [content];
  if (sentences.length <= 1) return [content, ""];
  const totalLen = content.length;
  let acc = "";
  let cut = Math.ceil(sentences.length / 2);
  for (let i = 0; i < sentences.length; i++) {
    acc += sentences[i];
    if (acc.length >= totalLen / 2) {
      cut = i + 1;
      break;
    }
  }
  cut = Math.min(Math.max(cut, 1), sentences.length - 1 || sentences.length);
  return [sentences.slice(0, cut).join(""), sentences.slice(cut).join("")];
}

// Small floating status widget shown whenever the app is waiting on the AI
// (new stories, new chapters, translations, etc.). Deliberately NOT a
// full-screen blocking modal: it floats near the bottom of the screen, over
// a transparent/click-through background, so the reader can keep browsing —
// switch tabs, open a different chapter, read the library — while this
// keeps working in the background. It shows a real progress ring (percent
// complete) and a plain-language time estimate ("about 20 seconds left")
// instead of internal retry/attempt counters, which the reader never asked
// about and can't do anything with.
function useLoadingProgress(estimateSeconds, startedAt) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    if (!startedAt) return;
    const id = setInterval(() => setNow(Date.now()), 350);
    return () => clearInterval(id);
  }, [startedAt]);
  if (!startedAt || !estimateSeconds) return { percent: null, remainingLabel: null };
  const elapsed = Math.max(0, (now - startedAt) / 1000);
  const est = Math.max(estimateSeconds, 3);
  // Approaches ~96% as elapsed passes the estimate, but never claims 100%
  // until the work is actually done (the caller clears the overlay then) —
  // an honest "almost there" rather than a bar that lies about being finished.
  const tau = est / 2.6;
  const percent = Math.min(96, Math.round(100 * (1 - Math.exp(-elapsed / tau))));
  const remaining = est - elapsed;
  let remainingLabel;
  if (remaining > 90) remainingLabel = `עוד כ-${Math.ceil(remaining / 60)} דקות`;
  else if (remaining > 45) remainingLabel = `עוד כדקה`;
  else if (remaining > 4) remainingLabel = `עוד כ-${Math.ceil(remaining)} שניות`;
  else remainingLabel = `כמעט מוכן…`;
  return { percent, remainingLabel };
}

// A small hand-drawn-style decorative illustration for the loading page —
// evokes a story being assembled piece by piece, in the same pencil-and-ink
// engraving spirit as the app's chapter illustrations (see ILLUSTRATION_STYLE),
// rather than a generic spinner. Pure line art so it inherits the category
// color and sits comfortably on the paper background.
function LoadingBookArt({ color = "#23342E", size = 108 }) {
  const bars = [
    { x: 4, h: 30 },
    { x: 22, h: 52 },
    { x: 40, h: 20 },
    { x: 64, h: 42 },
    { x: 82, h: 16 },
    { x: 100, h: 60 },
  ];
  const baseline = 78;
  return (
    <svg viewBox="0 0 118 90" width={size} height={Math.round((size * 90) / 118)} fill="none" aria-hidden="true">
      <defs>
        <pattern id="loading-hatch" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="4" stroke={color} strokeWidth="0.6" opacity="0.5" />
        </pattern>
      </defs>
      {bars.map((b, i) => (
        <rect
          key={i}
          x={b.x}
          y={baseline - b.h}
          width="14"
          height={b.h}
          rx="1.5"
          fill="url(#loading-hatch)"
          stroke={color}
          strokeWidth="1.4"
          opacity={0.85}
        />
      ))}
      <line x1="1" y1={baseline} x2="117" y2={baseline} stroke={color} strokeWidth="1.6" strokeLinecap="round" />
    </svg>
  );
}

// A few honest, friendly status lines that rotate as generation actually
// takes longer — this is deliberate: since chapters now go through several
// real passes (writing, word-count top-up, a final editorial review), the
// wait is genuinely longer than it used to be, and the loading page should
// say so plainly rather than leaving the reader staring at a bare spinner.
function useLoadingSubtitle(startedAt) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    if (!startedAt) return;
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, [startedAt]);
  if (!startedAt) return "רק רגע…";
  const elapsed = (now - startedAt) / 1000;
  if (elapsed < 6) return "מתכננים את התוכן…";
  if (elapsed < 18) return "כותבים את הפרק, שורה אחר שורה…";
  if (elapsed < 32) return "הפרק ארוך ולוקח קצת זמן — רוצים שהוא יצא טוב…";
  return "כמעט מוכן…";
}

// Full in-page loading state for when the reader is already sitting on the
// exact story+chapter that's still being generated — replaces what would
// otherwise be an empty, content-less chapter page. Same progress ring/
// timing logic as the floating LoadingOverlay, just laid out as a proper,
// good-looking page (a raised paper card, a small decorative illustration,
// a status line that updates honestly as the wait goes on) instead of a bare
// spinner, since here it IS the page.
function StoryLoadingPage({ story, category, chapterIndex, job, onBack }) {
  const estimateSeconds = job?.estimateSeconds ?? null;
  const startedAt = job?.startedAt ?? null;
  const { percent, remainingLabel } = useLoadingProgress(estimateSeconds, startedAt);
  const subtitle = useLoadingSubtitle(startedAt);
  const accent = category?.color || "var(--ink, #23342E)";
  const ringSize = 72;
  const stroke = 5;
  const r = (ringSize - stroke) / 2;
  const circumference = 2 * Math.PI * r;
  const dash = percent == null ? circumference * 0.72 : (circumference * percent) / 100;
  // Only the chapter NUMBER (never its title, or the story's title) is
  // shown here — this page covers a specific pick the reader hasn't
  // necessarily "arrived" at on purpose (e.g. a fresh surprise pick), and
  // both would spoil content they haven't reached yet.
  const headline = job?.chapterNumber ? `כותבים את פרק ${job.chapterNumber.toLocaleString("he")}…` : "טוען…";
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", marginBottom: 18 }}>
        <SecondaryButton onClick={onBack} style={{ padding: "7px 12px", fontSize: 13 }}>
          חזרה
        </SecondaryButton>
      </div>
      <div
        style={{
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          gap: 16,
          padding: "44px 24px",
          textAlign: "center",
          background: "var(--paper-raised, #fff)",
          border: "1px solid var(--line, #ddd)",
          borderRadius: 20,
          boxShadow: "0 10px 30px rgba(35,52,46,0.08)",
        }}
      >
        <div style={{ opacity: 0.9 }}>
          <LoadingBookArt color={accent} />
        </div>
        <div style={{ position: "relative", width: ringSize, height: ringSize }}>
          <svg width={ringSize} height={ringSize} style={{ transform: "rotate(-90deg)" }}>
            <circle cx={ringSize / 2} cy={ringSize / 2} r={r} fill="none" stroke="rgba(35,52,46,0.15)" strokeWidth={stroke} />
            <circle
              cx={ringSize / 2}
              cy={ringSize / 2}
              r={r}
              fill="none"
              stroke={accent}
              strokeWidth={stroke}
              strokeLinecap="round"
              strokeDasharray={`${dash} ${circumference}`}
              style={{
                transition: "stroke-dasharray 0.35s linear",
                // CSS transforms on an inner SVG shape rotate around the
                // SVG viewport's corner by default, not the shape's own
                // center — that's what made this ring visibly swing out
                // past its own circle while spinning. Anchoring the
                // transform to the shape's own bounding box fixes that.
                ...(percent == null
                  ? { animation: "spin 0.8s linear infinite", transformBox: "fill-box", transformOrigin: "center" }
                  : {}),
              }}
            />
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
            {percent != null ? <span style={{ fontSize: 16, fontWeight: 700 }}>{percent}%</span> : <AppIcon name="BookOpen" size={24} />}
          </div>
        </div>
        <div style={{ fontFamily: "'Assistant', sans-serif", fontWeight: 700, fontSize: 16 }}>{headline}</div>
        <div style={{ fontSize: 13, color: "#5c665f", minHeight: 16 }}>{subtitle}</div>
        {job?.note && <div style={{ fontSize: 12, color: "#8a938c" }}>{job.note}</div>}
        {remainingLabel && <div style={{ fontSize: 12, color: "#8a938c" }}>{remainingLabel}</div>}
        {story && (
          // Only the level is shown here — never the story's title or a
          // chapter's title. Both would spoil content the reader hasn't
          // reached yet, which is exactly what this loading screen should
          // not do while they're staring right at it.
          <div style={{ marginTop: 4, borderTop: "1px dashed var(--line, #ddd)", paddingTop: 12, width: "100%" }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: accent }}>רמה {story.level}</div>
          </div>
        )}
      </div>
    </div>
  );
}

// Shows the still-relevant loading jobs (in-progress or freshly done) as ONE
// small floating card at a time — never stacking several on top of each
// other and eating into the screen — with a tiny pager underneath when more
// than one exists, so the reader can flip between whichever generations
// they've stepped away from.
function LoadingOverlayStack({ jobs, onOpen, onDismiss }) {
  const [pageIndex, setPageIndex] = useState(0);
  if (!jobs || jobs.length === 0) return null;
  const clampedIndex = Math.min(pageIndex, jobs.length - 1);
  const job = jobs[clampedIndex];
  return (
    <div
      style={{
        position: "fixed",
        left: "50%",
        // Raised well above the screen's very bottom edge (rather than
        // hugging it) so it doesn't end up hidden behind the "Powered by
        // Netlify" watermark badge that some deploys render fixed at the
        // bottom of the viewport.
        bottom: "calc(60px + env(safe-area-inset-bottom, 0px))",
        transform: "translateX(-50%)",
        zIndex: 40,
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        gap: 6,
      }}
    >
      <LoadingOverlayCard job={job} onTap={() => onOpen(job.id)} onDismiss={() => onDismiss(job.id)} />
      {jobs.length > 1 && (
        <div
          style={{
            display: "flex",
            alignItems: "center",
            gap: 10,
            background: "var(--paper-raised, #fff)",
            border: "1px solid var(--line, #ddd)",
            borderRadius: 999,
            padding: "3px 6px",
            boxShadow: "0 4px 12px rgba(35,52,46,0.14)",
            pointerEvents: "auto",
          }}
        >
          <button
            onClick={() => setPageIndex((i) => (i - 1 + jobs.length) % jobs.length)}
            aria-label="הקודם"
            style={{ background: "none", border: "none", color: "var(--ink)", cursor: "pointer", padding: 4, display: "flex" }}
          >
            <AppIcon name="ChevronRight" size={13} />
          </button>
          <span style={{ fontSize: 11, fontFamily: "'IBM Plex Mono', monospace", color: "#5c665f", minWidth: 24, textAlign: "center" }}>
            {clampedIndex + 1}/{jobs.length}
          </span>
          <button
            onClick={() => setPageIndex((i) => (i + 1) % jobs.length)}
            aria-label="הבא"
            style={{ background: "none", border: "none", color: "var(--ink)", cursor: "pointer", padding: 4, display: "flex" }}
          >
            <AppIcon name="ChevronLeft" size={13} />
          </button>
        </div>
      )}
    </div>
  );
}

function LoadingOverlayCard({ job, onTap, onDismiss }) {
  const { percent, remainingLabel } = useLoadingProgress(job.estimateSeconds, job.startedAt);
  const ringSize = 40;
  const stroke = 3.5;
  const r = (ringSize - stroke) / 2;
  const circumference = 2 * Math.PI * r;
  const cardStyle = {
    // No full-screen backdrop and no fixed/inset:0 here — the wrapper above
    // is the one pinned to the screen; this never captures clicks outside
    // its own small card, so everything behind it (nav, buttons, the page
    // itself) stays fully usable while this keeps working.
    pointerEvents: "auto",
    maxWidth: "min(360px, calc(100vw - 24px))",
    background: "var(--paper-raised, #fff)",
    border: "1px solid var(--line, #ddd)",
    borderRadius: 16,
    boxShadow: "0 6px 20px rgba(35,52,46,0.18)",
    padding: "10px 14px",
    display: "flex",
    alignItems: "center",
    gap: 12,
  };

  // Finished state: doesn't auto-clear like the in-progress card does — it
  // stays exactly like a completed download notification (full ring, the
  // story's name, a button to jump straight in) until the reader taps it
  // or dismisses it with the ×, since they may well still be busy reading
  // something else and don't want the app to yank them away automatically.
  if (job.done) {
    return (
      <div style={{ ...cardStyle, cursor: "pointer" }} onClick={onTap}>
        <div style={{ position: "relative", width: ringSize, height: ringSize, flexShrink: 0 }}>
          <svg width={ringSize} height={ringSize}>
            <circle cx={ringSize / 2} cy={ringSize / 2} r={r} fill="none" stroke="var(--ink, #23342E)" strokeWidth={stroke} />
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <AppIcon name="Check" size={18} color="var(--ink)" />
          </div>
        </div>
        <div style={{ minWidth: 0, flex: 1 }}>
          <div
            style={{
              fontFamily: "'Assistant', sans-serif",
              fontWeight: 600,
              fontSize: 13.5,
              overflow: "hidden",
              textOverflow: "ellipsis",
              whiteSpace: "nowrap",
            }}
          >
            מוכן! 100%
          </div>
          {job.title && (
            <div style={{ fontSize: 11.5, color: "#5c665f", marginTop: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {job.title}
            </div>
          )}
        </div>
        <PrimaryButton
          onClick={(e) => {
            e.stopPropagation();
            onTap();
          }}
          style={{ padding: "7px 12px", fontSize: 12.5, whiteSpace: "nowrap" }}
        >
          היכנס
        </PrimaryButton>
        <button
          onClick={(e) => {
            e.stopPropagation();
            onDismiss();
          }}
          aria-label="סגור"
          style={{
            background: "none",
            border: "none",
            color: "#8a9089",
            fontSize: 16,
            lineHeight: 1,
            padding: 2,
            cursor: "pointer",
            flexShrink: 0,
          }}
        >
          ×
        </button>
      </div>
    );
  }

  const dash = percent == null ? circumference * 0.72 : (circumference * percent) / 100;
  return (
    <div style={{ ...cardStyle, cursor: job.target ? "pointer" : "default" }} onClick={job.target ? onTap : undefined}>
      <div style={{ position: "relative", width: ringSize, height: ringSize, flexShrink: 0 }}>
        <svg width={ringSize} height={ringSize} style={{ transform: "rotate(-90deg)" }}>
          <circle cx={ringSize / 2} cy={ringSize / 2} r={r} fill="none" stroke="rgba(35,52,46,0.15)" strokeWidth={stroke} />
          <circle
            cx={ringSize / 2}
            cy={ringSize / 2}
            r={r}
            fill="none"
            stroke={job.category?.color || "var(--ink, #23342E)"}
            strokeWidth={stroke}
            strokeLinecap="round"
            strokeDasharray={`${dash} ${circumference}`}
            style={{
              transition: "stroke-dasharray 0.35s linear",
              // Same fix as the story-loading-page ring: anchor the spin
              // to the shape's own center instead of the SVG viewport's
              // corner, which is what made the ring look like it was
              // leaping outside its own circle.
              ...(percent == null
                ? { animation: "spin 0.8s linear infinite", transformBox: "fill-box", transformOrigin: "center" }
                : {}),
            }}
          />
        </svg>
        <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
          {percent != null ? (
            <span style={{ fontSize: 10.5, fontWeight: 700, color: "var(--ink)" }}>{percent}%</span>
          ) : (
            <AppIcon name="BookOpen" size={16} color="var(--ink)" />
          )}
        </div>
      </div>
      <div style={{ minWidth: 0, flex: 1 }}>
        {job.chapterNumber ? (
          // Writing a specific chapter of a (multi-chapter) book: lead with
          // the chapter number + its title once known.
          <div
            style={{
              fontFamily: "'Assistant', sans-serif",
              fontWeight: 700,
              fontSize: 13.5,
              overflow: "hidden",
              textOverflow: "ellipsis",
              whiteSpace: "nowrap",
            }}
          >
            {`מכין את פרק ${job.chapterNumber.toLocaleString("he")}${job.chapterTitle ? ` — ${job.chapterTitle}` : "…"}`}
          </div>
        ) : (
          // Planning stage, or a single-chapter item (poem/short story):
          // category name in its own color + level.
          <div
            style={{
              fontFamily: "'Assistant', sans-serif",
              fontWeight: 700,
              fontSize: 13.5,
              overflow: "hidden",
              textOverflow: "ellipsis",
              whiteSpace: "nowrap",
            }}
          >
            {`מכין את ה${job.category?.itemLabel || "סיפור"} הבא — `}
            <span style={{ color: job.category?.color || "inherit" }}>{job.category?.name || ""}</span>
            {job.level != null ? ` · רמה ${job.level}` : ""}
          </div>
        )}
        {job.storyTitle && (
          <div
            style={{
              fontFamily: "'Assistant', sans-serif",
              fontWeight: 700,
              fontSize: 11.5,
              color: "#5c665f",
              marginTop: 1,
              overflow: "hidden",
              textOverflow: "ellipsis",
              whiteSpace: "nowrap",
            }}
          >
            {job.storyTitle}
          </div>
        )}
        {job.note ? (
          <div style={{ fontSize: 10.5, color: "#8a938c", marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
            {job.note}
          </div>
        ) : (
          remainingLabel && <div style={{ fontSize: 11.5, color: "#5c665f", marginTop: 2 }}>{remainingLabel}</div>
        )}
      </div>
    </div>
  );
}

// Front/back cover — rendered as an ordinary page of the book, with exactly
// the same relationship to its neighbors as any chapter: reached only by
// swiping/paging past the chapter before or after it (or from the chapter
// menu), rendered inline in the normal scrollable layout (never a fixed/
// full-screen overlay), and using the same header chrome as every chapter
// page. The artwork is the book's own illustration mechanism: a real
// captured cover image for an imported PDF that had one, otherwise the same
// per-chapter image (an AI illustration if one was generated, or the
// procedural per-category/per-book sketch every chapter already falls back
// to) — so it varies by book and category instead of one fixed template.
// The credit line is the real author when genuinely known (an imported
// book's own metadata, or a retelling's real classic author), otherwise an
// honest "נכתב ואוייר ע"י AI" instead of inventing one.
function coverCreditLine(story, category) {
  if (story.author && story.author.trim()) return story.author.trim();
  if (story.source) {
    const parts = story.source.split("—");
    const author = parts.length > 1 ? parts[1].trim() : "";
    if (author && author !== "לא צוין") return author;
  }
  return 'נכתב ואוייר ע"י AI';
}

function CoverPageView({ story, category, isFront, onBack, onToggleLiked, onTouchStart, onTouchEnd, chapterMenu, prefs }) {
  const realImage = isFront ? story.frontCoverImage : story.backCoverImage;
  const fallbackChapter = isFront
    ? chapterAt(story, 0)
    : story.chapters && [...story.chapters].reverse().find((c) => c && c.imageStatus === "done" && c.image);
  const aiImage = fallbackChapter && fallbackChapter.imageStatus === "done" && fallbackChapter.image;
  const bgImage = realImage || (aiImage ? fallbackChapter.image : null);
  const credit = coverCreditLine(story, category);
  const Icon = category.icon;
  const info = story.level ? getLevelInfo(story.level) : null;
  const blurb = `הספר "${story.storyTitle}" עוסק ב${story.subtopic || category.tagline}. סיפור מתוך ${category.name}${
    info ? `, המתאים לרמת קריאה ${info.band}` : ""
  } — עבור קוראים שאוהבים עלילה קולחת ומעוניינים להרחיב אוצר מילים ומבני שפה חדשים באנגלית תוך כדי קריאה.`;

  return (
    <div>

        <div style={{ display: "flex", gap: 8 }}>
          <SecondaryButton
            onClick={onToggleLiked}
            style={story.liked ? { padding: "7px 10px", fontSize: 13, background: "#B5658A18", borderColor: "#B5658A", color: "#B5658A" } : { padding: "7px 10px", fontSize: 13 }}
            title={story.liked ? "הסירו מהספרים שאהבתי" : "הוסיפו לספרים שאהבתי"}
          >
            <AppIcon name={story.liked ? "HeartFill" : "Heart"} size={15} color={story.liked ? "#B5658A" : undefined} />
          </SecondaryButton>
          {story.categoryId !== "webImport" && (
          <SecondaryButton onClick={() => printStory(story, category, prefs)} style={{ padding: "7px 10px", fontSize: 13 }} title="הדפסה / שמירה כ-PDF">
            <AppIcon name="Printer" size={15} />
          </SecondaryButton>
          )}
          <SecondaryButton onClick={onBack} style={{ padding: "7px 12px", fontSize: 13 }}>
            חזרה
            <AppIcon name="ChevronRight" size={15} />

        </div>

      {chapterMenu}

      <div style={{ marginBottom: 14, textAlign: "center" }}>

      <div
        onTouchStart={onTouchStart}
        onTouchEnd={onTouchEnd}
        style={{
          position: "relative",
          overflow: "hidden",
          minHeight: "min(72vh, 640px)",
          borderRadius: 14,
          border: "1px solid var(--line)",
          touchAction: "pan-y",
          display: "flex",
          flexDirection: "column",
          background: bgImage ? "#161311" : `linear-gradient(160deg, ${category.color}30 0%, ${category.color}08 100%)`,
        }}
      >
        {bgImage ? (
          <img
            src={bgImage}
            alt=""
            style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }}
          />
        ) : (
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", padding: 30 }}>
            <div style={{ width: "100%", maxWidth: 380 }}>
              <StoryArt seed={`${story.id}-cover-${isFront ? "front" : "back"}`} color={category.color} motif={category.artMotif} height={260} />
            </div>
          </div>
        )}

        <div
          style={{
            position: "absolute",
            inset: 0,
            background: isFront
              ? "linear-gradient(180deg, rgba(10,8,6,0.82) 0%, rgba(10,8,6,0.05) 30%, rgba(10,8,6,0.1) 62%, rgba(10,8,6,0.85) 100%)"
              : "linear-gradient(180deg, rgba(10,8,6,0.7) 0%, rgba(10,8,6,0.25) 30%, rgba(10,8,6,0.15) 62%, rgba(10,8,6,0.82) 100%)",
          }}

        <div
          style={{

            zIndex: 1,

                  <div

                  }}
                >
                  {story.tagline || `"${story.storyTitle}"`}
                </div>
                <div
                  style={{
                    marginTop: 14,
                    fontSize: 14,
                    color: "rgba(255,255,255,0.92)",
                    lineHeight: 1.8,
                    direction: "rtl",
                    textShadow: "0 2px 8px rgba(0,0,0,0.55)",
                  }}
                >
                  {blurb}
                </div>
              </div>
              <div
                style={{
                  textAlign: "right",
                  fontFamily: "'IBM Plex Mono', monospace",
                  fontSize: 11.5,
                  letterSpacing: 2,
                  color: "rgba(255,255,255,0.8)",
                  textTransform: "uppercase",
                }}
              >
                {credit}
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );

function StoryView({ story, category, chapterIndex, setChapterIndex, onSelectChapter, onSuppressNextScrollReset, savedWordsLower, onWordClick: onWordClickProp, onNextChapter, onStartNext, onGoToPreviousLevel, onGoToNextLevel, hasPreviousLevelStory, hasNextLevelStory, onToggleRead, onToggleLiked, onBack, errorMsg, phraseMode, setPhraseMode, phraseAnchor, setPhraseAnchor, readingPrefs, isGeneratingThisChapter, loadingJob, wordJumpTarget, onConsumeWordJump, onRetryChapterImage }) {
