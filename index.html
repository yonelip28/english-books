// Small quota readout for the API settings panel: shows whatever the
// provider's own rate-limit headers last reported (best-effort — some
// providers don't expose these to the browser, in which case there's
// simply nothing to show yet), translated into a rough "how many more
// stories/books can I make" estimate. ~1 request per chapter is a solid
// assumption (that's exactly how the app calls the text model); a "book"
// is estimated at ~3 chapters, a reasonable average across levels since
// the exact count (1-60) depends on which level is selected.
const AVG_CHAPTERS_PER_BOOK = 3;
function QuotaCard({ children }) {
  return (
    <div
      style={{
        fontSize: 12,
        color: "var(--ink)",
        marginTop: 10,
        marginBottom: 4,
        lineHeight: 1.6,
        background: "#FFF8E7",
        border: "1.5px solid #C08A3E60",
        borderRadius: 10,
        padding: "10px 12px",
        display: "flex",
        gap: 8,
        alignItems: "flex-start",
      }}
    >
      <AppIcon name="Info" size={16} color="#C08A3E" />
      <div style={{ flex: 1, minWidth: 0 }}>{children}</div>
    </div>
  );
}
// Shows the reader's OWN, locally measured token usage for today — this is
// the only honest number available for providers like Google that never
// expose "remaining quota" to the browser at all (see recordProviderUsage):
// it's real usage actually spent, not a guess, but it can't tell you the
// ceiling itself since that's set by Google and shown on their own
// dashboard/pricing page, not returned by the API.
function MeasuredUsageCard({ usage }) {
  const isToday = usage.day === usageDayKey();
  return (
    <QuotaCard>
      <div style={{ fontWeight: 700, marginBottom: 2 }}>
        שימוש בפועל שנמדד באפליקציה{isToday ? " — היום (מתאפס בחצות שעון האוקיינוס השקט, כמו המכסה של גוגל)" : ""}
      </div>
      <div>
        {usage.requests.toLocaleString("he")} בקשות · {usage.totalTokens.toLocaleString("he")} טוקנים סה"כ (
        {usage.inputTokens.toLocaleString("he")} קלט + {usage.outputTokens.toLocaleString("he")} פלט)
      </div>
      <div style={{ marginTop: 4, opacity: 0.8 }}>
        זהו מספר שנמדד בפועל מתוך תשובות ה-API עצמן (הספק הזה לא חושף כותרות "מכסה שנותרה" לדפדפן) — כדי לראות את התקרה
        המדויקת לפי המודל והתוכנית שלכם, יש לבדוק ב-Google AI Studio תחת "Rate limits" / "Usage".
      </div>
    </QuotaCard>
  );
}

function QuotaSnapshot({ provider }) {
  const snap = getRateLimitSnapshot(provider);
  const usage = getProviderUsageToday(provider);
  const usageCard = usage ? <MeasuredUsageCard usage={usage} /> : null;

  if (!snap) {
    return (
      <>
        <QuotaCard>
          <div style={{ fontWeight: 700, marginBottom: 2 }}>מכסת בקשות ל-API</div>
          עדיין לא בוצעה קריאה ל-API בספק הזה — נתוני מכסה יופיעו כאן (אם יש) אחרי הבקשה הראשונה.
        </QuotaCard>
        {usageCard}
      </>
    );
  }

  if (!snap.minute && !snap.day) {
    // We DID get a response and inspected its headers, we just didn't find
    // quota info in them — most likely the browser's CORS policy hid the
    // provider's rate-limit headers (only headers the server explicitly
    // exposes via Access-Control-Expose-Headers are readable by JS from a
    // different origin), or this provider simply doesn't send them.
    const blocked = (snap.visibleHeaderCount || 0) <= 3;
    return (
      <>
        <QuotaCard>
          <div style={{ fontWeight: 700, marginBottom: 2 }}>מכסת בקשות ל-API — לא זמינה לספק הזה</div>
          {blocked
            ? "הספק הזה לא חושף כותרות מכסה לדפדפן (מדיניות CORS חוסמת גישה אליהן מקוד JavaScript חיצוני) — אי אפשר להציג נתוני מכסה עבורו, גם אחרי יצירת סיפורים."
            : "התקבלה תשובה מהספק, אבל היא לא כללה נתוני מכסת בקשות (לא כל ספק שולח את זה)."}
          {snap.extra && (
            <div style={{ marginTop: 4, direction: "ltr", textAlign: "left", wordBreak: "break-word", opacity: 0.85, fontSize: 11 }}>
              {Object.entries(snap.extra)
                .map(([k, v]) => `${k}: ${v}`)
                .join(" · ")}
            </div>
          )}
        </QuotaCard>
        {usageCard}
      </>
    );
  }
  const ago = Math.max(0, Math.round((Date.now() - snap.capturedAt) / 1000));
  const agoText = ago < 90 ? "לפני רגע" : ago < 3600 ? `לפני ${Math.round(ago / 60)} דקות` : `לפני ${Math.round(ago / 3600)} שעות`;
  return (
    <>
      <div
        style={{
          fontSize: 12,
          color: "var(--ink)",
          marginTop: 10,
          marginBottom: 4,
          lineHeight: 1.6,
          background: "#3E7C7414",
          border: "1.5px solid #3E7C7460",
          borderRadius: 10,
          padding: "10px 12px",
          display: "flex",
          gap: 8,
          alignItems: "flex-start",
        }}
      >
        <AppIcon name="Info" size={16} color="#3E7C74" />
        <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontWeight: 700, marginBottom: 2 }}>מכסת בקשות ל-API (לפי הבקשה האחרונה, {agoText})</div>
        {snap.minute && (
          <div>
            לדקה הקרובה: {snap.minute.remaining}
            {snap.minute.limit != null ? ` מתוך ${snap.minute.limit}` : ""} בקשות — כ-{Math.max(0, snap.minute.remaining)} סיפורים/פרקים נוספים
          </div>
        )}
        {snap.day && (
          <div>
            להיום: {snap.day.remaining}
            {snap.day.limit != null ? ` מתוך ${snap.day.limit}` : ""} בקשות — כ-{Math.floor(Math.max(0, snap.day.remaining) / AVG_CHAPTERS_PER_BOOK)} ספרים נוספים (בממוצע כ-
            {AVG_CHAPTERS_PER_BOOK} פרקים לספר)
          </div>
        )}
        {!snap.day && <div style={{ opacity: 0.75 }}>הספק הזה לא חושף מכסה יומית לדפדפן, רק מכסת דקה.</div>}
        </div>
      </div>
      {usageCard}
    </>
  );
}

function BackupSettingsPanel({ state, onRestoreState, compact, autoRestoreOnSave }) {
  const [email, setEmail] = useState(getCloudEmail());
  const [emailSaved, setEmailSaved] = useState(false);
  const [emailError, setEmailError] = useState("");
  const [autoSync, setAutoSyncField] = useState(getAutoSync());
  const [busy, setBusy] = useState(null); // null | "backup" | "restoreCurrent" | "restoreFull"
  const [progressMsg, setProgressMsg] = useState("");
  const [result, setResult] = useState(null); // {ok:true,message} | {ok:false,message}
  const [lastSync, setLastSyncField] = useState(getLastSync());
  const [poolStorage, setPoolStorage] = useState(null); // {usedBytes, capBytes, projectCount} | null
  const [showRestoreOptions, setShowRestoreOptions] = useState(false);

  // Custom Firebase backup-project details, entered once by the reader
  // (kept in localStorage on this device). Hidden behind a toggle so it
  // doesn't clutter the panel for readers who don't need it.
  const storedProjectConfig = getStoredCloudConfig();
  const [showProjectForm, setShowProjectForm] = useState(false);
  const [projectId, setProjectId] = useState((storedProjectConfig && storedProjectConfig.projectId) || "");
  const [apiKey, setApiKey] = useState((storedProjectConfig && storedProjectConfig.apiKey) || "");
  const [projectSaved, setProjectSaved] = useState(false);
  const [projectError, setProjectError] = useState("");
  const usingCustomProject = !!storedProjectConfig;
  const usingBakedInFirebase = !usingCustomProject && CLOUD_BACKEND_CONFIGS.some((c) => c && c.projectId && c.apiKey);
  const isFirebaseMode = usingCustomProject || usingBakedInFirebase;

  // Google sign-in state (Firebase mode only). Kept in sync with Firebase
  // Auth's own listener so a sign-in/out from elsewhere in the app (or a
  // popup that finishes after this panel already rendered) is reflected.
  const [googleUser, setGoogleUser] = useState(() => (isFirebaseMode ? getGoogleUser() : null));
  const [googleBusy, setGoogleBusy] = useState(false);
  const [googleError, setGoogleError] = useState("");
  useEffect(() => {
    if (!isFirebaseMode) {
      setGoogleUser(null);
      return;
    }
    let handledInitialUser = false;
    // Surfaces an error from a just-completed signInWithRedirect() flow
    // (e.g. unauthorized domain, or the reader cancelling on Google's
    // side) — otherwise it would pass by silently, since picking up the
    // signed-in user itself happens via onAuthStateChanged below.
    checkGoogleRedirectResult().catch((e) => setGoogleError(e.message || "ההתחברות עם Google נכשלה."));
    return onGoogleAuthChanged((user) => {
      setGoogleUser(user);
      // Covers the redirect-based sign-in flow: after Google sends the
      // reader back and the app reloads, this listener is what notices
      // they're now signed in (nothing called connectGoogle() directly on
      // this fresh page load). If this is onboarding, resume the
      // auto-restore the same way a same-page popup sign-in would have.
      if (user && autoRestoreOnSave && !handledInitialUser) {
        handledInitialUser = true;
        (async () => {
          setResult(null);
          setBusy("restore");
          setProgressMsg("");
          try {
            const result = await pullBackup(state, setProgressMsg);
            if (result && (result.newStoryCount || result.newWordCount || result.categoriesRestoredCount)) {
              onRestoreState(result.patch);
              setLastSyncField(getLastSync());
              setResult({
                ok: true,
                message: `נמצא גיבוי קודם עבור חשבון ה-Google הזה — שוחזרו ${result.newStoryCount} ספרים, ${result.newWordCount} מילים ורמות ההתקדמות ב-${result.categoriesRestoredCount} נושאים.`,
              });
            } else if (result) {
              setLastSyncField(getLastSync());
            }
          } catch (e) {
            setResult({ ok: false, message: e.message || "השחזור האוטומטי נכשל. אפשר לנסות שוב עם \"שחזר מהגיבוי\" למטה." });
          }
          setBusy(null);
          setProgressMsg("");
        })();
      }
    });
  }, [isFirebaseMode, usingCustomProject, usingBakedInFirebase]);

  // Pooled storage-usage indicator (only meaningful with >1 pooled project).
  // Uses whichever identity is already signed in to the registry project —
  // never triggers its own sign-in popup, since this is just a nice-to-have
  // readout, not something worth interrupting the reader for.
  const refreshPoolStorage = useCallback(async () => {
    if (!isPooledMode()) {
      setPoolStorage(null);
      return;
    }
    const user = getGoogleUser(getActiveProjectConfigs()[0]);
    if (!user) {
      setPoolStorage(null);
      return;
    }
    try {
      setPoolStorage(await getPoolStorageUsage(user));
    } catch (e) {
      setPoolStorage(null);
    }
  }, []);
  useEffect(() => {
    if (googleUser) refreshPoolStorage();
    else setPoolStorage(null);
  }, [googleUser, refreshPoolStorage]);

  async function connectGoogle() {
    setGoogleError("");
    setGoogleBusy(true);
    try {
      // Normally resolves right here with the signed-in identity (popup
      // flow). If Google had to fall back to a redirect instead (see
      // signInWithGoogle), this line never returns in this page's
      // lifetime — that case is instead picked up by the
      // onAuthStateChanged listener above once the app reloads.
      const identity = await signInWithGoogle();
      if (identity) setGoogleUser(identity);
    } catch (e) {
      setGoogleError(e.message || "ההתחברות עם Google נכשלה.");
    }
    setGoogleBusy(false);
  }

  // Signs out of the current Google account and immediately reopens the
  // sign-in popup with Google's account chooser forced open, so the reader
  // can pick a different account instead of silently landing back in the
  // same one.
  async function switchGoogleAccount() {
    setGoogleError("");
    setGoogleBusy(true);
    try {
      await signOutGoogle();
      setGoogleUser(null);
      const identity = await signInWithGoogle(true);
      if (identity) setGoogleUser(identity);
    } catch (e) {
      setGoogleError(e.message || "החלפת החשבון נכשלה.");
    }
    setGoogleBusy(false);
  }

  function saveProjectConfig() {
    const p = projectId.trim();
    const k = apiKey.trim();
    if (!p || !k) {
      setProjectError("יש למלא גם מזהה פרויקט וגם מפתח API.");
      return;
    }
    setProjectError("");
    setStoredCloudConfig(p, k);
    setProjectSaved(true);
    setResult(null);
    setGoogleUser(null);
    setGoogleError("");
  }

  function clearProjectConfig() {
    clearStoredCloudConfig();
    setProjectId("");
    setApiKey("");
    setProjectSaved(false);
    setProjectError("");
    setResult(null);
    setGoogleUser(null);
    setGoogleError("");
  }

  async function saveEmail() {
    const trimmed = email.trim();
    if (trimmed && !isValidEmail(trimmed)) {
      setEmailError("כתובת מייל לא תקינה.");
      return;
    }
    setEmailError("");
    setCloudEmail(trimmed);
    setEmailSaved(true);

    // On a brand-new device (onboarding), an email that already has a cloud
    // backup should be picked up automatically — no separate "שחזר מהגיבוי"
    // tap needed. Silent when nothing is found, since that's simply the
    // normal case for a genuinely new reader (no data to lose, so no
    // confirmation step is needed either).
    if (autoRestoreOnSave && trimmed && isValidEmail(trimmed)) {
      setResult(null);
      setBusy("restore");
      setProgressMsg("");
      try {
        const result = await pullBackup(state, setProgressMsg);
        if (result && (result.newStoryCount || result.newWordCount || result.categoriesRestoredCount)) {
          onRestoreState(result.patch);
          setLastSyncField(getLastSync());
          setResult({
            ok: true,
            message: `נמצא גיבוי קודם עבור המייל הזה — שוחזרו ${result.newStoryCount} ספרים, ${result.newWordCount} מילים ורמות ההתקדמות ב-${result.categoriesRestoredCount} נושאים.`,
          });
        } else if (result) {
          setLastSyncField(getLastSync());
        }
      } catch (e) {
        setResult({ ok: false, message: e.message || "השחזור האוטומטי נכשל. אפשר לנסות שוב עם \"שחזר מהגיבוי\" למטה." });
      }
      setBusy(null);
      setProgressMsg("");
    }
  }

  function toggleAutoSync(v) {
    setAutoSyncField(v);
    setAutoSync(v);
  }

  async function doBackup() {
    setResult(null);
    if (!cloudReady()) {
      setResult({ ok: false, message: "צריך קודם להזין מייל ולשמור אותו." });
      return;
    }
    setBusy("backup");
    setProgressMsg("");
    try {
      const r = await pushBackup(state, setProgressMsg);
      setLastSyncField(getLastSync());
      if (isFirebaseMode) setGoogleUser(getGoogleUser());
      if (isPooledMode()) refreshPoolStorage();
      setResult({
        ok: true,
        message:
          r.newStoryCount || r.newWordCount
            ? `הגיבוי עודכן — ${r.newStoryCount} ספרים חדשים, ${r.newWordCount} מילים חדשות.`
            : "הכל כבר מגובה — לא נמצאו נתונים חדשים.",
      });
    } catch (e) {
      setResult({ ok: false, message: e.message || "הגיבוי נכשל." });
    }
    setBusy(null);
    setProgressMsg("");
  }

  async function doRestoreCurrent() {
    setResult(null);
    if (!cloudReady()) {
      setResult({ ok: false, message: "צריך קודם להזין מייל ולשמור אותו." });
      return;
    }
    setBusy("restoreCurrent");
    setProgressMsg("");
    try {
      const result = await pullBackup(state, setProgressMsg);
      if (isFirebaseMode) setGoogleUser(getGoogleUser());
      if (!result) {
        setResult({ ok: false, message: isFirebaseMode ? "לא נמצא גיבוי קיים עבור חשבון ה-Google הזה." : "לא נמצא גיבוי קיים עבור המייל הזה." });
      } else if (result.newStoryCount || result.newWordCount || result.categoriesRestoredCount) {
        onRestoreState(result.patch);
        setLastSyncField(getLastSync());
        setResult({
          ok: true,
          message: `השחזור הושלם — נוספו ${result.newStoryCount} ספרים, ${result.newWordCount} מילים ורמות ההתקדמות שוחזרו ב-${result.categoriesRestoredCount} נושאים.`,
        });
      } else {
        setLastSyncField(getLastSync());
        setResult({ ok: true, message: "הכל כבר מעודכן — אין נתונים חדשים לשחזור." });
      }
    } catch (e) {
      setResult({ ok: false, message: e.message || "השחזור נכשל." });
    }
    setBusy(null);
    setProgressMsg("");
  }

  // Additive on purpose, exactly like doRestoreCurrent above — never
  // overwrites progress made on this device, only fills in whatever the
  // private repository has that isn't here yet.
  async function doRestoreFull() {
    setResult(null);
    if (!cloudReady()) {
      setResult({ ok: false, message: "צריך קודם להזין מייל ולשמור אותו." });
      return;
    }
    setBusy("restoreFull");
    setProgressMsg("");
    try {
      const result = await pullBackup(state, setProgressMsg);
      if (isFirebaseMode) setGoogleUser(getGoogleUser());
      if (!result) {
        setResult({ ok: false, message: isFirebaseMode ? "לא נמצא גיבוי קיים עבור חשבון ה-Google הזה." : "לא נמצא גיבוי קיים עבור המייל הזה." });
      } else if (result.newStoryCount || result.newWordCount || result.categoriesRestoredCount) {
        onRestoreState(result.patch);
        setLastSyncField(getLastSync());
        setResult({
          ok: true,
          message: `נוספו ${result.newStoryCount} ספרים ו-${result.newWordCount} מילים, ורמות ההתקדמות מולאו ב-${result.categoriesRestoredCount} נושאים — בלי לגעת במה שכבר יש כרגע במכשיר.`,
        });
      } else {
        setLastSyncField(getLastSync());
        setResult({ ok: true, message: "הכל כבר מעודכן — אין נתונים נוספים להשלים." });
      }
    } catch (e) {
      setResult({ ok: false, message: e.message || "השחזור נכשל." });
    }
    setBusy(null);
    setProgressMsg("");
  }

  return (
    <div style={compact ? {} : { borderTop: "1px solid var(--line)", marginTop: 20, paddingTop: 16 }}>
      {!compact && (
        <>
          <div style={{ fontFamily: "'Frank Ruhl Libre', serif", fontSize: 16, fontWeight: 700, marginBottom: 4 }}>גיבוי ושמירה</div>
          <div style={{ fontSize: 12.5, color: "#8a9089", marginBottom: 12, lineHeight: 1.55 }}>
            {isFirebaseMode
              ? 'התחברו עם Google ולחצו "גבה עכשיו". באותו חשבון Google, במכשיר אחר, תוכלו ללחוץ "שחזר מהגיבוי" ולקבל בחזרה את כל הספרים, הסיפורים והמילים שלכם.'
              : 'הזינו את כתובת המייל שלכם, ולחצו "גבה עכשיו". באותו מייל במכשיר אחר תוכלו ללחוץ "שחזר מהגיבוי" ולקבל בחזרה את כל הספרים, הסיפורים והמילים שלכם. אין צורך בהרשמה או בסיסמה — המייל הוא רק המזהה של הגיבוי שלכם.'}
          </div>
        </>
      )}

      {isFirebaseMode ? (
        <>
          <div style={{ fontSize: 12.5, fontWeight: 700, color: "#5c665f", marginBottom: 6 }}>חשבון Google לגיבוי</div>
          {googleUser ? (
            <div
              style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                flexWrap: "wrap",
                padding: "10px 12px",
                borderRadius: 10,
                border: "1.5px solid var(--line-strong)",
                background: "var(--paper-raised)",
                marginBottom: 8,
              }}
            >
              {googleUser.photoURL && (
                <img
                  src={googleUser.photoURL}
                  alt=""
                  style={{ width: 32, height: 32, borderRadius: "50%", border: "1px solid var(--line)" }}
                />
              )}
              <div style={{ fontSize: 13, color: "var(--ink)", flex: 1, minWidth: 120 }}>
                מחוברים כ־<strong>{googleUser.email || googleUser.displayName}</strong>
              </div>
            </div>
          ) : (
            <div style={{ marginBottom: 6 }}>
              <SecondaryButton onClick={connectGoogle} disabled={googleBusy} style={{ padding: "9px 16px", fontSize: 13 }}>
                {googleBusy ? <AppIcon name="Loader2" className="spin" size={14} /> : null}
                התחבר עם Google
              </SecondaryButton>
              <div style={{ fontSize: 11.5, color: "#8a9089", marginTop: 6 }}>
                אין צורך להתחבר מראש — לחיצה על "גבה עכשיו" או "שחזר מהגיבוי" תפתח את חלון ההתחברות של Google בעצמה,
                אם עדיין לא מחוברים.
              </div>
            </div>
          )}
          {googleUser && (
            <SecondaryButton onClick={switchGoogleAccount} disabled={googleBusy} style={{ padding: "8px 14px", fontSize: 12.5, marginBottom: 8 }}>
              {googleBusy ? <AppIcon name="Loader2" className="spin" size={14} /> : null}
              שינוי חשבון Google מחובר
            </SecondaryButton>
          )}
          {googleError && <div style={{ fontSize: 12, color: "#8B3A3A", marginBottom: 8 }}>{googleError}</div>}
        </>
      ) : (
        <>
          <div style={{ fontSize: 12.5, fontWeight: 700, color: "#5c665f", marginBottom: 6 }}>מייל לגיבוי</div>
          <div style={{ display: "flex", gap: 6, marginBottom: 4, flexWrap: "wrap" }}>
            <input
              type="email"
              dir="ltr"
              value={email}
              onChange={(e) => { setEmail(e.target.value); setEmailSaved(false); }}
              placeholder="name@example.com"
              style={{
                flex: 1,
                minWidth: 180,
                padding: "10px 12px",
                borderRadius: 10,
                border: "1.5px solid var(--line-strong)",
                fontSize: 13.5,
                boxSizing: "border-box",
                background: "var(--paper-raised)",
                color: "var(--ink)",
              }}
            />
            <SecondaryButton onClick={saveEmail} style={{ padding: "9px 16px", fontSize: 13 }}>
              שמירת מייל
            </SecondaryButton>
          </div>
          {emailError && <div style={{ fontSize: 12, color: "#8B3A3A", marginBottom: 8 }}>{emailError}</div>}
          {emailSaved && !emailError && <div style={{ fontSize: 12, color: "#3E7C74", marginBottom: 8 }}>✓ נשמר</div>}
        </>
      )}

      <div style={{ fontSize: 12.5, fontWeight: 700, color: "#5c665f", marginTop: 16, marginBottom: 6 }}>גיבוי אוטומטי</div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
        <button
          onClick={() => toggleAutoSync(true)}
          style={{
            border: `1.5px solid ${autoSync ? "var(--ink)" : "var(--line-strong)"}`,
            background: autoSync ? "var(--ink)" : "transparent",
            color: autoSync ? "var(--paper)" : "var(--ink)",
            borderRadius: 999,
            padding: "7px 14px",
            fontSize: 12.5,
            fontWeight: 600,
            cursor: "pointer",
          }}
        >
          פעיל — מגבה ברקע בכל שינוי
        </button>
        <button
          onClick={() => toggleAutoSync(false)}
          style={{
            border: `1.5px solid ${!autoSync ? "var(--ink)" : "var(--line-strong)"}`,
            background: !autoSync ? "var(--ink)" : "transparent",
            color: !autoSync ? "var(--paper)" : "var(--ink)",
            borderRadius: 999,
            padding: "7px 14px",
            fontSize: 12.5,
            fontWeight: 600,
            cursor: "pointer",
          }}
        >
          כבוי — רק ידני
        </button>
      </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 16 }}>
        <PrimaryButton onClick={doBackup} disabled={!!busy} style={{ padding: "9px 16px", fontSize: 13 }}>
          {busy === "backup" ? <AppIcon name="Loader2" className="spin" size={14} /> : <AppIcon name="Check" size={14} />}
          גבה עכשיו
        </PrimaryButton>
        <SecondaryButton onClick={() => setShowRestoreOptions((v) => !v)} disabled={!!busy} style={{ padding: "9px 16px", fontSize: 13 }}>
          שחזור {showRestoreOptions ? "︿" : "﹀"}
        </SecondaryButton>
      </div>
      {showRestoreOptions && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 10 }}>
          <div style={{ background: "var(--paper-raised)", border: "1px solid var(--line)", borderRadius: 10, padding: "12px 14px" }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>שחזור מצב נוכחי</div>
            <div style={{ fontSize: 12, color: "#8a9089", marginBottom: 8, lineHeight: 1.5 }}>
              משלים מהגיבוי רק את מה שחסר כרגע במכשיר.
            </div>
            <SecondaryButton onClick={doRestoreCurrent} disabled={!!busy} style={{ padding: "8px 14px", fontSize: 12.5 }}>
              {busy === "restoreCurrent" ? <AppIcon name="Loader2" className="spin" size={14} /> : null}
              שחזר מצב נוכחי
            </SecondaryButton>
          </div>
          <div style={{ background: "var(--paper-raised)", border: "1px solid var(--line)", borderRadius: 10, padding: "12px 14px" }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>שחזור היסטוריה מלאה</div>
            <div style={{ fontSize: 12, color: "#8a9089", marginBottom: 8, lineHeight: 1.5 }}>
              משלים מהגיבוי את כל מה שנצבר שם מתחילת השימוש — גם הוא בלי לדרוס התקדמות קיימת.
            </div>
            <SecondaryButton onClick={doRestoreFull} disabled={!!busy} style={{ padding: "8px 14px", fontSize: 12.5 }}>
              {busy === "restoreFull" ? <AppIcon name="Loader2" className="spin" size={14} /> : null}
              שחזר היסטוריה מלאה
            </SecondaryButton>
          </div>
        </div>
      )}
      {busy && progressMsg && <div style={{ fontSize: 12, color: "#5c665f", marginTop: 8 }}>{progressMsg}</div>}
      {result && (
        <div style={{ fontSize: 12.5, marginTop: 10, color: result.ok ? "#3E7C74" : "#8B3A3A", lineHeight: 1.5 }}>
          {result.ok ? "✓ " : ""}{result.message}
        </div>
      )}
      <div style={{ fontSize: 11.5, color: "#8a9089", marginTop: 10 }}>
        {lastSync ? `גיבוי אחרון: ${new Date(lastSync).toLocaleString("he")}` : "עדיין לא בוצע גיבוי מהמכשיר הזה."}
      </div>
      {isPooledMode() && googleUser && getLocalAssignedProjectId(googleUser.email) && (
        <div style={{ fontSize: 11.5, color: "#8a9089", marginTop: 2 }}>
          הגיבוי שלכם מאוחסן בפרויקט: {getLocalAssignedProjectId(googleUser.email)}
        </div>
      )}
      {poolStorage && (
        <div style={{ fontSize: 11.5, color: "#8a9089", marginTop: 2 }}>
          משקל גיבוי כולל (משוער, {poolStorage.projectCount} פרויקטים יחד): {formatBytes(poolStorage.usedBytes)} מתוך{" "}
          {formatBytes(poolStorage.capBytes)}
        </div>
      )}

      <div style={{ marginTop: 18, paddingTop: 14, borderTop: "1px dashed var(--line)" }}>
        <div style={{ fontSize: 11.5, color: "#8a9089", marginBottom: 8 }}>
          {usingCustomProject
            ? "פועל כרגע מול פרויקט Firebase שהוזן ידנית במכשיר הזה."
            : usingBakedInFirebase
            ? "פועל כרגע מול פרויקט Firebase המוגדר מראש בקובץ."
            : "פועל כרגע במצב Netlify (ברירת המחדל, ללא צורך בהגדרה)."}
        </div>
        <SecondaryButton onClick={() => setShowProjectForm((v) => !v)} style={{ padding: "8px 14px", fontSize: 12.5 }}>
          שינוי פרטי פרויקט גיבוי
        </SecondaryButton>

        {showProjectForm && (
          <div style={{ marginTop: 12 }}>
            <div style={{ fontSize: 12, color: "#8a9089", lineHeight: 1.55, marginBottom: 10 }}>
              אפשר להזין כאן, פעם אחת, את פרטי פרויקט ה-Firebase האישי שלכם (מזהה הפרויקט ומפתח ה-Web API). הפרטים
              נשמרים רק במכשיר הזה (localStorage) ומשמשים לגיבוי ולשחזור במקום מצב ה-Netlify המובנה. אם ל-Google
              Sign-In מופעל בפרויקט, ההתחברות עם Google מחליפה את הצורך להזין מייל ידנית. חוקי Firestore Rules
              מומלצים לפרויקט כזה:
              <code style={{ display: "block", direction: "ltr", textAlign: "left", background: "var(--paper-raised)", border: "1px solid var(--line)", borderRadius: 8, padding: 8, marginTop: 6, fontSize: 11, whiteSpace: "pre-wrap" }}>
{`match /reader_backups/{uid}/{document=**} {
  allow read, write: if request.auth != null && request.auth.uid == uid;
}`}
              </code>
            </div>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: "#5c665f", marginBottom: 6 }}>מזהה פרויקט (Project ID)</div>
            <input
              type="text"
              dir="ltr"
              value={projectId}
              onChange={(e) => { setProjectId(e.target.value); setProjectSaved(false); }}
              placeholder="my-reading-app-12345"
              style={{
                width: "100%",
                padding: "10px 12px",
                borderRadius: 10,
                border: "1.5px solid var(--line-strong)",
                fontSize: 13.5,
                boxSizing: "border-box",
                background: "var(--paper-raised)",
                color: "var(--ink)",
                marginBottom: 8,
              }}
            />
            <div style={{ fontSize: 12.5, fontWeight: 700, color: "#5c665f", marginBottom: 6 }}>מפתח Web API</div>
            <input
              type="text"
              dir="ltr"
              value={apiKey}
              onChange={(e) => { setApiKey(e.target.value); setProjectSaved(false); }}
              placeholder="AIza..."
              style={{
                width: "100%",
                padding: "10px 12px",
                borderRadius: 10,
                border: "1.5px solid var(--line-strong)",
                fontSize: 13.5,
                boxSizing: "border-box",
                background: "var(--paper-raised)",
                color: "var(--ink)",
                marginBottom: 8,
              }}
            />
            {projectError && <div style={{ fontSize: 12, color: "#8B3A3A", marginBottom: 8 }}>{projectError}</div>}
            {projectSaved && !projectError && <div style={{ fontSize: 12, color: "#3E7C74", marginBottom: 8 }}>✓ נשמר במכשיר הזה</div>}
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <PrimaryButton onClick={saveProjectConfig} style={{ padding: "9px 16px", fontSize: 13 }}>
                שמירת פרטי פרויקט
              </PrimaryButton>
              {usingCustomProject && (
                <SecondaryButton
                  onClick={clearProjectConfig}
                  style={{ padding: "9px 16px", fontSize: 13, borderColor: "#8B3A3A", color: "#8B3A3A" }}
                >
                  מחיקת פרטי הפרויקט וחזרה למצב ברירת מחדל
                </SecondaryButton>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// Reset section, rendered as part of the "גיבוי ושמירה" (backup) tab: lets
// the reader clear the reading levels/library/words shown on this device,
// and offers two ways back in afterwards — both pulling from the exact same
// private cloud repository as the regular backup/restore above (never a
// separate local copy), which is also what feeds the shared public library.
function ResetDataPanel({ state, onResetState }) {
  const [confirming, setConfirming] = useState(false);
  const [ackNoBackup, setAckNoBackup] = useState(false);
  const [busy, setBusy] = useState(null); // null | "reset"
  const [progressMsg, setProgressMsg] = useState("");
  const [result, setResult] = useState(null); // {ok, message} | null

  const storyCount = Object.keys(state.stories || {}).length;
  const wordCount = Object.keys(state.words || {}).length;

  async function doReset() {
    setResult(null);
    setBusy("reset");
    setProgressMsg("");
    let backedUp = false;
    let backupError = null;
    if (cloudReady()) {
      // Make sure whatever's on this device right now is safely sitting in
      // the private cloud repository before it disappears from the screen —
      // pushBackup only ever ADDS/raises progress there (see the protective
      // merge in pushBackupFirebase/pushBackupNetlify), so this can't erase
      // anything already backed up, only make sure today's progress is too.
      try {
        await pushBackup(state, setProgressMsg);
        backedUp = true;
      } catch (e) {
        backupError = e.message || "הגיבוי שקדם לאיפוס נכשל.";
      }
    }
    onResetState(resetLearningState(state));
    setConfirming(false);
    setAckNoBackup(false);
    setBusy(null);
    setProgressMsg("");
    if (backedUp) {
      setResult({
        ok: true,
        message:
          "האפליקציה אופסה במכשיר הזה. ההתקדמות שהייתה כאן שמורה במאגר הפרטי בענן (לא במכשיר) — אפשר להחזיר אותה בכל עת עם כפתור \"שחזור\" למעלה.",
      });
    } else if (backupError) {
      setResult({
        ok: false,
        message: `האפליקציה אופסה במכשיר, אבל הגיבוי שהיה אמור לקדום לאיפוס נכשל (${backupError}). אם לא היה גיבוי קודם לכן מהמכשיר הזה, ההתקדמות עלולה להיות אבודה.`,
      });
    } else {
      setResult({
        ok: false,
        message: "האפליקציה אופסה במכשיר, אך לא היה מוגדר גיבוי בענן — אם לא גיבתם בעבר, ההתקדמות הזו אינה ניתנת לשחזור.",
      });
    }
  }

  return (
    <div style={{ borderTop: "1px solid var(--line)", marginTop: 20, paddingTop: 16 }}>
      <div style={{ fontFamily: "'Frank Ruhl Libre', serif", fontSize: 16, fontWeight: 700, marginBottom: 4 }}>
        איפוס האפליקציה
      </div>
      <div style={{ fontSize: 12.5, color: "#8a9089", marginBottom: 14, lineHeight: 1.6 }}>
        מאפס במכשיר הזה את רמות הקריאה, את כל הספרים שבספרייה ואת המילים השמורות — לנוחות בלבד. לפני האיפוס, ההתקדמות
        הנוכחית נשלחת אוטומטית לאותו <strong>מאגר אחסון פרטי בענן</strong> שמשמש לגיבוי הרגיל (ולא לשום עותק מקומי) —
        אותו מאגר שמזין במקביל גם את הספרייה הציבורית המצטברת. שום דבר לא נמחק משם, ואפשר להחזיר את הנתונים בכל עת
        בהמשך.
      </div>
      <div
        style={{
          background: "var(--paper-raised)",
          border: "1px solid var(--line)",
          borderRadius: 10,
          padding: "10px 12px",
          fontSize: 12.5,
          color: "#5c665f",
          marginBottom: 14,
        }}
      >
        כרגע במכשיר: {storyCount} ספרים בספרייה, {wordCount} מילים שמורות.
      </div>

      {!confirming ? (
        <SecondaryButton
          onClick={() => setConfirming(true)}
          disabled={!!busy}
          style={{ padding: "9px 16px", fontSize: 13, borderColor: "#8B3A3A", color: "#8B3A3A" }}
        >
          אפס את האפליקציה
        </SecondaryButton>
      ) : (
        <div style={{ border: "1.5px solid #8B3A3A", borderRadius: 10, padding: "12px 14px", background: "#8B3A3A0d" }}>
          <div style={{ fontSize: 13, color: "#8B3A3A", fontWeight: 700, marginBottom: 6 }}>לאשר איפוס?</div>
          <div style={{ fontSize: 12.5, color: "#5c665f", marginBottom: 10, lineHeight: 1.55 }}>

// Small live read-out of the automatic fallback chain (see FALLBACK_CHAIN_ORDER
// in api.js) — every configured provider, in the exact order they'll be tried,
// and whether each one is currently available or cooling down (and for how
// long). Exists purely so nothing about the automatic provider-switching is a
// surprise: what you see here is exactly what the next story request will do.
// A tiny on/off switch, styled to match the rest of the Settings screen —
// used here to let a reader flip a provider out of (or back into) the
// fallback chain without deleting its saved key.
function MiniToggle({ on, onChange, title }) {
  return (
    <button
      onClick={() => onChange(!on)}
      title={title}
      style={{
        flexShrink: 0,
        width: 34,
        height: 19,
        borderRadius: 999,
        border: "none",
        cursor: "pointer",
        background: on ? "#3E7C74" : "#c8cdc5",
        position: "relative",
        transition: "background 0.15s",
        padding: 0,
      }}
    >
      <span
        style={{
          position: "absolute",
          top: 2,
          [on ? "right" : "left"]: 2,
          width: 15,
          height: 15,
          borderRadius: "50%",
          background: "#fff",
          transition: "inset 0.15s",
          boxShadow: "0 1px 3px rgba(0,0,0,0.3)",
        }}
      />
    </button>
  );
}

function FallbackChainStatus() {
  const [, forceTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => forceTick((n) => n + 1), 30000); // keep the countdowns fresh
    return () => clearInterval(id);
  }, []);
  // Every provider that HAS a key saved, in chain priority order — including
  // ones currently switched off manually, so there's a place to turn them
  // back on again. This is deliberately different from getFallbackChain(),
  // which only returns the ones actually eligible to be tried right now.
  const allConfigured = FALLBACK_CHAIN_ORDER.filter(isProviderKeySet);
  if (allConfigured.length === 0) return null;
  const activeChain = getFallbackChain();
  return (
    <div
      style={{
        background: "var(--paper-raised)",
        border: "1.5px solid var(--line-strong)",
        borderRadius: 10,
        padding: "10px 12px",
        marginBottom: 10,
        fontSize: 12,
        lineHeight: 1.6,
      }}
    >
      <div style={{ fontWeight: 700, color: "#5c665f", marginBottom: 4 }}>
        {activeChain.length > 1
          ? `שרשרת גיבוי אוטומטית פעילה (${activeChain.length} ספקים) — לפי הסדר:`
          : activeChain.length === 1
          ? "ספק פעיל יחיד (אין עדיין ספק גיבוי פעיל):"
          : "כל הספקים המוגדרים כבויים כרגע:"}
      </div>
      {allConfigured.map((id, i) => {
        const disabled = isProviderManuallyDisabled(id);
        const cooling = !disabled && isProviderCoolingDown(id);
        const until = getProviderCooldownUntil(id);
        const orderNum = activeChain.indexOf(id);
        return (
          <div
            key={id}
            style={{
              display: "flex",
              alignItems: "center",
              gap: 6,
              color: disabled ? "#8a9089" : cooling ? "#C08A3E" : "#3E7C74",
              opacity: disabled ? 0.75 : 1,
              padding: "3px 0",
            }}
          >
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, minWidth: 14 }}>
              {orderNum >= 0 ? `${orderNum + 1}.` : "—"}
            </span>
            <span style={{ fontWeight: 600, flex: 1, minWidth: 0 }}>{getProviderDisplayLabel(id)}</span>
            <span style={{ flex: 2 }}>
              {disabled
                ? "— כבוי ידנית, לא ישמש בשרשרת"
                : cooling
                ? `— במנוחה, יחזור לפעולה בעוד ${formatCooldownDuration(until - Date.now())}`
                : "— זמין כרגע"}
            </span>
            <MiniToggle
              on={!disabled}
              title={disabled ? "הפעל ספק זה" : "כבה ספק זה (בלי למחוק את המפתח)"}
              onChange={(next) => {
                setProviderManuallyDisabled(id, !next);
                forceTick((n) => n + 1);
              }}
            />
          </div>
        );
      })}
      {activeChain.length > 1 && (
        <div style={{ marginTop: 4, color: "#8a9089" }}>
          כל בקשה עוברת אוטומטית לספק הבא בתור ברגע שהראשון נגמר, וחוזרת אליו לבד ברגע שהוא מתאפס. אפשר לכבות כל ספק
          זמנית עם המתג משמאל — בלי למחוק את המפתח שלו — והשרשרת מתעדכנת מיד.
        </div>
      )}
    </div>
  );
}

function SettingsModal({ onClose, readingPrefs, onChangeReadingPrefs, state, onRestoreState, onResetState }) {
  const [prefs, setPrefs] = useState(readingPrefs || defaultReadingPrefs());
  function updatePrefs(patch) {
    const next = { ...prefs, ...patch };
    setPrefs(next);
  }
  const [provider, setProviderField] = useState(getProvider());
  const [key, setKey] = useState(getApiKey(provider));
  const [model, setModelField] = useState(getModel(provider));
  const [imageModel, setImageModelField] = useState(getImageModel(provider));
  const [baseUrl, setBaseUrlField] = useState(getCustomBaseUrl());
  const [saved, setSaved] = useState(false);
  const [testState, setTestState] = useState(null); // null | "testing" | {ok:true} | {ok:false, message}
  const [activeTab, setActiveTab] = useState("display"); // "display" | "api" — page display shows first, API settings are opened from the second tab
  const [modelList, setModelList] = useState([]);
  const [modelListState, setModelListState] = useState(null); // null | "loading" | "error"
  const [modelListError, setModelListError] = useState(null);
  const [imageModelList, setImageModelList] = useState([]);
  const [imageModelListState, setImageModelListState] = useState(null);
  const [imageModelListError, setImageModelListError] = useState(null);
  const [quickKey, setQuickKey] = useState("");
  const [quickResult, setQuickResult] = useState(null); // null | {ok:true,label} | {ok:false,message}
  const [showApiInstructions, setShowApiInstructions] = useState(false);
  const [apiViewMode, setApiViewMode] = useState("quick"); // "quick" | "advanced"
  const [showQuotaPanel, setShowQuotaPanel] = useState(false); // collapsed by default — see the quota button below
  const [imgProviderChoice, setImgProviderChoice] = useState(getImageProviderPref()); // "same" | "google" | "openai"
  const [imgKey, setImgKey] = useState(getImageProviderPref() !== "same" ? getApiKey(getImageProviderPref()) : "");
  const [imgModel, setImgModel] = useState(getImageProviderPref() !== "same" ? getImageModel(getImageProviderPref()) : "");
  const [imgSaved, setImgSaved] = useState(false);

  function switchImgProvider(choice) {
    setImgProviderChoice(choice);
    if (choice !== "same") {
      setImgKey(getApiKey(choice));
      setImgModel(getImageModel(choice));
    }
  }

  function saveImageProvider() {
    setImageProviderPref(imgProviderChoice);
    if (imgProviderChoice !== "same") {
      setApiKey(imgKey, imgProviderChoice);
      setImageModel(imgModel, imgProviderChoice);
    }
    setImgSaved(true);
  }

  function handleQuickConnect() {
    const trimmed = quickKey.trim();
    if (!trimmed) return;
    const detected = detectProviderFromKey(trimmed);
    if (!detected) {
      setQuickResult({
        ok: false,
        message: "לא הצלחנו לזהות אוטומטית את סוג המפתח הזה. הוא נשמר תחת \"מותאם אישית\" למטה — רק צריך להוסיף שם את כתובת ה-Base URL של הספק שלו.",
      });
      switchProvider("custom");
      setKey(trimmed);
      return;
    }
    switchProvider(detected.provider);
    setKey(trimmed);
    if (detected.model) setModelField(detected.model);
    if (detected.baseUrl) setBaseUrlField(detected.baseUrl);
    // Persist immediately so it's connected with no extra steps.
    setProvider(detected.provider);
    setApiKey(trimmed, detected.provider);
    setModel(detected.model || getDefaultModel(detected.provider), detected.provider);
    if (detected.baseUrl) setCustomBaseUrl(detected.baseUrl);
    setQuickResult({ ok: true, label: detected.label });
    setQuickKey("");
  }

  function switchProvider(nextProvider) {
    setProviderField(nextProvider);
    setKey(getApiKey(nextProvider));
    setModelField(getModel(nextProvider));
    setImageModelField(getImageModel(nextProvider));
    setBaseUrlField(getCustomBaseUrl(nextProvider));
    setTestState(null);
    setModelList([]);
    setModelListState(null);
    setImageModelList([]);
    setImageModelListState(null);
  }

  function save() {
    setProvider(provider);
    setApiKey(key, provider);
    setModel(model, provider);
    if (providerSupportsImages(provider)) setImageModel(imageModel, provider);
    if (provider === "custom" || provider === "custom2") setCustomBaseUrl(baseUrl, provider);
    onChangeReadingPrefs(prefs);
    setSaved(true);
  }

  async function testConnection() {
    // save first so the test uses exactly what's currently typed
    setProvider(provider);
    setApiKey(key, provider);
    setModel(model, provider);
    if (providerSupportsImages(provider)) setImageModel(imageModel, provider);
    if (provider === "custom" || provider === "custom2") setCustomBaseUrl(baseUrl, provider);
    setTestState("testing");
    try {
      const reply = await callClaude("Reply with exactly one word: OK", "OK", 50);
      if (reply && reply.trim().length > 0) setTestState({ ok: true });
      else setTestState({ ok: false, message: "התקבלה תשובה ריקה מהספק." });
    } catch (e) {
      setTestState({ ok: false, message: e.message || "שגיאה לא ידועה" });
    }
  }

  async function fetchModelList() {
    if (!key) {
      setModelListState("error");
      setModelListError("צריך להזין מפתח API קודם.");
      return;
    }
    setModelListState("loading");
    setModelListError(null);
    try {
      const list = await listModels(provider, key);
      setModelList(list);
      setModelListState(list.length ? null : "error");
      if (!list.length) setModelListError("לא נמצאו מודלים זמינים למפתח הזה.");
    } catch (e) {
      setModelListState("error");
      setModelListError(e.message || "שגיאה לא ידועה");
    }
  }

  async function fetchImageModelList() {
    if (!key) {
      setImageModelListState("error");
      setImageModelListError("צריך להזין מפתח API קודם.");
      return;
    }
    setImageModelListState("loading");
    setImageModelListError(null);
    try {
      const list = await listImageModels(provider, key);
      setImageModelList(list);
      setImageModelListState(list.length ? null : "error");
      if (!list.length) setImageModelListError("לא נמצאו מודלים ליצירת תמונות למפתח הזה.");
    } catch (e) {
      setImageModelListState("error");
      setImageModelListError(e.message || "שגיאה לא ידועה");
    }
  }

  function resetModel() {
    setModelField(getDefaultModel(provider));
  }

    setImageModelField(getDefaultImageModel(provider));
  }

function WordPopup({ popup, onClose, onSave, saved, onEdit }) {
  const [editing, setEditing] = useState(false);
  const [editValue, setEditValue] = useState("");
  // Lets the person drag the popup somewhere else on screen if it's covering
  // the word/line they're trying to read — resets back to the default spot
  // (near the tapped word) every time a NEW word/phrase is looked up, so it
  // never ends up permanently stuck off in a corner from a previous drag.
  const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
  const dragState = useRef(null); // { pointerId, startX, startY, originX, originY } | null

  useEffect(() => {
    // Reset the edit box whenever a different word is shown.
    setEditing(false);
    setDragOffset({ x: 0, y: 0 });
  }, [popup && popup.word]);

  if (!popup) return null;
  const { x, y, word, loading, translation, error } = popup;

  function startDrag(e) {
    e.stopPropagation();
    dragState.current = { pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, originX: dragOffset.x, originY: dragOffset.y };
    e.currentTarget.setPointerCapture?.(e.pointerId);
  }
  function onDragMove(e) {
    if (!dragState.current || dragState.current.pointerId !== e.pointerId) return;
    e.stopPropagation();
    const { startX, startY, originX, originY } = dragState.current;
    setDragOffset({ x: originX + (e.clientX - startX), y: originY + (e.clientY - startY) });
  }
  function endDrag(e) {
    if (!dragState.current || dragState.current.pointerId !== e.pointerId) return;
    dragState.current = null;
  }

  function startEditing() {
    setEditValue(translation || "");
    setEditing(true);
  }
  function confirmEdit() {
    const trimmed = editValue.trim();
    if (trimmed) onEdit(trimmed);
    setEditing(false);
  }

  return (
    <div
      // Full-screen invisible backdrop: tapping anywhere outside the popup
      // closes it too, so the tiny X button isn't the only way to dismiss it.
      style={{ position: "fixed", inset: 0, zIndex: 59 }}
      onClick={onClose}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          position: "fixed",
          left: "50%",
          top: Math.min(Math.max(y + 22, 10), window.innerHeight - 230),
          transform: `translateX(-50%) translate(${dragOffset.x}px, ${dragOffset.y}px)`,
          zIndex: 60,
          width: 190,
          background: "var(--ink)",
          color: "var(--paper)",
          borderRadius: 12,
          padding: "12px 14px",
          boxShadow: "0 10px 30px rgba(0,0,0,0.25)",
          fontFamily: "'Assistant', sans-serif",
          direction: "rtl",
        }}
        dir="rtl"
      >
        <div
          onPointerDown={startDrag}
          onPointerMove={onDragMove}
          onPointerUp={endDrag}
          onPointerCancel={endDrag}
          role="button"
          aria-label="גררו כדי להזיז את החלונית"
          style={{
            position: "absolute",
            top: 4,
            left: "50%",
            transform: "translateX(-50%)",
            width: 40,
            height: 16,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            cursor: "grab",
            touchAction: "none",
          }}
        >
          <div style={{ width: 30, height: 4, borderRadius: 4, background: "rgba(255,255,255,0.35)" }} />
        </div>
        <button
          onClick={onClose}
          aria-label="סגירה"
          style={{
            position: "absolute",
            top: 2,
            left: 2,
            width: 32,
            height: 32,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            background: "none",
            border: "none",
            color: "var(--paper)",
            opacity: 0.7,
            cursor: "pointer",
            touchAction: "manipulation",
          }}
        >
          <AppIcon name="X" size={16} />
        </button>
        <div style={{ fontFamily: "'Lora', serif", fontStyle: "italic", fontSize: 13, opacity: 0.75, direction: "ltr", textAlign: "left", marginTop: 6 }}>
          {word}
        </div>

        {editing ? (
          <div style={{ marginTop: 6 }}>
            <input
              autoFocus
              type="text"
              value={editValue}
              onChange={(e) => setEditValue(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter") confirmEdit();
                if (e.key === "Escape") setEditing(false);
              }}
              style={{
                width: "100%",
                boxSizing: "border-box",
                padding: "6px 8px",
                borderRadius: 6,
                border: "1.5px solid rgba(255,255,255,0.35)",
                background: "rgba(255,255,255,0.08)",
                color: "var(--paper)",
                fontSize: 15,
                fontWeight: 700,
              }}
            />
            <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
              <button
                onClick={confirmEdit}
                style={{
                  flex: 1,
                  background: "#3E7C74",
                  border: "none",
                  borderRadius: 7,
                  color: "var(--paper)",
                  padding: "6px 8px",
                  fontSize: 12.5,
                  fontWeight: 700,
                  cursor: "pointer",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  gap: 5,
                }}
              >
                <AppIcon name="Check" size={13} />
                שמירה
              </button>
              <button
                onClick={() => setEditing(false)}
                style={{
                  background: "rgba(255,255,255,0.1)",
                  border: "none",
                  borderRadius: 7,
                  color: "var(--paper)",
                  padding: "6px 10px",
                  fontSize: 12.5,
                  cursor: "pointer",
                }}
              >
                ביטול
              </button>
            </div>
          </div>
        ) : (
          <div style={{ marginTop: 4, display: "flex", alignItems: "flex-start", gap: 6 }}>
            <div style={{ fontSize: 17, fontWeight: 700, minHeight: 24, flex: 1 }}>
              {loading ? <AppIcon name="Loader2" size={16} className="spin" /> : error ? "שגיאה בתרגום" : translation}
            </div>
            {!loading && !error && (
              <button
                onClick={startEditing}
                aria-label="עריכת התרגום"
                style={{
                  flexShrink: 0,
                  width: 26,
                  height: 26,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  background: "rgba(255,255,255,0.1)",
                  border: "none",
                  borderRadius: 6,
                  color: "var(--paper)",
                  opacity: 0.85,
                  cursor: "pointer",
                }}
              >
                <AppIcon name="Pencil" size={13} />
              </button>
            )}
          </div>
        )}

        {!loading && !error && !editing && (
          <button
            onClick={onSave}
            style={{
              marginTop: 8,
              width: "100%",
              background: saved ? "#3E7C74" : "rgba(255,255,255,0.12)",
              border: "none",
              borderRadius: 8,
              color: "var(--paper)",
              padding: "7px 8px",
              fontSize: 13,
              fontWeight: 600,
              cursor: "pointer",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: 6,
            }}
          >
            {saved ? <AppIcon name="Check" size={14} /> : <AppIcon name="Plus" size={14} />}
            {saved ? "נשמר במילים שלי" : "הוסף למילים שלי"}
          </button>
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Story art — a small deterministic SVG illustration generated entirely in
// the browser (no network request at all), so an illustration is 100%
// guaranteed to appear for every story/chapter, instantly, everywhere
// (including inside sandboxed previews that block outside network calls).
// ---------------------------------------------------------------------------

function hashStr(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shade(hex, percent) {
  const num = parseInt(hex.replace("#", ""), 16);
  let r = (num >> 16) + Math.round(255 * percent);
  let g = ((num >> 8) & 0x00ff) + Math.round(255 * percent);
  let b = (num & 0x0000ff) + Math.round(255 * percent);
  r = Math.max(Math.min(255, r), 0);
  g = Math.max(Math.min(255, g), 0);
  b = Math.max(Math.min(255, b), 0);
  return "#" + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
}

function StoryArt({ seed, color, motif, height = 170 }) {
  const uid = hashStr(seed || "seed");
  const patternId = "hatch-" + uid;
  const filterId = "sketchy-" + uid;
  const ink = "#2b2118";
  const paper = shade("#F3EEDC", 0);
  const accent = shade(color, 0.12);

  return (
    <svg
      viewBox="0 0 400 190"
      width="100%"
      height={height}
      preserveAspectRatio="xMidYMax slice"
      style={{ display: "block", borderRadius: 12, border: `1px solid ${color}30`, background: paper }}
    >
      <defs>
        <pattern id={patternId} width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="6" stroke={ink} strokeWidth="1" opacity="0.35" />
        </pattern>
        <filter id={filterId} x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed={uid % 1000} result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
      <rect width="400" height="190" fill={paper} />
      <g filter={`url(#${filterId})`}>
        <ArtScene motif={motif} ink={ink} hatch={`url(#${patternId})`} accent={accent} />
      </g>
    </svg>
  );
}

function ChapterImage({ seed, color, motif, chapter, onRetry }) {
  const status = chapter && chapter.imageStatus;
  const pdfImages = chapter && chapter.pdfImages;
  // These chapters get their illustrations from the original PDF itself,
  // placed inline at their true positions within the text (see
  // ClickableText's inlineImages support, wired up for both the continuous
  // and paginated reading modes) — no separate header image is needed, in
  // either mode.
  if (pdfImages && pdfImages.length) return null;
  if (status === "loading") {
    return (
      <div
        style={{
          margin: "4px 0 16px 0",
          height: 168,
          borderRadius: 12,
          border: `1px dashed ${color}40`,
          background: `${color}08`,
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          gap: 8,
          color,
        }}
      >
        <AppIcon name="Loader2" className="spin" size={20} />
        <span style={{ fontSize: 11.5, color: "#8a9089" }}>מציירים את הסצנה…</span>
      </div>
    );
  }
  if (status === "done" && chapter.image) {
    return (
      <div style={{ margin: "4px 0 16px 0" }}>
        <img
          src={chapter.image}
          alt=""
          loading="lazy"
          style={{ width: "100%", maxHeight: 340, objectFit: "cover", borderRadius: 12, border: `1px solid ${color}30`, display: "block" }}
        />
      </div>
    );
  }
  // "none" (unsupported provider / generation failed) or legacy chapters
  // with no image fields at all — always falls back to the free, instant,
  // guaranteed-to-render procedural illustration. Never a crash, never a
  // stuck screen — worst case the reader sees this sketch plus (when there
  // really was a failed real-illustration attempt, as opposed to simply an
  // unsupported provider) a small note and a button to try again.
  return (
    <div style={{ margin: "4px 0 16px 0" }}>
      <StoryArt seed={seed} color={color} motif={motif} />
      {chapter && chapter.imageError && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 4, flexWrap: "wrap" }}>
          <div style={{ fontSize: 10.5, color: "#8B3A3A", opacity: 0.75 }}>לא נוצר איור אמיתי לקטע זה (מוצג שרטוט חלופי)</div>
          {onRetry && (
            <button
              onClick={onRetry}
              style={{
                fontSize: 10.5,
                color,
                background: `${color}12`,
                border: `1px solid ${color}40`,
                borderRadius: 8,
                padding: "3px 8px",
                cursor: "pointer",
                display: "inline-flex",
                alignItems: "center",
                gap: 4,
              }}
            >
              <AppIcon name="RefreshCw" size={11} />
              טען איור מחדש
            </button>
          )}
        </div>
      )}
    </div>
  );
}

// A whitespace-only token from the tokenizer normally renders as an inert
// text node — but plain HTML text collapses ALL runs of whitespace,
// including real newlines, down to a single space. That's invisible for
// flowing prose, but silently destroys the line-by-line structure a play
// script or a poem depends on (character cues, stage directions, verse
// lines, stanza breaks) — the AI can format it perfectly and it would still
// display as one run-on paragraph. So any newline(s) in a whitespace token
// become actual <br/> line breaks instead (capped at 2 in a row — one
// blank line — so a stray extra newline in the generated text can't blow
// up into a huge gap).
function renderWhitespaceToken(tok, key) {
  const newlineCount = (tok.match(/\n/g) || []).length;
  if (newlineCount === 0) return <React.Fragment key={key}>{tok}</React.Fragment>;
  const brCount = Math.min(newlineCount, 2);
  return (
    <React.Fragment key={key}>
      {Array.from({ length: brCount }).map((_, idx) => (
        <br key={idx} />
      ))}
    </React.Fragment>
  );
}

// Same token regex ClickableText itself uses below — kept as a standalone
// helper so other code (the saved-word "jump to exact source" fallback in
// StoryView) can tokenize a chunk of chapter text the exact same way,
// without needing a mounted ClickableText to do it.
function wordTextTokens(content) {
  return (content || "").match(/[A-Za-z]+(?:'[A-Za-z]+)?|[^A-Za-z\s]+|\s+/g) || [];
}

function ClickableText({ content, source, savedWordsLower, onWordClick, onHighlightClick, phraseAnchor, highlightRanges, as = "p", style, dropCap, dropCapColor, speakingOffset, inlineImages }) {
  const tokens = useMemo(() => content.match(/[A-Za-z]+(?:'[A-Za-z]+)?|[^A-Za-z\s]+|\s+/g) || [], [content]);
  const Wrap = as;
  const firstWordIndex = dropCap ? tokens.findIndex((t) => /^[A-Za-z]+(?:'[A-Za-z]+)?$/.test(t)) : -1;
  // inlineImages: [{offset, dataUrl}], offset = absolute character position
  // into THIS content string (e.g. chapter.pdfImages, extracted from the
  // original PDF at its true position). Emitted as ordinary <img> elements
  // interleaved among the token spans below, purely additively — every
  // token's start/end/data-tts-start stays exactly as it was, so bookmarks,
  // read-aloud, highlighting, and tap-to-lookup are all completely
  // unaffected by images being present.
  const sortedImages = useMemo(
    () => (inlineImages && inlineImages.length ? [...inlineImages].sort((a, b) => a.offset - b.offset) : null),
    [inlineImages]
  );
  let pos = 0;
  let nextImageIdx = 0;
  const nodes = [];
  const pushImage = (img, key) => {
    nodes.push(
      <img
        key={key}
        src={img.dataUrl}
        alt=""
        loading="lazy"
        style={{ display: "block", width: "100%", maxHeight: 420, objectFit: "contain", borderRadius: 10, margin: "16px 0" }}
      />
    );
  };
  tokens.forEach((tok, i) => {
    const start = pos;
    const end = pos + tok.length;
    pos = end;
    while (sortedImages && nextImageIdx < sortedImages.length && start >= sortedImages[nextImageIdx].offset) {
      pushImage(sortedImages[nextImageIdx], `pdfimg-${nextImageIdx}`);
      nextImageIdx++;
    }
    const hl = highlightRanges && highlightRanges.find((r) => start < r.end && end > r.start);
    const isWord = /^[A-Za-z]+(?:'[A-Za-z]+)?$/.test(tok);
    if (isWord) {
      const isSaved = savedWordsLower.has(tok.toLowerCase());
      const isAnchor = phraseAnchor && phraseAnchor.source === source && phraseAnchor.tokenIndex === i;
      const isSpeaking = speakingOffset != null && start <= speakingOffset && speakingOffset < end;
      const hlColor = hl && (hl.emphasized ? emphasizedHighlightColor(hl.color) : hl.color);
      const bg = isAnchor ? "rgba(62,124,116,0.4)" : hl ? hlColor : isSaved ? "rgba(192,138,62,0.12)" : "transparent";
      nodes.push(
        <span
          key={i}
          data-tts-start={start}
          onClick={(e) => {
            // While a grammar rule is highlighted, tapping any word that's
            // part of a highlighted span shows what grammar type it is,
            // instead of the normal dictionary/save-word click.
            if (hl && onHighlightClick) {
              onHighlightClick(hl, e);
              return;
            }
            onWordClick(tok, e, { tokens, tokenIndex: i, content, source });
          }}
          style={{
            cursor: "pointer",
            borderBottom: isAnchor
              ? `2px solid #3E7C74`
              : hl && hl.emphasized
              ? `2px solid ${emphasizedHighlightColor(hl.color).replace(/[\d.]+\)$/, "0.95)")}`
              : isSaved
              ? "2px solid #C08A3E"
              : "1.5px dotted rgba(35,52,46,0.28)",
            background: isSpeaking ? "rgba(224,168,58,0.55)" : bg,
            borderRadius: 2,
            transition: "background 0.15s ease",
          }}
          onMouseEnter={(e) => {
            if (!isAnchor && !hl && !isSpeaking) e.currentTarget.style.background = isSaved ? "rgba(192,138,62,0.22)" : "rgba(62,124,116,0.12)";
          }}
          onMouseLeave={(e) => {
            if (!isAnchor && !isSpeaking) e.currentTarget.style.background = hl ? hlColor : isSaved ? "rgba(192,138,62,0.12)" : "transparent";
          }}
        >
          {i === firstWordIndex ? (
            <>
              <span
                style={{
                  float: "left",
                  fontFamily: "'EB Garamond', serif",
                  fontStyle: "normal",
                  fontWeight: 700,
                  fontSize: "3em",
                  lineHeight: 0.82,
                  color: dropCapColor || "var(--ink)",
                  padding: "0.09em 0.06em 0 0.01em",
                  margin: 0,
                }}
              >
                {tok[0]}
              </span>
              {tok.slice(1)}
            </>
          ) : (
            tok
          )}
        </span>
      );
    } else if (hl) {
      // non-word (punctuation/whitespace) — still wrap in a span when highlighted, so the
      // highlight background looks continuous across spaces/punctuation within a phrase,
      // and so a tap on a highlighted punctuation mark also opens the grammar-type popup.
      const isBlank = /^\s+$/.test(tok);
      nodes.push(
        <span
          key={i}
          onClick={isBlank ? undefined : (e) => onHighlightClick && onHighlightClick(hl, e)}
          style={{ background: hl.emphasized ? emphasizedHighlightColor(hl.color) : hl.color, cursor: isBlank ? "default" : "pointer" }}
        >
          {isBlank ? renderWhitespaceToken(tok, i) : tok}
        </span>
      );
    } else {
      nodes.push(renderWhitespaceToken(tok, i));
    }
  });
  // Any images that never got flushed above — content shorter than an
  // image's recorded offset (shouldn't normally happen, but degrade
  // gracefully rather than silently drop the image) — go at the very end.
  while (sortedImages && nextImageIdx < sortedImages.length) {
    pushImage(sortedImages[nextImageIdx], `pdfimg-${nextImageIdx}`);
    nextImageIdx++;
  }
  return <Wrap style={{ margin: 0, ...style }}>{nodes}</Wrap>;
}

// ---------------------------------------------------------------------------
// Main App
// ---------------------------------------------------------------------------

function App() {
  const [state, setState] = useState(null);
  const [ready, setReady] = useState(false);
  const [view, setView] = useState("home"); // home | story | words | library | grammar | search | publicLibrary
  const [activeStoryId, setActiveStoryId] = useState(null);
  const [activeChapterIndex, setActiveChapterIndex] = useState(0);
  // Loading status is a small, non-blocking floating indicator (not a
  // full-screen modal) — the reader can keep browsing (switch tabs, read a
  // different chapter, open the library...) while a story/chapter keeps
  // generating in the background. Up to MAX_CONCURRENT_JOBS generations can
  // run at once (e.g. two different books), each tracked as its own job so
  // one starting/finishing never clobbers the other's card.
  const MAX_CONCURRENT_JOBS = 2;
  const [loadingJobs, setLoadingJobs] = useState([]);
  // Each job: { id, category: {name,color,itemLabel} | null, level: number |
  // null, chapterNumber: number | null, chapterTitle: string | null,
  // storyTitle: string | null, note: string | null, estimateSeconds,
  // startedAt, target: {storyId, chapterIndex} | null, done: boolean, title:
  // string | null }. `category`/`level`/`chapterNumber`/`chapterTitle`/
  // `storyTitle` describe WHAT is being generated (so the floating widget can
  // show it plainly instead of a generic spinner); `note` is a small,
  // secondary status line (e.g. "provider is busy, waiting Ns and retrying")
  // shown under that in smaller text. `target` is filled in once the story
  // exists (a fresh story doesn't have an id yet during outline planning).
  // Once a job's `done` becomes true it does NOT auto-clear — it stays
  // exactly like a completed download notification (100%, title, "enter"
  // button) until the reader taps it or dismisses it.
  const activeJobIdsRef = useRef(new Set());
  const blankJob = (jobId) => ({
    id: jobId,
    category: null,
    level: null,
    chapterNumber: null,
    chapterTitle: null,
    storyTitle: null,
    note: null,
    estimateSeconds: null,
    startedAt: null,
    target: null,
    done: false,
    title: null,
  });
  // Sets WHAT is being generated — category/level/story title/chapter
  // number+title — as soon as each piece becomes known. Called more than
  // once per job as more details resolve (e.g. the story title only exists
  // after the outline call returns).
  const setLoadingContext = useCallback((jobId, patch) => {
    setLoadingJobs((prev) => {
      const existing = prev.find((j) => j.id === jobId);
      if (existing) return prev.map((j) => (j.id === jobId ? { ...j, ...patch } : j));
      return [...prev, { ...blankJob(jobId), ...patch }];
    });
  }, []);
  // Sets the small secondary status line (rate-limit waits, etc.) — pass
  // null to clear it once the wait is over. Only resets the progress-ring
  // timer when a fresh estimateSeconds is given.
  const setLoadingNote = useCallback((jobId, note, estimateSeconds) => {
    setLoadingJobs((prev) => {
      const existing = prev.find((j) => j.id === jobId);
      if (existing) {
        return prev.map((j) =>
          j.id === jobId
            ? { ...j, note, done: false, ...(estimateSeconds != null ? { estimateSeconds, startedAt: Date.now() } : {}) }
            : j
        );
      }
      return [
        ...prev,
        { ...blankJob(jobId), note, estimateSeconds: estimateSeconds ?? null, startedAt: estimateSeconds != null ? Date.now() : null },
      ];
    });
  }, []);
  // Operation failed/aborted — drop this job entirely.
  const removeLoadingJob = useCallback((jobId) => setLoadingJobs((prev) => prev.filter((j) => j.id !== jobId)), []);
  const setLoadingTarget = useCallback((jobId, target) => {
    setLoadingJobs((prev) => prev.map((j) => (j.id === jobId ? { ...j, target } : j)));
  }, []);
  // finishLoadingSuccess (below) needs to know where the reader IS RIGHT
  // NOW when a background generation finishes — not where they were when
  // that generation started. It's called from deep inside long-running
  // async functions (createNewStory, writeChapterAt, ...) whose closures
  // captured `view`/`activeStoryId` back when the user clicked to kick
  // things off; reading those stale variables instead of fresh state was
  // exactly backwards in both directions — a reader who navigated AWAY
  // before it finished still read as "currently viewing" (so the job got
  // silently dropped instead of turning into a "ready, tap to enter" card),
  // while a reader who navigated INTO the story before it finished still
  // read as "not viewing" (so a stale card kept sitting there even though
  // the content was already right in front of them). Refs always hold the
  // latest value no matter which render's closure reads them, which is
  // exactly what's needed here.
  const viewRef = useRef(view);
  viewRef.current = view;
  const activeStoryIdRef = useRef(activeStoryId);
  activeStoryIdRef.current = activeStoryId;
  const finishLoadingSuccess = useCallback((jobId, target, title) => {
    // If the reader is already sitting on exactly this story (any
    // chapter), the freshly generated content is already in state and
    // about to re-render on its own — no "download finished, tap to
    // enter" card is needed; that card exists only to bring the reader
    // back INTO a page they've since navigated away from.
    const isCurrentlyViewing = viewRef.current === "story" && activeStoryIdRef.current === target.storyId;
    setLoadingJobs((prev) =>
      isCurrentlyViewing ? prev.filter((j) => j.id !== jobId) : prev.map((j) => (j.id === jobId ? { ...j, done: true, target, title } : j))
    );
  }, []);
  const openLoadingTarget = useCallback((target) => {
    if (!target) return;
    setActiveStoryId(target.storyId);
    if (target.chapterIndex != null) setActiveChapterIndex(target.chapterIndex);
    setView("story");
  }, []);
  const openLoadingJob = useCallback(
    (jobId) => {
      const job = loadingJobs.find((j) => j.id === jobId);
      if (job && job.target) openLoadingTarget(job.target);
      setLoadingJobs((prev) => prev.filter((j) => j.id !== jobId));
    },
    [loadingJobs, openLoadingTarget]
  );
  const dismissLoadingJob = useCallback((jobId) => setLoadingJobs((prev) => prev.filter((j) => j.id !== jobId)), []);
  // "Already generating something" guard for every entry point below: with
  // up to MAX_CONCURRENT_JOBS jobs already running, a further tap doesn't
  // queue a 3rd parallel generation — it just says so instead of silently
  // doing nothing (or worse, doubling up on one of the two already running).
  function blockedByConcurrencyLimit(itemLabel) {
    if (activeJobIdsRef.current.size < MAX_CONCURRENT_JOBS) return false;
    setErrorMsg(`אפשר ליצור עד ${MAX_CONCURRENT_JOBS} ${itemLabel || "פריטים"} במקביל — המתינו לסיום אחד מהם ונסו שוב.`);
    return true;
  }
  // Stamps every story with the moment it was last opened for reading —
  // regardless of how the reader got there (library, "מילים שלי", a fresh
  // search result, "continue reading" on the home page, etc.) — so the
  // library can offer an "אחרון שנקרא" sort order. Runs whenever the reader
  // lands on the story view for a given story id.
  useEffect(() => {
    if (view !== "story" || !activeStoryId) return;
    setState((prev) => {
      if (!prev || !prev.stories[activeStoryId]) return prev;
      return {
        ...prev,
        stories: {
          ...prev.stories,
          [activeStoryId]: { ...prev.stories[activeStoryId], lastOpenedAt: Date.now() },
        },
      };
    });
  }, [view, activeStoryId]);
  // Every navigation to a new screen — switching top-level views, opening a
  // story/book, or moving to a different chapter within one — should land
  // scrolled to the top, never wherever the previous screen happened to be
  // scrolled to. UNLESS suppressScrollResetRef was armed just before this
  // navigation (by the "resume to last position" flow jumping into a
  // different chapter for a bookmark) — in which case this reset is skipped
  // entirely, so StoryView's own precise scroll-to-the-exact-word isn't
  // clobbered. (React fires a child's effects before its parent's on the
  // same update, so without this flag, this effect would always run AFTER
  // StoryView already scrolled to the right spot, and silently undo it.)
  const suppressScrollResetRef = useRef(false);
  useEffect(() => {
    if (suppressScrollResetRef.current) {
      suppressScrollResetRef.current = false;
      return;
    }
    window.scrollTo({ top: 0, left: 0, behavior: "auto" });
  }, [view, activeStoryId, activeChapterIndex]);
  const [errorMsg, setErrorMsg] = useState(null);
  const [popup, setPopup] = useState(null);
  const [duplicateStoryPrompt, setDuplicateStoryPrompt] = useState(null); // { existingStoryId, existingTitle, query, level } | null
  const [showSettings, setShowSettings] = useState(false);
  const [showPdfImport, setShowPdfImport] = useState(false);
  const [showArticleImport, setShowArticleImport] = useState(false);
  const [deleteStoryId, setDeleteStoryId] = useState(null); // story id pending delete confirmation, or null
  const [phraseMode, setPhraseMode] = useState(false);
  const [phraseAnchor, setPhraseAnchor] = useState(null);
  // Word-translation is always the DEFAULT the moment a section/book is
  // (re)opened — phrase/sentence mode is a deliberate, temporary choice for
  // the CURRENT reading session, not something that should silently carry
  // over and surprise the reader the next time they open a story/chapter.
  useEffect(() => {
    setPhraseMode(false);
    setPhraseAnchor(null);
    setPopup(null);
  }, [activeStoryId, activeChapterIndex]);
  const saveTimer = useRef(null);
  const cloudSyncTimer = useRef(null);
  const [showOnboarding, setShowOnboarding] = useState(false);
  const [cloudSyncStatus, setCloudSyncStatus] = useState(null); // { state: "syncing"|"done"|"error", message } | null

  function withApiKeyGuard(err) {
    if (err instanceof MissingApiKeyError) {
      setErrorMsg("צריך להגדיר ספק AI ומפתח API בהגדרות (סמל גלגל השיניים) כדי ליצור סיפורים ותרגומים.");
      return true;
    }
    if (isApiKeyAuthError(err)) {
      setErrorMsg("תוקפו של קוד ה-API פג. יש להיכנס לקישור בהגדרות, למחוק את הקוד הקיים וליצור קוד חדש.");
      return true;
    }
    return false;
  }

  // load
  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get(STORAGE_KEY);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          // ensure all categories exist (in case of future additions)
          const base = emptyState();
          CATEGORIES.forEach((c) => {
            if (!parsed.categoryProgress[c.id]) parsed.categoryProgress[c.id] = base.categoryProgress[c.id];
          });
          if (!parsed.readingPrefs) parsed.readingPrefs = base.readingPrefs;
          if (!parsed.librarySort) parsed.librarySort = base.librarySort;
          setState(parsed);
        } else {
          setState(emptyState());
        }
      } catch (e) {
        setState(emptyState());
      }
      setReady(true);
      // The one-time backup/email prompt: shown exactly once, the very first
      // time the app ever runs on a given browser profile. Skipping it (or
      // completing it) both mark it done — from then on, the same setup only
      // lives in Settings → "הגדרת גיבוי ושמירה".
      if (!localStorage.getItem(ONBOARDED_KEY)) {
        setShowOnboarding(true);
      }
    })();
  }, []);

  // Self-heal illustrations stuck at imageStatus "loading" — this happens
  // whenever a session ends (tab closed, phone locked, page reloaded)
  // while a chapter's illustration request was still in flight: nothing
  // ever retried it, so it was stuck showing the "מציירים את הסצנה…"
  // spinner forever on every future visit, looking exactly like "the image
  // just never shows" — regardless of whether an API key is configured now.
  // Runs once, right after the saved state finishes loading, so it only
  // catches genuinely stale leftovers from a previous session rather than
  // interfering with an illustration actively being generated right now.
  const healedStuckImages = useRef(false);
  useEffect(() => {
    if (!ready || !state || healedStuckImages.current) return;
    healedStuckImages.current = true;
    Object.values(state.stories).forEach((s) => {
      (s.chapters || []).forEach((c, i) => {
        if (c && c.imageStatus === "loading") loadChapterImage(s.id, i, null, c.content);
      });
    });
  }, [ready, state]);

  // persist (debounced)
  useEffect(() => {
    if (!ready || !state) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await storage.set(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // ignore
      }
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [state, ready]);

  // auto cloud backup (debounced) — only runs once a backup email + project
  // are configured AND the reader has switched auto-backup on in Settings.
  // Silent on success; surfaces a small status line only on failure so a
  // flaky connection doesn't spam the reader while they're reading.
