  // Runs non-interactively: it will never itself pop open a Google
  // sign-in window — that only ever happens from an explicit tap (see
  // BackupSettingsPanel). If nobody's signed in yet, it just waits quietly
  // until the reader connects manually.
  useEffect(() => {
    if (!ready || !state) return;
    if (!getAutoSync() || !cloudReady()) return;
    if (cloudSyncTimer.current) clearTimeout(cloudSyncTimer.current);
    cloudSyncTimer.current = setTimeout(async () => {
      if (getCloudConfig() && !getGoogleUser()) return; // Firebase mode, nobody signed in — skip silently
      setCloudSyncStatus({ state: "syncing", message: "מגבים לענן…" });
      try {
        await pushBackup(state, undefined, false);
        setCloudSyncStatus({ state: "done", message: "הגיבוי עודכן" });
      } catch (e) {
        setCloudSyncStatus({ state: "error", message: e.message || "גיבוי אוטומטי נכשל" });
      }
    }, 4000);
    return () => clearTimeout(cloudSyncTimer.current);
  }, [state, ready]);

  // auto cloud restore, once per app load — as soon as the app is ready and
  // a backup identity (email or Google account) is configured, silently
  // checks whether the backup has anything this device doesn't, and merges
  // in just that (never overwrites anything already here — see
  // mergeBackupPatch). Runs non-interactively, same as auto-backup above:
  // in Firebase mode it will never itself pop open a Google sign-in window,
  // it just waits quietly until the reader connects manually.
  const autoRestoredRef = useRef(false);
  useEffect(() => {
    if (!ready || !state) return;
    if (autoRestoredRef.current) return;
    autoRestoredRef.current = true;
    if (!cloudReady()) return;
    if (getCloudConfig() && !getGoogleUser()) return; // Firebase mode, nobody signed in — skip silently
    (async () => {
      try {
        const result = await pullBackup(state, undefined, false);
        if (result && (result.newStoryCount || result.newWordCount || result.categoriesRestoredCount)) {
          setState((prev) => mergeBackupPatch(prev, result.patch));
          setCloudSyncStatus({
            state: "done",
            message: `שוחזרו ${result.newStoryCount} ספרים, ${result.newWordCount} מילים ורמות התקדמות ב-${result.categoriesRestoredCount} נושאים מהגיבוי`,
          });
        }
      } catch (e) {
        // Silent — this is a background check on app entry, not a
        // user-initiated action, so it shouldn't interrupt reading.
      }
    })();
  }, [ready, state]);


  const activeStory = activeStoryId && state ? state.stories[activeStoryId] : null;
  // A "done" (finished, waiting to be tapped) job card is only meant to
  // bring the reader back INTO a story they've navigated away from. If
  // they end up viewing that exact story by any other means — opening it
  // from the library, say, rather than tapping the card itself — the card
  // is now redundant: they're already looking at the content. Drop it
  // automatically the moment that happens, instead of leaving a stale
  // "ready" notification sitting on screen for something they're already
  // reading.
  useEffect(() => {
    if (view !== "story" || !activeStoryId) return;
    setLoadingJobs((prev) => {
      const next = prev.filter((j) => !(j.done && j.target && j.target.storyId === activeStoryId));
      return next.length === prev.length ? prev : next;
    });
  }, [view, activeStoryId]);
  // The (at most one) in-progress job for exactly the story+chapter the
  // reader currently has open — drives the full-page loader inside
  // StoryView. Finished ("done") jobs are excluded here on purpose: once a
  // job finishes while the reader is elsewhere, finishLoadingSuccess above
  // either already dropped it (if they were on that exact story) or left it
  // for the floating "ready" card — never for this full-page loader again.
  const activeChapterJob = loadingJobs.find(
    (j) => !j.done && j.target && j.target.storyId === activeStoryId && j.target.chapterIndex === activeChapterIndex
  );
  const activeCategory = activeStory ? CAT_BY_ID[activeStory.categoryId] : null;

  const savedWordsLowerForStory = useMemo(() => {
    if (!state || !activeStoryId) return new Set();
    const set = new Set();
    Object.values(state.words).forEach((w) => {
      if (w.storyId === activeStoryId) set.add(w.word.toLowerCase());
    });
    return set;
  }, [state, activeStoryId]);

  function goHome() {
    setView("home");
    setPopup(null);
    setErrorMsg(null);
  }

  async function startOrContinue(catId) {
    setErrorMsg(null);
    const progress = state.categoryProgress[catId];
    if (progress.currentStoryId && state.stories[progress.currentStoryId] && !state.stories[progress.currentStoryId].read) {
      const s = state.stories[progress.currentStoryId];
      setActiveStoryId(s.id);
      let lastGenIdx = 0;
      for (let i = s.chapters.length - 1; i >= 0; i--) {
        if (s.chapters[i]) {
          lastGenIdx = i;
          break;
        }
      }
      setActiveChapterIndex(initialChapterIndex(s, state.readingPrefs, lastGenIdx));
      setView("story");
      return;
    }
    await createNewStory(catId, progress.level);
  }

  async function createNewStory(catId, level) {
    const category = CAT_BY_ID[catId];
    const itemLabel = category.itemLabel || "סיפור";
    if (blockedByConcurrencyLimit(itemLabel)) return;
    const jobId = uid();
    activeJobIdsRef.current.add(jobId);
    const info = getLevelInfo(level);
    // Poetry is always exactly one poem per level — never split across
    // several chapters the way prose books/plays are — regardless of what
    // the level's usual chapter-count formula would otherwise give.
    const totalChapters = catId === "poetry" ? 1 : info.chapters;
    setLoadingContext(jobId, { category: { name: category.name, color: category.color, itemLabel }, level });
    setLoadingNote(jobId, null, estimateOutlineSeconds(totalChapters) + estimateChapterSeconds(info.wordsPerChapter));
    try {
      const progress = state.categoryProgress[catId];
      // Step 1: plan the book — small/fast call, no chapter content yet.
      // This is what actually populates the chapter menu, and it happens
      // BEFORE any slow content generation, so the outline is available
      // right away regardless of how long chapter 1 itself takes. Until
      // this resolves the widget just shows the category+level (this is a
      // "surprise" pick from the category, not something the reader asked
      // for by name) — the actual title appears the moment it's known.
      const plan = await generateBookOutline({
        category,
        level,
        totalChapters,
        avoidTopics: progress.usedSubtopics,
        onRateLimitWait: (seconds) => setLoadingNote(jobId, `השירות עמוס כרגע — ממתינים ${seconds} שניות ומנסים שוב אוטומטית…`),
      });
      const subtopicLabel = plan.subtopic;
      const source = `${plan.sourceWork || "מקור כללי"} — ${plan.sourceAuthor || "לא צוין"}`;
      const outline = plan.outline; // already sanitized to exactly totalChapters entries (or null for a single-chapter book)
      const storyId = uid();
      const shellStory = {
        id: storyId,
        categoryId: catId,
        level,
        storyTitle: plan.storyTitle,
        tagline: plan.tagline,
        subtopic: subtopicLabel,
        source,
        totalChapters,
        outline,
        chapters: Array.from({ length: totalChapters }, () => null),
        read: false,
        createdAt: Date.now(),
      };
      setState((prev) => {
        const next = { ...prev, stories: { ...prev.stories, [shellStory.id]: shellStory } };
        const p = { ...next.categoryProgress[catId] };
        p.storyIds = [...p.storyIds, shellStory.id];
        p.usedSubtopics = [...p.usedSubtopics, subtopicLabel]; // keep full history — never repeat a tale/subtopic
        p.currentStoryId = shellStory.id;
        next.categoryProgress = { ...next.categoryProgress, [catId]: p };
        return next;
      });
      // Only auto-navigate into the freshly created story if the reader
      // isn't already busy elsewhere with another job still running — with
      // 2 possible concurrent generations, jumping the reader into THIS one
      // out from under them while they're watching a different one load
      // would be disorienting.
      if (activeJobIdsRef.current.size <= 1) {
        setActiveStoryId(storyId);
        setActiveChapterIndex(initialChapterIndex(shellStory, state.readingPrefs, 0));
        setView("story");
      }
      setLoadingTarget(jobId, { storyId, chapterIndex: 0 });
      // Now that the plan resolved, the book's (and — for a multi-chapter
      // book — chapter 1's) real title is known, so show it plainly instead
      // of the generic category placeholder.
      setLoadingContext(jobId, {
        storyTitle: plan.storyTitle,
        chapterNumber: totalChapters > 1 ? 1 : null,
        chapterTitle: totalChapters > 1 ? (outline ? outline[0].title : plan.chapterTitle) : null,
      });

      // Step 2: write chapter 1's actual content, using the exact same
      // outline-driven path every other chapter uses.
      const res = await generateChapter({
        category,
        level,
        isFirst: false,
        chapterIndex: 0,
        totalChapters,
        storyTitle: plan.storyTitle,
        subtopic: subtopicLabel,
        previousExcerpt: null,
        outlineEntry: outline ? outline[0] : { title: plan.chapterTitle, summary: "" },
        fullOutline: outline,
        onRateLimitWait: (seconds) => setLoadingNote(jobId, `השירות עמוס כרגע — ממתינים ${seconds} שניות ומנסים שוב אוטומטית…`),
      });
      setState((prev) => {
        const s = { ...prev.stories[storyId] };
        const chapters = s.chapters.slice();
        chapters[0] = { title: numberedChapterTitle(res.chapterTitle, 0, totalChapters), content: res.content, image: null, imageStatus: "loading" };
        s.chapters = chapters;
        return { ...prev, stories: { ...prev.stories, [s.id]: s } };
      });
      loadChapterImage(storyId, 0, res.imagePrompt, res.content);
      finishLoadingSuccess(jobId, { storyId, chapterIndex: 0 }, plan.storyTitle);
      maybePushStoryToPublicLibrary({
        ...shellStory,
        chapters: [
          { title: numberedChapterTitle(res.chapterTitle, 0, totalChapters), content: res.content, image: null, imageStatus: "loading" },
          ...shellStory.chapters.slice(1),
        ],
      });
    } catch (e) {
      if (!withApiKeyGuard(e)) setErrorMsg(describeGenerationError(e, `לא הצלחנו ליצור ${itemLabel} חדש`));
      removeLoadingJob(jobId);
    } finally {
      activeJobIdsRef.current.delete(jobId);
    }
  }

  async function createSearchedStory(query, level, force, isPublic = true) {
    if (!force) {
      const norm = normalizeSearchQuery(query);
      const match = Object.values(state.stories).find(
        (s) =>
          s.categoryId === "search" &&
          norm &&
          ((s.searchQuery && normalizeSearchQuery(s.searchQuery) === norm) ||
            (s.storyTitle && normalizeSearchQuery(s.storyTitle) === norm))
      );
      if (match) {
        setDuplicateStoryPrompt({ existingStoryId: match.id, existingTitle: match.storyTitle, query, level, isPublic });
        return;
      }
    }
    // See createNewStory's identical guard: never let more than
    // MAX_CONCURRENT_JOBS generations run in parallel.
    if (blockedByConcurrencyLimit("ספרים")) return;
    const jobId = uid();
    activeJobIdsRef.current.add(jobId);
    const info = getLevelInfo(level);
    // The search query itself IS the "topic" here (the reader asked for it
    // by name), so it doubles as the story-title placeholder until the real
    // title comes back from the outline call.
    setLoadingContext(jobId, { category: { name: SEARCH_CATEGORY.name, color: SEARCH_CATEGORY.color, itemLabel: "ספר" }, level, storyTitle: query });
    setLoadingNote(jobId, null, estimateOutlineSeconds(info.chapters) + estimateChapterSeconds(info.wordsPerChapter));
    try {
      const plan = await generateBookOutline({
        category: SEARCH_CATEGORY,
        level,
        totalChapters: info.chapters,
        forcedQuery: query,
        onRateLimitWait: (seconds) => setLoadingNote(jobId, `השירות עמוס כרגע — ממתינים ${seconds} שניות ומנסים שוב אוטומטית…`),
      });
      const source = `${plan.sourceWork || "מקור כללי"} — ${plan.sourceAuthor || "לא צוין"}`;
      const outline = plan.outline;
      const storyId = uid();
      const shellStory = {
        id: storyId,
        categoryId: "search",
        level,
        storyTitle: plan.storyTitle,
        tagline: plan.tagline,
        subtopic: plan.subtopic,
        source,
        searchQuery: query,
        isPublic: isPublic !== false,
        totalChapters: info.chapters,
        outline,
        chapters: Array.from({ length: info.chapters }, () => null),
        read: false,
        createdAt: Date.now(),
      };
      setState((prev) => ({ ...prev, stories: { ...prev.stories, [shellStory.id]: shellStory } }));
      // See createNewStory's identical check — don't hijack navigation away
      // from another job's page if one is running in parallel.
      if (activeJobIdsRef.current.size <= 1) {
        setActiveStoryId(storyId);
        setActiveChapterIndex(initialChapterIndex(shellStory, state.readingPrefs, 0));
        setView("story");
      }
      setLoadingTarget(jobId, { storyId, chapterIndex: 0 });
      setLoadingContext(jobId, {
        storyTitle: plan.storyTitle,
        chapterNumber: info.chapters > 1 ? 1 : null,
        chapterTitle: info.chapters > 1 ? (outline ? outline[0].title : plan.chapterTitle) : null,
      });

      const res = await generateChapter({
        category: SEARCH_CATEGORY,
        level,
        isFirst: false,
        chapterIndex: 0,
        totalChapters: info.chapters,
        storyTitle: plan.storyTitle,
        subtopic: plan.subtopic,
        previousExcerpt: null,
        outlineEntry: outline ? outline[0] : { title: plan.chapterTitle, summary: "" },
        fullOutline: outline,
        onRateLimitWait: (seconds) => setLoadingNote(jobId, `השירות עמוס כרגע — ממתינים ${seconds} שניות ומנסים שוב אוטומטית…`),
      });
      const chapter0 = { title: numberedChapterTitle(res.chapterTitle, 0, info.chapters), content: res.content, image: null, imageStatus: "loading" };
      setState((prev) => {
        const s = { ...prev.stories[storyId] };
        const chapters = s.chapters.slice();
        chapters[0] = chapter0;
        s.chapters = chapters;
        return { ...prev, stories: { ...prev.stories, [s.id]: s } };
      });
      loadChapterImage(storyId, 0, res.imagePrompt, res.content);
      finishLoadingSuccess(jobId, { storyId, chapterIndex: 0 }, plan.storyTitle);
      maybePushStoryToPublicLibrary({ ...shellStory, chapters: [chapter0, ...shellStory.chapters.slice(1)] });
    } catch (e) {
      if (!withApiKeyGuard(e)) setErrorMsg(describeGenerationError(e, "לא הצלחנו למצוא/ליצור את הספר המבוקש"));
      removeLoadingJob(jobId);
    } finally {
      activeJobIdsRef.current.delete(jobId);
    }
  }

  // Imports a real PDF book/text: extracts its exact original wording (no
  // AI rewriting), splits it into chapters the same way the book itself is
  // divided, and stores the raw per-chapter text separately from the main
  // saved state. Only chapter 1 is placed into story.chapters right away
  // (so the reader has something to read immediately) — every other
  // chapter is filled in later, on demand, the moment it's actually opened.
  async function importPdfStory(file, onProgress, isPublic = true) {
    if (onProgress) onProgress("קוראים את קובץ ה-PDF…");
    // Keep the exact original bytes — this is what actually gets pushed to
    // the cloud (see below), not the extracted chapters, so any other
    // device can regenerate identical chapters/images straight from the
    // real file instead of relying on a separate cloud copy of our own
    // extraction output.
    const pdfBytes = new Uint8Array(await file.arrayBuffer());
    const { pages, meta, frontCoverImage, backCoverImage } = await extractPdfText(file, (page, total) => {
      if (onProgress) onProgress(`קוראים את קובץ ה-PDF… (עמוד ${page.toLocaleString("he")} מתוך ${total.toLocaleString("he")})`);
    });
    const titleGuess = (meta && meta.title) || file.name.replace(/\.pdf$/i, "");
    if (onProgress) onProgress("מזהים את מבנה הפרקים…");
    const rawChapters = splitPdfIntoChapters(pages, titleGuess);
    if (!rawChapters.length) throw new Error("לא הצלחנו לחלץ טקסט מהקובץ הזה.");

    // Same exact book someone else already published to the public catalog?
    // Reuse their cloud copy (same storyId, outline, level, cover) instead
    // of uploading a full duplicate — see fingerprintPdfBook /
    // findExistingPublicPdfBook. Only checked for public imports; a private
    // import never touches the cloud either way. Best-effort: any lookup
    // failure just falls through to the normal "I'm the first uploader" path.
    const willBePublic = isPublic !== false;
    const publicConfig = willBePublic ? publicLibraryConfig() : null;
    const fingerprint = publicConfig ? fingerprintPdfBook(rawChapters) : null;
    if (onProgress && fingerprint) onProgress("בודקים אם הספר כבר קיים בספרייה הציבורית…");
    const existingPublicStory = fingerprint
      ? await findExistingPublicPdfBook(publicConfig, fingerprint, rawChapters.length)
      : null;

    if (onProgress) onProgress("שומרים את הפרקים…");
    const storyId = existingPublicStory ? existingPublicStory.id : uid();
    // Cached locally either way (IndexedDB, this device only) — free, and
    // means this reader can open any chapter offline right away regardless
    // of whether the content came from the cloud or was just extracted.
    await savePdfRawChapters(storyId, rawChapters);
    // Also keep the original file itself locally (even for a reused public
    // book, and even for a private import) — a later full backup run reads
    // it from here to push to the cloud (see pushBackupFirebase), which can
    // happen in a completely different browser session than this import.
    // (savePdfFileBytes already logs its own failures internally and never
    // rejects, so there's nothing to attach a .catch to here.)
    savePdfFileBytes(storyId, pdfBytes);

    const outline = existingPublicStory ? existingPublicStory.outline : rawChapters.map((c) => ({ title: c.title, summary: "" }));
    const chapters = Array.from({ length: rawChapters.length }, () => null);
    const firstHasImages = rawChapters[0].images && rawChapters[0].images.length > 0;
    chapters[0] = {
      title: rawChapters[0].title,
      content: rawChapters[0].content,
      image: null,
      imageStatus: firstHasImages ? "none" : "loading",
      pdfImages: firstHasImages ? rawChapters[0].images : undefined,
    };

    // Real, unleveled book — assign the level its actual chapter count and
    // chapter length correspond to, instead of leaving it level-less.
    // (Skipped when reusing an existing public book — keep the same level
    // everyone else sees it at.)
    const avgWordsPerChapter =
      rawChapters.reduce((sum, c) => sum + countWords(c.content), 0) / rawChapters.length;
    const level = existingPublicStory ? existingPublicStory.level : estimateLevelForBook(rawChapters.length, avgWordsPerChapter);

    const shellStory = {
      id: storyId,
      categoryId: "pdfImport",
      level,
      storyTitle: existingPublicStory ? existingPublicStory.storyTitle : titleGuess,
      tagline: "",
      subtopic: "ספר מיובא מ-PDF",
      source: file.name,
      author: existingPublicStory ? existingPublicStory.author : (meta && meta.author) || null,
      isImported: true,
      isPublic: willBePublic,
      frontCoverImage: existingPublicStory ? existingPublicStory.frontCoverImage : frontCoverImage || null,
      backCoverImage: existingPublicStory ? existingPublicStory.backCoverImage : backCoverImage || null,
      totalChapters: rawChapters.length,
      outline,
      chapters,
      read: false,
      createdAt: Date.now(),
    };
    setState((prev) => ({ ...prev, stories: { ...prev.stories, [shellStory.id]: shellStory } }));
    setActiveStoryId(storyId);
    setActiveChapterIndex(initialChapterIndex(shellStory, state.readingPrefs, 0));
    setView("story");
    setShowPdfImport(false);
    if (!firstHasImages) loadChapterImage(storyId, 0, null, rawChapters[0].content);

    if (existingPublicStory) {
      // Someone else already published this exact book — there's nothing
      // new to upload to the PUBLIC catalog. This device just piggybacks on
      // the existing cloud copy, exactly like downloading someone else's
      // import normally works (see writeChapterAt's cloud-fallback branch
      // above). It still needs its OWN private backup of the file though —
      // see backupImportedPdfNow just below.
      setPublicPushTrack(storyId, generatedChapterCount(shellStory));
    } else {
      maybePushStoryToPublicLibrary(shellStory);
      // Register the fingerprint immediately so the next reader who uploads
      // this exact file finds this copy instead of creating a duplicate —
      // safe to do right away regardless of whether the file upload below
      // ends up succeeding on the first try.
      if (shellStory.isPublic && fingerprint) registerPdfFingerprint(publicConfig, fingerprint, storyId);
    }

    // Immediately push the ORIGINAL PDF FILE, in the background, to every
    // cloud destination it belongs in: this reader's own private backup
    // always, and — only for a brand-new public upload — the shared public
    // catalog too (skipped when reusing an existing public book above,
    // since there's nothing new to send there). This runs right now rather
    // than waiting for the general debounced auto-backup (which might also
    // be switched off), so a chapter someone else opens on a public book
    // — or this reader restoring their own private import on a different
    // device — doesn't depend on this session's auto-backup timing. Never
    // awaited here (the reader is already reading chapter 1), but never
    // silent about failure either — see backupImportedPdfNow for the
    // visible status line + real console logging, and the retry loops in
    // pushBackupFirebase / pushAllToPublicCatalog that pick up anything
    // this immediate attempt doesn't manage to finish.
    backupImportedPdfNow(storyId, pdfBytes, !existingPublicStory && shellStory.isPublic, setCloudSyncStatus);
  }

  // Imports a single article/page from a pasted link: fetches the page,
  // extracts just its own article body + images (see extractArticleFromHtml
  // above), and drops it into the library as a one-chapter "book" — same
  // exact original wording, same "isImported" no-AI-rewrite treatment as a
  // PDF import. UNLIKE a PDF import, this is never public and never has a
  // public/private choice in its UI at all: categoryId "webImport" is
  // hardcoded to always-private in storyIsPublic, and printStory refuses to
  // print it — both regardless of anything set on the story object itself,
  // since the text and images here belong to whoever originally published
  // them, not to this reader.
  async function importArticleFromUrl(rawUrl, onProgress) {
    const trimmed = (rawUrl || "").trim();
    let parsedUrl;
    try {
      parsedUrl = new URL(trimmed);
      if (!/^https?:$/.test(parsedUrl.protocol)) throw new Error("bad protocol");
    } catch (e) {
      throw new Error("הקישור לא תקין — ודאו שהוא קישור מלא ומתחיל ב-https:// או http://");
    }

    if (onProgress) onProgress("טוענים את הדף…");
    let html;
    try {
      // Try a direct browser fetch first — works fine for sites that do
      // send permissive CORS headers, and needs no server involvement.
      const res = await fetch(parsedUrl.href, { redirect: "follow" });
      if (!res.ok) throw new Error(`הדף החזיר שגיאה (קוד ${res.status}).`);
      html = await res.text();
    } catch (directErr) {
      // Direct fetch failed — most likely CORS. Fall back to a small
      // server-side proxy that fetches the page itself (a server-to-server
      // request isn't subject to browser CORS at all). If the proxy isn't
      // deployed (e.g. running index.html standalone with no backend),
      // this will also fail and we show the original explanation.
      if (onProgress) onProgress("גישה ישירה נחסמה — מנסים דרך שרת ביניים…");
      try {
        const proxyRes = await fetch(`${ARTICLE_PROXY_URL}?url=${encodeURIComponent(parsedUrl.href)}`);
        if (!proxyRes.ok) {
          let detail = "";
          try { detail = (await proxyRes.json()).error || ""; } catch (_) {}
          throw new Error(detail || `שרת הביניים החזיר שגיאה (קוד ${proxyRes.status}).`);
        }
        html = await proxyRes.text();
      } catch (proxyErr) {
        throw new Error(
          directErr && directErr.message && directErr.message.includes("קוד")
            ? directErr.message
            : "לא הצלחנו לטעון את הדף — לא ישירות ולא דרך שרת הביניים. אתרים רבים חוסמים גישה ישירה מהדפדפן לתוכן שלהם (הגנת CORS), וזה קורה גם כששרת הביניים אינו זמין כרגע. אפשר לנסות קישור מאתר אחר, או להדביק את תוכן הכתבה ידנית."
        );
      }
    }

    if (onProgress) onProgress("מזהים את גוף הכתבה…");
    const article = await extractArticleFromHtml(html, parsedUrl.href);

    if (onProgress && article.images.length) onProgress("מביאים תמונות מהכתבה…");
    const images = await resolveArticleImages(article.images, onProgress);

    if (onProgress) onProgress("שומרים את הכתבה…");
    const storyId = uid();
    await savePdfRawChapters(storyId, [{ title: article.title, content: article.content, images }]);

    const hasImages = images.length > 0;
    const chapter0 = {
      title: article.title,
      content: article.content,
      image: null,
      imageStatus: hasImages ? "none" : "loading",
      pdfImages: hasImages ? images : undefined,
    };
    const level = estimateLevelForBook(1, countWords(article.content));

    const shellStory = {
      id: storyId,
      categoryId: "webImport",
      level,
      storyTitle: article.title,
      tagline: article.author ? `מאת ${article.author}` : "",
      subtopic: "כתבה מיובאת מקישור",
      source: article.siteName,
      author: article.author || null,
      standfirst: article.standfirst || "",
      isImported: true,
      isPublic: false, // hardcoded — see storyIsPublic()'s own hardcoded override too
      webSource: { url: parsedUrl.href, domain: article.domain, fetchedAt: Date.now() },
      frontCoverImage: null,
      backCoverImage: null,
      totalChapters: 1,
      outline: [{ title: article.title, summary: "" }],
      chapters: [chapter0],
      read: false,
      createdAt: Date.now(),
    };
    setState((prev) => ({ ...prev, stories: { ...prev.stories, [shellStory.id]: shellStory } }));
    setActiveStoryId(storyId);
    setActiveChapterIndex(0);
    setView("story");
    setShowArticleImport(false);
    if (!hasImages) loadChapterImage(storyId, 0, null, article.content);
    // Deliberately no maybePushStoryToPublicLibrary call here, ever.
  }

  // Writes ONE specific chapter of a story, by index — used both by the
  // simple "next chapter" button and by picking any chapter directly from
  // the chapter menu (which may be out of order, and may be a chapter
  // whose earlier siblings don't exist yet). Once written, it's saved into
  // story.chapters[targetIndex] permanently: revisiting that index later
  // just displays the cached text, it's never regenerated.
  async function writeChapterAt(storyId, targetIndex) {
    const story = state.stories[storyId];
    if (!story || targetIndex < 0 || targetIndex >= story.totalChapters) return;
    if (chapterAt(story, targetIndex)) {
      // Already written and cached — just switch to it, no API call.
      setActiveChapterIndex(targetIndex);
      return;
    }
    // See createNewStory's identical guard — never let more than
    // MAX_CONCURRENT_JOBS generations run in parallel; just say so.
    if (blockedByConcurrencyLimit(CAT_BY_ID[story.categoryId]?.itemLabel || "פרקים")) return;
    const jobId = uid();
    activeJobIdsRef.current.add(jobId);
    // Switch to this chapter's slot RIGHT AWAY (it's still empty, but the
    // loading overlay covers that) instead of only jumping there once
    // generation finishes — otherwise clicking a chapter in the menu looks
    // like nothing happened until the whole thing suddenly pops in. Only
    // done when this is the sole job running, so it doesn't yank the reader
    // away from a different job's page if one is generating in parallel.
    if (activeJobIdsRef.current.size <= 1) setActiveChapterIndex(targetIndex);

    // Imported PDF books never call the AI for the chapter TEXT — the
    // chapter's exact original wording was already extracted at upload time
    // and just sits in storage waiting to be dropped into this slot, the
    // same "write on demand" pattern as generated books, minus the
    // network/token cost. Illustrations are handled per chapter though: a
    // chapter whose pages actually contained real embedded images uses
    // those (extracted, not AI-generated, so this never depends on the AI
    // image step succeeding); a chapter with no embedded images gets a
    // normal AI-generated illustration exactly like an AI-authored book.
    if (story.isImported) {
      const importedCategory = CAT_BY_ID[story.categoryId];
      setLoadingContext(jobId, {
        category: importedCategory ? { name: importedCategory.name, color: importedCategory.color, itemLabel: importedCategory.itemLabel || "ספר" } : null,
        level: story.level,
        storyTitle: story.storyTitle,
        chapterNumber: targetIndex + 1,
        chapterTitle: Array.isArray(story.outline) ? story.outline[targetIndex]?.title || null : null,
      });
      setLoadingNote(jobId, null, 2);
      setLoadingTarget(jobId, { storyId, chapterIndex: targetIndex });
      try {
        let rawChapters = (await loadPdfRawChapters(storyId)) || [];
        let rc = rawChapters[targetIndex];
        if (!rc) {
          // Not on this device's own IndexedDB — the normal case right
          // after downloading someone else's imported book from the public
          // library, or restoring a private import to a new device: only
          // chapters the importer had already opened travel with the story
          // itself. Fall back to the ORIGINAL PDF FILE pushed to the cloud
          // at import time (public copy first, then this reader's own
          // private backup — see pushPdfFileToPublicCloud /
          // pushPdfFileToBackupCloud) and re-run the exact same local
          // extraction this device would have run had it imported the file
          // itself — same chapters, same images, nothing cloud-format-
          // specific to keep in sync.
          setLoadingNote(jobId, "מורידים את קובץ ה-PDF המקורי…");
          let pdfBytes = story.isPublic ? await fetchPdfFileFromPublicCloud(storyId) : null;
          if (!pdfBytes) pdfBytes = await fetchPdfFileFromPersonalBackup(storyId);
          if (pdfBytes) {
            // Caches the freshly-downloaded file locally so this device
            // doesn't need to re-download it for the NEXT chapter too —
            // savePdfFileBytes already logs its own failures internally and
            // never rejects, so there's nothing to attach a .catch to here.
            savePdfFileBytes(storyId, pdfBytes);
            setLoadingNote(jobId, "מחלצים את הפרקים מהקובץ…");
            const pdfBlob = new Blob([pdfBytes], { type: "application/pdf" });
            const extracted = await extractPdfText(pdfBlob, (page, total) => {
              setLoadingNote(jobId, `מחלצים את הפרקים מהקובץ… (עמוד ${page.toLocaleString("he")} מתוך ${total.toLocaleString("he")})`);
            });
            rawChapters = splitPdfIntoChapters(extracted.pages, story.storyTitle);
            // Unlike savePdfFileBytes, savePdfRawChapters has no internal
            // error handling of its own — a failure here must not vanish
            // silently: this chapter still displays fine THIS session (rc
            // below reads straight from the in-memory rawChapters array),
            // it just means the extraction would have to be redone next
            // time if this device closes without a successful cache write.
            savePdfRawChapters(storyId, rawChapters).catch((e) =>
              console.error("savePdfRawChapters failed after restoring from cloud:", (e && e.message) || e, { storyId })
            );
            rc = rawChapters[targetIndex];
          }
        }
        if (!rc) throw new Error("לא נמצא תוכן הפרק הזה בקובץ שהועלה. ודאו שגיבוי בוצע במכשיר שבו הספר יובא, ושהמכשיר הזה מחובר לאינטרנט ולאותו חשבון גיבוי.");
        const hasImages = rc.images && rc.images.length > 0;
        const newChapterObj = {
          title: rc.title,
          content: rc.content,
          image: null,
          imageStatus: hasImages ? "none" : "loading",
          pdfImages: hasImages ? rc.images : undefined,
        };
        setState((prev) => {
          const s = { ...prev.stories[storyId] };
          const chs = s.chapters.slice();
          chs[targetIndex] = newChapterObj;
          s.chapters = chs;
          return { ...prev, stories: { ...prev.stories, [s.id]: s } };
        });
        if (!hasImages) loadChapterImage(storyId, targetIndex, null, rc.content);
        finishLoadingSuccess(jobId, { storyId, chapterIndex: targetIndex }, story.storyTitle);
        maybePushStoryToPublicLibrary({
          ...story,
          chapters: story.chapters.map((c, i) => (i === targetIndex ? newChapterObj : c)),
        });
      } catch (e) {
        setErrorMsg(`לא הצלחנו לטעון את הפרק מהקובץ: ${e.message || "שגיאה לא ידועה"}`);
        removeLoadingJob(jobId);
      } finally {
        activeJobIdsRef.current.delete(jobId);
      }
      return;
    }

    const category = CAT_BY_ID[story.categoryId];
    const hasOutline = Array.isArray(story.outline) && story.outline.length === story.totalChapters;
    const outlineEntry = hasOutline ? story.outline[targetIndex] : null;
    setLoadingContext(jobId, {
      category: { name: category.name, color: category.color, itemLabel: category.itemLabel || "סיפור" },
      level: story.level,
      storyTitle: story.storyTitle,
      chapterNumber: targetIndex + 1,
      chapterTitle: outlineEntry ? outlineEntry.title : null,
    });
    setLoadingNote(jobId, null, estimateChapterSeconds(getLevelInfo(story.level).wordsPerChapter));
    setLoadingTarget(jobId, { storyId, chapterIndex: targetIndex });
    try {
      const prevChapter = chapterAt(story, targetIndex - 1);
      const excerpt = prevChapter ? prevChapter.content.slice(-320) : null;
      const res = await generateChapter({
        category,
        level: story.level,
        isFirst: false,
        chapterIndex: targetIndex,
        totalChapters: story.totalChapters,
        storyTitle: story.storyTitle,
        subtopic: story.subtopic,
        previousExcerpt: excerpt,
        outlineEntry,
        fullOutline: hasOutline ? story.outline : null,
        onRateLimitWait: (seconds) => setLoadingNote(jobId, `השירות עמוס כרגע — ממתינים ${seconds} שניות ומנסים שוב אוטומטית…`),
      });
      const newChapterObj = { title: numberedChapterTitle(res.chapterTitle, targetIndex, story.totalChapters), content: res.content, image: null, imageStatus: "loading" };
      const updatedChapters = hasOutline
        ? story.chapters.map((c, i) => (i === targetIndex ? newChapterObj : c))
        : [...story.chapters, newChapterObj];
      setState((prev) => {
        const s = { ...prev.stories[storyId], chapters: updatedChapters };
        return { ...prev, stories: { ...prev.stories, [s.id]: s } };
      });
      loadChapterImage(storyId, targetIndex, res.imagePrompt, res.content);
      finishLoadingSuccess(jobId, { storyId, chapterIndex: targetIndex }, story.storyTitle);
      maybePushStoryToPublicLibrary({ ...story, chapters: updatedChapters });
    } catch (e) {
      if (!withApiKeyGuard(e)) setErrorMsg(describeGenerationError(e, "לא הצלחנו לטעון את הפרק"));
      removeLoadingJob(jobId);
    } finally {
      activeJobIdsRef.current.delete(jobId);
    }
  }

  async function nextChapter() {
    if (!activeStory) return;
    const targetIndex = activeChapterIndex + 1;
    if (targetIndex >= activeStory.totalChapters) return;
    await writeChapterAt(activeStory.id, targetIndex);
  }

  // Tries to generate a REAL illustration of this specific passage (only
  // works with providers that support image generation — OpenAI/Google).
  // Fires in the background; never blocks the chapter text from showing —
  // the chapter's text is always already committed to state and on screen
  // before any caller invokes this (it's never awaited on the critical
  // path). If unsupported/unavailable/fails for any reason, falls back to
  // the built-in procedural sketch illustration (imageStatus "none"), which
  // always renders regardless — the reader is never left with a crashed or
  // stuck screen.
  //
  // `throttleMs` is a small mandatory delay BEFORE the image call actually
  // fires (default ~2.5s, randomized a bit so back-to-back chapters don't
  // all hit the API in the exact same instant). This is deliberate,
  // low-tech throttling: it spaces out the text call (which just finished)
  // from the image call, and spaces out consecutive chapters' image calls
  // from each other, which is what actually avoids tripping Google's 429
  // burst limits in practice — on top of the retry/backoff already inside
  // generateIllustration for the odd transient 429/503 that still occurs.
  async function loadChapterImage(storyId, chapterIndex, imagePrompt, chapterContent, throttleMs = 2000 + Math.random() * 1000) {
    if (throttleMs > 0) await sleep(throttleMs);
    let url = null;
    let imageError = null;
    let resolvedPrompt = imagePrompt && imagePrompt.trim() ? imagePrompt.trim() : null;
    if (providerSupportsImages()) {
      try {
        // Normally the scene description already arrived bundled with the
        // chapter content (see generateChapter) — this only falls back to a
        // separate API call for older/cached data missing that field.
        const scene = resolvedPrompt || (await describeSceneForImage(chapterContent));
        resolvedPrompt = scene;
        url = await generateIllustration(`${scene} Style: ${ILLUSTRATION_STYLE}`);
        if (!url) imageError = "הספק לא החזיר תמונה (ייתכן חסימת תוכן בטוחה מצדו).";
      } catch (e) {
        url = null;
        imageError = describeGenerationError(e, "שגיאה ביצירת האיור");
      }
    }
    setState((prev) => {
      const s = prev.stories[storyId];
      if (!s || !s.chapters[chapterIndex]) return prev;
      const chapters = s.chapters.slice();
      chapters[chapterIndex] = {
        ...chapters[chapterIndex],
        image: url,
        imageStatus: url ? "done" : "none",
        imageError: url ? null : imageError,
        // Kept so a manual "טען איור מחדש" retry (see ChapterImage) can
        // reuse the exact same scene description instead of paying for
        // another describeSceneForImage call just to try the image again.
        imagePrompt: resolvedPrompt || chapters[chapterIndex].imagePrompt || null,
      };
      return { ...prev, stories: { ...prev.stories, [storyId]: { ...s, chapters } } };
    });
  }

  // Manual retry, wired to the "טען איור מחדש" button shown alongside the
  // fallback sketch (see ChapterImage). Re-enters loading state so the
  // reader gets the same spinner as first-load, and skips the throttle
  // delay since this is an explicit, deliberate re-request — not part of a
  // burst of automatic chapter creations.
  function retryChapterImage(storyId, chapterIndex) {
    setState((prev) => {
      const s = prev.stories[storyId];
      if (!s || !s.chapters[chapterIndex]) return prev;
      const chapters = s.chapters.slice();
      chapters[chapterIndex] = { ...chapters[chapterIndex], imageStatus: "loading", imageError: null };
      return { ...prev, stories: { ...prev.stories, [storyId]: { ...s, chapters } } };
    });
    const chapter = state.stories[storyId]?.chapters[chapterIndex];
    loadChapterImage(storyId, chapterIndex, chapter?.imagePrompt || null, chapter?.content || "", 0);
  }

  async function startNextStory(advanceLevel) {
    if (!activeStory) return;
    const catId = activeStory.categoryId;
    const currentLevel = activeStory.level;
    const newLevel = advanceLevel ? currentLevel + 1 : currentLevel;
    setState((prev) => {
      const p = { ...prev.categoryProgress[catId], level: newLevel };
      return { ...prev, categoryProgress: { ...prev.categoryProgress, [catId]: p } };
    });
    // wait a tick so state is committed, then create the next story
    setTimeout(() => createNewStory(catId, newLevel), 0);
  }

  // ===== Jump to the story at an adjacent level (same topic/category) =====
  // Complements startNextStory (which creates a brand-new story at the next
  // level): this instead navigates to a story that ALREADY EXISTS at the
  // previous or next level within the same category, so a reader can move
  // back and forth across the whole ladder of levels they've already
  // written, not just forward into new content. If more than one story was
  // ever created at that level (via "story נוסף באותה רמה"), asks which one
  // to jump to instead of guessing.
  const [levelStoryChoice, setLevelStoryChoice] = useState(null); // { level, candidates } | null
  function storiesAtLevel(catId, level) {
    return Object.values(state.stories)
      .filter((s) => s.categoryId === catId && s.level === level)
      .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  }
  function goToAdjacentLevelStory(direction) {
    if (!activeStory) return;
    const catId = activeStory.categoryId;
    const targetLevel = activeStory.level + direction;
    if (targetLevel < 1) return;
    const candidates = storiesAtLevel(catId, targetLevel);
    if (candidates.length === 0) return; // nothing written at that level yet — nothing to jump to
    if (candidates.length === 1) {
      openStoryFromLibrary(candidates[0].id);
      return;
    }
    setLevelStoryChoice({ level: targetLevel, candidates });
  }
  function hasAdjacentLevelStory(direction) {
    if (!activeStory) return false;
    const catId = activeStory.categoryId;
    const targetLevel = activeStory.level + direction;
    if (targetLevel < 1) return false;
    return storiesAtLevel(catId, targetLevel).length > 0;
  }

  // ===== Move to the previous/next story that already exists WITHIN the
  // same level (as opposed to goToAdjacentLevelStory, which moves a level
  // up or down) — relevant only when a level has more than one story
  // (created via "story נוסף באותה רמה"). =====
  const [storyNavChoice, setStoryNavChoice] = useState(null); // { direction, sibling } | null
  function getSameLevelSibling(direction) {
    if (!activeStory) return null;
    const siblings = storiesAtLevel(activeStory.categoryId, activeStory.level);
    if (siblings.length <= 1) return null;
    const idx = siblings.findIndex((s) => s.id === activeStory.id);
    if (idx === -1) return null;
    return siblings[idx + direction] || null;
  }
  function hasStoryNav(direction) {
    return hasAdjacentLevelStory(direction) || !!getSameLevelSibling(direction);
  }
  // Entry point for the "סיפור הבא"/"סיפור קודם" toolbar buttons: when both
  // a same-level sibling AND an adjacent level exist, ask the reader which
  // kind of "next/previous" they mean instead of guessing.
  function handleStoryNav(direction) {
    if (!activeStory) return;
    const levelJumpAvailable = hasAdjacentLevelStory(direction);
    const sibling = getSameLevelSibling(direction);
    if (levelJumpAvailable && sibling) {
      setStoryNavChoice({ direction, sibling });
      return;
    }
    if (sibling) {
      openStoryFromLibrary(sibling.id);
      return;
    }
    goToAdjacentLevelStory(direction);
  }

  function toggleRead() {
    if (!activeStory) return;
    setState((prev) => {
      const s = { ...prev.stories[activeStory.id], read: !prev.stories[activeStory.id].read };
      const catId = s.categoryId;
      const stories = { ...prev.stories, [s.id]: s };
      if (!prev.categoryProgress[catId]) {
        // search-created stories aren't part of any category's progress tracking
        return { ...prev, stories };
      }
      const p = { ...prev.categoryProgress[catId] };
      // if this was the "in progress" story and we just marked it read, free it up
      if (s.read && p.currentStoryId === s.id) p.currentStoryId = null;
      if (!s.read) p.currentStoryId = s.id;
      return {
        ...prev,
        stories,
        categoryProgress: { ...prev.categoryProgress, [catId]: p },
      };
    });
  }

  function toggleLiked(storyId) {
    if (!storyId) return;
    setState((prev) => {
      const s = prev.stories[storyId];
      if (!s) return prev;
      return { ...prev, stories: { ...prev.stories, [storyId]: { ...s, liked: !s.liked } } };
    });
  }

  function openStoryFromLibrary(storyId) {
    setActiveStoryId(storyId);
    setActiveChapterIndex(initialChapterIndex(state.stories[storyId], state.readingPrefs, 0));
    setView("story");
    setPopup(null);
  }

  // Non-null while a jump from "המילים שלי" to a word's exact source spot is
  // pending — {storyId, chapterIndex, charOffset}. StoryView consumes this
  // once it's showing the right chapter (see its wordJumpTarget effect) and
  // then this is cleared via onConsumeWordJump.
  const [pendingWordJump, setPendingWordJump] = useState(null);
  // Opens the story a saved word came from, landing directly on the exact
  // chapter (and, when available, the exact spot within it) it was saved
  // from — not just the book's first page — by reusing the same
  // scroll-to-offset mechanism "resume to last position" already relies on.
  function openWordSource(word) {
    if (!word.storyId || !state.stories[word.storyId]) return;
    const story = state.stories[word.storyId];
    const chapterIndex = word.chapterIndex != null ? word.chapterIndex : initialChapterIndex(story, state.readingPrefs, 0);
    setActiveStoryId(word.storyId);
    setView("story");
    setPopup(null);
    // Always ask for a jump, even when charOffset is missing (words saved
    // before that scheme existed) — StoryView falls back to locating the
    // word by its own text in that case, instead of just landing on the
    // chapter's top page.
    setPendingWordJump({ storyId: word.storyId, chapterIndex, charOffset: word.charOffset != null ? word.charOffset : null, word: word.word });
    // The target chapter might not actually be loaded yet — a PDF import
    // only has its first chapter loaded up front (every other chapter is
    // fetched from storage on demand), and a generated book's chapter text
    // only exists once it's actually been written. Jumping straight to an
    // empty, not-yet-loaded chapter is exactly why the jump used to land
    // nowhere precise: there was no text there yet for the offset/word
    // lookup to find. writeChapterAt already knows how to do both — switch
    // straight over if it's cached, or load/generate it otherwise — so
    // route through it instead of setting the chapter index directly.
    writeChapterAt(word.storyId, chapterIndex);
  }

  // Adds a book downloaded from the public library into the reader's own
  // personal library — display/reading only, deliberately NOT touched into
  // categoryProgress (storyIds/currentStoryId/usedSubtopics), so a downloaded
  // book never disturbs that category's own sequential level progression.
  // Guards against double-adding (e.g. a double tap) by simply keeping
  // whatever's already there.
  function addDownloadedPublicStory(story) {
    setState((prev) => {
      if (prev.stories[story.id]) return prev;
      return {
        ...prev,
        stories: {
          ...prev.stories,
          // downloadedAt: when THIS reader pulled the book into their own
          // library — distinct from the story's original createdAt (when
          // its author first made it). For a public-library book, the date
          // shown in "הספרייה שלי" should be this one, not the author's.
          [story.id]: { ...story, fromPublicLibrary: true, downloadedAt: Date.now() },
        },
      };
    });
  }

  // Permanently removes a story (and everything tied to it): the story
  // record itself, any saved words that point back to it, its raw chapter
  // text and original PDF file sitting in this device's own IndexedDB, and
  // — for a PRIVATE import only — this reader's own cloud-backed-up copy of
  // that file too (see deletePdfFileChunksFromBackupCloud's comment for why
  // a PUBLIC book's cloud copy is deliberately left alone: other readers
  // may still depend on it). If the story being deleted is the one
  // currently open, backs out to the library instead of leaving the reader
  // stranded on a story that no longer exists.
  async function deleteStory(storyId) {
    const story = state.stories[storyId];
    setState((prev) => {
      const stories = { ...prev.stories };
      delete stories[storyId];
      const words = { ...prev.words };
      Object.keys(words).forEach((wid) => {
        if (words[wid].storyId === storyId) delete words[wid];
      });
      return { ...prev, stories, words };
    });
    clearGrammarSpanCacheForStory(storyId);
    if (story && story.isImported) {
      try {
        const db = await openPdfDb();
        db.transaction(PDF_DB_STORE, "readwrite").objectStore(PDF_DB_STORE).delete(storyId);
        db.transaction(PDF_FILE_STORE, "readwrite").objectStore(PDF_FILE_STORE).delete(storyId);
      } catch (e) {
        // Best-effort local cleanup — the story record itself is already
        // gone from state either way, so this can't leave the library in a
        // broken spot. Still logged rather than swallowed: a stray
        // never-cleaned-up IndexedDB entry is exactly the kind of thing
        // that's invisible until storage quietly fills up.
        console.error("deleteStory: local IndexedDB cleanup failed:", (e && e.message) || e, { storyId });
      }
      // Also drop THIS reader's own private cloud backup of the file, if
      // any — fire-and-forget, never blocks the delete, and only ever runs
      // for a book that was never public (see the function's own comment).
      if (story.isPublic === false && cloudReady()) {
        (async () => {
          try {
            const registryIdentity = await ensureGoogleSignedIn(undefined, false);
            if (!registryIdentity) return;
            const targetConfig = await resolveBackupProject(registryIdentity, undefined, false);
            if (!targetConfig) return;
            const targetIdentity = await identityForProject(registryIdentity, targetConfig, undefined, false);
            if (!targetIdentity) return;
            await deletePdfFileChunksFromBackupCloud(targetConfig, targetIdentity.uid, storyId);
          } catch (e) {
            console.error("deleteStory: cloud cleanup failed:", (e && e.message) || e, { storyId });
          }
        })();
      }
    }
    if (activeStoryId === storyId) {
      setActiveStoryId(null);
      setView("library");
    }
    setDeleteStoryId(null);
  }

  function openExistingFromDuplicatePrompt() {
    if (!duplicateStoryPrompt) return;
    openStoryFromLibrary(duplicateStoryPrompt.existingStoryId);
    setDuplicateStoryPrompt(null);
  }

  function createNewFromDuplicatePrompt() {
    if (!duplicateStoryPrompt) return;
    const { query, level, isPublic } = duplicateStoryPrompt;
    setDuplicateStoryPrompt(null);
    createSearchedStory(query, level, true, isPublic); // force: skip the duplicate check this time
  }

  // Chapter-absolute character offset of a clicked token — combines its
  // position within the (possibly page-relative) tokens array with the
  // page's own chapter-absolute start (StoryView's wrapped onWordClick
  // supplies `pageBaseOffset`; 0 for non-paginated/continuous reading).
  // This is the exact same offset scheme "resume to last position" already
  // uses, which is what lets a saved word later jump straight back to it.
  function tokenCharOffset(tokens, tokenIndex, pageBaseOffset) {
    if (!Array.isArray(tokens) || tokenIndex == null) return null;
    return (pageBaseOffset || 0) + tokens.slice(0, tokenIndex).join("").length;
  }

  // If this exact word/phrase is already sitting in "המילים שלי" (saved from
  // any story, any time), reuse that translation instead of asking the AI
  // again — same word, same answer, no reason to spend a call on it twice.
  function findSavedWordTranslation(word) {
    const key = (word || "").toLowerCase().trim();
    if (!key) return null;
    const match = Object.values(state.words).find((w) => w.word.toLowerCase().trim() === key);
    return match ? match.translation : null;
  }

  function handleWordClick(word, e, meta) {
    const x = e.clientX;
    const y = e.clientY;
    const fallbackContext = (meta && meta.content) || (activeStory && chapterAt(activeStory, activeChapterIndex)?.content) || word;

    if (phraseMode) {
      if (!phraseAnchor || phraseAnchor.source !== meta.source) {
        // first tap of a phrase, or a tap in a different piece of text — (re)start the selection here
        setPhraseAnchor({ source: meta.source, tokenIndex: meta.tokenIndex });
        return;
      }
      // second tap in the same piece of text — resolve the whole phrase between the two taps
      const [startIdx, endIdx] = [phraseAnchor.tokenIndex, meta.tokenIndex].sort((a, b) => a - b);
      const phraseText = meta.tokens.slice(startIdx, endIdx + 1).join("").trim();
      setPhraseAnchor(null);
      if (!phraseText) return;
      // Center the context window on the middle of the tapped phrase, not a
      // text-search for it — exact by construction, see buildLocalTranslationContext.
      const phraseContext =
        buildLocalTranslationContext({ tokens: meta.tokens, tokenIndex: Math.round((startIdx + endIdx) / 2) }, phraseText) || fallbackContext;
      const phraseCharOffset = tokenCharOffset(meta.tokens, startIdx, meta.pageBaseOffset);
      setPopup({ x, y, word: phraseText, loading: true, translation: "", error: false, charOffset: phraseCharOffset });
      // Reuse order: a manual correction the reader already made > this
      // exact phrase already saved in "המילים שלי" > a fresh AI translation
      // (which then also gets cached the same way, so it's instant and
      // consistent the next time this exact phrase comes up anywhere).
      const override = getCustomTranslation(phraseText);
      if (override != null) {
        setPopup((p) => (p && p.word === phraseText ? { ...p, loading: false, translation: override } : p));
        return;
      }
      const savedTranslation = findSavedWordTranslation(phraseText);
      if (savedTranslation != null) {
        setCustomTranslation(phraseText, savedTranslation); // promote to the fast local cache too
        setPopup((p) => (p && p.word === phraseText ? { ...p, loading: false, translation: savedTranslation } : p));
        return;
      }
      translateWord(phraseText, phraseContext)
        .then((translation) => {
          setCustomTranslation(phraseText, translation);
          setPopup((p) => (p && p.word === phraseText ? { ...p, loading: false, translation } : p));
        })
        .catch(() => {
          setPopup((p) => (p && p.word === phraseText ? { ...p, loading: false, error: true } : p));
        });
      return;
    }

    const wordContext = buildLocalTranslationContext(meta, word) || fallbackContext;
    const wordCharOffset = tokenCharOffset(meta && meta.tokens, meta && meta.tokenIndex, meta && meta.pageBaseOffset);
    setPopup({ x, y, word, loading: true, translation: "", error: false, charOffset: wordCharOffset });
    // Same reuse order as the phrase branch above.
    const override = getCustomTranslation(word);
    if (override != null) {
      setPopup((p) => (p && p.word === word ? { ...p, loading: false, translation: override } : p));
      return;
    }
    const savedTranslation = findSavedWordTranslation(word);
    if (savedTranslation != null) {
      setCustomTranslation(word, savedTranslation);
      setPopup((p) => (p && p.word === word ? { ...p, loading: false, translation: savedTranslation } : p));
      return;
    }
    translateWordCached(word, wordContext)
      .then((translation) => {
        setCustomTranslation(word, translation);
        setPopup((p) => (p && p.word === word ? { ...p, loading: false, translation } : p));
      })
      .catch(() => {
        setPopup((p) => (p && p.word === word ? { ...p, loading: false, error: true } : p));
      });
  }

  function editCurrentWordTranslation(newTranslation) {
    if (!popup) return;
    const trimmed = (newTranslation || "").trim();
    if (!trimmed) return;
    setCustomTranslation(popup.word, trimmed);
    setPopup((p) => (p ? { ...p, translation: trimmed } : p));
    // If this word is already saved in "המילים שלי", keep that entry's
    // translation in sync with the correction too.
    if (activeStory) {
      const key = popup.word.toLowerCase();
      const existing = Object.values(state.words).find((w) => w.storyId === activeStory.id && w.word.toLowerCase() === key);
      if (existing) {
        setState((prev) => ({
          ...prev,
          words: { ...prev.words, [existing.id]: { ...prev.words[existing.id], translation: trimmed } },
        }));
      }
    }
  }

  function saveCurrentWord() {
    if (!popup || popup.loading || popup.error || !activeStory) return;
    const key = popup.word.toLowerCase();
    const existing = Object.values(state.words).find((w) => w.storyId === activeStory.id && w.word.toLowerCase() === key);
    if (existing) {
      setState((prev) => {
        const words = { ...prev.words };
        delete words[existing.id];
        return { ...prev, words };
      });
      return;
    }
    const id = uid();
    const chapter = chapterAt(activeStory, activeChapterIndex) || { content: "" };
    const word = {
      id,
      word: popup.word,
      translation: popup.translation,
      context: chapter.content.length > 160 ? chapter.content.slice(0, 160) + "…" : chapter.content,
      storyId: activeStory.id,

      categoryId: activeStory.categoryId,
      level: activeStory.level,
      // Exactly where this word first came from, so "המילים שלי" can later
      // jump straight back to that precise spot rather than just the
      // story's first page — see openWordSource below.
      chapterIndex: activeChapterIndex,

    setState((prev) => ({ ...prev, words: { ...prev.words, [id]: word } }));

        setState((prev) => {

        });

  const isCurrentWordSaved = useMemo(() => {

          }}

          onRestoreState={(patch) => setState((prev) => mergeBackupPatch(prev, patch))}

      )}
    </div>
  );

// Book "size" bands — grouped by chapter count, which also implies a level
// range (higher levels generate longer books). Shared by the library
// catalog filter and the search screen's quick-level presets below, so
// both use exactly the same categories.
const BOOK_SIZE_BANDS = [
  { key: "basic", label: "רמה בסיסית", levelRange: "1–10", chapterMin: 1, chapterMax: 2, midLevel: 5 },
  { key: "small", label: "ספר קטן", levelRange: "10–22", chapterMin: 3, chapterMax: 5, midLevel: 15 },
  { key: "medium", label: "ספר בינוני", levelRange: "23–67", chapterMin: 6, chapterMax: 20, midLevel: 40 },
  { key: "large", label: "ספר גדול", levelRange: "68–127", chapterMin: 21, chapterMax: 40, midLevel: 95 },
  { key: "full", label: "ספר מלא", levelRange: "127 ומעלה", chapterMin: 41, chapterMax: Infinity, midLevel: 150 },
];
function bookSizeBand(totalChapters) {
  return BOOK_SIZE_BANDS.find((b) => totalChapters >= b.chapterMin && totalChapters <= b.chapterMax) || BOOK_SIZE_BANDS[BOOK_SIZE_BANDS.length - 1];
}
function bookSizeBandLabel(band) {
  const chapters = band.chapterMax === Infinity ? `${band.chapterMin}+` : `${band.chapterMin}–${band.chapterMax}`;
  return `${band.label} (רמה ${band.levelRange}) · ${chapters} פרקים`;
}

const GRAMMAR_HIGHLIGHT_PALETTE = [
  "rgba(62,124,116,0.30)", // teal
  "rgba(192,138,62,0.32)", // ochre
  "rgba(139,58,58,0.28)", // burgundy
  "rgba(92,107,192,0.30)", // indigo
  "rgba(181,101,138,0.30)", // pink
  "rgba(107,142,35,0.30)", // olive
];

// A visually distinct palette for poetry-curriculum rules, so a grammar
// highlight and a poetry highlight never land on the same color even when
// both are active on the same page at once.
const POETRY_HIGHLIGHT_PALETTE = [
  "rgba(74,107,140,0.30)", // slate blue
  "rgba(163,90,42,0.30)", // rust
  "rgba(108,74,140,0.30)", // violet
  "rgba(58,130,110,0.28)", // sea green
  "rgba(176,120,40,0.30)", // amber
  "rgba(140,74,110,0.28)", // plum
];

function grammarColorFor(rule) {
  const palette = rule.kind === "poetry" ? POETRY_HIGHLIGHT_PALETTE : GRAMMAR_HIGHLIGHT_PALETTE;
  return palette[rule.level % palette.length];
}

// A rule's identity for the grammarHighlights dictionary and for React keys.
// Prefixed by kind so a grammar rule and a poetry rule that happen to share
// a level never collide with each other.
function ruleKey(rule) {
  return (rule.kind || "grammar") + "-" + rule.level + "-" + rule.title;
}

// Finds every (non-overlapping) occurrence of each span inside content and
// returns them as {start, end, color, ruleTitle, ruleKey, groupId, groupSize}
// ranges for ClickableText to render. ruleTitle (the Hebrew name of the
// grammar/poetry point) travels with each range so a click on the
// highlighted text can show which rule it is. groups is an array of arrays
// of spans (see findGrammarSpans) — every span within the same inner array
// shares one groupId, so a "paired" rule (rhyme, refrain, etc.) can have all
// its related spans emphasized together when one of them is clicked.
// groupId is left null for single-span groups, since there's nothing else to
// link them to.
// Escapes regex-special characters so an arbitrary AI-returned span can be
// dropped into a RegExp literally.
function escapeRegExpChars(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}
// A tolerant matcher for a span the model claims it copied verbatim: any
// run of whitespace is allowed to match any other run of whitespace, and
// straight vs "curly"/typographic quotes, apostrophes, and dashes are
// treated as interchangeable. AI output and PDF-extracted text routinely
// differ only in exactly these cosmetic ways (smart quotes, an em-dash, a
// line-wrap where the source had a plain space) — without this, an
// otherwise-correct span would silently fail to highlight at all instead of
// just landing off by a character or two. Returns null if the span can't be
// turned into a valid pattern (should be effectively never).
function tolerantSpanRegex(span) {
  const escaped = escapeRegExpChars(span)
    .replace(/\s+/g, "\\s+")
    .replace(/['’‘´`]/g, "['’‘´`]")
    .replace(/["“”]/g, '["“”]')
    .replace(/[-–—]/g, "[-–—]");
  try {
    return new RegExp(escaped, "g");
  } catch (e) {
    return null;
  }
}
function buildHighlightRanges(content, groups, color, ruleTitle, ruleKeyVal) {
  const ranges = [];
  (groups || []).forEach((group, groupIndex) => {
    const spans = Array.isArray(group) ? group : [group];
    const groupId = spans.length > 1 ? groupIndex : null;
    spans.forEach((rawSpan) => {
      const span = (rawSpan || "").trim();
      if (!span) return;
      let found = false;
      let fromIndex = 0;
      while (true) {
        const idx = content.indexOf(span, fromIndex);
        if (idx === -1) break;
        found = true;
        ranges.push({ start: idx, end: idx + span.length, color, ruleTitle, ruleKey: ruleKeyVal, groupId, groupSize: spans.length });
        fromIndex = idx + span.length;
      }
      // The model claims this span is an exact quote but it doesn't appear
      // character-for-character — try again tolerating the cosmetic
      // differences above rather than just dropping a genuine match.
      if (!found) {
        const re = tolerantSpanRegex(span);
        if (re) {
          let m;
          while ((m = re.exec(content)) !== null) {
            ranges.push({ start: m.index, end: m.index + m[0].length, color, ruleTitle, ruleKey: ruleKeyVal, groupId, groupSize: spans.length });
            if (m[0].length === 0) re.lastIndex++;
          }
        }
      }
    });
  });
  return ranges;
}

// Bumps a highlight's rgba color to a stronger, more opaque version, used to
// visually emphasize an entire linked group (e.g. a rhyme pair) once the
// reader taps on one member of it.
function emphasizedHighlightColor(rgba) {
  const m = /rgba\(([\d.]+),\s*([\d.]+),\s*([\d.]+),\s*([\d.]+)\)/.exec(rgba || "");
  if (!m) return rgba;
  return `rgba(${m[1]}, ${m[2]}, ${m[3]}, 0.68)`;
}

// Browse-everyone's-books page: category chips (same categories as the rest
// of the app, plus the two virtual ones) across the top, and — once a
// category is picked — the public catalog for just that category, fetched
// with a single read (see fetchPublicLibraryIndex). A book already present
// in the reader's own library (downloaded before, or one of their own that
// happens to be public) shows a "כבר בספרייה שלך" badge instead of a
// download button, so there's never a confusing "download" on a book
// they can already open right now.
function PublicLibraryView({ state, onDownload, onOpenStory, onBack }) {
  const allTopics = useMemo(() => [...CATEGORIES, SEARCH_CATEGORY, PDF_IMPORT_CATEGORY], []);
  const [activeCat, setActiveCat] = useState(allTopics[0].id);
  const [entries, setEntries] = useState(null); // null = loading, [] = loaded, empty
  const [loadError, setLoadError] = useState(null);
  const [downloadingId, setDownloadingId] = useState(null);
  const [downloadError, setDownloadError] = useState(null);
  // "מיון לפי" — mirrors the personal library's sort control (LibraryView):
  // "topic" fetches one category's index at a time (cheapest, the original
  // behavior); "size" instead pulls every category's index and filters
  // client-side by chapter-count band, same bands as the personal library.
  const [sortMode, setSortMode] = useState("topic");
  const [sizeFilter, setSizeFilter] = useState("all");
  const [allEntries, setAllEntries] = useState(null); // used only in "size" mode
  const [downloadingAll, setDownloadingAll] = useState(false);
  const [downloadAllMsg, setDownloadAllMsg] = useState(null);
  const available = publicLibraryAvailable();

  // "topic" mode fetches just one category's index at a time (cheapest) —
  // except its own "הכל" pill, which (like "size" mode below) needs every
  // category at once, so both share the same allEntries fetch/state.
  useEffect(() => {
    if (!available || sortMode !== "topic" || activeCat === "all") return;
    let cancelled = false;
    setEntries(null);
    setLoadError(null);
    fetchPublicLibraryIndex(activeCat)
      .then((list) => {
        if (!cancelled) setEntries(list);
      })
      .catch((e) => {
        if (!cancelled) {
          setLoadError(e.message || "שגיאה לא ידועה");
          setEntries([]);
        }
      });
    return () => {
      cancelled = true;
    };
  }, [activeCat, available, sortMode]);

  const needsAllEntries = sortMode === "size" || (sortMode === "topic" && activeCat === "all");
  useEffect(() => {
    if (!available || !needsAllEntries) return;
    let cancelled = false;
    setAllEntries(null);
    setLoadError(null);
    fetchAllPublicStoryPreviews()
      .then((list) => {
        if (!cancelled) setAllEntries(list);
      })
      .catch((e) => {
        if (!cancelled) {
          setLoadError(e.message || "שגיאה לא ידועה");
          setAllEntries([]);
        }
      });
    return () => {
      cancelled = true;
    };
  }, [available, needsAllEntries]);

  const visibleEntries = sortMode === "size"
    ? (allEntries || []).filter((e) => sizeFilter === "all" || bookSizeBand(e.totalChapters).key === sizeFilter)
    : activeCat === "all"
    ? allEntries
    : entries;
  const isLoading = needsAllEntries ? allEntries === null : entries === null;
  const showCatLabel = sortMode === "size" || (sortMode === "topic" && activeCat === "all");

  async function handleDownload(preview) {
    setDownloadError(null);
    setDownloadingId(preview.id);
    try {
      const story = await fetchPublicLibraryStory(preview.id);
      if (!story) throw new Error("הספר לא נמצא במאגר (יתכן שהוסר).");
      onDownload(story);
    } catch (e) {
      setDownloadError(e.message || "שגיאה לא ידועה בהורדת הספר");
    } finally {
      setDownloadingId(null);
    }
  }

  // Downloads every public book not already in this reader's own library —
  // same idea as "הורידו את כל המאגר" for the public word bank: fetch the
  // full catalog, skip anything already owned, add only what's new.
  async function handleDownloadAll() {
    setDownloadingAll(true);
    setDownloadAllMsg(null);
    try {
      const all = await fetchAllPublicStoryPreviews();
      const toAdd = all.filter((preview) => !state.stories[preview.id]);
      let added = 0;
      for (let i = 0; i < toAdd.length; i++) {
        setDownloadAllMsg(`מורידים ספרים (${i + 1}/${toAdd.length})…`);
        try {
          const story = await fetchPublicLibraryStory(toAdd[i].id);
          if (story) {
            onDownload(story);
            added++;
          }
        } catch (e) {
          // best-effort — skip a book that failed to fetch and keep going
        }
      }
      setDownloadAllMsg(
        added > 0
          ? `נוספו ${added.toLocaleString("he")} ספרים חדשים (מתוך ${all.length.toLocaleString("he")} במאגר — השאר כבר היו אצלכם).`
          : `כל ${all.length.toLocaleString("he")} הספרים שבמאגר כבר נמצאים אצלכם.`
      );
    } catch (e) {
      setDownloadAllMsg("שגיאה בהורדת המאגר: " + (e.message || "לא ידועה"));
    } finally {
      setDownloadingAll(false);
    }
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 18, gap: 10 }}>
        <div>
          <div style={{ fontFamily: "'Frank Ruhl Libre', serif", fontSize: 24, fontWeight: 700 }}>מאגר הספרים של כולם</div>
          <div style={{ color: "#5c665f", fontSize: 14, marginTop: 4 }}>כל הספרים הציבוריים באפליקציה, מסווגים לפי קטגוריה או גודל.</div>
        </div>
        <SecondaryButton onClick={onBack} style={{ padding: "7px 12px", fontSize: 13, whiteSpace: "nowrap" }}>
          חזרה
        </SecondaryButton>
      </div>

      {!available ? (
        <div
          style={{
            background: "var(--paper-raised)",
            border: "1px solid var(--line)",
            borderRadius: 12,
            padding: 16,
            fontSize: 13.5,
            color: "#5c665f",
            lineHeight: 1.6,
          }}
        >
          מאגר הספרים הציבורי זמין רק כשגיבוי הענן מוגדר על Firebase (לא Netlify). אפשר להגדיר זאת בהגדרות → גיבוי ושמירה.
        </div>
      ) : (
        <>
          <div
            style={{
              marginBottom: 16,
              background: "var(--paper-raised)",
              border: "1px solid var(--line)",
              borderRadius: 12,
              padding: "12px 14px",
              display: "flex",
              alignItems: "center",
              justifyContent: "space-between",
              gap: 10,
              flexWrap: "wrap",
            }}
          >
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5 }}>כל המאגר בבת אחת</div>
              <div style={{ fontSize: 12, color: "#8a9089", marginTop: 2 }}>
                מוריד את כל הספרים הציבוריים לספרייה שלכם, ממוינים לפי הקטגוריות שלהם (ספרים שכבר יש לכם לא יורדו שוב).
              </div>
              {downloadAllMsg && <div style={{ fontSize: 12, color: "#3E7C74", marginTop: 6 }}>{downloadAllMsg}</div>}
            </div>
            <SecondaryButton onClick={handleDownloadAll} disabled={downloadingAll} style={{ padding: "7px 12px", fontSize: 12.5, whiteSpace: "nowrap" }}>
              {downloadingAll ? <AppIcon name="Loader2" size={14} className="spin" /> : <AppIcon name="Plus" size={14} />}
              הורידו את כל המאגר
            </SecondaryButton>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
            <span style={{ fontSize: 11.5, color: "#8a9089", fontWeight: 600 }}>מיון לפי:</span>
            <select
              value={sortMode}
              onChange={(e) => setSortMode(e.target.value)}
              style={{
                border: "1.5px solid var(--line-strong)",
                background: "var(--paper-raised)",
                color: "var(--ink)",
                borderRadius: 999,
                padding: "4px 10px",
                fontSize: 11.5,
                fontWeight: 600,
                cursor: "pointer",
              }}
            >
              <option value="topic">נושא</option>
              <option value="size">גודל</option>
            </select>
          </div>

          {sortMode === "topic" ? (
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16 }}>
              <button
                onClick={() => setActiveCat("all")}
                style={{
                  border: `1.5px solid ${activeCat === "all" ? "var(--ink)" : "var(--line-strong)"}`,
                  background: activeCat === "all" ? "var(--ink)" : "transparent",
                  color: activeCat === "all" ? "var(--paper)" : "var(--ink)",
                  borderRadius: 999,
                  padding: "6px 12px",
                  fontSize: 12.5,
                  fontWeight: 600,
                  cursor: "pointer",
                }}
              >
                הכל
              </button>
              {allTopics.map((t) => {
                const active = t.id === activeCat;
                return (
                  <button
                    key={t.id}
                    onClick={() => setActiveCat(t.id)}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 5,
                      border: `1.5px solid ${active ? t.color : "var(--line-strong)"}`,
                      background: active ? t.color : "transparent",
                      color: active ? "#fff" : "var(--ink)",
                      borderRadius: 999,
                      padding: "6px 12px",

                      fontWeight: 600,
                      cursor: "pointer",
                    }}
                  >
                    <AppIcon name={t.icon} size={13} />
                    {t.name}

            <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 16 }}>
              <button
                onClick={() => setSizeFilter("all")}
                style={{
                  border: `1.5px solid ${sizeFilter === "all" ? "var(--ink)" : "var(--line-strong)"}`,
                  background: sizeFilter === "all" ? "var(--ink)" : "transparent",
                  color: sizeFilter === "all" ? "var(--paper)" : "var(--ink)",
                  borderRadius: 999,
                  padding: "5px 11px",
                  fontSize: 11,
                  fontWeight: 600,
                  cursor: "pointer",

              >
                הכל
              </button>
              {BOOK_SIZE_BANDS.map((b) => (

                  onClick={() => setSizeFilter(b.key)}

// Small horizontal progress bar shown while a rule's chunks are being
// scanned, so a longer chapter (more chunks) visibly fills in instead of
// leaving the reader staring at a spinner with no sense of how much is
// left. total === 0 means chunk count isn't known yet (the very first
// instant of a scan) — shown as a slim indeterminate/empty bar rather than
// a misleading 0%.
function GrammarScanProgressBar({ progress }) {
  const total = progress && progress.total;
  const done = (progress && progress.done) || 0;
  const pct = total ? Math.min(100, Math.round((done / total) * 100)) : 0;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6, width: "100%" }}>
      <div style={{ flex: 1, height: 5, borderRadius: 3, background: "var(--line)", overflow: "hidden" }}>
        <div
          style={{
            height: "100%",
            width: `${pct}%`,
            background: "#3E7C74",
            borderRadius: 3,
            transition: "width 0.25s ease",
          }}
        />
      </div>
      <span style={{ fontSize: 11, color: "#8a9089", fontFamily: "'IBM Plex Mono', monospace", flexShrink: 0, minWidth: 30, textAlign: "left" }}>
        {total ? `${pct}%` : "…"}
      </span>
    </div>
  );
}
